Object.assign(Events, {
  def(e) { return EVDEF[e.kind] || null; },
  cat(e) { return EV_CAT[e.cat || (this.def(e) || {}).cat] || EV_CAT.reseau; },
  color(e) { return this.cat(e).col; },
  glyph(e) { return e.glyph || (this.def(e) || {}).glyph || '!'; },
  icon(e) { return EV_INFO[e.kind]?.icon || this.cat(e).icon; },
  tone(e) { return e.tone ?? (this.def(e) || {}).tone ?? (e.bad ? -1 : 0); },

  /** anciennes sauvegardes : effets reconstitués */
  normalize(e) {
    if (e.kind === 'big' && !e.demand && e.mx !== undefined) e.demand = { mx: e.mx, my: e.my, r: 700, mult: 4 };
    if (e.kind === 'failure' && !e.halt && e.lineId) e.halt = { lineId: e.lineId };
    if (e.tone === undefined) e.tone = this.tone(e);
    if (!e.cat) e.cat = (this.def(e) || {}).cat || (e.kind === 'strike' ? 'social' : 'reseau');
    if (e.applied === undefined) e.applied = e.start <= G.s.min;
    e.dialogOpen = false;
    return e;
  },

  /* ---- effets agrégés ---- */
  active() { return this.live(); },
  upcoming() { const m = G.s.min; return G.s.events.filter((e) => !e.void && e.start > m); },
  live() { const m = G.s.min; return G.s.events.filter((e) => !e.void && e.start <= m && e.end > m); },
  trafficEvents() { return this.live().filter((e) => e.traffic).map((e) => e.traffic); },
  speedMult(mode) {
    const w = this.weather();
    let f = 1;
    if (mode === 'bus') f = w === 'snow' ? 0.6 : w === 'rain' ? 0.92 : 1;
    else if (mode === 'boat') f = w === 'storm' ? 0 : 1;
    else if (mode === 'ter') f = w === 'snow' ? 0.85 : 1;
    for (const e of this.live()) if (e.speed && e.speed.mode === mode) f *= e.speed.mult;
    return f;
  },
  /** affluence d'une ligne (météo + événements touchant le mode, la ligne ou tout le réseau) */
  demandFor(l) {
    let f = this.demandMult(l.mode);
    for (const e of this.live()) {
      const d = e.demand; if (!d || d.mx !== undefined) continue;
      if (d.all || d.mode === l.mode || d.lineId === l.id) f *= d.mult;
    }
    return f;
  },
  fareMult(l) {
    let f = Staff.fareMult();
    for (const e of this.live()) { const x = e.fare; if (x && (x.all || x.mode === l.mode || x.lineId === l.id)) f *= x.mult; }
    return f;
  },
  opsMult(mode) {
    let f = 1;
    for (const e of this.live()) if (e.ops && e.ops.mode === mode) f *= e.ops.mult;
    return f;
  },
  halted(line) {
    for (const e of this.live()) {
      if (e.kind === 'strike' && !e.resolved && e.mode === line.mode) return true;
      const h = e.halt;
      if (h && (h.lineId === line.id || h.mode === line.mode)) return true;
    }
    if (line.mode === 'boat' && this.weather() === 'storm') return true;
    return false;
  },
  stopMult(line) {
    const m = line.evMul; m.fill(1);
    for (const e of this.live()) {
      const d = e.demand; if (!d || d.mx === undefined) continue;
      line.stops.forEach((st, k) => { const dd = dist(st.mx, st.my, d.mx, d.my); if (dd < d.r) m[k] = Math.max(m[k], 1 + (d.mult - 1) * (1 - 0.6 * dd / d.r)); });
    }
  },
  where(e) {
    if (e.veh) {
      const l = G.s.lines.find((x) => x.id === e.veh.lineId), v = l && l.veh.find((x) => x.id === e.veh.vehId);
      if (l && v && !v.hidden) { const p = Lines.posOf(l, v); return [p.mx, p.my]; }
    }
    if (e.mx !== undefined) return [e.mx, e.my];
    if (e.zone) { const z = G.w.zones.get(e.zone); return z ? [z.cx, z.cy] : null; }
    if (e.lineId) { const l = G.s.lines.find((x) => x.id === e.lineId); if (l) { const st = l.stops[Math.floor(l.stops.length / 2)]; return [st.mx, st.my]; } }
    return null;
  },
  /** effets lisibles par le joueur */
  effects(e) {
    const out = [], L = (id) => { const l = G.s.lines.find((x) => x.id === id); return l ? 'ligne ' + lab(l) : 'une ligne'; };
    const pct = (m) => (m >= 1 ? '+' : '−') + Math.round(Math.abs(m - 1) * 100) + ' %';
    if (e.traffic) out.push(e.traffic.all ? `Circulation ${e.traffic.all < 1 ? 'fluidifiée' : 'chargée'} dans toute la ville (${pct(e.traffic.all)})` : e.traffic.zone ? `Circulation difficile dans le quartier (${pct(e.traffic.mult)} de trafic)` : `Bouchons dans un rayon de ${Math.round(e.traffic.r / 50) * 50} m (trafic ×${e.traffic.mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })})`);
    if (e.demand) out.push(e.demand.mx !== undefined ? `Affluence jusqu’à ×${e.demand.mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} aux arrêts à moins de ${Math.round(e.demand.r / 50) * 50} m` : `Fréquentation ${pct(e.demand.mult)} (${e.demand.all ? 'tout le réseau' : e.demand.mode ? MODES[e.demand.mode].label.toLowerCase() : L(e.demand.lineId)})`);
    if (e.halt) out.push(e.halt.mode ? `Toutes les lignes ${MODES[e.halt.mode].label.toLowerCase()} à l’arrêt` : `${L(e.halt.lineId)} interrompue`);
    if (e.kind === 'strike' && !e.resolved) out.push('Toutes les lignes du mode concerné restent au dépôt');
    if (e.speed) out.push(`Vitesse des ${MODES[e.speed.mode].label.toLowerCase()} ${pct(e.speed.mult)}`);
    if (e.fare) out.push(e.fare.mult === 0 ? `Aucune recette billets (${e.fare.all ? 'tout le réseau' : e.fare.mode ? MODES[e.fare.mode].label.toLowerCase() : L(e.fare.lineId)})` : `Recettes billets ${pct(e.fare.mult)} (${e.fare.all ? 'tout le réseau' : e.fare.mode ? MODES[e.fare.mode].label.toLowerCase() : L(e.fare.lineId)})`);
    if (e.ops) out.push(`Coûts d’exploitation des ${MODES[e.ops.mode].label.toLowerCase()} ${pct(e.ops.mult)}`);
    if (e.veh) out.push(e.veh.type === 'hold' ? `Un véhicule immobilisé ${e.veh.min} min (ceux qui suivent attendent derrière)` : `Un véhicule immobilisé ${e.veh.min} min puis indisponible jusqu’à la fin de l’événement`);
    if (e.rep) out.push(`Image ${e.rep.delta > 0 ? '+' : '−'}${Math.round(Math.abs(e.rep.delta) * 100)} % (${e.rep.all ? 'tout le réseau' : e.rep.mode ? MODES[e.rep.mode].label.toLowerCase() : L(e.rep.lineId)})`);
    if (e.money) out.push(`${e.money > 0 ? 'Recette' : 'Dépense'} de ${fmtEur(Math.abs(e.money))}`);
    return out;
  },

  /* ---- création ---- */
  add(e) {
    e.id = G.s.nextId++;
    if (e.tone === undefined) e.tone = this.tone(e);
    if (!e.cat) e.cat = (this.def(e) || {}).cat || 'reseau';
    e.bad = e.tone < 0;
    e.applied = false;
    G.s.events.push(e);
    this.log(e.title + ' — ' + e.desc, e.kind);
    if (e.start <= G.s.min) this.apply(e);
    Notif.push(e, e.start > G.s.min ? 'announce' : 'now');
    if (e.q && !e.decided) UI.choiceDialog(e);
    Render.dirty = true;
    UI.refreshInfoBadge();
    return e;
  },
  /** effets immédiats au début de l'événement */
  apply(e) {
    if (e.applied || e.void) return;
    e.applied = true;
    const s = G.s;
    if (e.money && !e.moneyDone) { e.moneyDone = true; if (e.money > 0) Eco.earn(e.money, 'evIn'); else Eco.charge(-e.money, 'events'); }
    if (e.rep) for (const l of s.lines) if (e.rep.all || e.rep.mode === l.mode || e.rep.lineId === l.id) l.rep = clamp(l.rep + e.rep.delta, 0.6, 1.1);
    if (e.veh) {
      const l = s.lines.find((x) => x.id === e.veh.lineId), v = l && l.veh.find((x) => x.id === e.veh.vehId);
      if (v && !v.hidden && !v.parked) {
        v.incUntil = s.sec + e.veh.min * 60; v.incEv = e.id;
        if (e.veh.type === 'breakdown') { v.towAt = s.min + e.veh.min; v.brokenUntil = e.end; }
      }
    }
    if (e.announce && e.start < s.min + 1 && Math.abs(e.tone) >= 2 && e.notified === 'announce') Notif.push(e, 'start');
  },
  /** chaque minute : début des événements annoncés, véhicules en panne */
  minute() {
    const s = G.s, m = s.min;
    for (const e of s.events) if (!e.applied && !e.void && e.start <= m) {
      if (e.q && !e.decided) { e.decided = true; const d = this.def(e); if (d && d.choose) d.choose(e, 1); } // sans réponse : option prudente
      this.apply(e);
    }
    for (const l of s.lines) for (const v of l.veh) {
      if (v.towAt && m >= v.towAt) {
        v.towAt = 0;
        // remorquage : les voyageurs à bord attendent le véhicule suivant au prochain arrêt
        if (!v.parked && !v.hidden && l.ev && l.ev[v.ev]) {
          const n = l.stops.length, evt = l.ev[v.ev], k = evt.k, R = evt.d === 0 ? l.Rf : l.Rb;
          for (let j = 0; j < n; j++) if (j !== k && v.on && v.on[j] > 0) R[k * n + j] += v.on[j];
        }
        v.parked = true; v.broken = true; v.hidden = true; v.load = 0; v.toPark = false;
        if (v.on) v.on.fill(0); if (v.ont) v.ont.fill(0);
        if (G.ui && G.ui.follow === v) G.ui.follow = null;
        Render.dirty = true;
      }
      if (v.broken && m >= (v.brokenUntil || 0)) { v.broken = false; v.brokenUntil = 0; }
    }
  },
  hourly() {
    const s = G.s, m = s.min, h = Time.hour(m);
    // grève à confirmer (dialogue la veille)
    for (const e of s.events) if (e.kind === 'strike' && !e.asked && e.start - m < 1200) { e.asked = true; UI.strikeDialog(e); }
    // choix restés sans réponse (après un rechargement)
    for (const e of s.events) if (e.q && !e.decided && !e.dialogOpen && e.start > m) UI.choiceDialog(e);
    // rythme : 3 à 14 événements par jour selon la taille du réseau, surtout en journée
    const nL = s.lines.length, nV = s.lines.reduce((a, l) => a + l.veh.length, 0);
    const perDay = nL ? Math.min(14, 4 + nL * 0.9 + nV * 0.06) : 1.5;
    const day = h >= 6 && h <= 22;
    const p = day ? perDay / 17 * 0.95 : perDay / 17 * 0.15;
    if (Math.random() < p) this.spawn();
    if (Math.random() < p * 0.25) this.spawn(); // parfois deux à la fois
  },
  ctx() {
    const m = G.s.min;
    return { m, h: Time.hour(m), dow: Time.dow(m), month: Time.month(m) };
  },
  spawn(forceId) {
    const s = G.s, c = this.ctx();
    s.evLast = s.evLast || {};
    const cands = EVENTS.filter((d) => {
      if (forceId) return d.id === forceId;
      if (s.evLast[d.id] && s.min - s.evLast[d.id] < (d.cd || 12) * 60) return false;
      if (d.when && !d.when(c)) return false;
      // pas deux fois le même événement en cours
      return !s.events.some((e) => e.kind === d.id && e.end > s.min);
    });
    if (!forceId) {
      // d'abord la tonalité (≈ 50 % négatifs, 40 % positifs, 10 % mitigés), puis l'événement
      const r = Math.random(), want = r < 0.5 ? -1 : r < 0.9 ? 1 : 0;
      const sub = cands.filter((d) => Math.sign(d.tone) === want);
      if (sub.length) { cands.length = 0; cands.push(...sub); }
    }
    for (let tries = 0; tries < 6 && cands.length; tries++) {
      const wt = (x) => x.w * Math.max(0.05, Staff.weight(x.id));
      const tot = cands.reduce((a, x) => a + wt(x), 0);
      let r = Math.random() * tot, d = cands[0];
      for (const x of cands) { r -= wt(x); if (r <= 0) { d = x; break; } }
      const x = d.make(c);
      if (!x) { cands.splice(cands.indexOf(d), 1); continue; }
      const start = x.start ?? s.min;
      const e = { kind: d.id, cat: d.cat, tone: d.tone, title: d.title, glyph: d.glyph, ...x, start, end: start + Math.max(1, x.dur || 60) };
      delete e.dur;
      Staff.adjust(e);
      s.evLast[d.id] = s.min;
      return this.add(e);
    }
    return null;
  },
  /** chaque matin : météo, grève éventuelle, purge, fêtes du calendrier */
  daily() {
    const s = G.s, m = s.min, month = Time.month(m);
    if (!RealWeather.active()) {
      const r = Math.random();
      let w = 'sun';
      const winter = month === 11 || month <= 1, summer = month >= 5 && month <= 7;
      if (winter && r < 0.1) w = 'snow';
      else if (summer && r < 0.15) w = 'heat';
      else if (r < 0.04) w = 'storm';
      else if (r < 0.3) w = 'rain';
      const prev = s.weather;
      s.weather = w;
      if (w !== 'sun' && w !== prev) {
        this.log('Météo : ' + EV_INFO[w].title.toLowerCase() + ' aujourd’hui.', w);
        const txt = { rain: 'Plus de monde dans le métro et les bus, circulation un peu plus lente.', snow: 'Les bus roulent au ralenti, le métro fait le plein.', heat: 'Chaleur écrasante : les navettes fluviales ont la cote.', storm: 'Vent violent : navettes fluviales à quai, circulation perturbée.' }[w];
        Notif.push({ title: 'Météo : ' + EV_INFO[w].title.toLowerCase(), desc: txt, tone: w === 'heat' ? 0 : -1, cat: 'meteo', glyph: '≈' }, 'now');
      }
    }
    s.events = s.events.filter((e) => e.end > m - 1440);
    const modes = new Set(s.lines.map((l) => l.mode));
    const day0 = m - Time.mod(m);
    // grève (annoncée la veille, avec négociation possible)
    if (Math.random() < 0.03 * Staff.strikeMult() && (modes.has('bus') || modes.has('metro'))) {
      const mode = modes.has('metro') && Math.random() < 0.5 ? 'metro' : modes.has('bus') ? 'bus' : 'metro';
      const cost = Math.round((40000 + s.lines.filter((l) => l.mode === mode).reduce((a, l) => a + l.veh.length, 0) * 6000) * s.costMul * Staff.negoMult());
      this.add({ kind: 'strike', cat: 'social', tone: -3, glyph: '⚑', mode, start: day0 + 1440 + 300, end: day0 + 2880, title: 'Préavis de grève', desc: 'les agents ' + (mode === 'bus' ? 'des bus' : 'du métro') + ' cesseront le travail demain.', cost, resolved: false, asked: false, announce: true });
    }
    // fêtes du calendrier (annoncées la veille)
    const tomorrow = Time.date(day0 + 1440);
    for (const f of SEASONAL) {
      if (tomorrow.getUTCMonth() !== f.month || tomorrow.getUTCDate() !== f.day) continue;
      if (s.events.some((e) => e.kind === f.id && e.end > m)) continue;
      const c = EvCtx.center(), st = day0 + 1440 + f.start;
      this.add({ kind: f.id, cat: f.cat, tone: f.tone, title: f.title, glyph: f.glyph, desc: f.desc, start: st, end: st + f.dur, announce: true, ...f.fx(c) });
    }
  },
});

/* =====================================================================
   NOTIFICATIONS DANS LE JEU
   ===================================================================== */
const Notif = {
  push(e, phase) {
    const s = G.s; if (!s) return;
    s.notifs = s.notifs || [];
    const tone = e.tone ?? 0;
    const when = phase === 'announce' ? (Time.label(e.start).day === Time.label(s.min).day ? 'aujourd’hui ' : Time.label(e.start).day + ' ') + Time.label(e.start).time : null;
    const n = { id: s.nextId++, t: s.min, title: (phase === 'start' ? 'C’est maintenant : ' : '') + e.title, text: e.desc, tone, cat: e.cat || 'reseau', glyph: e.glyph || '!', evId: e.id || null, when, read: false };
    if (e.id) e.notified = phase;
    s.notifs.unshift(n);
    if (s.notifs.length > 60) s.notifs.length = 60;
    const mode = s.settings.notif || 'all';
    // pause automatique : par défaut seulement pour les choix (la fenêtre de choix met déjà le jeu en pause)
    const pz = s.settings.notifPause || 'choices';
    const pause = !e.q && G.ready && !G.paused && (pz === 'all' || (pz === 'major' && Math.abs(tone) >= 2));
    if (pause) { G.paused = true; n.paused = true; UI.refreshTop(); }
    if (mode === 'all' || (mode === 'major' && Math.abs(tone) >= 2) || pause) this.banner(n);
    UI.refreshInfoBadge();
  },
  unread() { return (G.s.notifs || []).filter((n) => !n.read).length; },
  readAll() { for (const n of G.s.notifs || []) n.read = true; UI.refreshInfoBadge(); },
  banner(n) {
    const box = document.getElementById('toasts'); if (!box || !G.ready) return;
    // panneau ou fenêtre ouverte : pas de bannière (la pastille Infos compte la notification)
    if ((UI.sheetOpen() || !document.getElementById('modal').hidden) && !n.paused) return;
    const el = document.createElement('button');
    const c = EV_CAT[n.cat] || EV_CAT.reseau;
    el.className = 'nban ' + (n.tone <= -2 ? 'n-bad' : n.tone < 0 ? 'n-warn' : n.tone >= 2 ? 'n-great' : n.tone > 0 ? 'n-good' : 'n-info');
    el.dataset.act = 'notifOpen'; el.dataset.arg = String(n.id);
    el.innerHTML = `<span class="nb-ic" style="background:${c.col}">${esc(n.glyph)}</span><span class="nb-t"><b>${esc(n.title)}</b><small>${n.when ? '<em>' + esc(n.when) + '</em> · ' : ''}${esc(n.text)}</small></span><span class="nb-tone">${n.paused ? '<i class="nb-pause"><svg viewBox="0 0 10 10" width="9" height="9"><rect x="1.5" y="1" width="2.4" height="8" fill="currentColor"/><rect x="6.1" y="1" width="2.4" height="8" fill="currentColor"/></svg> en pause</i>' : ''}${Notif.toneLabel(n.tone)}</span>`;
    box.appendChild(el);
    const bans = box.querySelectorAll('.nban');
    if (bans.length > 2) bans[0].remove();
    // en pause, la bannière reste jusqu'à la reprise du jeu
    const hide = () => { el.classList.add('out'); setTimeout(() => el.remove(), 400); };
    if (n.paused) { const t = setInterval(() => { if (!G.paused || !el.isConnected) { clearInterval(t); setTimeout(hide, 1500); } }, 500); }
    else setTimeout(hide, Math.abs(n.tone) >= 2 ? 6500 : 5000);
  },
  toneLabel(t) { return t <= -3 ? '▼▼▼' : t === -2 ? '▼▼' : t === -1 ? '▼' : t >= 3 ? '▲▲▲' : t === 2 ? '▲▲' : t === 1 ? '▲' : '●'; },
};

/* =====================================================================

    lv: ['Gestes qui sauvent', 'Secouristes du travail', 'Référents santé'],
    fx: (n) => [`Arrêts pour malaise ${25 * n} % plus courts`, `Actes héroïques et naissances à bord ×${1 + 0.5 * n} (image en hausse)`] },

    fx: (n) => [`Les mécontents pèsent ${15 * n} % de moins sur l’image`, `Bonnes nouvelles (objets rendus, prix, presse) +${30 * n} %`, `Portes bloquées et incivilités −${15 * n} %`] },
  { id: 'regulation', icon: 'target', col: '#8E5BD6', name: 'Régulation du trafic', who: 'régulateurs du PC',
    lv: ['Poste de commande', 'Régulation en temps réel', 'Centre de pilotage'],
    fx: (n) => [`Interruptions de ligne ${20 * n} % plus courtes`, `Qualité de service +${2 * n} % (passages plus réguliers)`, `Véhicules bloqués : la file repart ${15 * n} % plus vite`] },
  { id: 'communication', icon: 'star', col: '#F2B705', name: 'Communication de crise', who: 'service communication',
    lv: ['Réseaux sociaux', 'Cellule de crise', 'Porte-parole aguerri'],
    fx: (n) => [`Baisses d’image −${25 * n} %`, `Bad buzz et articles critiques −${25 * n} %`, `Vidéos virales et articles élogieux +${25 * n} %`] },
  { id: 'social', icon: 'strike', col: '#5B6770', name: 'Dialogue social', who: 'encadrement',

    fx: (n) => [`Préavis de grève −${30 * n} %`, `Négociations −${20 * n} % moins chères`, n >= 3 ? 'Les équipes proposent elles-mêmes des améliorations (petits bonus d’image)' : 'Climat social apaisé'] },
];
const STAFF_DAYS = [2, 4, 7];
const STAFF_BASE = [40000, 90000, 180000];
const STAFF_MAX_PARALLEL = 2;

const Staff = {
  st() { const s = G.s; if (!s.staff) s.staff = {}; if (!s.training) s.training = []; return s; },
  L(id) { return (this.st().staff[id] || 0); },
  total() { const s = this.st(); return STAFF.reduce((a, d) => a + (s.staff[d.id] || 0), 0); },
  training(id) { return this.st().training.find((t) => t.id === id) || null; },
  size() { return G.s.lines.reduce((a, l) => a + l.veh.length, 0); },
  cost(id) {
    const lv = this.L(id); if (lv >= 3) return 0;
    return Math.round(STAFF_BASE[lv] * (1 + this.size() / 20) * G.s.costMul / 1000) * 1000;
  },
  canStart(id) {
    const s = this.st();
    if (this.L(id) >= 3 || this.training(id)) return false;
    return s.training.length < STAFF_MAX_PARALLEL;
  },
  start(id) {
    const d = STAFF.find((x) => x.id === id); if (!d || !this.canStart(id)) return false;
    const cost = this.cost(id);
    if (!Eco.spend(cost, 'capex')) return false;
    const lv = this.L(id) + 1, days = STAFF_DAYS[lv - 1];
    this.st().training.push({ id, level: lv, start: G.s.min, end: G.s.min + days * 1440 });
    Events.log(`Formation lancée : ${d.name}, niveau ${lv} (${days} jours, ${fmtEur(cost)}).`, 'info');
    return true;
  },
  /** toutes les 10 minutes de jeu : fin des formations */
  tick() {
    const s = this.st(), m = s.min;
    const done = s.training.filter((t) => m >= t.end);
    if (!done.length) return;
    s.training = s.training.filter((t) => m < t.end);
    for (const t of done) {
      const d = STAFF.find((x) => x.id === t.id); if (!d) continue;
      s.staff[t.id] = Math.max(s.staff[t.id] || 0, t.level);
      Events.log(`Formation terminée : ${d.name} niveau ${t.level} (${d.lv[t.level - 1]}).`, 'ok');
      Notif.push({ title: `${d.name} : niveau ${t.level}`, desc: `Vos ${d.who} sont formés (« ${d.lv[t.level - 1]} »). ${d.fx(t.level)[0]}.`, tone: 1, cat: 'staff', glyph: '★' }, 'now');
    }
    for (const l of s.lines) Sim.lineQuality(l);
    if (UI.sheetOpen()) UI.refreshSheet();
  },

  /* ---- effets sur la simulation ---- */
  /** salaires : +1 % d'exploitation par niveau acquis ; éco-conduite : −3 % par niveau */
  opsMult() { return 1 + 0.01 * this.total() - 0.03 * this.L('conduite'); },
  fareMult() { return 1 + 0.02 * this.L('controle'); },
  qualMult() { return 1 + 0.02 * this.L('regulation'); },
  mecRepMult() { return 1 - 0.15 * this.L('accueil'); },
  strikeMult() { return 1 - 0.3 * this.L('social'); },
  negoMult() { return 1 - 0.2 * this.L('social'); },
  /** probabilité d'un événement selon les compétences du personnel */
  weight(id) {
    const L = (k) => this.L(k);
    switch (id) {
      case 'fraude': return 1 - 0.25 * L('controle');
      case 'altercation': return (1 - 0.2 * L('controle')) * (1 - 0.1 * L('accueil'));
      case 'portes': return 1 - 0.15 * L('accueil');
      case 'vandalisme': case 'tags': return 1 - 0.12 * L('controle');
      case 'panne_bus': return 1 - 0.22 * L('conduite');
      case 'panne_rame': return (1 - 0.22 * L('conduite')) * (1 - 0.1 * L('maintenance'));
      case 'failure': return 1 - 0.1 * L('maintenance');
      case 'malaise': return 1 - 0.08 * L('conduite');
      case 'heros': case 'naissance': return 1 + 0.5 * L('secours');
      case 'portefeuille': case 'ponctuelle': case 'prix': return 1 + 0.3 * L('accueil');
      case 'presse_plus': return (1 + 0.3 * L('accueil')) * (1 + 0.25 * L('communication'));
      case 'viral_plus': return 1 + 0.25 * L('communication');
      case 'presse_moins': case 'viral_moins': return 1 - 0.25 * L('communication');
      default: return 1;
    }
  },
  /** ajuste la gravité d'un événement au moment où il se produit */
  adjust(e) {
    const L = (k) => this.L(k);
    const shorten = (f) => { const d = e.end - e.start; e.end = e.start + Math.max(5, Math.round(d * f)); };
    if (e.kind === 'fraude' && e.fare) e.fare.mult = 1 - 0.25 * (1 - 0.25 * L('controle'));
    if (e.kind === 'controle' && e.fare) e.fare.mult = 1.12 + 0.04 * L('controle');
    if (e.veh && e.veh.type === 'hold') {
      let f = 1;
      if (e.kind === 'malaise') f *= 1 - 0.25 * L('secours');
      if (e.kind === 'altercation') f *= 1 - 0.2 * L('controle');
      f *= 1 - 0.15 * L('regulation');
      e.veh.min = Math.max(2, Math.round(e.veh.min * f));
    }
    if (e.veh && e.veh.type === 'breakdown') {
      shorten(1 - 0.3 * L('maintenance'));
      e.veh.min = Math.max(2, Math.round(e.veh.min * (1 - 0.15 * L('regulation'))));
    }
    if (e.money < 0 && ['panne_bus', 'panne_rame', 'vandalisme', 'tags'].includes(e.kind)) e.money = Math.round(e.money * (1 - 0.2 * L('maintenance')) / 100) * 100;
    if (e.halt && !e.halt.mode && ['failure', 'colis', 'animal'].includes(e.kind)) shorten(1 - 0.2 * L('regulation'));
    if (e.halt && e.halt.mode && e.kind === 'courant') shorten(1 - 0.2 * L('regulation'));
    if (e.rep && e.rep.delta < 0) e.rep.delta *= 1 - 0.25 * L('communication');
    if (e.kind === 'strike') e.cost = Math.round(e.cost * this.negoMult());
    return e;
  },
};

/* ---------- réseau ferré du joueur ---------- */
const Rail = {
  KM: 1.5e6, STATION: 400000,
  st() {
    if (!G.s.rail) G.s.rail = { stations: [], tracks: [] };
    if (!G.s.rail.joins) G.s.rail.joins = [];
    return G.s.rail;
  },
  /** aiguillage : nœud posé sur une voie existante, relié aux deux extrémités du tronçon */
  applyJoin(j) {
    const net = G.w.rail;
    const i = net.node(j.nid, j.mx, j.my);
    for (const end of [j.a, j.b]) {
      if (!net.idx.has(end)) continue; // tronçon pas encore chargé : on réessaiera
      net.edge(i, net.idx.get(end), 0, j.kmh || 120, '', 'j:' + j.nid + ':' + end, 0, 0);
    }
  },
  /** point d'accroche sur le réseau ferré : un nœud proche, sinon un aiguillage sur le tronçon le plus proche */
  attach(mx, my, maxM) {
    const net = G.w.rail;
    const n = net.nearest(mx, my, Math.min(25, maxM));
    if (n >= 0) return { nid: net.ids[n], mx: net.x[n], my: net.y[n], ang: this.railAngle(n), join: null };
    let best = null, bd = maxM;
    for (let e = 0; e < net.nE; e++) {
      const a = net.ea[e], b = net.eb[e];
      const ax = net.x[a], ay = net.y[a], dx = net.x[b] - ax, dy = net.y[b] - ay;
      const L2 = dx * dx + dy * dy; if (L2 <= 0) continue;
      const t = clamp(((mx - ax) * dx + (my - ay) * dy) / L2, 0, 1);
      const px = ax + t * dx, py = ay + t * dy, d = dist(px, py, mx, my);
      if (d < bd) { bd = d; best = { e, px, py, ang: Math.atan2(dy, dx) }; }
    }
    if (!best) return null;
    const nid = 'j' + Math.round(best.px * 1e9) + '_' + Math.round(best.py * 1e9);
    return { nid, mx: best.px, my: best.py, ang: best.ang, join: { nid, mx: best.px, my: best.py, a: net.ids[net.ea[best.e]], b: net.ids[net.eb[best.e]], kmh: Math.round(net.spd[best.e] * 3.6) } };
  },
  commitJoin(j) {
    if (!j) return;
    const R = this.st();
    if (!R.joins.some((x) => x.nid === j.nid)) R.joins.push(j);
    this.applyJoin(j);
  },
  /** réinjecte gares et voies du joueur dans le réseau ferré et dans les lieux (idempotent) */
  inject() {
    const R = this.st(), net = G.w.rail, w = G.w;
    for (const j of R.joins) this.applyJoin(j);
    for (const s of R.stations) {
      net.node(s.nid, s.mx, s.my);
      const key = 'gs' + s.id;
      if (!w.poiSeen.has(key)) {
        w.poiSeen.add(key);
        w.pois.push({ mx: s.mx, my: s.my, kind: 'station', name: s.name, w: POI_W.station, train: true, own: true, sid: s.id });
      }
    }
    for (const t of R.tracks) this.injectTrack(t);
    net.version++;
  },
  injectTrack(t) {
    const net = G.w.rail;
    let prev = -1;
    t.pts.forEach((p, k) => {
      const id = k === 0 && t.aNid ? t.aNid : k === t.pts.length - 1 && t.bNid ? t.bNid : 't' + t.id + ':' + k;
      const i = net.node(id, p[0], p[1]);
      if (prev >= 0) net.edge(prev, i, 0, t.kmh || 140, '', 't' + t.id + ':' + k, 0, 0);
      prev = i;
    });
  },
  stationById(id) { return this.st().stations.find((s) => s.id === id); },
  stationNear(mx, my, rM) {
    let best = null, bd = rM;
    for (const s of this.st().stations) { const d = dist(s.mx, s.my, mx, my); if (d < bd) { bd = d; best = s; } }
    return best;
  },
  /** direction d'une voie existante au nœud i (angle en radians, écran mercator) */
  railAngle(i) {
    const net = G.w.rail; const e = net.adj[i][0];
    if (e === undefined) return null;
    const j = net.other(e, i);
    return Math.atan2(net.y[j] - net.y[i], net.x[j] - net.x[i]);
  },
  /** courbe lisse (Hermite cubique) passant par les points, tangente aux ancrages */
  curve(P, dirA, dirB) {
    const n = P.length; if (n < 2) return P.slice();
    const tan = [];
    for (let i = 0; i < n; i++) {
      let tx, ty;
      if (i === 0) { tx = P[1][0] - P[0][0]; ty = P[1][1] - P[0][1]; }
      else if (i === n - 1) { tx = P[n - 1][0] - P[n - 2][0]; ty = P[n - 1][1] - P[n - 2][1]; }
      else { tx = (P[i + 1][0] - P[i - 1][0]) / 2; ty = (P[i + 1][1] - P[i - 1][1]) / 2; }
      tan.push([tx, ty]);
    }
    const orient = (i, ang) => {
      if (ang === null || ang === undefined) return;
      const L = Math.hypot(tan[i][0], tan[i][1]) || 1e-9;
      let ux = Math.cos(ang), uy = Math.sin(ang);
      if (ux * tan[i][0] + uy * tan[i][1] < 0) { ux = -ux; uy = -uy; }
      tan[i] = [ux * L * 1.15, uy * L * 1.15];
    };
    orient(0, dirA); orient(n - 1, dirB);
    const out = [P[0]];
    for (let i = 0; i < n - 1; i++) {
      const a = P[i], b = P[i + 1], ta = tan[i], tb = tan[i + 1];
      const segM = dist(a[0], a[1], b[0], b[1]);
      const N = Math.max(2, Math.ceil(segM / 20));
      for (let k = 1; k <= N; k++) {
        const t = k / N, t2 = t * t, t3 = t2 * t;
        const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
        out.push([h00 * a[0] + h10 * ta[0] + h01 * b[0] + h11 * tb[0], h00 * a[1] + h10 * ta[1] + h01 * b[1] + h11 * tb[1]]);
      }
    }
    return out;
  },
  length(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]); return L; },
  trackCost(L) { return Math.round(L / 1000 * this.KM * G.s.costMul / 1000) * 1000; },
  stationCost() { return Math.round(this.STATION * G.s.costMul / 1000) * 1000; },
  /** gares qu'une ligne TER utilise (empêche la démolition) */
  stationUsed(s) {
    return G.s.lines.some((l) => l.mode === 'ter' && l.stops.some((st) => dist(st.mx, st.my, s.mx, s.my) < 60))
      || this.st().tracks.some((t) => t.aNid === s.nid || t.bNid === s.nid);
  },
};

/* ---------- outils de construction : gare et voie ferrée ---------- */
const RailBuild = {
  b: null,
  start(kind) {
    if (Build.b) Build.cancel();
    UI.close(); UI.closeCard();
    this.b = kind === 'gare' ? { kind, pos: null, ang: 0, snap: -1 } : { kind, ctrl: [], a: null, end: null, pts: null };
    $('#buildbar').hidden = false; $('#nav').classList.add('dim');
    this.bar();
    UI.toast(kind === 'gare' ? 'Touchez la carte pour placer la gare. Près d’une voie, elle s’y accroche et s’aligne.' : 'Touchez une gare ou une voie pour partir, puis ajoutez des points de passage. Finissez sur une gare ou une voie.', 'info');
  },
  cancel() { this.b = null; $('#buildbar').hidden = true; $('#nav').classList.remove('dim'); Render.dirty = true; },
  bar() {
    const b = this.b; if (!b) return;
    const ico = `<span class="pict pict-ter">${b.kind === 'gare' ? 'GARE' : '═'}</span>`;
    if (b.kind === 'gare') {
      const deg = Math.round(((b.ang * 180 / Math.PI) % 180 + 180) % 180);
      $('#buildbar').innerHTML = `<div class="bb-t">${ico}<div><b>${b.pos ? 'Nouvelle gare' : 'Placez la gare'}</b><small>${b.pos ? (b.snap >= 0 ? 'sur la voie · ' : 'libre · ') + deg + '°' : fmtEur(Rail.stationCost())}</small></div></div>
        <div class="bb-a"><button class="icon-b" data-act="rbRot" data-arg="-1" aria-label="Tourner à gauche" ${b.pos ? '' : 'disabled'}>⟲</button><button class="icon-b" data-act="rbRot" data-arg="1" aria-label="Tourner à droite" ${b.pos ? '' : 'disabled'}>⟳</button><button class="icon-b" data-act="rbCancel" aria-label="Annuler">${icon('close')}</button><button class="btn primary sm" data-act="rbOk" ${b.pos ? '' : 'disabled'}>${fmtEur(Rail.stationCost())}</button></div>`;
    } else {
      const L = b.pts ? Rail.length(b.pts) : 0;
      $('#buildbar').innerHTML = `<div class="bb-t">${ico}<div><b>${b.ctrl.length ? fmtKm(L) + ' de voie' : 'Point de départ'}</b><small>${b.ctrl.length >= 2 ? fmtEur(Rail.trackCost(L)) : '1,5 M€/km'}${b.end ? ' · arrivée fixée' : ''}</small></div></div>
        <div class="bb-a"><button class="icon-b" data-act="rbUndo" aria-label="Retirer le dernier point" ${b.ctrl.length ? '' : 'disabled'}>${icon('undo')}</button><button class="icon-b" data-act="rbCancel" aria-label="Annuler">${icon('close')}</button><button class="btn primary sm" data-act="rbOk" ${b.ctrl.length >= 2 ? '' : 'disabled'}>${icon('check')} Valider</button></div>`;
    }
  },
  owned(mx, my) { const z = G.w.zoneAt(mx, my); return z && z.owned; },
  /** ancrage : gare du joueur, voie existante, ou rien */
  anchor(mx, my) {
    const s = Rail.stationNear(mx, my, 80);
    if (s) return { type: 'station', nid: s.nid, mx: s.mx, my: s.my, ang: s.ang };
    const at = Rail.attach(mx, my, 60);
    if (at) return { type: 'rail', nid: at.nid, mx: at.mx, my: at.my, ang: at.ang, join: at.join };
    return null;
  },
  tap(mx, my) {
    const b = this.b;
    if (b.kind === 'gare') {
      const at = Rail.attach(mx, my, 60);
      const pos = at ? [at.mx, at.my] : [mx, my];
      if (!this.owned(pos[0], pos[1])) { UI.toast('Hors de votre zone d’exploitation.', 'warn'); return; }
      if (Rail.stationNear(pos[0], pos[1], 150) || G.w.pois.some((p) => p.kind === 'station' && p.train && dist(p.mx, p.my, pos[0], pos[1]) < 150)) { UI.toast('Il y a déjà une gare à moins de 150 m.', 'warn'); return; }
      b.pos = pos; b.snap = at ? 1 : -1; b.at = at;
      if (at && at.ang !== null) b.ang = at.ang;
      this.bar(); Render.dirty = true;
      return;
    }
    if (b.end) { UI.toast('L’arrivée est fixée : validez, ou retirez le dernier point.', 'info'); return; }
    const an = this.anchor(mx, my);
    const p = an ? [an.mx, an.my] : [mx, my];
    if (!this.owned(p[0], p[1])) { UI.toast('Hors de votre zone d’exploitation.', 'warn'); return; }
    if (!b.ctrl.length) { b.a = an; b.ctrl.push(p); }
    else {
      const last = b.ctrl[b.ctrl.length - 1];
      if (dist(last[0], last[1], p[0], p[1]) < 40) return;
      b.ctrl.push(p);
      if (an) b.end = an;
    }
    this.recompute();
  },
  recompute() {
    const b = this.b;
    b.pts = b.ctrl.length >= 2 ? Rail.curve(b.ctrl, b.a ? b.a.ang : null, b.end ? b.end.ang : null) : null;
    this.bar(); Render.dirty = true;
  },
  rotate(dir) { const b = this.b; if (!b || !b.pos) return; b.ang += dir * Math.PI / 12; this.bar(); Render.dirty = true; },
  undo() {
    const b = this.b; if (!b || !b.ctrl) return;
    b.ctrl.pop();
    if (b.end) b.end = null;
    if (!b.ctrl.length) b.a = null;
    this.recompute();
  },
  stationName(mx, my) {
    const used = new Set([...Rail.st().stations.map((s) => s.name), ...G.w.pois.filter((p) => p.kind === 'station').map((p) => p.name)]);
    let base = '';
    const net = G.w.road, i = net.nE ? net.nearest(mx, my, 200) : -1;
    if (i >= 0) { const nm = net.adj[i].map((e) => net.name[e]).filter(Boolean); if (nm.length) base = nm[0].replace(/^(rue|avenue|boulevard|place|quai|chemin|route|allée|cours)\s+(de la |du |des |de l’|de l'|de |d’)?/i, ''); }
    if (!base) { const z = G.w.zoneAt(mx, my); base = z ? z.name : 'Nouvelle'; }
    let n = 'Gare ' + base, k = 2;
    while (used.has(n)) n = 'Gare ' + base + ' ' + k++;
    return n;
  },
  confirm() {
    const b = this.b; if (!b) return;
    const R = Rail.st();
    if (b.kind === 'gare') {
      if (!b.pos) return;
      if (!Eco.spend(Rail.stationCost(), 'capex')) return;
      const id = G.s.nextId++;
      const nid = b.at ? b.at.nid : 'gs' + id;
      if (b.at) Rail.commitJoin(b.at.join);
      const s = { id, mx: b.pos[0], my: b.pos[1], ang: b.ang, name: this.stationName(b.pos[0], b.pos[1]), nid };
      R.stations.push(s);
      Rail.inject();
      Events.log('Nouvelle gare : ' + s.name + '.', 'ok');
      UI.toast(s.name + ' construite. Reliez-la avec une voie, puis créez une ligne TER.', 'ok');
    } else {
      if (!b.pts || b.ctrl.length < 2) return;
      for (const p of b.pts) if (!this.owned(p[0], p[1])) { UI.toast('La voie sort de votre zone d’exploitation. Ajoutez un point de passage ou achetez la zone.', 'warn'); return; }
      const cost = Rail.trackCost(Rail.length(b.pts));
      if (!Eco.spend(cost, 'capex')) return;
      const id = G.s.nextId++;
      const r9 = (x) => Math.round(x * 1e9) / 1e9;
      if (b.a) Rail.commitJoin(b.a.join);
      if (b.end) Rail.commitJoin(b.end.join);
      const t = { id, pts: b.pts.map((p) => [r9(p[0]), r9(p[1])]), aNid: b.a ? b.a.nid : null, bNid: b.end ? b.end.nid : null, kmh: 140 };
      R.tracks.push(t);
      Rail.injectTrack(t);
      G.w.rail.version++;
      Events.log('Nouvelle voie ferrée de ' + fmtKm(Rail.length(b.pts)) + '.', 'ok');
      UI.toast('Voie ferrée posée (' + fmtKm(Rail.length(b.pts)) + ').', 'ok');
    }
    this.cancel(); Render.dirty = true; Save.auto();
  },
};

'use strict';
/* =====================================================================
   CORRESPONDANCE — rendu de la carte (calques canvas au-dessus de Leaflet)
   ===================================================================== */

const TR_COL = ['#58B368', '#F0A53A', '#E2563F', '#9C2B25'];
const FONT = '"Jost", "Futura", "Century Gothic", sans-serif';
const INK = '#232323';
const EV_COL = { accident: '#E2563F', big: '#F2B705', demo: '#8E5BD6', works: '#E08A12' };
const EV_GLYPH = { accident: '!', big: '★', demo: '⚑', works: '⚒' };

function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const inkOn = (hex) => (lum(hex) > 0.55 ? '#232323' : '#FFFFFF');
const fillCol = (f) => (f < 0.6 ? '#2E9E5B' : f < 0.9 ? '#E08A12' : '#D9433A');

/* =====================================================================
   NUIT : obscurité, lampadaires, éclairage des stations et des véhicules
   ===================================================================== */
const Night = {
  sp: null,
  /** 0 = plein jour, 1 = nuit noire ; lever/coucher du soleil selon la saison (France) */
  factor() {
    const s = G.s; if (!s) return 0;
    const m = Time.mod(s.min) / 60, d = Time.date(s.min);
    const doy = Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
    const th = 2 * Math.PI * (doy - 172) / 365;
    const rise = 7.2 - 1.4 * Math.cos(th), set = 19.4 + 2.4 * Math.cos(th), tw = 0.75;
    if (m < rise - tw || m > set + tw) return 1;
    if (m > rise + tw && m < set - tw) return 0;
    if (m <= rise + tw) return clamp((rise + tw - m) / (2 * tw), 0, 1);
    return clamp((m - (set - tw)) / (2 * tw), 0, 1);
  },
  lightsOn() { return G.s.settings.lights !== false; },
  sprite(size, stops, sx = 1, sy = 1, cx = 0.5) {
    const c = document.createElement('canvas'); c.width = size * sx; c.height = size * sy;
    const g = c.getContext('2d');
    g.scale(sx, sy);
    const gr = g.createRadialGradient(size * cx, size / 2, 0, size * cx, size / 2, size / 2);
    for (const [o, col] of stops) gr.addColorStop(o, col);
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return c;
  },
  init() {
    if (this.sp) return;
    this.sp = {
      hole: this.sprite(64, [[0, 'rgba(0,0,0,1)'], [0.45, 'rgba(0,0,0,.7)'], [1, 'rgba(0,0,0,0)']]),
      warm: this.sprite(64, [[0, 'rgba(255,190,110,.95)'], [0.3, 'rgba(255,160,70,.45)'], [1, 'rgba(255,140,40,0)']]),
      led: this.sprite(64, [[0, 'rgba(255,244,220,.95)'], [0.3, 'rgba(240,230,210,.4)'], [1, 'rgba(230,220,200,0)']]),
      beam: this.sprite(64, [[0, 'rgba(255,250,225,.9)'], [0.35, 'rgba(255,240,200,.35)'], [1, 'rgba(255,235,190,0)']], 2, 0.6, 0.05),
      red: this.sprite(32, [[0, 'rgba(255,60,50,1)'], [0.4, 'rgba(255,40,30,.4)'], [1, 'rgba(255,30,20,0)']]),
      green: this.sprite(32, [[0, 'rgba(70,255,120,1)'], [0.4, 'rgba(40,230,90,.4)'], [1, 'rgba(30,200,80,0)']]),
      white: this.sprite(32, [[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,240,.45)'], [1, 'rgba(255,255,240,0)']]),
    };
  },
  /** petit canevas réutilisé (masque de lumière, teintes) */
  buf(k, w, h) {
    this.bufs = this.bufs || {};
    let c = this.bufs[k];
    if (!c) { c = document.createElement('canvas'); this.bufs[k] = c; }
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.filter = 'none'; g.clearRect(0, 0, w, h);
    return [c, g];
  },
  /** applique un calque basse résolution, flouté, sur le voile de nuit (bords qui s'estompent) */
  soft(ctx, src, W, H, blurPx, op, alpha) {
    const [b, bg] = this.buf('blur', src.width, src.height);
    if ('filter' in bg) bg.filter = `blur(${blurPx.toFixed(1)}px)`;
    bg.drawImage(src, 0, 0);
    bg.filter = 'none';
    ctx.save();
    ctx.globalCompositeOperation = op; ctx.globalAlpha = alpha;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
    ctx.drawImage(b, 0, 0, W, H);
    ctx.restore();
  },
  /** obscurité + lampadaires + stations éclairées (calque statique, sous les lignes) */
  draw(ctx, o, nf, W, H) {
    this.init();
    const z = o.z, s = G.s, w = G.w, X = (mx) => mx * o.k - o.x, Y = (my) => my * o.k - o.y;
    ctx.save();
    ctx.fillStyle = `rgba(5,9,28,${(0.88 * nf).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    const ln = clamp((nf - 0.15) / 0.45, 0, 1);
    if (ln > 0 && this.lightsOn()) {
      const net = w.road;
      const mpp = G.mpu / o.k;                       // mètres par pixel
      const Rm = clamp(18 / mpp, 1.2, 16);           // rayon éclairé par un lampadaire (~18 m)
      // masque de lumière en basse résolution, flouté à l'application :
      // la lumière s'atténue progressivement en s'éloignant des rues et des lampadaires
      const q = 0.3, mw = Math.max(2, Math.round(W * q)), mh = Math.max(2, Math.round(H * q));
      const [mk, mg] = this.buf('mask', mw, mh);
      mg.setTransform(q, 0, 0, q, 0, 0); mg.lineCap = 'round'; mg.lineJoin = 'round'; mg.strokeStyle = '#000';
      let tk = null, paths = null;
      const lamps = [];
      if (net.nE) {
        const maxCls = z < 12.5 ? 1 : z < 13.5 ? 2 : z < 14.5 ? 3 : 4;
        const nx = net.x, ny = net.y;
        paths = [new Path2D(), new Path2D()];  // 0 : grands axes (sodium), 1 : rues (LED)
        const stepM = 32;
        for (let e = 0; e < net.nE; e++) {
          const c = net.cls[e]; if (c > maxCls) continue;
          const a = net.ea[e], b = net.eb[e];
          const x1 = X(nx[a]), y1 = Y(ny[a]), x2 = X(nx[b]), y2 = Y(ny[b]);
          if ((x1 < -20 && x2 < -20) || (x1 > W + 20 && x2 > W + 20) || (y1 < -20 && y2 < -20) || (y1 > H + 20 && y2 > H + 20)) continue;
          const pth = paths[c <= 1 ? 0 : 1];
          pth.moveTo(x1, y1); pth.lineTo(x2, y2);
          if (z >= 15 && lamps.length < 9000) {
            const n = Math.floor(net.len[e] / stepM + (net.noise[e] - 0.7) * 1.6);
            for (let k = 0; k < n; k++) { const t = (k + 0.5) / n; lamps.push(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, c <= 1 ? 1 : 0); }
          }
        }
        // couloirs dégressifs : larges et faibles, puis étroits et plus forts
        for (const [wMul, al] of [[4.2, 0.16], [2.8, 0.24], [1.7, 0.34], [0.8, 0.45]]) {
          mg.globalAlpha = al; mg.lineWidth = Math.max(1.4, Rm * wMul);
          mg.stroke(paths[0]); mg.stroke(paths[1]);
        }
        // lampadaires : un halo par point lumineux
        if (lamps.length) {
          const r = Rm * 1.3;
          mg.globalAlpha = 0.75;
          for (let i = 0; i < lamps.length; i += 3) mg.drawImage(this.sp.hole, lamps[i] - r, lamps[i + 1] - r, 2 * r, 2 * r);
        }
        // teinte : sodium orangé sur les grands axes, LED blanche ailleurs (adoucie elle aussi)
        let tg; [tk, tg] = this.buf('tint', mw, mh);
        tg.setTransform(q, 0, 0, q, 0, 0); tg.lineCap = 'round'; tg.lineJoin = 'round';
        tg.lineWidth = Math.max(1, Rm * 2);
        tg.globalAlpha = 0.9; tg.strokeStyle = '#FF9A3C'; tg.stroke(paths[0]);
        tg.globalAlpha = 0.5; tg.strokeStyle = '#FFE8C8'; tg.stroke(paths[1]);
      }
      // stations et arrêts éclairés
      const SR = clamp(55 / mpp, 6, 32);
      const vis = (x, y) => x > -SR && y > -SR && x < W + SR && y < H + SR;
      mg.globalAlpha = 0.95;
      for (const l of s.lines) for (const st of l.stops) { const x = X(st.mx), y = Y(st.my); if (vis(x, y)) mg.drawImage(this.sp.hole, x - SR, y - SR, 2 * SR, 2 * SR); }
      // 1) on perce le voile avec le masque flouté (bords doux) ...
      this.soft(ctx, mk, W, H, clamp(Rm * 0.9, 1.5, 12) * q, 'destination-out', ln);
      // 2) ... puis on ajoute les teintes et les points lumineux par-dessus
      if (tk) this.soft(ctx, tk, W, H, clamp(Rm * 1.1, 2, 14) * q, 'lighter', 0.13 * ln);
      ctx.globalCompositeOperation = 'lighter';
      if (paths && z < 15) { // vue d'avion : fil lumineux fin
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 0.9;
        ctx.globalAlpha = 0.45 * ln; ctx.strokeStyle = '#FFB866'; ctx.stroke(paths[0]);
        ctx.globalAlpha = 0.25 * ln; ctx.strokeStyle = '#FFF0D8'; ctx.stroke(paths[1]);
      }
      if (lamps.length) {
        const r = Rm * 1.15;
        ctx.globalAlpha = 0.14 * ln;
        for (let i = 0; i < lamps.length; i += 3) ctx.drawImage(lamps[i + 2] ? this.sp.warm : this.sp.led, lamps[i] - r * 0.6, lamps[i + 1] - r * 0.6, 1.2 * r, 1.2 * r);
        ctx.globalAlpha = 0.9 * ln; ctx.fillStyle = '#FFE9C0';
        for (let i = 0; i < lamps.length; i += 3) ctx.fillRect(lamps[i] - 1, lamps[i + 1] - 1, 2, 2);
