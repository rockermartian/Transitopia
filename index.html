  resolveEdges(line) {
    const net = this.netFor(line.mode);
    if (!net || !line.path.pairs) return;
    let found = 0;
    const res = (P) => {
      if (!P || !P.pairs) return null;
      const segE = new Int32Array(P.pts.length).fill(-1);
      P.pairs.forEach((p, i) => {
        if (!p) return;
        const e = net.pairEdge(p);
        if (e !== undefined) { segE[i] = e; found++; }
      });
      return segE;
    };
    const Ps = line.P || [line.path, null];
    line.segEs = [res(Ps[0]), res(Ps[1])];
    line.segE = line.segEs[0];
    line.segFound = found;
  },

  /** Demande quotidienne origine-destination (lignes indépendantes, modèle gravitaire) */
  computeOD(line) {
    const mode = MODES[line.mode], n = line.stops.length, w = G.w;
    const P = [], A = [];
    const area = Math.PI * (mode.catch / 1000) ** 2;
    for (const st of line.stops) {
      let pop = 0, jobs = 0, cnt = 0;
      const r = meters(mode.catch * 0.5);
      for (const [dx, dy] of [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]]) {
        const z = w.zoneAt(st.mx + dx, st.my + dy);
        if (z) { pop += z.density; jobs += z.jobDensity; }
        cnt++;
      }
      pop = (pop / cnt) * area; jobs = (jobs / cnt) * area;
      let poi = 0;
      for (const p of w.poisNear(st.mx, st.my, mode.catch)) {
        let wgt = p.w;
        if (line.mode === 'boat' && (p.kind === 'attraction' || p.kind === 'museum')) wgt *= 2.5;
        if (line.mode === 'ter' && p.kind === 'station') wgt *= 3;
        poi += wgt;
      }
      P.push(pop + jobs * 0.25);
      A.push(jobs + pop * 0.45 + poi);
    }
    const od = new Float64Array(n * n);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      od[i * n + j] = mode.K * Math.sqrt(P[i] * A[j]) * this.gravity(line.mode, this.stopDist(line, i, j));
    }
    line.od = od;
    line.Pw = P; line.Aw = A;
    line.catchPop = P.reduce((a, b) => a + b, 0);
  },

  /** estimation avant construction : voyageurs par jour de semaine (service correct, tarif de référence) */
  estimate(mode, stops, path, loop) {
    if (!path || !path.cum || stops.length < 2) return null;
    const fake = { mode, stops, loop: !!loop, path, stopAt: path.stopPt.map((i) => path.cum[i]) };
    this.computeOD(fake);
    let sum = 0; for (const x of fake.od) sum += x;
    return { pax: sum, pop: fake.catchPop };
  },
  /** distance parcourue (km) entre deux arrêts d'une ligne */
  stopDist(line, i, j) {
    let d = Math.abs(line.stopAt[j] - line.stopAt[i]) / 1000;
    if (line.loop) d = Math.min(d, line.path.L / 1000 - d);
    return d;
  },
  /** attractivité selon la distance (peu de trajets très courts, décroissance pour les longs) */
  gravity(mode, d) {
    if (mode === 'bus') return (1 - Math.exp(-d / 0.8)) * Math.exp(-d / 12);
    if (mode === 'metro') return (1 - Math.exp(-d / 1.0)) * Math.exp(-d / 25);
    if (mode === 'ter') return (1 - Math.exp(-d / 4)) * Math.exp(-d / 150);
    return (1 - Math.exp(-d / 1)) * Math.exp(-d / 15);
  },

  /* ---- grille horaire ---- */
  serviceKey(min) {
    if (Time.night(min)) return 'night';
    if (Time.sundayLike(min)) return 'sun';
    if (Time.dow(min) === 6) return 'sat';
    const m = Time.mod(min);
    if ((m >= 420 && m < 570) || (m >= 990 && m < 1170)) return 'peak';
    if (m >= 1200) return 'evening';
    return 'off';
  },
  targetActive(line, min) {
    const n = line.veh.length; if (!n) return 0;
    const avail = line.veh.filter((v) => !v.broken).length; if (!avail) return 0;
    const f = line.svc ? (line.svc[this.serviceKey(min)] ?? 1) : 1;
    return clamp(Math.round(n * f), 1, avail);
  },
  running(line) { return line.veh.filter((v) => !v.parked).length; },
  /** mise en service de la ligne : la bonne part de la flotte, répartie sur le parcours */
  activate(line, min) {
    const want = this.targetActive(line, min);
    let c = 0;
    for (const v of line.veh) { v.toPark = false; if (v.broken) v.parked = true; else { v.parked = c >= want; c++; } }
    this.placeVehicles(line);
  },
  /** ajuste la flotte en service : sorties au dépôt (au terminus) ou entrées depuis le terminus de départ */
  adjustFleet(line, min) {
    const want = this.targetActive(line, min);
    const run = line.veh.filter((v) => !v.parked);
    let extra = run.length - want;
    if (extra > 0) {
      for (const v of run) if (v.toPark) extra--;
      for (let k = run.length - 1; k >= 0 && extra > 0; k--) if (!run[k].toPark) { run[k].toPark = true; extra--; }
      return;
    }
    let need = want - run.length;
    for (const v of run) if (need > 0 && v.toPark) { v.toPark = false; need--; }
    if (need <= 0) return;
    // un seul véhicule entre en ligne à la fois, quand le départ est dégagé
    const ph = PHYS[line.mode], C = line.C;
    const clear = run.every((o) => Math.min(o.u, C - o.u) > Math.max(ph.safe * 2, 80));
    if (!clear) return;
    const v = line.veh.find((x) => x.parked && !x.broken); if (!v) return;
    v.parked = false; v.toPark = false; v.hidden = false;
    v.u = 0; v.ev = 0; v.wrap = false; v.dwell = 0; v.v = 0; v.hold = null; v.cdec = -1; v.load = 0;
    if (v.on) v.on.fill(0); if (v.ont) v.ont.fill(0);
    this.ctlPointer(line, v);
  },

  /* ---- modification d'une ligne existante ---- */
  applyEdit(line, stops, path, pathB) {
    line.stops = stops.map((st) => ({ mx: st.mx, my: st.my, name: st.name, nid: st.nid ?? null, shared: !!st.shared, bmx: st.bmx, bmy: st.bmy, bnid: st.bnid ?? null }));
    line.path = path; line.pathB = pathB || null; line.routedV2 = true;
    line.od = null;
    this.autoName(line);
    this.prepare(line);
    line.active = this.isActiveAt(line, G.s.min);
    if (line.active) this.activate(line, G.s.min);
    else for (const v of line.veh) v.hidden = true;
  },

  addVehicle(line, modelId, free) {
    const md = MODEL[modelId];
    if (!free) {
      const price = Math.round(md.price * G.s.costMul);
      if (!Eco.spend(price, 'capex')) return false;
    }
    const v = { id: G.s.nextId++, model: modelId, u: 0, ev: 0, dwell: 0, on: new Float64Array(line.stops.length), ont: new Float64Array(line.stops.length), load: 0, hidden: true, parked: true };
    line.veh.push(v);
    // le nouveau véhicule entre en ligne depuis le terminus (pas de téléportation des autres)
    if (line.active) this.adjustFleet(line, G.s.min);
    return true;
  },
  sellVehicle(line, modelId) {
    // de préférence un véhicule au dépôt
    let i = line.veh.findIndex((v) => v.model === modelId && v.parked);
    if (i < 0) i = line.veh.map((v) => v.model).lastIndexOf(modelId);
    if (i < 0) return;
    const v = line.veh[i];
    line.veh.splice(i, 1);
    // véhicule offert par un tutoriel : il n'est pas revendable
    if (line.gift && line.veh.length < line.gift) { line.gift = line.veh.length; UI.toast('Véhicule offert par le tutoriel : retiré sans revente.', 'info'); }
    else Eco.earn(Math.round(MODEL[modelId].price * G.s.costMul * 0.6), 'sales');
    if (G.ui && G.ui.follow === v) G.ui.follow = null;
  },
  placeVehicles(line) {
    const runV = line.veh.filter((v) => !v.parked);
    for (const v of line.veh) if (v.parked) { v.hidden = true; v.load = 0; if (v.on) v.on.fill(0); if (v.ont) v.ont.fill(0); }
    const n = runV.length;
    runV.forEach((v, k) => {
      v.hidden = !line.active; v.toPark = false;
      if (v.ont) v.ont.fill(0);
      v.u = (line.C * k) / Math.max(1, n);
      v.ev = 0; v.wrap = false;
      while (v.ev < line.ev.length && line.ev[v.ev].u < v.u - 1e-6) v.ev++;
      if (v.ev >= line.ev.length) { v.ev = 0; v.wrap = true; }
      v.dwell = 0; if (v.on) v.on.fill(0); v.load = 0; v.hold = null; v.v = 0; v.cdec = -1;
      this.ctlPointer(line, v);
    });
  },
  remove(line) {
    const s = G.s;
    s.lines = s.lines.filter((l) => l !== line);
    const sold = line.veh.slice(Math.min(line.veh.length, line.gift || 0)); // les véhicules offerts ne sont pas remboursés
    let refund = sold.reduce((a, v) => a + MODEL[v.model].price * 0.6, 0) * s.costMul;
    Eco.earn(Math.round(refund), 'sales');
    if (G.ui && G.ui.follow && line.veh.includes(G.ui.follow)) G.ui.follow = null;
  },

  /** position ; avec hd (demi-longueur en m), le cap suit la corde entre l'avant et l'arrière du véhicule */
  posOf(line, v, hd) {
    const L = line.L0;
    const dir = line.loop || v.u <= L ? 0 : 1;
    const P = line.P[dir];
    const s = dir ? v.u - L : v.u;
    const p = pointAt(P, s);
    let ang;
    if (hd) {
      let s1 = s + hd, s0 = s - hd;
      const f = line.loop ? pointAt(P, ((s1 % P.L) + P.L) % P.L) : pointAt(P, Math.min(P.L, s1));
      const r = line.loop ? pointAt(P, ((s0 % P.L) + P.L) % P.L) : pointAt(P, Math.max(0, s0));
      if (Math.hypot(f[0] - r[0], f[1] - r[1]) > 1e-12) ang = Math.atan2(f[1] - r[1], f[0] - r[0]);
    }
    if (ang === undefined) {
      const a = P.pts[p[2]], b = P.pts[Math.min(P.pts.length - 1, p[2] + 1)];
      ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    }
    return { mx: p[0], my: p[1], seg: p[2], t: p[3], dir, ang };
  },
  /** limitation de vitesse au point où se trouve le véhicule (km/h) */
  limitAt(line, v) {
    if (line.mode !== 'bus') return null;
    const p = this.posOf(line, v);
    const segE = line.segEs ? line.segEs[p.dir] : line.segE;
    const e = segE ? segE[p.seg] : -1;
    return e >= 0 && G.w.road.lim[e] > 0 ? G.w.road.lim[e] : null;
  },
  label(line) {
    if (line.mode === 'metro') return String(line.num);
    if (line.mode === 'ter') return 'TER ' + line.num;
    if (line.mode === 'boat') return 'N' + line.num;
    return String(line.num);
  },
  capacity(line) { return line.veh.reduce((a, v) => a + MODEL[v.model].cap, 0); },
  isActiveAt(line, min) {
    if (line.status !== 'active') return false;
    if (Events.halted(line)) return false;
    if (line.night) return true;
    const m = Time.mod(min), st = line.hours.start, en = line.hours.end;
    return en > st ? m >= st && m < en : m >= st || m < en;
  },
  price(line, min) { return line.prices[Time.period(min)]; },
};

/* ---------- correspondances entre lignes ---------- */
const XFER = { walk: 150, pen: 0.45, maxHubs: 3 };
/** distance de marche maximale pour une correspondance (m) : 30 m, 50 m dès qu'une navette fluviale est concernée */
function xferWalk(a, b) {
  return a === 'boat' || b === 'boat' ? 50 : 30;
}
const Transfers = {
  hubs: [],
  /** repère les arrêts proches entre lignes et calcule les trajets avec un changement */
  rebuild() {
    const s = G.s; if (!s) return;
    const lines = s.lines;
    for (const l of lines) { l.xgen = []; l.xcont = Array.from({ length: l.stops.length }, () => []); }
    const hubs = [];
    for (let a = 0; a < lines.length; a++) for (let b = a + 1; b < lines.length; b++) {
      const A = lines[a], B = lines[b];
      const cand = [], lim = xferWalk(A.mode, B.mode);
      A.stops.forEach((sa, ka) => B.stops.forEach((sb, kb) => {
        const d = dist(sa.mx, sa.my, sb.mx, sb.my);
        if (d <= lim) cand.push({ ka, kb, walk: d });
      }));
      if (!cand.length) continue;
      cand.sort((x, y) => x.walk - y.walk);
      const used = [];
      for (const c of cand) {
        if (used.some((u) => u.ka === c.ka || u.kb === c.kb || Math.abs(u.ka - c.ka) < 2)) continue;
        used.push(c); if (used.length >= XFER.maxHubs) break;
      }
      for (const c of used) hubs.push({ A, ka: c.ka, B, kb: c.kb, walk: c.walk });
      this.flows(A, B, used);
      this.flows(B, A, used.map((c) => ({ ka: c.kb, kb: c.ka, walk: c.walk })));
    }
    this.hubs = hubs;
  },
  flows(A, B, hubs) {
    if (!A.Pw || !B.Aw || !A.stopAt || !B.stopAt) return;
    const nA = A.stops.length, nB = B.stops.length;
    const K = Math.min(MODES[A.mode].K, MODES[B.mode].K) * XFER.pen;
    // destinations déjà accessibles sans changer (trajet direct ou à pied)
    const nearA = B.stops.map((sb) => A.stops.some((sa) => dist(sa.mx, sa.my, sb.mx, sb.my) < 350));
    const nearB = A.stops.map((sa) => B.stops.some((sb) => dist(sa.mx, sa.my, sb.mx, sb.my) < 350));
    const gen = new Map(), cont = new Map();
    for (let i = 0; i < nA; i++) {
      if (nearB[i]) continue;
      for (let j = 0; j < nB; j++) {
        if (nearA[j]) continue;
        let best = null, bd = Infinity;
        for (const h of hubs) {
          if (h.ka === i || h.kb === j) continue;
          const d = Lines.stopDist(A, i, h.ka) + Lines.stopDist(B, h.kb, j) + h.walk / 1000 * 1.5;
          if (d < bd) { bd = d; best = h; }
        }
        if (!best) continue;
        const g = Math.max(Lines.gravity(A.mode, bd), Lines.gravity(B.mode, bd));
        const r = K * Math.sqrt(A.Pw[i] * B.Aw[j]) * g;
        if (!(r > 1e-6)) continue;
        const gk = i * nA + best.ka;
        const ge = gen.get(gk); if (ge) ge.r += r; else gen.set(gk, { i, ka: best.ka, b: B, r });
        const ck = best.ka + '|' + j;
        const ce = cont.get(ck); if (ce) ce.w += r; else cont.set(ck, { b: B, kb: best.kb, j, w: r, ka: best.ka });
      }
    }
    for (const v of gen.values()) A.xgen.push(v);
    for (const c of cont.values()) A.xcont[c.ka].push(c);
  },
  /** voyageurs qui descendent pour changer de ligne : ils rejoignent le quai de la ligne suivante */
  hand(l, k, x) {
    const s = G.s;
    const conts = (l.xcont[k] || []).filter((c) => c.b.active && c.b.veh.length && s.lines.includes(c.b));
    if (!conts.length) { l.today.mec += x * 0.5; s.today.mec += x * 0.5; return; }
    const tot = conts.reduce((a, c) => a + c.w, 0);
    for (const c of conts) {
      const B = c.b, nB = B.stops.length, amt = x * c.w / tot;
      const R = B.loop || c.j > c.kb ? B.Rf : B.Rb;
      R[c.kb * nB + c.j] += amt;
      B.today.xin += amt;
    }
    l.today.xout += x;
    s.today.xfer = (s.today.xfer || 0) + x;
  },
  /** correspondances d'un arrêt donné */
  at(l, k) {
    const out = [];
    for (const h of this.hubs) {
      if (h.A === l && h.ka === k) out.push({ line: h.B, k: h.kb, walk: h.walk });
      else if (h.B === l && h.kb === k) out.push({ line: h.A, k: h.ka, walk: h.walk });
    }
    return out;
  },
};

/* ---------- trafic routier (simulé) ---------- */
const Traffic = {
  /** part fixe du trafic de chaque tronçon (densité, catégorie, bruit) : recalculée seulement si le réseau change */
  base(net) {
    if (this._b && this._bN === net.nE && this._bV === net.densV) return this._b;
    const B = new Float32Array(net.nE);
    for (let e = 0; e < net.nE; e++) {
      const d = net.dens[e] < 0 ? 250 : net.dens[e];
      B[e] = (0.35 + 0.65 * Math.min(1.7, d / 7000)) * CLS_F[net.cls[e]] * net.noise[e];
    }
    this._b = B; this._bN = net.nE; this._bV = net.densV; this._m = new Float32Array(net.nE); this._ms = new Uint32Array(net.nE); this._st = 0;
    return B;
  },
  update() {
    const s = G.s, net = G.w.road;
    if (!net.nE) return;
    const h = Time.hour(s.min), we = Time.weekend(s.min);
    const prof = (we ? PROF_WE[h] * 0.8 : PROF_WD[h]);
    const shift = Math.min(0.22, s.modalShift || 0);
    let g = prof * Events.weatherTraffic() * (1 - shift);
    const B = this.base(net), M = this._m, MS = this._ms, st = ++this._st, tr = net.traffic;
    // événements localisés : seuls les tronçons concernés sont visités (grille spatiale des nœuds)
    let local = false;
    for (const ev of Events.trafficEvents()) {
      if (ev.all) { g *= ev.all; continue; }
      local = true;
      const mul = (e, f) => { if (MS[e] !== st) { MS[e] = st; M[e] = 1; } M[e] *= f; };
      if (ev.zone) { for (let e = 0; e < net.nE; e++) if (net.zone[e] === ev.zone) mul(e, ev.mult); continue; }
      if (ev.mx === undefined) continue;
      const rr = Math.ceil(meters(ev.r) / GCELL), cx = Math.floor(ev.mx / GCELL), cy = Math.floor(ev.my / GCELL), seen = new Set();
      for (let dx = -rr; dx <= rr; dx++) for (let dy = -rr; dy <= rr; dy++) {
        const c = net.grid.get((cx + dx) + ',' + (cy + dy)); if (!c) continue;
        for (const i of c) for (const e of net.adj[i]) {
          if (seen.has(e)) continue; seen.add(e);
          const dd = dist((net.x[net.ea[e]] + net.x[net.eb[e]]) / 2, (net.y[net.ea[e]] + net.y[net.eb[e]]) / 2, ev.mx, ev.my);
          if (dd < ev.r) mul(e, 1 + (ev.mult - 1) * (1 - dd / ev.r));
        }
      }
    }
    const n = net.nE;
    if (local) for (let e = 0; e < n; e++) tr[e] = tr[e] * 0.4 + g * B[e] * (MS[e] === st ? M[e] : 1) * 0.6;
    else for (let e = 0; e < n; e++) tr[e] = tr[e] * 0.4 + g * B[e] * 0.6;
    Render.dirty = true;
  },
  /** facteur de vitesse d'un bus sur un tronçon */
  busFactor(e, line) {
    if (e < 0) return 0.75;
    const c = G.w.road.traffic[e] ?? 0.3;
    let f = 1 / (1 + 3 * Math.pow(Math.max(0, c - 0.3), 1.6));
    f = Math.max(0.22, f);
    if ((line.busLane && G.w.road.cls[e] <= 3) || G.w.road.bl[e]) f = 1 - (1 - f) * 0.25;
    return f;
  },
};

/* ---------- économie ---------- */
const Eco = {
  spend(amount, cat) {
    const s = G.s;
    if (s.unlimited) return true; // argent illimité : rien n'est débité
    if (amount > s.money) { UI.toast('Fonds insuffisants : il manque ' + fmtEur(amount - s.money) + '.', 'bad'); return false; }
    s.money -= amount; s.today[cat] = (s.today[cat] || 0) + amount;
    UI.refreshTop();
    UX.money(-amount);
    return true;
  },
  charge(amount, cat) { const s = G.s; if (s.unlimited) return; s.money -= amount; s.today[cat] = (s.today[cat] || 0) + amount; },
  earn(amount, cat) { const s = G.s; if (s.unlimited) return; s.money += amount; s.today[cat] = (s.today[cat] || 0) + amount; UX.money(amount); UI.refreshTop(); },
  /** mode argent illimité : dépenses et recettes en pause */
  free() { return !!(G.s && G.s.unlimited); },
  canAfford(x) { return this.free() || G.s.money >= x; },
  setUnlimited(on) {
    G.s.unlimited = !!on;
    Events.log(on ? 'Argent illimité activé : dépenses et recettes en pause.' : 'Argent illimité désactivé : la trésorerie reprend.', 'info');
    UI.toast(on ? 'Argent illimité activé. Construisez librement !' : 'Retour à la gestion normale, trésorerie : ' + fmtEur(G.s.money) + '.', 'ok');
    UI.refreshTop();
  },
  blankDay() { return { fares: 0, ads: 0, sales: 0, ops: 0, maint: 0, interest: 0, capex: 0, zones: 0, events: 0, evIn: 0, loanIn: 0, repay: 0, pax: 0, mec: 0, xfer: 0, taxi: 0, taxiOps: 0 }; },
  dayProfit(d) { return d.fares + d.ads + (d.evIn || 0) + (d.taxi || 0) - d.ops - d.maint - d.interest - d.events - (d.taxiOps || 0); },
  debt() { return G.s.loans.reduce((a, l) => a + l.amount, 0); },
  loanOffers() {
    const m = G.s.costMul;
    return [
      { amount: 1e6 * m, rate: 0.04, label: 'Prêt relais' },
      { amount: 3e6 * m, rate: 0.05, label: 'Prêt d’équipement' },
      { amount: 8e6 * m, rate: 0.06, label: 'Grand emprunt' },
    ];
  },
  maxDebt() { return 20e6 * G.s.costMul; },
  borrow(o) {
    const s = G.s;
    if (s.unlimited) { UI.toast('Inutile d’emprunter en mode argent illimité.', 'info'); return; }
    if (this.debt() + o.amount > this.maxDebt()) { UI.toast('La banque refuse : endettement maximum atteint (' + fmtEur(this.maxDebt()) + ').', 'bad'); return; }
    s.loans.push({ id: s.nextId++, amount: o.amount, rate: o.rate, taken: s.min });
    s.money += o.amount; s.today.loanIn += o.amount;
    UI.toast('Prêt accordé : +' + fmtEur(o.amount) + ' à ' + (o.rate * 100).toFixed(0) + ' %/an.', 'ok');
    UI.refreshTop();
  },
  repay(loan, part) {
    const s = G.s;
    const amt = Math.min(loan.amount, part);
    if (amt > s.money) { UI.toast('Pas assez de trésorerie pour rembourser.', 'bad'); return; }
    s.money -= amt; loan.amount -= amt; s.today.repay += amt;
    if (loan.amount < 1) s.loans = s.loans.filter((l) => l !== loan);
    UI.refreshTop();
  },
  /** coûts et recettes horaires */
  hourly() {
    const s = G.s;
    let maint = 0;
    for (const l of s.lines) {
      const nStops = l.stops.filter((x) => !x.shared).length;
      if (l.mode === 'bus') maint += nStops * MAINT.busStop;
      else if (l.mode === 'metro') maint += (l.path.L / 1000) * MAINT.metroKm + nStops * MAINT.metroStation;
      else if (l.mode === 'ter') maint += (l.path.L / 1000) * MAINT.terKm + nStops * MAINT.terStation;
      else maint += nStops * MAINT.boatStop;
      if (l.busLane) maint += (l.laneKm || 0) * 200;
    }
    this.charge((maint * s.costMul) / 24, 'maint');
    let interest = 0;
    for (const ln of s.loans) interest += (ln.amount * ln.rate) / 365 / 24;
    this.charge(interest, 'interest');
  },
};

/* ---------- événements ---------- */
const EV_INFO = {
  rain: { icon: 'rain', title: 'Pluie' },
  snow: { icon: 'snow', title: 'Neige' },
  heat: { icon: 'heat', title: 'Canicule' },
  storm: { icon: 'wind', title: 'Tempête' },
  sun: { icon: 'sun', title: 'Beau temps' },
  strike: { icon: 'strike', title: 'Préavis de grève' },
  works: { icon: 'works', title: 'Travaux de voirie' },
  accident: { icon: 'accident', title: 'Accident' },
  demo: { icon: 'demo', title: 'Manifestation' },
  big: { icon: 'star', title: 'Grand événement' },
  failure: { icon: 'alert', title: 'Incident technique' },
};
const Events = {
  active() { const m = G.s.min; return G.s.events.filter((e) => e.start <= m && e.end > m); },
  upcoming() { const m = G.s.min; return G.s.events.filter((e) => e.start > m); },
  weather() { return G.s.weather || 'sun'; },
  weatherTraffic() { const w = this.weather(); return w === 'rain' ? 1.1 : w === 'snow' ? 1.3 : w === 'storm' ? 1.12 : 1; },
  speedMult(mode) {
    const w = this.weather();
    if (mode === 'bus') return w === 'snow' ? 0.6 : w === 'rain' ? 0.92 : 1;
    if (mode === 'boat') return w === 'storm' ? 0 : 1;
    if (mode === 'ter') return w === 'snow' ? 0.85 : 1;
    return 1;
  },
  demandMult(mode) {
    const w = this.weather();
    const t = { sun: 1, rain: { bus: 1.1, metro: 1.15, ter: 1.05, boat: 0.7 }, snow: { bus: 0.9, metro: 1.2, ter: 1.05, boat: 0.6 }, heat: { bus: 0.9, metro: 0.95, ter: 1, boat: 1.35 }, storm: { bus: 0.95, metro: 1.1, ter: 1, boat: 0 } }[w];
    return t === 1 || !t ? 1 : t[mode];
  },
  /** position d'un événement sur la carte (ou null) */
  where(e) {
    if (e.mx !== undefined) return [e.mx, e.my];
    if (e.zone) { const z = G.w.zones.get(e.zone); return z ? [z.cx, z.cy] : null; }
    if (e.lineId) { const l = G.s.lines.find((x) => x.id === e.lineId); if (l) { const st = l.stops[Math.floor(l.stops.length / 2)]; return [st.mx, st.my]; } }
    return null;
  },
  trafficEvents() {
    return this.active().filter((e) => e.traffic).map((e) => e.traffic);
  },
  halted(line) {
    for (const e of this.active()) {
      if (e.kind === 'strike' && !e.resolved && e.mode === line.mode) return true;
      if (e.kind === 'failure' && e.lineId === line.id) return true;
    }
    if (line.mode === 'boat' && this.weather() === 'storm') return true;
    return false;
  },
  stopMult(line) {
    const m = line.evMul; m.fill(1);
    for (const e of this.active()) if (e.kind === 'big') {
      line.stops.forEach((st, k) => { const d = dist(st.mx, st.my, e.mx, e.my); if (d < 700) m[k] = Math.max(m[k], 1 + 3 * (1 - d / 700)); });
    }
  },
  log(text, kind) {
    const s = G.s;
    s.journal.unshift({ t: s.min, text, kind });
    if (s.journal.length > 60) s.journal.length = 60;
  },
  add(e) {
    e.id = G.s.nextId++;
    G.s.events.push(e);
    this.log(e.title + ' — ' + e.desc, e.kind);
    UI.toast(e.title + ' : ' + e.desc, e.bad ? 'warn' : 'info');
    Render.dirty = true;
    UI.refreshInfoBadge();
  },
  randomOwnedZone() {
    const z = [...G.w.zones.values()].filter((z) => z.owned);
    return z.length ? pick(z) : null;
  },
  randomRoadEdge() {
    const n = G.w.road; if (!n.nE) return -1;
    for (let k = 0; k < 40; k++) {
      const e = Math.floor(Math.random() * n.nE);
      if (n.cls[e] <= 2 && n.zone[e] && G.w.zones.get(n.zone[e])?.owned) return e;
    }
    return -1;
  },
  daily() {
    const s = G.s, m = s.min, month = Time.month(m);
    // météo du jour
    if (!RealWeather.active()) {
      const r = Math.random();
      let w = 'sun';
      const winter = month === 11 || month <= 1, summer = month >= 5 && month <= 7;
      if (winter && r < 0.1) w = 'snow';
      else if (summer && r < 0.15) w = 'heat';
      else if (r < 0.04) w = 'storm';
      else if (r < 0.3) w = 'rain';
      s.weather = w;
      if (w !== 'sun') this.log('Météo : ' + EV_INFO[w].title.toLowerCase() + ' aujourd’hui.', w);
      if (w === 'storm' && s.lines.some((l) => l.mode === 'boat')) UI.toast('Tempête : les navettes fluviales restent à quai aujourd’hui.', 'warn');
      if (w === 'snow') UI.toast('Neige : les bus roulent au ralenti.', 'warn');
    }
    // purge
    s.events = s.events.filter((e) => e.end > m - 1440);
    const modes = new Set(s.lines.map((l) => l.mode));
    const day0 = m - Time.mod(m);
    // grève (annoncée la veille)
    if (Math.random() < 0.035 && (modes.has('bus') || modes.has('metro'))) {
      const mode = modes.has('metro') && Math.random() < 0.5 ? 'metro' : modes.has('bus') ? 'bus' : 'metro';
      const cost = Math.round((40000 + s.lines.filter((l) => l.mode === mode).reduce((a, l) => a + l.veh.length, 0) * 6000) * s.costMul);
      this.add({ kind: 'strike', mode, start: day0 + 1440 + 300, end: day0 + 2880, title: 'Préavis de grève', desc: 'les agents ' + (mode === 'bus' ? 'des bus' : 'du métro') + ' cesseront le travail demain.', bad: true, cost, resolved: false, asked: false });
    }
    // travaux
    if (Math.random() < 0.22) {
      const z = this.randomOwnedZone();
      if (z) {
        const len = 2 + Math.floor(Math.random() * 3);
        this.add({ kind: 'works', start: day0 + 1440 + 420, end: day0 + 1440 * (1 + len), title: 'Travaux de voirie', desc: 'chantier à ' + z.name + ' pendant ' + len + ' jours, circulation difficile.', bad: true, zone: z.code, traffic: { zone: z.code, mult: 1.6 } });
      }
    }
    // grand événement
    if (Math.random() < 0.2 && s.lines.length) {
      const l = pick(s.lines); const st = pick(l.stops);
      const what = pick(['Match de football', 'Concert en plein air', 'Festival', 'Salon', 'Feu d’artifice', 'Marché de nuit']);
      const st0 = day0 + 1440 + 17 * 60;
      this.add({ kind: 'big', start: st0, end: st0 + 300, title: what, desc: 'demain soir près de ' + st.name + ', forte affluence attendue.', mx: st.mx, my: st.my, traffic: { mx: st.mx, my: st.my, r: 900, mult: 1.5 } });
    }
    // manifestation
    if (Math.random() < 0.06) {
      const c = G.s.city;
      const st0 = day0 + 1440 + 14 * 60;
      this.add({ kind: 'demo', start: st0, end: st0 + 180, title: 'Manifestation', desc: 'cortège demain après-midi en centre-ville, ralentissements prévus.', bad: true, mx: lonToMx(c.lon), my: latToMy(c.lat), traffic: { mx: lonToMx(c.lon), my: latToMy(c.lat), r: 900, mult: 1.8 } });
    }
  },
  hourly() {
    const s = G.s, m = s.min, h = Time.hour(m);
    // accident
    const peak = (h >= 7 && h <= 9) || (h >= 16 && h <= 19);
    if (Math.random() < (peak ? 0.08 : 0.025)) {
      const e = this.randomRoadEdge();
      if (e >= 0) {
        const n = G.w.road;
        const mx = n.x[n.ea[e]], my = n.y[n.ea[e]];
        const dur = 60 + Math.floor(Math.random() * 120);
        const where = n.name[e] || G.w.zoneAt(mx, my)?.name || 'centre';
        this.add({ kind: 'accident', start: m, end: m + dur, title: 'Accident', desc: (n.name[e] ? where : 'secteur ' + where) + ', bouchons pendant ' + Math.round(dur / 60) + ' h environ.', bad: true, mx, my, traffic: { mx, my, r: 550, mult: 2.2 } });
      }
    }
    // incident technique (métro / TER)
    const rail = s.lines.filter((l) => (l.mode === 'metro' || l.mode === 'ter') && l.status === 'active');
    if (rail.length && Math.random() < 0.012) {
      const l = pick(rail); const dur = 60 + Math.floor(Math.random() * 120);
      this.add({ kind: 'failure', lineId: l.id, start: m, end: m + dur, title: 'Incident technique', desc: 'ligne ' + Lines.label(l) + ' interrompue (' + pick(['panne de signalisation', 'rame en panne', 'colis suspect', 'panne électrique']) + ').', bad: true });
    }
    // grève à confirmer
    for (const e of s.events) if (e.kind === 'strike' && !e.asked && e.start - m < 1200) { e.asked = true; UI.strikeDialog(e); }
  },
};

/* ---------- moteur ---------- */
const Sim = {
  newState(city, diff, slot) {
    const d = DIFF[diff];
    const now = new Date();
    const startMs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return {
      v: 1, slot, city, diff, costMul: d.cost, money: d.money, loans: [], startMs, min: 300, sec: 300 * 60, nextMin: 301,
      owned: [], lines: [], nextId: 1, events: [], journal: [], weather: 'sun', rail: { stations: [], tracks: [] }, tuto: { main: 'pending', seen: {} },
      today: Eco.blankDay(), days: [], ads: { bus: 1, metro: 1, ter: 1, boat: 1 },
      settings: { idle: true, fill: true, traffic: true, zones: true, names: true, pois: true, lights: true, base: 'photo' },
      modalShift: 0, view: null, lastReal: Date.now(), created: Date.now(), zoneMode: 'iris',
    };
  },

  onNetworkGrow() {
    for (const l of G.s.lines) {
      const want = (l.path.pairs || []).filter(Boolean).length + ((l.pathB && l.pathB.pairs) || []).filter(Boolean).length;
      if (!(l.segE && l.segFound >= want)) Lines.resolveEdges(l);
    }
    if (G.s.rail && G.s.rail.joins && G.s.rail.joins.length) Rail.inject(); // aiguillages vers des voies nouvellement chargées
    this.rerouteOld();
  },
  /** lignes créées avant la gestion des sens uniques : nouveau calcul automatique */
  rerouteOld() {
    let n = 0;
    for (const l of G.s.lines) {
      if (l.routedV2 || l.mode === 'metro') { l.routedV2 = true; continue; }
      const net = Lines.netFor(l.mode);
      // on attend que le réseau couvre tous les arrêts
      if (!l.stops.every((st) => net.nearest(st.mx, st.my, 250) >= 0)) continue;
      if (Lines.reroute(l)) n++;
      else l.routedV2 = true; // impossible : on garde l'ancien tracé
    }
    if (n) { UI.toast(n + ' ligne' + (n > 1 ? 's' : '') + ' recalculée' + (n > 1 ? 's' : '') + ' selon les sens de circulation.', 'ok'); Render.dirty = true; }
  },
  onSignals() {
    for (const l of G.s.lines) Lines.controls(l);
  },

  advance(sec) {
    const s = G.s;
    Taxi.fMs = 0; // budget de calcul d'itinéraires des taxis, par image
    // à grande vitesse, pas de calcul plus longs pour les véhicules (sans dépassement ni feu grillé)
    this.hmax = G.speed === 'rt' || G.speed < 5 ? 1 : G.speed < 20 ? 1.5 : 2.5;
    let rem = sec;
    while (rem > 0) {
      const step = Math.min(rem, 10);
      rem -= step;
      s.sec += step;
      this.moveVehicles(step);
      Taxi.move(step);
      while (s.sec >= s.nextMin * 60) { s.min = s.nextMin; this.minute(); s.nextMin++; }
    }
  },

  minute() {
    const s = G.s, m = s.min, mod = Time.mod(m);
    for (const l of s.lines) this.lineMinute(l, m);
    Taxi.minute(m);
    Events.minute();
    if (mod % 10 === 0) {
      Staff.tick();
      UI.updateTint();
      Traffic.update();
      for (const l of s.lines) this.lineQuality(l);
    }
    if (mod % 60 === 0) this.hour();
    if (mod === 0) this.newDay();
    if (mod === 300) Events.daily();
    for (const l of s.lines) if (l.status === 'construction' && m >= l.buildEnd) {
      l.status = 'active';
      Events.log('Ligne ' + Lines.label(l) + ' du métro inaugurée.', 'ok');
      UI.toast('Inauguration : la ligne ' + Lines.label(l) + ' du métro ouvre au public !', 'ok');
      Render.dirty = true;
    }
  },

  lineMinute(l, m) {
    const was = l.active;
    l.active = Lines.isActiveAt(l, m);
    if (l.active && !was) { Lines.activate(l, m); Render.dirty = true; }
    if (!l.active) {
      if (was) { for (const v of l.veh) { v.hidden = true; v.on.fill(0); if (v.ont) v.ont.fill(0); v.load = 0; } for (const W of [l.Wf, l.Wb, l.Xf, l.Xb, l.Rf, l.Rb]) W.fill(0); }
      return;
    }
    const s = G.s, n = l.stops.length, mode = MODES[l.mode];
    // grille horaire : renforts, retraits au dépôt
    if (was) Lines.adjustFleet(l, m);
    // coûts d'exploitation (véhicules en service uniquement)
    let op = 0, nRun = 0;
    for (const v of l.veh) if (!v.parked) { op += MODEL[v.model].op; nRun++; }
    op = (op * s.costMul * Events.opsMult(l.mode) * Staff.opsMult()) / 60;
    Eco.charge(op, 'ops'); l.today.ops += op;
    const adLvl = s.ads[l.mode] || 0;
    const adH = (ADS.perHour[l.mode][adLvl] * nRun) / 60;
    if (adH) { if (!s.unlimited) { s.money += adH; s.today.ads += adH; } l.today.ads += adH; }
    if (!l.veh.length) return;
    // génération des voyageurs
    const h = Time.hour(m), we = Time.weekend(m);
    const prof = we ? (PROF_WE[h] / SUM_WE) * (Time.sundayLike(m) ? 0.6 : 0.85) : PROF_WD[h] / SUM_WD;
    const price = Lines.price(l, m);
    const pf = price <= 0.01 ? 2.2 : clamp(Math.pow(mode.ref / price, 0.55), 0.3, 2.2);
    const base = (prof / 60) * l.qual * pf * l.rep * Events.demandFor(l) * ADS.demand[adLvl];
    if (base <= 0) return;
    const od = l.od, em = l.evMul;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const r = od[i * n + j] * base * Math.max(em[i], em[j]);
      if (l.loop || j > i) l.Wf[i * n + j] += r; else l.Wb[i * n + j] += r;
    }
    // trajets avec correspondance : on monte ici, on changera de ligne plus loin
    for (const x of l.xgen) {
      if (!x.b.active || !x.b.veh.length) continue;
      const r = x.r * base * Math.max(em[x.i], em[x.ka]) * Math.min(1.1, x.b.qual || 0);
      if (l.loop || x.ka > x.i) l.Xf[x.i * n + x.ka] += r; else l.Xb[x.i * n + x.ka] += r;
    }
    // abandons
    const rate = clamp(0.003 + Math.max(0, l.headway - 12) * 0.0015, 0.003, 0.05);
    let lost = 0;
    for (const W of [l.Wf, l.Wb, l.Xf, l.Xb, l.Rf, l.Rb]) for (let k = 0; k < W.length; k++) if (W[k] > 0) { const x = W[k] * rate; W[k] -= x; lost += x; l.sm[(k / n) | 0] += x; }
    l.today.mec += lost; s.today.mec += lost;
  },

  lineQuality(l) {
    const mode = MODES[l.mode];
    Events.stopMult(l);
    let spd = 0;
    if (l.mode === 'bus') {
      let num = 0, den = 0;
      const net = G.w.road;
      (l.P || [l.path]).forEach((P, dir) => {
        if (!P) return;
        const segE = l.segEs ? l.segEs[dir] : null;
        for (let i = 0; i < P.pts.length - 1; i++) {
          const segL = P.cum[i + 1] - P.cum[i];
          const e = segE ? segE[i] : -1;
          const vmax = Math.min((e >= 0 && net.lim[e] > 0 ? net.lim[e] : 50) / 3.6 * 0.95, 13.9);
          num += segL; den += segL / (vmax * Traffic.busFactor(e, l) * (l.signal ? 1.05 : 1) * Events.speedMult('bus'));
        }
      });
      // feux et stops : attente + redémarrage
      const a = l.veh[0] ? MODEL[l.veh[0].model].acc || 1 : 1, vc = 8.3;
      const restart = vc / (2 * a) + vc / (2 * PHYS.bus.b);
      for (const c of l.ctl || []) den += c.t === 'sig' ? (l.signal ? 1 + restart * 0.15 : 0.5 * (20 + restart)) : c.t === 'stop' ? 4 + restart : 0.45 * (2 + restart);
      // arrêts : décélération + redémarrage
      den += l.ev.length * restart;
      spd = den > 0 ? num / den : 6;
    }
    let cycle;
    if (l.mode === 'bus') cycle = l.C / Math.max(1, spd) + l.ev.length * (mode.dwell + 6);
    else {
      const md = l.veh[0] ? MODEL[l.veh[0].model] : CATALOG[l.mode][0];
      const ph = PHYS[l.mode], a = md.acc || ph.a;
      let vc = md.kmh / 3.6 * (Events.speedMult(l.mode) || 0.01);
      if (ph.vmax) vc = Math.min(vc, ph.vmax);
      if (l.mode === 'metro') vc *= 0.97;
      cycle = 0;
      for (let k = 0; k < l.ev.length; k++) {
        const u0 = l.ev[k].u, u1 = k + 1 < l.ev.length ? l.ev[k + 1].u : l.ev[0].u + l.C;
        cycle += runTime(u1 - u0, Math.max(0.5, vc), a, ph.b) + (u1 - u0 > 1 ? mode.dwell + 4 : 0);
      }
      spd = l.C / Math.max(1, cycle);
    }
    const nA = Math.max(1, l.active ? Lines.running(l) : Lines.targetActive(l, G.s.min));
    l.headway = cycle / nA / 60;
    l.cycleMin = cycle / 60;
    l.speedAvg = l.C / Math.max(1, cycle) * 3.6;
    const qWait = clamp(1.25 - l.headway / 40, 0.25, 1.15);
    const qSpeed = clamp(Math.pow(l.speedAvg / mode.refKmh, 0.6), 0.55, 1.35);
    l.qual = l.veh.length ? qWait * qSpeed * Staff.qualMult() * (1 + 0.03 * (G.s.social || 0)) : 0;
  },

  /** vitesse de croisière visée sur le tronçon courant (m/s) */
  cruise(l, v, p) {
    const md = MODEL[v.model];
    const vm = md.kmh / 3.6;
    const sm = Events.speedMult(l.mode);
    const segE = l.segEs ? l.segEs[p.dir || 0] : l.segE;
    const e = segE ? segE[p.seg] : -1;
    if (l.mode === 'bus') {
      const lim = (e >= 0 && G.w.road.lim[e] > 0 ? G.w.road.lim[e] : 50) / 3.6;  // limitation légale
      return Math.max(1.5, Math.min(vm, lim * 0.95) * Traffic.busFactor(e, l) * sm);
    }
    if (l.mode === 'metro') return vm * 0.97;
    if (l.mode === 'ter') {
      const lim = e >= 0 ? G.w.rail.spd[e] : PHYS.ter.vmax;
      return Math.max(3, Math.min(vm, PHYS.ter.vmax, Math.max(lim, 60 / 3.6)) * sm);
    }
    return Math.max(0.5, vm * (sm || 0.01));
  },

  /** anticipation des panneaux : freine avant d'entrer dans une zone plus lente */
  limitAhead(l, v, p, b) {
    const P = l.P[p.dir], segE = l.segEs ? l.segEs[p.dir] : null;
    if (!segE) return Infinity;
    const net = G.w.road, sLoc = p.dir ? v.u - l.L0 : v.u;
    const look = (v.v * v.v) / (2 * b) + 15;
    let best = Infinity;
    for (let i = p.seg + 1; i < P.pts.length - 1; i++) {
      const d = P.cum[i] - sLoc;
      if (d > look) break;
      const e = segE[i]; if (e < 0) continue;
      const lim = (net.lim[e] > 0 ? net.lim[e] : 50) / 3.6 * 0.95;
      const vAllowed = Math.sqrt(lim * lim + 2 * b * 0.8 * Math.max(0, d - 8));
      if (vAllowed < best) best = vAllowed;
    }
    return best;
  },

  /** attente à un feu / stop / cédez-le-passage (en secondes de jeu) */
  ctlWait(l, c, tSec) {
    if (c.t === 'stop') return 3 + 3 * Math.min(1, G.w.road.traffic[0] || 0);
    if (c.t === 'yield') return Math.random() < 0.55 ? 0 : 1 + Math.random() * 3;
    const sg = c.sg;
    const T = 60 + (sg.ph % 41);            // cycle 60 à 100 s
    const g = l.signal ? 0.88 : 0.5;          // part du vert (priorité aux feux)
    const ph = (tSec + (sg.ph >>> 8) % T) % T;
    return ph < g * T ? 0 : T - ph;
  },

  moveVehicles(dt) {
    const tNow = G.s.sec;
    for (const l of G.s.lines) {
      if (!l.active || !l.veh.length) continue;
      const ctl = l.ctl || [], ph = PHYS[l.mode], b = ph.b;
      // véhicule qui précède chacun sur la ligne (même sens de parcours)
      let lead = null;
      if (l.veh.length > 1) {
        const ord = l.veh.filter((x) => !x.hidden).sort((x, y) => x.u - y.u);
        lead = new Map();
        ord.forEach((x, i) => lead.set(x, ord[(i + 1) % ord.length]));
      }
      for (const v of l.veh) {
        if (v.parked) continue;
        if (v.incUntil > tNow) { v.v = 0; v.spd = 0; if (v.dwell <= 0) v.hold = 'incident'; continue; }
        if (v.hold === 'incident') v.hold = null;
        const a = MODEL[v.model].acc || ph.a;
        if (!(v.v >= 0)) v.v = 0;
        let t = dt, guard = 0;
        while (t > 1e-6 && guard++ < 800 && !v.parked) {
          if (v.dwell > 0) { const d = Math.min(t, v.dwell); v.dwell -= d; t -= d; if (v.dwell <= 0) v.hold = null; continue; }
          const h = Math.min(t, this.hmax || 1);
          const evt = l.ev[v.ev];
          const tStop = evt.u + (v.wrap ? l.C : 0);
          let c = null, tCtl = Infinity, key = -1, mustC = false;
          if (ctl.length) { c = ctl[v.ci]; tCtl = c.u + (v.cwrap ? l.C : 0); key = v.ci + (v.cwrap ? 1e6 : 0); }
          if (c && tCtl <= tStop) {
            // à l'approche d'un feu : on décide une fois s'il faudra s'arrêter
            if (v.cdec !== key) {
              const gapC = tCtl - v.u;
              if (gapC <= (v.v * v.v) / (2 * b) + 30 + v.v * h) {
                v.cdec = key;
                v.cstop = c.t === 'stop' || this.ctlWait(l, c, tNow + (dt - t) + gapC / Math.max(v.v, 2)) > 0;
              }
            }
            mustC = v.cdec === key && v.cstop;
          }
          const target = mustC ? tCtl : tStop;
          const gap = Math.max(0, target - v.u);
          const p = Lines.posOf(l, v);
          let vt = Math.min(this.cruise(l, v, p), Math.sqrt(2 * b * gap));
          if (l.mode === 'bus') vt = Math.min(vt, this.limitAhead(l, v, p, b));
          // distance de sécurité avec le véhicule de devant : jamais de dépassement ni de chevauchement
          const L = lead && lead.get(v);
          if (L && L !== v) {
            let gl = L.u - v.u; if (gl <= 0) gl += l.C;
            const free = gl - Math.min(ph.safe, l.C / l.veh.length * 0.4);
            if (free < gap) {
              vt = Math.min(vt, Math.sqrt(2 * b * Math.max(0, free)));
              if (free <= 0.5) { v.v = 0; v.spd = 0; v.hold = 'queue'; t -= h; continue; }
            }
          }
          if (v.hold === 'queue') v.hold = null;
          v.v = v.v < vt ? Math.min(vt, v.v + a * h) : Math.max(vt, v.v - 2 * b * h);
          v.spd = v.v;
          // pas long : jamais au-delà de la distance libre derrière le véhicule de devant
          let freeL = Infinity;
          if (h > 1 && L && L !== v) { let gl = L.u - v.u; if (gl <= 0) gl += l.C; freeL = gl - Math.min(ph.safe, l.C / l.veh.length * 0.4) - 0.5; }
          if (gap <= Math.max(0.8, v.v * h)) {
            // arrivée (arrêt ou feu), à vitesse quasi nulle
            const used = v.v > 0.1 ? Math.min(h, gap / v.v) : Math.min(h, 0.5);
            v.u = target; t -= used; v.v = 0; v.spd = 0;
            if (mustC) {
              v.ci++; if (v.ci >= ctl.length) { v.ci = 0; v.cwrap = true; }
              v.cdec = -1;
              const w = c.t === 'stop' ? 2.5 + Math.random() * 2.5 : c.t === 'yield' ? 1 + Math.random() * 3 : this.ctlWait(l, c, tNow + (dt - t));
              if (w > 0) { v.dwell = w; v.hold = c.t; }
              continue;
            }
            if (v.wrap) { v.u -= l.C; v.wrap = false; v.cwrap = false; if (v.u < 0) v.u = 0; }
            this.atStop(l, v, evt);
            if (v.parked) break;
            v.hold = this.regulate(l, v) ? 'reg' : null;
            v.ev++;
            if (v.ev >= l.ev.length) { v.ev = 0; v.wrap = true; }
            continue;
          }
          v.u += Math.min(v.v * h, Math.max(0, freeL)); t -= h;
          // feux verts et cédez-le-passage dégagés : franchis sans s'arrêter
          let g2 = 0;
          while (ctl.length && g2++ < ctl.length) {
            const cc = ctl[v.ci], tc = cc.u + (v.cwrap ? l.C : 0);
            if (tc > v.u) break;
            v.ci++; if (v.ci >= ctl.length) { v.ci = 0; v.cwrap = true; }
            v.cdec = -1;
          }
        }
      }
    }
  },

  /** Régulation à l'intervalle : à l'arrêt, un véhicule trop proche de celui de devant
   *  patiente pour se recentrer entre son prédécesseur et son suiveur. */
  regulate(l, v) {
    if (G.noReg) return false;
    const vis = l.veh.filter((x) => !x.hidden);
    if (vis.length < 2) return false;
    let ahead = Infinity, behind = Infinity;
    for (const o of vis) {
      if (o === v) continue;
      let d = o.u - v.u; if (d <= 0) d += l.C;
      if (d < ahead) ahead = d;
      let e = v.u - o.u; if (e <= 0) e += l.C;
      if (e < behind) behind = e;
    }
    const spd = Math.max(1, (l.speedAvg || 15) / 3.6);
    const extra = clamp((behind - ahead) / 2 / spd, 0, PHYS[l.mode].maxHold);
    if (extra < 4) return false;
    v.dwell += extra;
    return true;
  },

  atStop(l, v, evt) {
    const s = G.s, n = l.stops.length, k = evt.k, mode = MODES[l.mode];
    const md = MODEL[v.model];
    // descente
    const off = v.on[k]; v.on[k] = 0; v.load = Math.max(0, v.load - off);
    if (!v.ont) v.ont = new Float64Array(n);
    const xo = v.ont[k]; v.ont[k] = 0;
    if (xo > 1e-6) Transfers.hand(l, k, xo);
    const terminus = l.loop ? k === 0 : (evt.d === 0 && k === n - 1) || (evt.d === 1 && k === 0);
    if (!l.loop && terminus) { v.on.fill(0); v.ont.fill(0); v.load = 0; }
    // fin de service pour ce véhicule (grille horaire) : il rentre au dépôt depuis le terminus
    if (v.toPark && terminus) {
      // ligne circulaire : les voyageurs encore à bord attendent le véhicule suivant (billet conservé)
      if (v.load > 1e-6) { const R0 = evt.d === 0 ? l.Rf : l.Rb; for (let j = 0; j < n; j++) if (j !== k && v.on[j] > 0) R0[k * n + j] += v.on[j]; }
      v.parked = true; v.toPark = false; v.hidden = true; v.on.fill(0); v.ont.fill(0); v.load = 0; v.dwell = 0; v.hold = null;
      if (G.ui && G.ui.follow === v) G.ui.follow = null;
      return;
    }
    // montée (voyageurs directs, voyageurs qui changeront de ligne, voyageurs en correspondance déjà munis d'un billet)
    const W = evt.d === 0 ? l.Wf : l.Wb, X = evt.d === 0 ? l.Xf : l.Xb, R = evt.d === 0 ? l.Rf : l.Rb;
    let want = 0;
    for (let j = 0; j < n; j++) if (j !== k) want += W[k * n + j] + X[k * n + j] + R[k * n + j];
    const space = Math.max(0, md.cap - v.load);
    const take = Math.min(space, want);
    if (want > 0 && take > 0) {
      const ratio = take / want;
      let paying = 0;
      for (let j = 0; j < n; j++) {
        if (j === k) continue;
        const i0 = k * n + j;
        const w = W[i0] * ratio, x = X[i0] * ratio, r = R[i0] * ratio;
        W[i0] -= w; X[i0] -= x; R[i0] -= r;
        v.on[j] += w + x + r; v.ont[j] += x;
        paying += w + x;
      }
      v.load += take;
      const price = Lines.price(l, s.min);
      const fare = paying * price * Events.fareMult(l);
      const adPax = paying * ADS.perPax[s.ads[l.mode] || 0];
      if (!s.unlimited) { s.money += fare + adPax; s.today.fares += fare; s.today.ads += adPax; }
      s.today.pax += take; l.sb[k] += take;
      l.today.fares += fare; l.today.ads += adPax; l.today.pax += take;
    }
    if (want - take > 0.5) {
      const left = (want - take) * 0.3;
      l.today.mec += left; s.today.mec += left; l.sm[k] += left;
    }
    l.today.loadSum += v.load / md.cap; l.today.loadN++;
    if (v.load / md.cap > (l.today.loadMax || 0)) l.today.loadMax = v.load / md.cap;
    v.dwell = Math.min(mode.maxDwell, mode.dwell + (take + off) * mode.perPax);
    v.lastStop = k; v.dir = evt.d;
  },

  hour() {
    Eco.hourly();
    Events.hourly();
    UI.updateTint();
    UI.refreshTop();
    if (G.s.settings && UI.sheetOpen()) UI.refreshSheet();
  },

  newDay() {
    const s = G.s;
    const d = s.today;
    d.date = s.min - 1440;
    d.lines = {};
    for (const l of s.lines) {
      d.lines[l.id] = { pax: Math.round(l.today.pax), fares: Math.round(l.today.fares), ops: Math.round(l.today.ops), ads: Math.round(l.today.ads), mec: Math.round(l.today.mec), fill: l.today.loadN ? l.today.loadSum / l.today.loadN : 0, peak: l.today.loadMax || 0, xin: Math.round(l.today.xin || 0), xout: Math.round(l.today.xout || 0) };
      const ratio = l.today.mec / Math.max(1, l.today.pax) * Staff.mecRepMult();
      l.rep = clamp(l.rep + 0.02 + (Staff.L('social') >= 3 ? 0.005 : 0) - ratio * 0.6, 0.6, 1.05);
      l.hist.unshift(d.lines[l.id]); if (l.hist.length > 30) l.hist.length = 30;
      l.today = Lines.blankStats();
      if (l.sb) { l.sb.fill(0); l.sm.fill(0); }
    }
    Taxi.newDay();
    s.days.unshift(d); if (s.days.length > 60) s.days.length = 60;
    s.today = Eco.blankDay();
    const servedPop = this.servedPop();
    s.modalShift = Math.min(0.22, d.pax / Math.max(20000, servedPop * 2.8));
    if (!s.unlimited && Eco.dayProfit(d) < 0 && s.money < 0) UI.toast('Trésorerie négative : pensez à un prêt ou à ajuster vos tarifs.', 'bad');
    Save.auto();
  },

  servedPop() {
    let p = 0;
    for (const z of G.w.zones.values()) if (z.owned) p += z.pop;
    return p;
  },

  avgDailyProfit() {
    const ds = G.s.days.slice(0, 3);
    if (!ds.length) return 0;
    return ds.reduce((a, d) => a + Eco.dayProfit(d), 0) / ds.length;
  },

  /** décale toutes les dates du jeu de d minutes (retour en arrière de l'horloge) */
  shiftTime(d) {
    const s = G.s;
    for (const e of s.events) { e.start += d; e.end += d; }
    for (const t of s.training || []) { t.start += d; t.end += d; }
    for (const l of s.lines) {
      if (l.buildEnd) l.buildEnd += d;
      if (l.created !== undefined) l.created += d;
      for (const v of l.veh) {
        if (v.towAt) v.towAt += d;
        if (v.brokenUntil) v.brokenUntil += d;
        if (v.incUntil) v.incUntil += d * 60;
      }
    }
    for (const ln of s.loans || []) if (ln.taken !== undefined) ln.taken += d;
    for (const j of s.journal || []) j.t += d;
    for (const n of s.notifs || []) n.t += d;
    for (const x of s.days || []) if (x.date !== undefined) x.date += d;
    if (s.evLast) for (const k in s.evLast) s.evLast[k] += d;
    Taxi.shiftTime(d);
  },
  /** progression pendant l'absence (mode « idle ») */
  offline(realSec, gameMinForced) {
    const s = G.s;
    // 1 min de jeu par seconde réelle (ou durée réelle en mode temps réel), plafonné à 5 jours
    const gameMin = Math.min(gameMinForced ?? realSec, 5 * 1440);
    if (gameMin < 30) return null;
    const perMin = this.avgDailyProfit() / 1440;
    const gain = s.unlimited ? 0 : perMin * gameMin;
    const days = Math.floor((Time.mod(s.min) + gameMin) / 1440);
    s.money += gain;
    for (let k = 0; k < days; k++) {
      const d = Eco.blankDay(); d.date = s.min + k * 1440;
      const ref = s.days[0];
      if (ref) { d.taxi = ref.taxi || 0; d.taxiOps = ref.taxiOps || 0; d.fares = ref.fares; d.ads = ref.ads; d.ops = ref.ops; d.maint = ref.maint; d.interest = ref.interest; d.pax = ref.pax; d.mec = ref.mec; }
      d.offline = true;
      s.days.unshift(d);
    }
    if (s.days.length > 60) s.days.length = 60;
    s.min += Math.floor(gameMin); s.sec = s.min * 60; s.nextMin = s.min + 1;
    s.events = s.events.filter((e) => e.end > s.min);
    return { gameMin, gain };
  },
};

/* ---------- temps réel ---------- */
const RealTime = {
  /** heure de Paris « murale », exprimée comme une date UTC (même convention que l'horloge du jeu) */
  parisMs(d = new Date()) {
    const f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
    const p = {}; for (const x of f.formatToParts(d)) p[x.type] = x.value;
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  },
  targetSec() { return (this.parisMs() - G.s.startMs) / 1000; },
  /** cale l'horloge du jeu sur l'heure réelle : rattrapage simulé si l'écart est court, saut sinon */
  sync() {
    const s = G.s; if (!s) return;
    const target = this.targetSec(), gap = target - s.sec;
    if (Math.abs(gap) < 5) return;
    if (gap > 0 && gap <= 3 * 3600) {
      let r = gap;
      while (r > 0) { const st = Math.min(r, 600); Sim.advance(st); r -= st; }
      return;
    }
    this.jump(target);
  },
  jump(targetSec) {
    const s = G.s;
    const dayBefore = Math.floor(s.min / 1440);
    const newMin = Math.floor(targetSec / 60);
    // l'horloge recule (le jeu avait pris de l'avance sur l'heure réelle) : tout ce qui est daté recule d'autant,
    // pour que les événements en cours le restent avec la même durée restante
    if (newMin < s.min) Sim.shiftTime(newMin - s.min);
    s.sec = targetSec; s.min = newMin; s.nextMin = s.min + 1;
    if (Math.floor(s.min / 1440) !== dayBefore) Sim.newDay();
    s.events = s.events.filter((e) => e.end > s.min && e.start < s.min + 2880);
    for (const l of s.lines) {
      if (l.status === 'construction' && s.min >= l.buildEnd) l.status = 'active';
      l.active = Lines.isActiveAt(l, s.min);
      Lines.activate(l, s.min);
      for (const W of [l.Wf, l.Wb, l.Xf, l.Xb, l.Rf, l.Rb]) W.fill(0);
    }
    Traffic.update();
    for (const l of s.lines) Sim.lineQuality(l);
    UI.updateTint(); UI.refreshTop(); UI.refreshInfoBadge(); Render.dirty = true;
  },
  enable() {
    const s = G.s;
    s.realtime = true; G.speed = 'rt'; G.paused = false;
    this.sync();
    Events.log('Temps réel activé : l’horloge suit l’heure de Paris.', 'info');
    if (s.settings.realWeather) RealWeather.refresh(true);
    UI.refreshTop();
  },
  disable() { G.s.realtime = false; G.speed = 1; UI.refreshTop(); },
};

/* ---------- météo réelle (modèles Météo-France via Open-Meteo, sans clé) ---------- */
const WMO = {
  0: 'Ciel dégagé', 1: 'Peu nuageux', 2: 'Partiellement nuageux', 3: 'Couvert', 45: 'Brouillard', 48: 'Brouillard givrant',
  51: 'Bruine légère', 53: 'Bruine', 55: 'Bruine dense', 56: 'Bruine verglaçante', 57: 'Bruine verglaçante',
  61: 'Pluie faible', 63: 'Pluie', 65: 'Forte pluie', 66: 'Pluie verglaçante', 67: 'Pluie verglaçante',
  71: 'Neige faible', 73: 'Neige', 75: 'Forte neige', 77: 'Grains de neige', 80: 'Averses', 81: 'Averses', 82: 'Fortes averses',
  85: 'Averses de neige', 86: 'Fortes averses de neige', 95: 'Orage', 96: 'Orage avec grêle', 99: 'Orage avec grêle',
};
const RealWeather = {
  fetching: false, failNote: false,
  active() { const s = G.s; return !!(s && s.settings.realWeather && s.wxReal && Date.now() - s.wxReal.t < 3 * 3600e3); },
  async refresh(force) {
    const s = G.s; if (!s || !s.settings.realWeather || this.fetching) return;
    if (!force && s.wxReal && Date.now() - s.wxReal.t < 15 * 60e3) return;
    this.fetching = true;
    const q = 'latitude=' + s.city.lat.toFixed(4) + '&longitude=' + s.city.lon.toFixed(4) +
      '&current=temperature_2m,precipitation,rain,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m&timezone=Europe%2FParis';
    try {
      let j, src = 'Météo-France (AROME/ARPEGE)';
      try { j = await fetchJSON('https://api.open-meteo.com/v1/meteofrance?' + q, {}, 15000); }
      catch (e) { j = await fetchJSON('https://api.open-meteo.com/v1/forecast?' + q, {}, 15000); src = 'Open-Meteo'; }
      const c = j.current || {};
      const prev = s.weather;
      s.wxReal = { t: Date.now(), temp: c.temperature_2m, code: c.weather_code, wind: c.wind_speed_10m, gust: c.wind_gusts_10m, label: WMO[c.weather_code] || '—', src, at: c.time };
      s.weather = this.map(c);
      this.failNote = false;
      if (prev !== s.weather) {
        Events.log('Météo réelle : ' + s.wxReal.label.toLowerCase() + ', ' + Math.round(c.temperature_2m) + ' °C.', s.weather);
        if (s.weather === 'storm' && s.lines.some((l) => l.mode === 'boat')) UI.toast('Vent violent : les navettes fluviales restent à quai.', 'warn');
      }
      Traffic.update(); for (const l of s.lines) Sim.lineQuality(l);
      UI.refreshTop(); if (UI.sheetOpen()) UI.refreshSheet();
    } catch (e) {
      if (!this.failNote) { UI.toast('Météo réelle indisponible pour le moment, nouvel essai dans 15 min.', 'warn'); this.failNote = true; }
    } finally { this.fetching = false; }
  },
  /** codes météo OMM -> météo du jeu */
  map(c) {
    const code = c.weather_code ?? 0;
    if (code >= 95 || (c.wind_gusts_10m ?? 0) >= 75 || (c.wind_speed_10m ?? 0) >= 55) return 'storm';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86 || (c.snowfall ?? 0) > 0) return 'snow';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (c.rain ?? 0) > 0.1) return 'rain';
    if ((c.temperature_2m ?? 0) >= 31) return 'heat';
    return 'sun';
  },
};

/* ---------- sauvegardes ---------- */
const SLOTS = 5;
const Save = {
  key: (n) => 'corr.slot.' + n,
  list() {
    const out = [];
    for (let n = 1; n <= SLOTS; n++) {
      let meta = null;
      try { const raw = localStorage.getItem('corr.meta.' + n); if (raw) meta = JSON.parse(raw); } catch (e) { }
      out.push({ n, meta });
    }
    return out;
  },
  serialize() {
    const s = G.s;
    const r6 = (x) => Math.round(x * 1e9) / 1e9;
    const lines = s.lines.map((l) => ({
      id: l.id, mode: l.mode, num: l.num, color: l.color, name: l.name, loop: l.loop,
      stops: l.stops, prices: l.prices, hours: l.hours, svc: l.svc, svcPreset: l.svcPreset, night: l.night, busLane: l.busLane, signal: l.signal, laneKm: l.laneKm || 0,
      status: l.status, buildEnd: l.buildEnd, rep: l.rep, created: l.created, hist: l.hist, today: l.today,
      veh: l.veh.map((v) => v.model),
      path: { pts: l.path.pts.map((p) => [r6(p[0]), r6(p[1])]), pairs: l.path.pairs, stopPt: l.path.stopPt },
      pathB: l.pathB ? { pts: l.pathB.pts.map((p) => [r6(p[0]), r6(p[1])]), pairs: l.pathB.pairs, stopPt: l.pathB.stopPt } : null,
      routedV2: !!l.routedV2, gift: l.gift || 0,
      od: Array.from(l.od, (x) => Math.round(x * 100) / 100),
    }));
    const owned = [...G.w.zones.values()].filter((z) => z.owned).map((z) => z.code);
    const c = G.map.getCenter();
    return JSON.stringify({
      ...s, lines, owned, taxi: Taxi.toSave(), view: { lat: c.lat, lng: c.lng, z: G.map.getZoom() }, lastReal: Date.now(),
      zoneMode: G.w.mode,
    });
  },
  write(n) {
    if (!G.s) return false;
    G.s.slot = n;
    try {
      localStorage.setItem(this.key(n), this.serialize());
      const meta = { city: G.s.city.nom, date: Time.label(G.s.min).day, money: G.s.money, unlimited: !!G.s.unlimited, lines: G.s.lines.length, real: Date.now(), diff: G.s.diff };
      localStorage.setItem('corr.meta.' + n, JSON.stringify(meta));
      localStorage.setItem('corr.last', String(n));
      return true;
    } catch (e) {
      UI.toast('Sauvegarde impossible : stockage du téléphone plein ?', 'bad');
      return false;
    }
  },
  auto() { if (G.s && G.s.slot) this.write(G.s.slot); },
  read(n) {
    try { const raw = localStorage.getItem(this.key(n)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  remove(n) { try { localStorage.removeItem(this.key(n)); localStorage.removeItem('corr.meta.' + n); } catch (e) { } },
  /** Restaure l'état et reconstitue les lignes */
  hydrate(data) {
    const s = data;
    s.lines = s.lines.map((l) => {
      const line = { ...l, path: { pts: l.path.pts, pairs: l.path.pairs, stopPt: l.path.stopPt }, pathB: l.pathB ? { pts: l.pathB.pts, pairs: l.pathB.pairs, stopPt: l.pathB.stopPt } : null, od: Float64Array.from(l.od || []), veh: [] };
      line.veh = l.veh.map((m) => ({ id: s.nextId++, model: m, u: 0, ev: 0, dwell: 0, on: null, load: 0, hidden: true }));
      if (!line.today) line.today = Lines.blankStats();
      return line;
    });
    return s;
  },
};

/* ---------- aides pour placer les événements ---------- */
const EvCtx = {
  lines(pred) { return G.s.lines.filter((l) => l.status === 'active' && l.veh.length && (!pred || pred(l))); },
  line(pred) { const a = this.lines(pred); return a.length ? pick(a) : null; },
  veh(l) { const a = l.veh.filter((v) => !v.hidden && !v.parked && !v.broken && !(v.incUntil > G.s.sec)); return a.length ? pick(a) : null; },
  stop(l) { const k = Math.floor(Math.random() * l.stops.length); return { k, st: l.stops[k] }; },
  anyStop() { const l = this.line(); return l ? { l, ...this.stop(l) } : null; },
  poi(kinds) {
    const a = G.w.pois.filter((p) => kinds.includes(p.kind) && p.name && G.w.zoneAt(p.mx, p.my)?.owned);
    return a.length ? pick(a) : null;
  },
  road(maxCls = 2) {
    const n = G.w.road; if (!n.nE) return null;
    for (let k = 0; k < 60; k++) {
      const e = Math.floor(Math.random() * n.nE);
      if (n.cls[e] <= maxCls && n.zone[e] && G.w.zones.get(n.zone[e])?.owned) {
        const mx = n.x[n.ea[e]], my = n.y[n.ea[e]];
        return { mx, my, name: n.name[e] || ('secteur ' + (G.w.zoneAt(mx, my)?.name || 'centre')) };
      }
    }
    return null;
  },
  /** point sur le parcours d'une ligne de bus (pour les gênes qui touchent vraiment le réseau) */
  busSpot() {
    const l = this.line((x) => x.mode === 'bus'); if (!l) return this.road(3);
    const P = l.path, i = Math.floor(Math.random() * P.pts.length);
    const [mx, my] = P.pts[i];
    const n = G.w.road, e = n.nearest ? n.nearest(mx, my, 60) : -1;
    const nm = e >= 0 ? (n.adj[e] || []).map((x) => n.name[x]).find(Boolean) : null;
    return { mx, my, name: nm || ('secteur ' + (G.w.zoneAt(mx, my)?.name || l.stops[0].name)), l };
  },
  zone() { const z = [...G.w.zones.values()].filter((z) => z.owned); return z.length ? pick(z) : null; },
  center() { const c = G.s.city; return { mx: lonToMx(c.lon), my: latToMy(c.lat), name: 'centre-ville' }; },
  river() {
    const n = G.w.water; if (!n.nE) return null;
    for (let k = 0; k < 40; k++) { const i = Math.floor(Math.random() * n.x.length); const z = G.w.zoneAt(n.x[i], n.y[i]); if (z && z.owned) return { mx: n.x[i], my: n.y[i] }; }
    return null;
  },
  scale() { const v = G.s.lines.reduce((a, l) => a + l.veh.length, 0); return 1 + v / 15; },
  day0() { const m = G.s.min; return m - Time.mod(m); },
  rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  mec() { const d = G.s.days[0]; return d ? d.mec / Math.max(1, d.pax) : 0; },
};

Object.assign(Events, {
  def(e) { return EVDEF[e.kind] || null; },
  cat(e) { return EV_CAT[e.cat || (this.def(e) || {}).cat] || EV_CAT.reseau; },
  color(e) { return this.cat(e).col; },
  glyph(e) { return e.glyph || (this.def(e) || {}).glyph || '!'; },
  icon(e) { return EV_INFO[e.kind]?.icon || this.cat(e).icon; },
  tone(e) { return e.tone ?? (this.def(e) || {}).tone ?? (e.bad ? -1 : 0); },

  /** anciennes sauvegardes : effets reconstitués */
  normalize(e) {
    if (e.kind === 'big' && !e.demand && e.mx !== undefined) e.demand = { mx: e.mx, my: e.my, r: 700, mult: 4 };
    if (e.kind === 'failure' && !e.halt && e.lineId) e.halt = { lineId: e.lineId };
    if (e.tone === undefined) e.tone = this.tone(e);
    if (!e.cat) e.cat = (this.def(e) || {}).cat || (e.kind === 'strike' ? 'social' : 'reseau');
    if (e.applied === undefined) e.applied = e.start <= G.s.min;
    // réparation des parties touchées par l'ancien retour en arrière de l'horloge :
    // un événement déjà commencé mais daté dans le futur redémarre maintenant, même durée restante
    if (e.applied && !e.announce && e.kind !== 'strike' && e.start > G.s.min) { const d = e.start - G.s.min; e.start -= d; e.end -= d; }
    e.dialogOpen = false;
    return e;
  },

  /* ---- effets agrégés ---- */
  active() { return this.live(); },
  /** événements à venir connus du public : seulement ceux qui sont annoncés (les imprévisibles ne le sont jamais) */
  upcoming() { const m = G.s.min; return G.s.events.filter((e) => !e.void && e.start > m && (e.announce || e.kind === 'strike')); },
  live() { const m = G.s.min; return G.s.events.filter((e) => !e.void && e.start <= m && e.end > m); },
  trafficEvents() { return this.live().filter((e) => e.traffic).map((e) => e.traffic); },
  speedMult(mode) {
    const w = this.weather();
    let f = 1;
    if (mode === 'bus') f = w === 'snow' ? 0.6 : w === 'rain' ? 0.92 : 1;
    else if (mode === 'boat') f = w === 'storm' ? 0 : 1;
    else if (mode === 'ter') f = w === 'snow' ? 0.85 : 1;
    for (const e of this.live()) if (e.speed && e.speed.mode === mode) f *= e.speed.mult;
    return f;
  },
  /** affluence d'une ligne (météo + événements touchant le mode, la ligne ou tout le réseau) */
  demandFor(l) {
    let f = this.demandMult(l.mode);
    for (const e of this.live()) {
      const d = e.demand; if (!d || d.mx !== undefined) continue;
      if (d.all || d.mode === l.mode || d.lineId === l.id) f *= d.mult;
    }
    return f;
  },
  fareMult(l) {
    let f = Staff.fareMult();
    for (const e of this.live()) { const x = e.fare; if (x && (x.all || x.mode === l.mode || x.lineId === l.id)) f *= x.mult; }
    return f;
  },
  opsMult(mode) {
    let f = 1;
    for (const e of this.live()) if (e.ops && (e.ops.all || e.ops.mode === mode)) f *= e.ops.mult;
    return f;
  },
  halted(line) {
    for (const e of this.live()) {
      if (e.kind === 'strike' && !e.resolved && e.mode === line.mode) return true;
      const h = e.halt;
      if (h && (h.all || h.lineId === line.id || h.mode === line.mode)) return true;
    }
    if (line.mode === 'boat' && this.weather() === 'storm') return true;
    return false;
  },
  stopMult(line) {
    const m = line.evMul; m.fill(1);
    for (const e of this.live()) {
      const d = e.demand; if (!d || d.mx === undefined) continue;
      line.stops.forEach((st, k) => { const dd = dist(st.mx, st.my, d.mx, d.my); if (dd < d.r) m[k] = Math.max(m[k], 1 + (d.mult - 1) * (1 - 0.6 * dd / d.r)); });
    }
  },
  where(e) {
    if (e.veh) {
      const l = G.s.lines.find((x) => x.id === e.veh.lineId), v = l && l.veh.find((x) => x.id === e.veh.vehId);
      if (l && v && !v.hidden) { const p = Lines.posOf(l, v); return [p.mx, p.my]; }
    }
    if (e.mx !== undefined) return [e.mx, e.my];
    if (e.zone) { const z = G.w.zones.get(e.zone); return z ? [z.cx, z.cy] : null; }
    if (e.lineId) { const l = G.s.lines.find((x) => x.id === e.lineId); if (l) { const st = l.stops[Math.floor(l.stops.length / 2)]; return [st.mx, st.my]; } }
    return null;
  },
  /** effets lisibles par le joueur */
  effects(e) {
    const out = [], L = (id) => { const l = G.s.lines.find((x) => x.id === id); return l ? 'ligne ' + lab(l) : 'une ligne'; };
    const pct = (m) => (m >= 1 ? '+' : '−') + Math.round(Math.abs(m - 1) * 100) + ' %';
    if (e.traffic) out.push(e.traffic.all ? `Circulation ${e.traffic.all < 1 ? 'fluidifiée' : 'chargée'} dans toute la ville (${pct(e.traffic.all)})` : e.traffic.zone ? `Circulation difficile dans le quartier (${pct(e.traffic.mult)} de trafic)` : `Bouchons dans un rayon de ${Math.round(e.traffic.r / 50) * 50} m (trafic ×${e.traffic.mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })})`);
    if (e.demand) out.push(e.demand.mx !== undefined ? `Affluence jusqu’à ×${e.demand.mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} aux arrêts à moins de ${Math.round(e.demand.r / 50) * 50} m` : `Fréquentation ${pct(e.demand.mult)} (${e.demand.all ? 'tout le réseau' : e.demand.mode ? MODES[e.demand.mode].label.toLowerCase() : L(e.demand.lineId)})`);
    if (e.halt) out.push(e.halt.all ? 'Tout le réseau à l’arrêt' : e.halt.mode ? `Toutes les lignes ${MODES[e.halt.mode].label.toLowerCase()} à l’arrêt` : `${L(e.halt.lineId)} interrompue`);
    if (e.kind === 'strike' && !e.resolved) out.push('Toutes les lignes du mode concerné restent au dépôt');
    if (e.speed) out.push(`Vitesse des ${MODES[e.speed.mode].label.toLowerCase()} ${pct(e.speed.mult)}`);
    if (e.fare) out.push(e.fare.mult === 0 ? `Aucune recette billets (${e.fare.all ? 'tout le réseau' : e.fare.mode ? MODES[e.fare.mode].label.toLowerCase() : L(e.fare.lineId)})` : `Recettes billets ${pct(e.fare.mult)} (${e.fare.all ? 'tout le réseau' : e.fare.mode ? MODES[e.fare.mode].label.toLowerCase() : L(e.fare.lineId)})`);
    if (e.ops) out.push(e.ops.all ? `Coûts d’exploitation du réseau ${pct(e.ops.mult)}` : `Coûts d’exploitation des ${MODES[e.ops.mode].label.toLowerCase()} ${pct(e.ops.mult)}`);
    if (e.social) out.push(`Climat social ${e.social > 0 ? 'en amélioration' : 'dégradé'} (${e.social > 0 ? '+' : '−'}${Math.round(Math.abs(e.social) * 100)} pts)`);
    if (e.mairie) out.push(`Relations avec la mairie ${e.mairie > 0 ? 'en amélioration' : 'dégradées'} (${e.mairie > 0 ? '+' : '−'}${Math.round(Math.abs(e.mairie) * 100)} pts)`);
    if (e.taxi) out.push(`Demande de taxis ${e.taxi.mult >= 1 ? '+' : '−'}${Math.round(Math.abs(e.taxi.mult - 1) * 100)} %`);
    if (e.taxiRep) out.push(`Image des taxis ${e.taxiRep > 0 ? '+' : '−'}${Math.round(Math.abs(e.taxiRep) * 100)} %`);
    if (e.addVeh) out.push(`${e.addVeh.n} véhicule${e.addVeh.n > 1 ? 's' : ''} ${(MODEL[e.addVeh.model] || {}).name || ''} ajouté${e.addVeh.n > 1 ? 's' : ''} à la flotte`);
    if (e.veh) out.push(e.veh.type === 'hold' ? `Un véhicule immobilisé ${e.veh.min} min (ceux qui suivent attendent derrière)` : `Un véhicule immobilisé ${e.veh.min} min puis indisponible jusqu’à la fin de l’événement`);
    if (e.rep) out.push(`Image ${e.rep.delta > 0 ? '+' : '−'}${Math.round(Math.abs(e.rep.delta) * 100)} % (${e.rep.all ? 'tout le réseau' : e.rep.mode ? MODES[e.rep.mode].label.toLowerCase() : L(e.rep.lineId)})`);
    if (e.money) out.push(`${e.money > 0 ? 'Recette' : 'Dépense'} de ${fmtEur(Math.abs(e.money))}`);
    return out;
  },

  /* ---- création ---- */
  add(e) {
    e.id = G.s.nextId++;
    if (e.tone === undefined) e.tone = this.tone(e);
    if (!e.cat) e.cat = (this.def(e) || {}).cat || 'reseau';
    e.bad = e.tone < 0;
    e.applied = false;
    G.s.events.push(e);
    this.log(e.title + ' — ' + e.desc, e.kind);
    if (e.start <= G.s.min) this.apply(e);
    Notif.push(e, e.start > G.s.min && !e.v ? 'announce' : 'now'); // une question n'est pas un événement annoncé
    if (e.q && !e.decided) UI.choiceDialog(e);
    Render.dirty = true;
    UI.refreshInfoBadge();
    return e;
  },
  /** effets immédiats au début de l'événement */
  apply(e) {
    if (e.applied || e.void) return;
    e.applied = true;
    const s = G.s;
    if (e.money && !e.moneyDone) { e.moneyDone = true; if (e.money > 0) Eco.earn(e.money, 'evIn'); else Eco.charge(-e.money, 'events'); }
    if (e.rep) for (const l of s.lines) if (e.rep.all || e.rep.mode === l.mode || e.rep.lineId === l.id) l.rep = clamp(l.rep + e.rep.delta, 0.6, 1.1);
    if (e.social) s.social = clamp((s.social || 0) + e.social, -1, 1);
    if (e.mairie) s.mairie = clamp((s.mairie || 0) + e.mairie, -1, 1);
    if (e.taxiRep && s.taxi) s.taxi.rep = clamp((s.taxi.rep || 1) + e.taxiRep, 0.6, 1.1);
    if (e.addVeh) Gauges.addVehicles(e);
    if (e.veh) {
      const l = s.lines.find((x) => x.id === e.veh.lineId), v = l && l.veh.find((x) => x.id === e.veh.vehId);
      if (v && !v.hidden && !v.parked) {
        v.incUntil = s.sec + e.veh.min * 60; v.incEv = e.id;
        if (e.veh.type === 'breakdown') { v.towAt = s.min + e.veh.min; v.brokenUntil = e.end; }
      }
    }
    if (e.announce && e.start < s.min + 1 && Math.abs(e.tone) >= 2 && e.notified === 'announce') Notif.push(e, 'start');
  },
  /** chaque minute : début des événements annoncés, véhicules en panne */
  minute() {
    const s = G.s, m = s.min;
    for (const e of s.events) if (!e.applied && !e.void && e.start <= m) {
      if (e.q && !e.decided) { // sans réponse : option prudente
        e.decided = true; const d = this.def(e);
        if (d && d.choose) { d.choose(e, e.dflt ?? 1); e.auto = true; Events.log(e.title + ' (sans réponse) — ' + e.desc, e.kind); }
        if (e.applied) continue;
      }
      this.apply(e);
    }
    for (const l of s.lines) for (const v of l.veh) {
      if (v.towAt && m >= v.towAt) {
        v.towAt = 0;
        // remorquage : les voyageurs à bord attendent le véhicule suivant au prochain arrêt
        if (!v.parked && !v.hidden && l.ev && l.ev[v.ev]) {
          const n = l.stops.length, evt = l.ev[v.ev], k = evt.k, R = evt.d === 0 ? l.Rf : l.Rb;
          for (let j = 0; j < n; j++) if (j !== k && v.on && v.on[j] > 0) R[k * n + j] += v.on[j];
        }
        v.parked = true; v.broken = true; v.hidden = true; v.load = 0; v.toPark = false;
        if (v.on) v.on.fill(0); if (v.ont) v.ont.fill(0);
        if (G.ui && G.ui.follow === v) G.ui.follow = null;
        Render.dirty = true;
      }
      if (v.broken && m >= (v.brokenUntil || 0)) { v.broken = false; v.brokenUntil = 0; }
    }
  },
  hourly() {
    const s = G.s, m = s.min, h = Time.hour(m);
    // grève à confirmer (dialogue la veille)
    for (const e of s.events) if (e.kind === 'strike' && !e.asked && e.start - m < 1200) { e.asked = true; UI.strikeDialog(e); }
    // choix restés sans réponse (après un rechargement)
    for (const e of s.events) if (e.q && !e.decided && !e.dialogOpen && e.start > m) UI.choiceDialog(e);
    // rythme : 3 à 14 événements par jour selon la taille du réseau, surtout en journée
    const nL = s.lines.length, nV = s.lines.reduce((a, l) => a + l.veh.length, 0);
    const perDay = nL ? Math.min(14, 4 + nL * 0.9 + nV * 0.06) : 1.5;
    const day = h >= 6 && h <= 22;
    const p = day ? perDay / 17 * 0.95 : perDay / 17 * 0.15;
    if (Math.random() < p) this.spawn();
    if (Math.random() < p * 0.25) this.spawn(); // parfois deux à la fois
  },
  ctx() {
    const m = G.s.min;
    return { m, h: Time.hour(m), dow: Time.dow(m), month: Time.month(m) };
  },
  spawn(forceId) {
    const s = G.s, c = this.ctx();
    s.evLast = s.evLast || {};
    const cands = EVENTS.filter((d) => {
      if (forceId) return d.id === forceId;
      if (s.evLast[d.id] && s.min - s.evLast[d.id] < (d.cd || 12) * 60) return false;
      if (d.when && !d.when(c)) return false;
      // pas deux fois le même événement en cours
      return !s.events.some((e) => e.kind === d.id && e.end > s.min);
    });
    if (!forceId) {
      // 80 % d'événements à choix (une décision en attente à la fois au plus), 20 % d'événements simples
      const pending = s.events.some((e) => e.q && !e.decided);
      const choice = cands.filter((d) => d.choice), simple = cands.filter((d) => !d.choice);
      let pool = !pending && choice.length && (Math.random() < 0.8 || !simple.length) ? choice : simple;
      if (pool === simple) {
        // puis la tonalité (≈ 50 % négatifs, 40 % positifs, 10 % mitigés)
        const r = Math.random(), want = r < 0.5 ? -1 : r < 0.9 ? 1 : 0;
        const sub = simple.filter((d) => Math.sign(d.tone) === want);
        if (sub.length) pool = sub;
      }
      cands.length = 0; cands.push(...pool);
    }
    for (let tries = 0; tries < 6 && cands.length; tries++) {
      const wt = (x) => x.w * Math.max(0.05, Staff.weight(x.id)) * Gauges.weight(x.id);
      const tot = cands.reduce((a, x) => a + wt(x), 0);
      let r = Math.random() * tot, d = cands[0];
      for (const x of cands) { r -= wt(x); if (r <= 0) { d = x; break; } }
      const x = d.make(c);
      if (!x) { cands.splice(cands.indexOf(d), 1); continue; }
      const start = x.start ?? s.min;
      const e = { kind: d.id, cat: d.cat, tone: d.tone, title: d.title, glyph: d.glyph, ...x, start, end: start + Math.max(1, x.dur || 60) };
      delete e.dur;
      Staff.adjust(e);
      s.evLast[d.id] = s.min;
      return this.add(e);
    }
    return null;
  },
  /** chaque matin : météo, grève éventuelle, purge, fêtes du calendrier */
  daily() {
    const s = G.s, m = s.min, month = Time.month(m);
    if (!RealWeather.active()) {
      const r = Math.random();
      let w = 'sun';
      const winter = month === 11 || month <= 1, summer = month >= 5 && month <= 7;
      if (winter && r < 0.1) w = 'snow';
      else if (summer && r < 0.15) w = 'heat';
      else if (r < 0.04) w = 'storm';
      else if (r < 0.3) w = 'rain';
      const prev = s.weather;
      s.weather = w;
      if (w !== 'sun' && w !== prev) {
        this.log('Météo : ' + EV_INFO[w].title.toLowerCase() + ' aujourd’hui.', w);
        const txt = { rain: 'Plus de monde dans le métro et les bus, circulation un peu plus lente.', snow: 'Les bus roulent au ralenti, le métro fait le plein.', heat: 'Chaleur écrasante : les navettes fluviales ont la cote.', storm: 'Vent violent : navettes fluviales à quai, circulation perturbée.' }[w];
        Notif.push({ title: 'Météo : ' + EV_INFO[w].title.toLowerCase(), desc: txt, tone: w === 'heat' ? 0 : -1, cat: 'meteo', glyph: '≈' }, 'now');
      }
    }
    s.events = s.events.filter((e) => e.end > m - 1440);
    const modes = new Set(s.lines.map((l) => l.mode));
    const day0 = m - Time.mod(m);
    // grève (annoncée la veille, avec négociation possible)
    if (Math.random() < 0.03 * Staff.strikeMult() * Gauges.strikeMult() && (modes.has('bus') || modes.has('metro'))) {
      const mode = modes.has('metro') && Math.random() < 0.5 ? 'metro' : modes.has('bus') ? 'bus' : 'metro';
      const cost = Math.round((40000 + s.lines.filter((l) => l.mode === mode).reduce((a, l) => a + l.veh.length, 0) * 6000) * s.costMul * Staff.negoMult());
      this.add({ kind: 'strike', cat: 'social', tone: -3, glyph: '⚑', mode, start: day0 + 1440 + 300, end: day0 + 2880, title: 'Préavis de grève', desc: 'les agents ' + (mode === 'bus' ? 'des bus' : 'du métro') + ' cesseront le travail demain.', cost, resolved: false, asked: false, announce: true });
    }
    // fêtes du calendrier (annoncées la veille)
    const tomorrow = Time.date(day0 + 1440);
    for (const f of SEASONAL) {
      if (tomorrow.getUTCMonth() !== f.month || tomorrow.getUTCDate() !== f.day) continue;
      if (s.events.some((e) => e.kind === f.id && e.end > m)) continue;
      const c = EvCtx.center(), st = day0 + 1440 + f.start;
      this.add({ kind: f.id, cat: f.cat, tone: f.tone, title: f.title, glyph: f.glyph, desc: f.desc, start: st, end: st + f.dur, announce: true, ...f.fx(c) });
    }
  },
});

/* =====================================================================
   NOTIFICATIONS DANS LE JEU
   ===================================================================== */
const Notif = {
  push(e, phase) {
    const s = G.s; if (!s) return;
    s.notifs = s.notifs || [];
    const tone = e.tone ?? 0;
    const when = phase === 'announce' ? (Time.label(e.start).day === Time.label(s.min).day ? 'aujourd’hui ' : Time.label(e.start).day + ' ') + Time.label(e.start).time : null;
    const n = { id: s.nextId++, t: s.min, title: (phase === 'start' ? 'C’est maintenant : ' : '') + e.title, text: e.desc, tone, cat: e.cat || 'reseau', glyph: e.glyph || '!', evId: e.id || null, when, read: false };
    if (e.id) e.notified = phase;
    s.notifs.unshift(n);
    if (s.notifs.length > 60) s.notifs.length = 60;
    const mode = s.settings.notif || 'all';
    // pause automatique : par défaut seulement pour les choix (la fenêtre de choix met déjà le jeu en pause)
    const pz = s.settings.notifPause || 'choices';
    const pause = !e.q && G.ready && !G.paused && (pz === 'all' || (pz === 'major' && Math.abs(tone) >= 2));
    if (pause) { G.paused = true; n.paused = true; UI.refreshTop(); }
    if (mode === 'all' || (mode === 'major' && Math.abs(tone) >= 2) || pause) this.banner(n);
    UI.refreshInfoBadge();
  },
  unread() { return (G.s.notifs || []).filter((n) => !n.read).length; },
  readAll() { for (const n of G.s.notifs || []) n.read = true; UI.refreshInfoBadge(); },
  banner(n) {
    const box = document.getElementById('toasts'); if (!box || !G.ready) return;
    // panneau ou fenêtre ouverte : pas de bannière (la pastille Infos compte la notification)
    if ((UI.sheetOpen() || !document.getElementById('modal').hidden) && !n.paused) return;
    const el = document.createElement('button');
    const c = EV_CAT[n.cat] || EV_CAT.reseau;
    el.className = 'nban ' + (n.tone <= -2 ? 'n-bad' : n.tone < 0 ? 'n-warn' : n.tone >= 2 ? 'n-great' : n.tone > 0 ? 'n-good' : 'n-info');
    el.dataset.act = 'notifOpen'; el.dataset.arg = String(n.id);
    el.innerHTML = `<span class="nb-ic" style="background:${c.col}">${esc(n.glyph)}</span><span class="nb-t"><b>${esc(n.title)}</b><small>${n.when ? '<em>' + esc(n.when) + '</em> · ' : ''}${esc(n.text)}</small></span><span class="nb-tone">${n.paused ? '<i class="nb-pause"><svg viewBox="0 0 10 10" width="9" height="9"><rect x="1.5" y="1" width="2.4" height="8" fill="currentColor"/><rect x="6.1" y="1" width="2.4" height="8" fill="currentColor"/></svg> en pause</i>' : ''}${Notif.toneLabel(n.tone)}</span>`;
    box.appendChild(el);
    const bans = box.querySelectorAll('.nban');
    if (bans.length > 2) bans[0].remove();
    // en pause, la bannière reste jusqu'à la reprise du jeu
    const hide = () => { el.classList.add('out'); setTimeout(() => el.remove(), 400); };
    if (n.paused) { const t = setInterval(() => { if (!G.paused || !el.isConnected) { clearInterval(t); setTimeout(hide, 1500); } }, 500); }
    else setTimeout(hide, Math.abs(n.tone) >= 2 ? 6500 : 5000);
  },
  toneLabel(t) { return t <= -3 ? '▼▼▼' : t === -2 ? '▼▼' : t === -1 ? '▼' : t >= 3 ? '▲▲▲' : t === 2 ? '▲▲' : t === 1 ? '▲' : '●'; },
};
