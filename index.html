<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Transitopia</title>
<meta name="description" content="Jeu de gestion de transports sur la vraie carte de France">
<meta name="theme-color" content="#FFF6E3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Transitopia">
<meta name="application-name" content="Transitopia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Style épuré inspiré des plans de métro minimalistes : papier clair, encre anthracite,
   lignes épaisses aux couleurs franches, stations blanches cerclées de noir, typo géométrique */
:root{
  --paper:#FFF6E3; --panel:#FFFCF4; --panel-2:#F6ECD6; --panel-3:#EADCBC;
  --ink:#1D2240; --ink-2:#4A4E6E; --muted:#8C8AA0; --line:rgba(29,34,64,.10);
  --accent:#FFC21A; --ok:#3FA34D; --warn:#F28C28; --bad:#EF3E36;
  --f-display:"Jost","Futura","Century Gothic","Trebuchet MS",sans-serif;
  --f-body:"Jost","Futura","Century Gothic","Trebuchet MS",sans-serif;
  --r:12px; --nav-h:62px;
  --shadow:0 2px 10px rgba(29,34,64,.10),0 1px 2px rgba(29,34,64,.08);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:400 15px/1.4 var(--f-body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none}
small{font-size:12.5px;color:var(--muted)}
.neg{color:var(--bad)!important}.pos{color:var(--ok)!important}

/* pictogrammes (formes de stations) et pastilles de ligne */
.pict{display:inline-grid;place-items:center;flex:none;font:600 11px/1 var(--f-display);color:var(--ink);background:#fff;height:24px;min-width:24px;border:2.5px solid var(--ink);border-radius:6px;padding:0 3px;letter-spacing:.02em}
.pict-metro{border-radius:50%;width:24px;padding:0;font-size:13px}
.pict-boat{border-radius:50%;width:24px;padding:0;font-size:15px}
.pict-ter{font-size:10px}
.pict-taxi{background:#FFC21A;font-size:10px;font-weight:800;letter-spacing:.04em}
.sheet-h h2 .pict-taxi{margin-right:8px;vertical-align:2px}
.txst{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0 2px;font-size:13px;color:var(--ink-2)}.txst span{display:inline-flex;align-items:center;gap:5px}.txst i{width:10px;height:10px;border-radius:3px;box-shadow:0 0 0 1.5px var(--ink)}
.cnt{min-width:22px;text-align:center;align-self:center;font:600 15px/1 var(--f-display)}
.pict-bus{font-size:9.5px;border-radius:12px}
.lbadge{display:inline-grid;place-items:center;flex:none;font:600 14px/1 var(--f-display);height:26px;min-width:26px;padding:0 7px;border-radius:13px;margin-left:4px}
.lb-metro{border-radius:50%;width:26px;padding:0}
.plate{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font:600 18px/1.15 var(--f-display);text-wrap:balance}
.plate.big{font-size:22px;margin-bottom:6px}
.plate .ic{width:22px;height:22px}

/* écran d'accueil */
#start{position:fixed;inset:0;overflow:auto;background:var(--paper);padding:calc(24px + var(--sat)) max(16px,var(--sar)) calc(24px + var(--sab)) max(16px,var(--sal))}
#startArt{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
#startBox{position:relative;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:12px;margin-top:6vh}
.logo .pict{width:46px;height:46px;font-size:24px;border-width:4px}
.logo h1{font:600 clamp(26px,8.6vw,44px)/1 var(--f-display);margin:0;letter-spacing:-.01em;min-width:0}
.tagline{font-size:17px;color:var(--ink-2);margin:4px 0 18px;max-width:30ch}
.stack{display:flex;flex-direction:column;gap:10px}
.credits{margin-top:28px;font-size:12px;color:var(--muted)}
.lab{font:500 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:10px}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:12px}
.cityres{display:flex;flex-direction:column;gap:6px}
.cityrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);text-align:left;width:100%}
.cityrow .cr-n{display:flex;flex-direction:column;min-width:0;flex:1}.cityrow .cr-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cityrow .cr-n small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cityrow .cr-p{flex:none;color:var(--muted);font-size:12px}
.chosen:empty{display:none}
/* tutoriel */
#tuto{position:absolute;z-index:1250;left:max(10px,var(--sal));right:max(10px,var(--sar));max-width:460px;margin:0 auto;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px 10px;box-shadow:0 10px 30px rgba(29,34,64,.3);animation:up .2s ease-out}
#tuto.tuto-top{top:calc(64px + var(--sat))}
#tuto.tuto-bottom{bottom:calc(var(--nav-h) + var(--sab) + 12px)}
#tuto .tuto-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}#tuto .tuto-h b{font:600 16px/1.2 var(--f-display);color:#FFC21A}#tuto .tuto-h small{opacity:.6;font-size:12px}
#tuto p{margin:0 0 8px;font-size:14px;line-height:1.4}#tuto p b{color:#FFC21A}
#tuto .tuto-hint{color:#FFC21A;font-weight:600}
#tuto .tuto-a{display:flex;justify-content:space-between;gap:8px;align-items:center}
#tuto .btn.ghost{background:transparent;color:rgba(255,255,255,.75);box-shadow:none;padding-left:0}
#tuto .btn.primary{background:#FFC21A;color:var(--ink)}
.tuto-hl{position:relative;z-index:2;animation:tutohl 1.2s ease-in-out infinite;border-radius:14px}
@keyframes tutohl{0%,100%{box-shadow:0 0 0 3px #FFC21A,0 0 0 6px rgba(247,198,0,.25)}50%{box-shadow:0 0 0 3px #FFC21A,0 0 0 12px rgba(247,198,0,0)}}
.tuto-ill{display:flex;gap:8px;justify-content:center;margin:4px 0 2px}
.note .spin{display:inline-block;vertical-align:-2px;margin-right:6px}
.cityrow.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.chosen{display:flex;align-items:center;gap:8px;color:var(--ok)}
.chosen b{color:var(--ink)}
.loadbox{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10vh;text-align:center;color:var(--ink-2)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:22px;background:var(--panel-2);color:var(--ink);font:500 15.5px/1.1 var(--f-display);text-align:center}
.btn.primary{background:var(--ink);color:#fff}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.btn.big{min-height:58px;font-size:18px;flex-direction:column;gap:2px;border-radius:29px}
.btn.big small{color:inherit;opacity:.7}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:18px}
.btn.wide{width:100%;margin-top:10px}
.btn.on{box-shadow:inset 0 0 0 2px var(--ink)}
.btn .ic{width:18px;height:18px}
.icon-b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--ink)}
.row2{display:flex;gap:8px;margin-top:10px}.row2>*{flex:1}
.chcol{display:flex;flex-direction:column;gap:8px;margin-top:12px}.chcol .btn{text-align:left;justify-content:flex-start;white-space:normal;line-height:1.3;padding:11px 14px;min-height:44px}
.chnote{margin:10px 0 0;font-size:12px}
.gauge{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:8px 0 12px}.gauge>span{font-weight:600;font-size:14px}.gauge>em{font-style:normal;font-weight:700;font-size:13px;grid-column:2;grid-row:1}.gauge>em.good{color:var(--ok,#3FA34D)}.gauge>em.bad{color:var(--bad,#EF3E36)}
.gauge .gbar{grid-column:1/3;position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#EF3E36,#FFC21A 50%,#3FA34D)}.gauge .gbar b{position:absolute;top:-4px;width:6px;height:16px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.gauge small{grid-column:1/3;color:var(--muted);font-size:12px}
.row2.tight{margin:0;flex:none;gap:6px}.row2.tight>*{flex:none}
.seg{display:flex;gap:3px;background:var(--panel-2);padding:3px;border-radius:20px;flex-wrap:nowrap}
.seg.wrap{flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;min-height:32px;padding:4px 10px;border-radius:16px;font:500 13.5px/1 var(--f-display);color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}

/* jeu */
#game{position:fixed;inset:0}
#map{position:absolute;inset:0;z-index:0;background:var(--paper)}
.leaflet-container{font-family:var(--f-body);background:var(--paper)}
#map.bg-photo{background:#59604f}
.leaflet-control-attribution{display:none!important} /* sources citées dans le menu */
.leaflet-control-attribution a{color:var(--ink-2)!important}
.ov{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ov-n{z-index:405}.ov-s{z-index:410}.ov-d{z-index:420}

#top{position:absolute;left:0;right:0;top:0;z-index:900;display:flex;align-items:stretch;gap:6px;padding:calc(8px + var(--sat)) max(10px,var(--sar)) 0 max(10px,var(--sal));pointer-events:none}
#top>*{pointer-events:auto}
#top .icon-b{width:44px;height:44px;flex:none;background:var(--panel);box-shadow:var(--shadow)}
#top .speed{flex:none}
.tplate{display:flex;flex-direction:column;justify-content:center;padding:3px 10px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.tplate b{font:600 18px/1.05 var(--f-display);white-space:nowrap}
.tplate small{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{flex:.85 1 0;text-align:left;font:inherit;color:inherit}
#cash.on,#clock.on{box-shadow:var(--shadow),inset 0 0 0 2px var(--ink)}
#btnPlay .ic{width:20px;height:20px}
#clock{flex:2 1 0;flex-direction:row;align-items:center;gap:7px;padding-left:5px;padding-right:8px;text-align:left;font:inherit;color:inherit}
#clock>span{flex:1}
.spd{flex:none;display:flex;align-items:center;gap:3px;padding:5px 8px;border-radius:14px;background:var(--ink);color:#fff;font:600 13px/1 var(--f-display)}
.spd.rt{background:var(--bad);font-size:12px}
.spd.pz{background:var(--panel-2);color:var(--muted)}
#clock>span small{overflow:visible}
#wx{display:none!important}
.wxs{display:flex;align-items:center;gap:3px}
.wxs .ic{width:13px;height:13px;flex:none;color:var(--ink-2)}
#clock .dial{width:34px;height:34px;flex:none}
#clock>span{display:flex;flex-direction:column;min-width:0}
#wx{display:grid;place-items:center;width:44px;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink)}
#wx .ic{width:22px;height:22px}
.speed{display:flex;gap:2px;background:var(--panel);box-shadow:var(--shadow);border-radius:22px;padding:3px}
.speed button{width:35px;display:grid;place-items:center;border-radius:19px;font:600 14px/1 var(--f-display)}
.speed button .ic{width:18px;height:18px}
.caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.8}
#speedMenu{position:absolute;z-index:1100;top:calc(58px + var(--sat));left:50%;width:min(250px,calc(100% - 20px));background:var(--panel);border-radius:18px;box-shadow:0 10px 30px rgba(29,34,64,.22);padding:6px;animation:up .15s ease-out}
.sm-it{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;width:100%;text-align:left;padding:8px 12px;border-radius:12px}
.sm-it b{font:600 15px/1.1 var(--f-display)}
.sm-it small{grid-column:1;font-size:12px}
.sm-it .ic{grid-row:1/3;grid-column:2;width:18px;height:18px}
.sm-it.on{background:var(--panel-2)}
.sm-rt b{color:var(--bad)}
.sm-wx{margin:4px 6px 2px;border-top:1px solid var(--line);border-bottom:0;padding-top:10px}

#chip{position:absolute;z-index:880;top:calc(62px + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);box-shadow:var(--shadow);padding:6px 14px;border-radius:20px;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.spin{width:14px;height:14px;border:2.5px solid var(--panel-3);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
.spin.big{width:36px;height:36px;border-width:4px}
@keyframes sp{to{transform:rotate(360deg)}}

#toasts{position:absolute;z-index:1300;top:calc(62px + var(--sat));left:max(10px,var(--sal));right:max(10px,var(--sar));display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{position:relative;max-width:460px;width:100%;background:var(--panel);padding:8px 12px 8px 30px;border-radius:14px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.3;animation:tin .25s ease-out}
#game{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game input,#game select,#game textarea{-webkit-user-select:text;user-select:text}
#snacks{position:absolute;z-index:1300;bottom:calc(var(--nav-h) + var(--sab) + 12px);left:max(12px,var(--sal));right:max(12px,var(--sar));display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center;transition:bottom .2s}
#snacks.raised{bottom:calc(var(--nav-h) + var(--sab) + 84px)}
#snacks .toast{display:flex;align-items:center;gap:10px;background:#2A2A2A;color:#FFF6E3;padding:10px 12px 10px 30px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.25);pointer-events:auto;animation:sin .22s ease-out}
#snacks .toast span{flex:1}
#snacks .toast.out{opacity:0;transform:translateY(6px);transition:.35s}
.snack-a{flex:none;color:#FFC21A;font:600 14px/1 var(--f-display);padding:6px 4px;text-transform:uppercase;letter-spacing:.04em}
@keyframes sin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mfloat{position:absolute;z-index:5;font:700 14px/1 var(--f-display);pointer-events:none;animation:mfl 1.6s ease-out forwards;white-space:nowrap;text-shadow:0 1px 0 #fff,0 0 6px #fff}
.mfloat.neg{color:#C8312B}.mfloat.pos{color:#2F8F3E}
@keyframes mfl{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
#sheet.full{height:calc(100% - 70px - var(--sat));max-height:none}
#sheet{transition:max-height .22s ease,transform .18s ease}
.sheet-h{position:relative;touch-action:none;cursor:grab}
.sheet-h::before{content:"";position:absolute;top:5px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(29,34,64,.18)}
.vrow.stack{flex-direction:column;align-items:stretch;gap:8px}
.vrow.stack .seg{width:100%}
.vrow.stack .seg button{flex:1}
.quick{display:flex;gap:6px;margin:-2px 0 8px 44px;flex-wrap:wrap}
.quick .btn{flex:1 1 auto;min-height:32px;font-size:13px;padding:4px 10px}
#heatChip{position:absolute;z-index:900;top:calc(66px + var(--sat));left:max(10px,var(--sal));display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:18px;padding:6px 8px 6px 12px;box-shadow:var(--shadow);font:600 13px/1 var(--f-display)}
#heatChip i{width:44px;height:8px;border-radius:4px;display:block}
#heatChip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2)}
.toast::before{content:"";position:absolute;left:12px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--muted)}
.t-ok::before{background:var(--ok)}.t-warn::before{background:var(--warn)}.t-bad::before{background:var(--bad)}.t-info::before{background:var(--accent)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

#nav{position:absolute;z-index:900;left:0;right:0;bottom:0;display:flex;background:var(--panel);padding:0 max(4px,var(--sar)) var(--sab) max(4px,var(--sal));box-shadow:0 -1px 0 var(--line),0 -4px 14px rgba(29,34,64,.06)}
#nav.dim{opacity:.35;pointer-events:none}
.nav-b{position:relative;flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11px/1 var(--f-display);color:var(--muted)}
.nav-b .ic{width:34px;height:34px;padding:5px;border-radius:50%}
.nav-b.on{color:var(--ink)}
.nav-b.on .ic{background:var(--ink);color:#fff}
.nav-build .ic{background:var(--accent);color:var(--ink)}
.dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);box-shadow:0 0 0 2px var(--panel);color:#fff;font:700 10.5px/17px var(--f-display);font-style:normal;text-align:center}
.nban{position:relative;pointer-events:auto;max-width:460px;width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);padding:8px 10px;border-radius:16px;box-shadow:var(--shadow),inset 4px 0 0 var(--nc,#999);animation:tin .25s ease-out;color:var(--ink)}
.nban.out{opacity:0;transform:translateY(-6px);transition:.35s}
.nban.n-bad{--nc:#EF3E36}.nban.n-warn{--nc:#F28C28}.nban.n-info{--nc:#8a8a8a}.nban.n-good{--nc:#3FA34D}.nban.n-great{--nc:#FFC21A}
.nb-ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px/1 var(--f-display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.nb-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nb-t b{font:600 14px/1.2 var(--f-display)}
.nb-t small{font-size:12.5px;line-height:1.3;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb-t small em{font-style:normal;font-weight:600;color:var(--ink)}
.nb-tone{flex:none;font-size:10px;letter-spacing:-1px;color:var(--nc,#8a8a8a)}
.nrow{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line, rgba(29,34,64,.08));color:var(--ink)}
.nrow.unread{background:rgba(242,183,5,.12);border-radius:10px}
.nrow .nb-t small{-webkit-line-clamp:3}
.nrow .nr-t{color:var(--muted);font-size:11.5px}
.staffc{background:var(--panel-2);border-radius:16px;padding:10px 12px;margin:8px 0}
.staff-h{display:flex;align-items:center;gap:10px}
.staff-h>div{flex:1;min-width:0}
.staff-h b{font:600 15.5px/1.2 var(--f-display);display:block}
.staff-h small{color:var(--ink-2);font-size:12.5px}
.staff-h .evcard-ic{width:34px;height:34px;flex:none;background:var(--c);box-shadow:none}
.staff-h .evcard-ic .ic{width:18px;height:18px;color:#fff}
.lvdots{display:flex;gap:4px;flex:none}
.lvdots i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);display:block}
.lvdots i.on{background:var(--c)}
.lvdots i.tr{background:repeating-linear-gradient(45deg,var(--c) 0 2px,transparent 2px 4px)}
.staffc .nextlv{margin:4px 0 8px;font-size:12.5px}

<script>
'use strict';
/* =====================================================================
   TRANSITOPIA — cœur : utilitaires, géographie, données réelles,
   cache, monde (zones + réseaux), itinéraires
   ===================================================================== */

const EARTH = 40075016.686;
const G = { s: null, w: null, map: null, speed: 1, paused: false, ready: false };

/* ---------- utilitaires ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function hash32(n) {
  n = n | 0;
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return (n ^ (n >>> 16)) >>> 0;
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rnd01 = (seed) => hash32(seed) / 4294967296;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const lonToMx = (lon) => (lon + 180) / 360;
function latToMy(lat) {
  const s = Math.sin((lat * Math.PI) / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}
const mxToLon = (mx) => mx * 360 - 180;
function myToLat(my) {
  const n = Math.PI - 2 * Math.PI * my;
  return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}
const mPerUnit = (lat) => EARTH * Math.cos((lat * Math.PI) / 180);
/** distance en mètres entre deux points mercator (échelle locale de la partie) */
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by) * G.mpu;
const meters = (m) => m / G.mpu; // mètres -> unités mercator

function fmtInt(n) { return Math.round(n).toLocaleString('fr-FR'); }
function fmtEur(n, exact) {
  const a = Math.abs(n);
  if (exact || a < 10000) return Math.round(n).toLocaleString('fr-FR') + ' €';
  if (a < 1e6) return (n / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' k€';
  return (n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: a < 1e7 ? 2 : 1 }) + ' M€';
}
function fmtKm(m) { return (m / 1000).toLocaleString('fr-FR', { maximumFractionDigits: m < 10000 ? 1 : 0 }) + ' km'; }
function fmtPct(x) { return Math.round(x * 100) + ' %'; }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Tas binaire (A*) */
class Heap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v;
    let i = k.length; k.push(key); v.push(val);
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (k[p] <= key) break;
      k[i] = k[p]; v[i] = v[p]; i = p;
    }
    k[i] = key; v[i] = val;
  }
  pop() {
    const k = this.k, v = this.v;
    const top = v[0];
    const lk = k.pop(), lv = v.pop();
    if (k.length) {
      let i = 0; const n = k.length;
      while (true) {
        let c = 2 * i + 1;
        if (c >= n) break;
        if (c + 1 < n && k[c + 1] < k[c]) c++;
        if (k[c] >= lk) break;
        k[i] = k[c]; v[i] = v[c]; i = c;
      }
      k[i] = lk; v[i] = lv;
    }
    return top;
  }
}

/* ---------- cache IndexedDB ---------- */
/** laisse passer une image avant de continuer (ou une simple pause si l'onglet est caché) */
const nextFrame = () => new Promise((r) => { if (document.hidden) setTimeout(r, 0); else requestAnimationFrame(() => setTimeout(r, 0)); });

/** BD TOPO allégée avant mise en cache : seulement les champs utiles, et le centre des gares et des lieux
 *  (au lieu de leurs contours). Les coordonnées des routes restent intactes (clés des carrefours). */
const BD_KEEP = {
  roads: ['nature', 'importance', 'sens_de_circulation', 'reserve_aux_bus', 'vitesse_moyenne_vl', 'acces_vehicule_leger', 'urbain', 'nom_voie_ban_gauche', 'nom_collaboratif_gauche', 'position_par_rapport_au_sol', 'nombre_de_voies', 'largeur_de_chaussee'],
  rails: ['nature', 'etat_de_l_objet', 'vitesse_maximale', 'position_par_rapport_au_sol'],
  water: ['navigabilite', 'classe_de_largeur', 'cpx_toponyme_de_cours_d_eau'],
  gares: ['nature', 'toponyme'], pois: ['categorie', 'nature', 'toponyme'],
};
function compactBD(d) {
  const out = {};
  const centre = (g) => {
    const poly = !g ? null : g.type === 'Polygon' ? g.coordinates : g.type === 'MultiPolygon' ? g.coordinates[0] : null;
    if (g && g.type === 'Point') return g;
    if (!poly || !poly[0] || !poly[0].length) return null;
    let x = 0, y = 0; const r = poly[0];
    for (const c of r) { x += c[0]; y += c[1]; }
    return { type: 'Point', coordinates: [x / r.length, y / r.length] };
  };
  for (const k of Object.keys(BD_KEEP)) {
    const fs = (d[k] && d[k].features) || [];
    out[k] = { features: fs.map((f) => {
      const p = {}, src = f.properties || {};
      for (const a of BD_KEEP[k]) if (src[a] !== null && src[a] !== undefined && src[a] !== '') p[a] = src[a];
      return { id: f.id, properties: p, geometry: k === 'gares' || k === 'pois' ? centre(f.geometry) : f.geometry };
    }) };
  }
  out.compact = 1;
  return out;
}

const Cache = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('correspondance', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(key, maxAgeDays = 90) {
    try {
      const db = await this.open();
      const v = await new Promise((res) => {
        const q = db.transaction('kv').objectStore('kv').get(key);
        q.onsuccess = () => res(q.result);
        q.onerror = () => res(undefined);
      });
      if (!v) return undefined;
      if (Date.now() - v.t > maxAgeDays * 864e5) return undefined;
      return v.d;
    } catch (e) { return undefined; }
  },
  async set(key, d) {
    try {
      const db = await this.open();
      await new Promise((res) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put({ t: Date.now(), d }, key);
        tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
      });
    } catch (e) { /* stockage plein ou indisponible : on continue sans cache */ }
  },
  async del(key) {
    try {
      const db = await this.open();
      await new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(key); tx.oncomplete = res; tx.onerror = res; tx.onabort = res; });
    } catch (e) { /* rien */ }
  },
};

/* ---------- accès réseau ---------- */
async function fetchJSON(url, opts = {}, timeout = 60000) {
  const ac = new AbortController();
  const tm = setTimeout(() => ac.abort(), timeout);
  try {
    const r = await fetch(url, { ...opts, signal: ac.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];
const HW = 'motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link|busway';

const API = {
  async searchCommunes(q) {
    const F = '&fields=nom,code,codesPostaux,population,centre,codeDepartement,departement';
    q = q.trim().replace(/\s+/g, ' ');
    let u;
    if (/^\d{5}$/.test(q)) u = 'https://geo.api.gouv.fr/communes?codePostal=' + q + F + '&limit=20'; // code postal
    else {
      // « St Malo », « Ste Foy » : abréviations courantes
      const n = q.replace(/\b[Ss]t\b\.?/g, 'Saint').replace(/\b[Ss]te\b\.?/g, 'Sainte');
      u = 'https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(n) + F + '&boost=population&limit=30';
    }
    // France métropolitaine uniquement (Corse comprise) ; les grandes villes d'outre-mer prenaient sinon des places
    const r = await fetchJSON(u, {}, 15000);
    const out = (r || []).filter((c) => c.codeDepartement && !/^9[78]/.test(c.codeDepartement) && c.centre);
    if (/^\d{5}$/.test(q)) out.sort((a, b) => (b.population || 0) - (a.population || 0));
    return out.slice(0, 8);
  },
  async communePop(code) {
    const k = 'pop:' + code;
    const c = await Cache.get(k, 365);
    if (c !== undefined) return c;
    let pop = null;
    try {
      const j = await fetchJSON('https://geo.api.gouv.fr/communes/' + code + '?fields=population', {}, 15000);
      pop = j && j.population;
    } catch (e) {
      try {
        const j = await fetchJSON('https://geo.api.gouv.fr/communes?code=' + code + '&type=arrondissement-municipal&fields=population', {}, 15000);
        pop = j && j[0] && j[0].population;
      } catch (e2) { /* pas grave */ }
    }
    if (pop) await Cache.set(k, pop);
    return pop || null;
  },
  async irisBBox(s, w, n, e) {
    const u = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature' +
      '&TYPENAMES=STATISTICALUNITS.IRIS:contours_iris&OUTPUTFORMAT=application/json&COUNT=3000' +
      '&BBOX=' + [s, w, n, e].map((x) => x.toFixed(5)).join(',') + ',urn:ogc:def:crs:EPSG::4326';
    return fetchJSON(u, {}, 60000);
  },
  async communesDept(dep) {
    const u = 'https://geo.api.gouv.fr/departements/' + dep +
      '/communes?fields=nom,code,population,surface&format=geojson&geometry=contour';
    return fetchJSON(u, {}, 60000);
  },
  async deptAt(lat, lon) {
    const j = await fetchJSON('https://geo.api.gouv.fr/communes?lat=' + lat + '&lon=' + lon + '&fields=codeDepartement', {}, 15000);
    return j && j[0] && j[0].codeDepartement;
  },
  /** WFS Géoplateforme avec pagination */
  async wfsAll(typename, b, props) {
    const out = [];
    let start = 0, useProps = !!props;
    for (let page = 0; page < 30; page++) {
      const u = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=' + typename +
        '&OUTPUTFORMAT=application/json&COUNT=5000&STARTINDEX=' + start + (useProps ? '&PROPERTYNAME=' + props : '') +
        '&BBOX=' + [b.w, b.s, b.e, b.n].map((x) => x.toFixed(5)).join(',') + ',EPSG:4326';
      let j;
      try { j = await fetchJSON(u, {}, 90000); }
      catch (e) { if (useProps && page === 0) { useProps = false; page--; continue; } throw e; }
      const f = j.features || [];
      for (const x of f) out.push(x);
      const total = j.numberMatched ?? j.totalFeatures;
      start += f.length;
      if (!f.length || (typeof total === 'number' && start >= total) || (typeof total !== 'number' && f.length < 5000)) break;
    }
    return { type: 'FeatureCollection', features: out };
  },
  async bdtopo(b) {
    const [roads, rails, water, gares, pois] = await Promise.all([
      this.wfsAll('BDTOPO_V3:troncon_de_route', b, 'geometrie,nature,importance,sens_de_circulation,reserve_aux_bus,vitesse_moyenne_vl,acces_vehicule_leger,urbain,nom_voie_ban_gauche,nom_collaboratif_gauche,position_par_rapport_au_sol,nombre_de_voies,largeur_de_chaussee'),
      this.wfsAll('BDTOPO_V3:troncon_de_voie_ferree', b, 'geometrie,nature,etat_de_l_objet,vitesse_maximale,position_par_rapport_au_sol'),
      this.wfsAll('BDTOPO_V3:troncon_hydrographique', b, 'geometrie,navigabilite,classe_de_largeur,cpx_toponyme_de_cours_d_eau'),
      this.wfsAll('BDTOPO_V3:equipement_de_transport', b, 'geometrie,nature,toponyme'),
      this.wfsAll('BDTOPO_V3:zone_d_activite_ou_d_interet', b, 'geometrie,categorie,nature,toponyme'),
    ]);
    return { roads, rails, water, gares, pois };
  },
  async signals(s, w, n, e) {
    const bb = [s, w, n, e].map((x) => x.toFixed(5)).join(',');
    const q = `[out:json][timeout:60][bbox:${bb}];(node[highway~"^(traffic_signals|stop|give_way)$"];node[crossing=traffic_signals];);out qt;way[highway][maxspeed];out tags geom qt;`;
    let lastErr;
    for (let attempt = 0; attempt < 4; attempt++) {
      const ep = OVERPASS[(attempt + 1) % OVERPASS.length];
      try {
        return await fetchJSON(ep, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q) }, 60000);
      } catch (err) { lastErr = err; await sleep(2000 + attempt * 3000); }
    }
    throw lastErr;
  },
  async overpass(s, w, n, e) {
    const bb = [s, w, n, e].map((x) => x.toFixed(5)).join(',');
    const q = `[out:json][timeout:120][bbox:${bb}];
(way[highway~"^(${HW})$"];way[railway=rail][!service];way[waterway~"^(river|canal)$"];)->.l;
.l out body qt;
.l >;
out skel qt;
nwr[railway~"^(station|halt)$"];out center tags qt;
nwr[amenity~"^(school|college|university|hospital|townhall|marketplace|cinema|theatre|library)$"];out center tags qt;
nwr[shop~"^(mall|department_store|supermarket)$"];out center tags qt;
nwr[tourism~"^(attraction|museum)$"];out center tags qt;`;
    let lastErr;
    for (let attempt = 0; attempt < 6; attempt++) {
      const ep = OVERPASS[attempt % OVERPASS.length];
      try {
        return await fetchJSON(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(q),
        }, 150000);
      } catch (e) {
        lastErr = e;
        await sleep(1500 + attempt * 2500);
      }
    }
    throw lastErr || new Error('Overpass indisponible');
  },
};

/* ---------- grille de chargement ---------- */
const CH_LAT = 0.03, CH_LON = 0.04;
const chunkOf = (lat, lon) => [Math.floor(lat / CH_LAT), Math.floor(lon / CH_LON)];
const chunkBox = (i, j) => ({ s: i * CH_LAT, n: (i + 1) * CH_LAT, w: j * CH_LON, e: (j + 1) * CH_LON });
function chunksForMercBox(b, pad = 0) {
  const s = myToLat(b.maxy), n = myToLat(b.miny), w = mxToLon(b.minx), e = mxToLon(b.maxx);
  const [i0, j0] = chunkOf(s, w), [i1, j1] = chunkOf(n, e);
  const out = [];
  for (let i = i0 - pad; i <= i1 + pad; i++) for (let j = j0 - pad; j <= j1 + pad; j++) out.push([i, j]);
  return out;
}

/* ---------- réseaux (routes, rail, fleuves) ---------- */
const GCELL = 2e-6; // ~50 m
const ROAD_CLS = {
  motorway: 0, trunk: 0, motorway_link: 0, trunk_link: 0,
  primary: 1, primary_link: 1, secondary: 2, secondary_link: 2, tertiary: 3, tertiary_link: 3,
};
const ROAD_KMH = {
  motorway: 110, trunk: 90, motorway_link: 60, trunk_link: 50, primary: 50, primary_link: 40,
  secondary: 50, secondary_link: 40, tertiary: 45, tertiary_link: 40, unclassified: 40,
  residential: 30, living_street: 15, busway: 45,
};

class Net {
  constructor(kind) {
    this.kind = kind;
    this.idx = new Map(); this.ids = [];
    this.x = []; this.y = []; this.adj = [];
    this.ea = []; this.eb = []; this.len = []; this.cls = []; this.spd = []; this.name = [];
    this.grid = new Map();
    this.dens = []; this.zone = []; this.noise = []; this.traffic = [];
    this.ow = []; this.bl = []; this.lim = []; this.limSrc = [];
    this.wid = []; this.lanes = []; this.curW = 0; this.curL = 0; // largeur de chaussée (m) et nombre de voies (BD TOPO), 0 si inconnus
    // niveau (sol, pont, tunnel), point « en l'air » et altitude de chaque nœud (BD TOPO)
    this.nLv = []; this.nFly = []; this.nZ = []; this.nLvX = null; this.lvMore = null;
    this.version = 0;
  }
  get nE() { return this.ea.length; }
  node(id, mx, my) {
    let i = this.idx.get(id);
    if (i !== undefined) return i;
    i = this.x.length;
    this.idx.set(id, i); this.ids.push(id); this.x.push(mx); this.y.push(my); this.adj.push([]);
    this.nLv.push(0); this.nFly.push(0); this.nZ.push(NaN);
    const k = Math.floor(mx / GCELL) + ',' + Math.floor(my / GCELL);
    let c = this.grid.get(k); if (!c) { c = []; this.grid.set(k, c); } c.push(i);
    return i;
  }
  /** nœud tenant compte des ponts et tunnels : deux tronçons qui se superposent au même endroit ne sont
   *  reliés que s'ils sont au même niveau, ou si aucun des deux n'y passe « en l'air » (point intérieur
   *  d'un pont ou d'un tunnel) et que leurs altitudes concordent (bretelle, entrée de tunnel).
   *  lv : niveau (0 au sol, > 0 pont, < 0 tunnel) · inner : point intérieur du tronçon · z : altitude (m) */
  nodeLv(key, mx, my, lv, inner, z) {
    const zv = z > -500 ? z : NaN, flying = inner && lv !== 0;
    const i0 = this.idx.get(key);
    const more = i0 !== undefined && this.lvMore ? this.lvMore.get(key) : null;
    if (i0 !== undefined) {
      for (let c = -1; c < (more ? more.length : 0); c++) {
        const i = c < 0 ? i0 : more[c];
        const xs = this.nLvX && this.nLvX.get(i);
        if (this.nLv[i] === lv || (xs && xs.has(lv))) { if (flying) this.nFly[i] = 1; return i; } // même niveau : carrefour normal
        if (flying || this.nFly[i]) continue; // l'un passe au-dessus (ou au-dessous) de l'autre sans s'y arrêter
        const oz = this.nZ[i];
        if (Number.isFinite(zv) && Number.isFinite(oz) && Math.abs(zv - oz) >= 4.5) continue; // altitudes trop différentes : pas de bretelle ici
        if (!this.nLvX) this.nLvX = new Map();
        let st = xs; if (!st) { st = new Set(); this.nLvX.set(i, st); } st.add(lv);
        return i;
      }
    }
    const i = this.node(i0 === undefined ? key : key + '#' + (1 + (more ? more.length : 0)), mx, my);
    this.nLv[i] = lv; this.nFly[i] = flying ? 1 : 0; this.nZ[i] = zv;
    if (i0 !== undefined) {
      if (!this.lvMore) this.lvMore = new Map();
      let m = this.lvMore.get(key); if (!m) { m = []; this.lvMore.set(key, m); } m.push(i);
    }
    return i;
  }
  /** ow = 1 : circulation autorisée seulement de a vers b ; bl = 1 : voie réservée aux bus */
  edge(a, b, cls, kmh, name, key, ow = 0, bl = 0, lim = -1) {
    if (a === b) return;
    // déjà connu (tronçon chargé avec deux secteurs voisins) : même paire de nœuds, même sens
    for (const x of this.adj[a]) {
      if (this.ea[x] === a && this.eb[x] === b) return;
      if (this.ea[x] === b && this.eb[x] === a && (!this.ow[x] || !ow)) return;
    }
    const e = this.ea.length;
    this.ea.push(a); this.eb.push(b);
    this.len.push(dist(this.x[a], this.y[a], this.x[b], this.y[b]));
    this.cls.push(cls); this.spd.push(kmh / 3.6); this.name.push(name || '');
    this.dens.push(-1); this.zone.push(null);
    this.noise.push(0.7 + 0.6 * rnd01(hashStr(key)));
    this.traffic.push(0.2);
    this.ow.push(ow ? 1 : 0); this.bl.push(bl ? 1 : 0); this.lim.push(lim); this.limSrc.push(lim > 0 ? 2 : 0);
    this.wid.push(this.curW); this.lanes.push(this.curL);
    this.adj[a].push(e); this.adj[b].push(e);
  }
  /** tronçon entre deux nœuds (indices), ou −1 */
  between(a, b) { for (const x of this.adj[a]) if (this.ea[x] === b || this.eb[x] === b) return x; return -1; }
  /** tronçon désigné par « idA_idB » (identifiants de nœuds, qui peuvent eux-mêmes contenir « _ ») */
  pairEdge(p) {
    for (let i = p.indexOf('_'); i > 0; i = p.indexOf('_', i + 1)) {
      const A = p.slice(0, i), B = p.slice(i + 1);
      let a = this.idx.get(A), b = this.idx.get(B);
      if (a === undefined && /^\d+$/.test(A)) a = this.idx.get(+A);
      if (b === undefined && /^\d+$/.test(B)) b = this.idx.get(+B);

function parseMaxspeed(v) {

  v = String(v).trim();
  const named = { 'FR:urban': 50, 'FR:rural': 80, 'FR:zone30': 30, 'FR:zone20': 20, 'FR:motorway': 130, 'FR:walk': 6, walk: 6, 'FR:expressway': 110 };

}

/* ---------- population réelle : recensement INSEE par IRIS (fichiers par département livrés avec l'appli) ---------- */
const PopData = {
  mem: new Map(), pending: new Map(), failed: new Set(),
  dep(insee) { return insee ? insee.slice(0, 2) : null; },
  /** fichier unique pop.json (tous les départements), chargé une seule fois puis gardé sur le téléphone */
  async all() {
    if (this.allData !== undefined) return this.allData;
    if (!this.allP) this.allP = (async () => {
      let d = await Cache.get('ipop:all');
      if (!d) {
        try { d = await fetchJSON('pop.json', {}, 60000); if (d && typeof d === 'object') await Cache.set('ipop:all', d); else d = null; }
        catch (e) { d = null; }
      }
      this.allData = d;
      return d;
    })();
    return this.allP;
  },
  async get(dep) {
    if (this.mem.has(dep)) return this.mem.get(dep);
    if (this.failed.has(dep)) return null;
    const all = await this.all();
    if (all && all[dep]) { this.mem.set(dep, all[dep]); return all[dep]; }
    if (this.pending.has(dep)) return this.pending.get(dep);
    const pr = (async () => {
      let d = await Cache.get('ipop:' + dep);
      if (!d) {
        // anciens fichiers par département : dossier pop/ ou racine du site
        for (const u of ['pop/' + dep + '.json', dep + '.json']) {
          try { d = await fetchJSON(u, {}, 30000); if (d && typeof d === 'object') break; d = null; } catch (e) { d = null; }
        }
        if (!d) { this.failed.add(dep); return null; }
        await Cache.set('ipop:' + dep, d);
      }
      this.mem.set(dep, d);
      return d;
    })();
    this.pending.set(dep, pr);
    const r = await pr; this.pending.delete(dep);
    return r;
  },
  /** habitants d'une zone : IRIS exact, sinon somme des IRIS de la commune */
  lookup(d, z) {
    if (z.code && d[z.code] !== undefined && !String(z.code).startsWith('C')) return d[z.code];
    if (!z.insee) return undefined;
    if (d[z.insee + '0000'] !== undefined) return d[z.insee + '0000'];
    let sum = 0, found = false;
    for (const k in d) if (k.startsWith(z.insee)) { sum += d[k]; found = true; }
    return found ? sum : undefined;
  },
  /** remplace les estimations par les chiffres du recensement */
  async apply() {
    const w = G.w; if (!w) return 0;
    const deps = new Set();
    for (const z of w.zones.values()) if (!z.popReal && !z.popTried && z.insee) deps.add(this.dep(z.insee));
    let n = 0;
    for (const dep of deps) {
      const d = await this.get(dep);
      for (const z of w.zones.values()) {
        if (z.popReal || z.popTried || this.dep(z.insee) !== dep) continue;
        z.popTried = true;
        if (!d) continue;
        // découpage IRIS récent absent du recensement 2019 : on garde l'estimation
        if (z.code && !String(z.code).startsWith('C') && z.type !== 'Z' && d[z.code] === undefined) continue;
        const p = this.lookup(d, z);
        if (p === undefined) continue;
        z.pop = Math.max(0, p); z.popReal = 'INSEE 2019';
        if (z.type === 'H') z.jobs = Math.max(z.jobs * 0.3, z.pop * 0.35);
        else if (z.type === 'Z') z.jobs = z.pop * 0.4;
        w.reprice(z); n++;
      }
    }
    if (n) {
      w.attachDensity(true);
      if (G.s && G.ready) {
        for (const l of G.s.lines) if (l.stopAt) Lines.computeOD(l);
        Transfers.rebuild();
        for (const l of G.s.lines) Sim.lineQuality(l);
      }
      Render.dirty = true;
    }
    return n;
  },
};

/* ---------- gestionnaire de chargement ---------- */
const Loader = {
  busy: 0,
  failures: 0,
  listeners: [],
  status(msg) { for (const f of this.listeners) f(msg); },

  async zonesFor(chunks) {
    const w = G.w; let added = 0;
    for (const [i, j] of chunks) {
      const key = i + ':' + j;
      if (w.zoneChunks.has(key)) continue;
      const b = chunkBox(i, j);
      this.busy++; this.status('Quartiers IGN…');
      try {
        if (w.mode === 'iris') {
          let gj = await Cache.get('iris:' + key);
          if (!gj) {
            try { gj = await API.irisBBox(b.s, b.w, b.n, b.e); await Cache.set('iris:' + key, gj); }
            catch (e) {
              this.failures++;
              if (this.failures >= 2 && w.zones.size === 0) { w.mode = 'commune'; }
              else throw e;
            }
          }
          if (gj) added += w.ingestIris(gj);
        }
        if (w.mode === 'commune') {
          const dep = await API.deptAt((b.s + b.n) / 2, (b.w + b.e) / 2).catch(() => null);
          if (dep && !w.deptsLoaded.has(dep)) {
            let gj = await Cache.get('dep:' + dep);
            if (!gj) { gj = await API.communesDept(dep); await Cache.set('dep:' + dep, gj); }
            w.deptsLoaded.add(dep);
            added += w.ingestCommunes(gj);
          }
        }
        w.zoneChunks.add(key);
      } catch (e) {
        console.warn('zones', key, e);
        UI.toast('Quartiers indisponibles pour le moment, nouvel essai plus tard.', 'warn');
      } finally { this.busy--; }
    }
    if (added) {
      // populations communales pour les communes non découpées
      for (const z of w.zones.values()) if (z.type === 'Z' && !z.popFetched && w.mode === 'iris') {
        z.popFetched = true;
        API.communePop(z.insee).then((p) => { if (p) { z.pop = p; z.jobs = p * 0.4; z.popReal = 'INSEE (commune)'; z.popTried = true; w.reprice(z); Render.dirty = true; } });
      }
      PopData.apply().catch((e) => console.warn('population', e));
      w.attachDensity(true);
      w.version++;
      Render.dirty = true;
    }
    this.status(null);
    return added;
  },

  async roadsFor(chunks) {
    const w = G.w; let n = 0;
    const todo = chunks.filter(([i, j]) => !w.roadChunks.has(i + ':' + j));
    for (const [i, j] of todo) w.roadChunks.add(i + ':' + j);
    const one = async ([i, j]) => {
      const key = i + ':' + j, b = chunkBox(i, j);
      const srcWas = w.roadSrc;
      this.busy++; this.status(w.roadSrc === 'ign' ? 'Routes IGN…' : 'Routes OpenStreetMap…');
      try {
        if (w.roadSrc === 'ign') {
          let d = await Cache.get('bdt2:' + key);
          if (d) Cache.del('bdt:' + key); // l'ancienne copie (avant la version 1.15) ne sert plus
          if (!d) {
            try {
              d = compactBD(await API.bdtopo(b));

              const dd = d, later = window.requestIdleCallback || ((f) => setTimeout(f, 1500));
              later(() => { Cache.set('bdt2:' + key, dd).then(() => Cache.del('bdt:' + key)); }, { timeout: 8000 });
            }
            catch (e) {
              // hors ligne : on se contente de l'ancienne copie (sans les niveaux des ponts et tunnels)
              d = await Cache.get('bdt:' + key);
            }
          }
          if (!d) {
            w.bdFail++;
            if (w.bdFail >= 2 && !w.road.nE) w.roadSrc = 'osm';
            throw new Error('BD TOPO indisponible');
          }
          await w.ingestBDTopoAsync(d);
        } else {
          let js = await Cache.get('osm:' + key);
          if (!js) { js = await API.overpass(b.s, b.w, b.n, b.e); await Cache.set('osm:' + key, js); }
          w.ingestOSM(js);
        }
        w.attachDensity(false);
        w.applyMaxspeed(false);
        n++;
        Render.dirty = true;
        Sim.onNetworkGrow();
        Dessin.refresh();
        this.signalsFor(i, j); // en arrière-plan
      } catch (e) {
        console.warn('routes', key, e);
        w.roadChunks.delete(key);
        if (srcWas === 'ign' && w.roadSrc === 'osm') {
          UI.toast('Serveur IGN indisponible : bascule sur OpenStreetMap (plus lent).', 'warn');
          setTimeout(() => Loader.ensureAround(), 0);
        } else if (srcWas === 'ign' && !w.road.nE && w.bdFail < 2) {
          setTimeout(() => Loader.ensureAround(), 3000);
        } else {
          UI.toast('Routes indisponibles pour le moment. Nouvel essai dans 1 min.', 'warn');
          setTimeout(() => Loader.ensureAround(), 60000);
        }
      } finally { this.busy--; this.status(this.busy > 0 ? 'Routes…' : null); }
    };

    const queue = todo.slice();
    const workers = [0, 1, 2].map(async () => { while (queue.length) await one(queue.shift()); });

  },

  /** feux, stops et cédez-le-passage : petite requête OpenStreetMap, sans bloquer le jeu */
  async signalsFor(i, j) {

      if (!js) { const b = chunkBox(i, j); js = await API.signals(b.s, b.w, b.n, b.e); await Cache.set('sig2:' + key, js); }

};

/* ---------- temps ---------- */
const Time = {
  date(min) { return new Date(G.s.startMs + min * 60000); },
  mod(min) { return ((min % 1440) + 1440) % 1440; },
  hour(min) { return Math.floor(this.mod(min) / 60); },
  dow(min) { return this.date(min).getUTCDay(); }, // 0 = dimanche
  /** jour férié en France (fêtes fixes + Pâques, Ascension, Pentecôte) */
  holiday(min) {
    const d = this.date(min), y = d.getUTCFullYear(), md = (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
    if ([101, 501, 508, 714, 815, 1101, 1111, 1225].includes(md)) return true;
    let h = this._easter && this._easter.y === y ? this._easter : null;
    if (!h) {
      // calcul de Pâques (Meeus)
      const a = y % 19, b = Math.floor(y / 100), c = y % 100, dd = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), hh = (19 * a + b - dd - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
      const l = (32 + 2 * e + 2 * i - hh - k) % 7, m = Math.floor((a + 11 * hh + 22 * l) / 451);
      const mon = Math.floor((hh + l - 7 * m + 114) / 31), day = ((hh + l - 7 * m + 114) % 31) + 1;
      const e0 = Date.UTC(y, mon - 1, day);
      const dates = [1, 39, 50].map((o) => { const x = new Date(e0 + o * 864e5); return (x.getUTCMonth() + 1) * 100 + x.getUTCDate(); });
      h = this._easter = { y, dates };
    }
    return h.dates.includes(md);
  },
  sundayLike(min) { return this.dow(min) === 0 || this.holiday(min); },
  weekend(min) { return this.dow(min) === 6 || this.sundayLike(min); },
  night(min) { const h = this.hour(min); return h >= 22 || h < 5; },
  period(min) { return this.night(min) ? 'night' : this.weekend(min) ? 'weekend' : 'week'; },
  month(min) { return this.date(min).getUTCMonth(); },
  label(min) {
    const d = this.date(min);
    const j = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'][d.getUTCDay()];
    const m = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'][d.getUTCMonth()];
    return { day: `${j} ${d.getUTCDate()} ${m}`, time: String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0') };
  },
  dayLabel(min) { const d = this.date(min); return `${d.getUTCDate()}/${d.getUTCMonth() + 1}`; },
  hhmm(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); },
};

/* ---------- géométrie de ligne ---------- */
function buildPathMeta(path) {
  const pts = path.pts, cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]));
  path.cum = cum; path.L = cum[cum.length - 1];
}
function pointAt(path, s) {
  const cum = path.cum, pts = path.pts;
  if (s <= 0) return [pts[0][0], pts[0][1], 0, 0];
  if (s >= path.L) { const n = pts.length - 1; return [pts[n][0], pts[n][1], n - 1, 1]; }
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / Math.max(1e-9, cum[hi] - cum[lo]);
  return [lerp(pts[lo][0], pts[hi][0], t), lerp(pts[lo][1], pts[hi][1], t), lo, t];
}
/** Tracé « plan de métro » : segments à 0/45/90° avec coudes arrondis */
function octiPath(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const ax = Math.abs(dx), ay = Math.abs(dy);
  const sx = Math.sign(dx) || 1, sy = Math.sign(dy) || 1;
  let corner;
  if (ax > ay) corner = [a[0] + sx * (ax - ay), a[1]];
  else corner = [a[0], a[1] + sy * (ay - ax)];
  const l1 = Math.hypot(corner[0] - a[0], corner[1] - a[1]);
  const l2 = Math.hypot(b[0] - corner[0], b[1] - corner[1]);
  if (l1 < 1e-9 || l2 < 1e-9) return [a, b];
  const r = Math.min(meters(220), l1 * 0.45, l2 * 0.45);
  const p1 = [corner[0] - ((corner[0] - a[0]) / l1) * r, corner[1] - ((corner[1] - a[1]) / l1) * r];
  const p2 = [corner[0] + ((b[0] - corner[0]) / l2) * r, corner[1] + ((b[1] - corner[1]) / l2) * r];
  const out = [a, p1];
  for (let k = 1; k < 6; k++) {
    const t = k / 6, u = 1 - t;
    out.push([u * u * p1[0] + 2 * u * t * corner[0] + t * t * p2[0], u * u * p1[1] + 2 * u * t * corner[1] + t * t * p2[1]]);
  }
  out.push(p2, b);
  return out;
}

function reversePath(path) {
  const N = path.pts.length;
  const out = { pts: path.pts.slice().reverse(), pairs: path.pairs ? path.pairs.slice().reverse() : null, stopPt: path.stopPt.slice().reverse().map((i) => N - 1 - i) };
  buildPathMeta(out);
  return out;
}

/* ---------- construction de ligne ---------- */
const Lines = {
  netFor(mode) { return mode === 'bus' ? G.w.road : mode === 'ter' ? G.w.rail : mode === 'boat' ? G.w.water : null; },

  /** Calcule le tronçon entre deux arrêts (en respectant les sens de circulation). Renvoie {pts, pairs, len} */
  segment(mode, A, B, opts) {
    if (mode === 'metro') {
      return { pts: octiPath([A.mx, A.my], [B.mx, B.my]), pairs: null };
    }
    return this.segNodes(this.netFor(mode), A.node, B.node, opts);
  },
  segNodes(net, a, b, opts) {
    const r = route(net, a, b, opts);
    if (!r) return null;
    const pts = r.nodes.map((i) => [net.x[i], net.y[i]]);
    if (pts.length < 2) pts.push([net.x[b], net.y[b]]);
    const pairs = r.edges.map((e) => net.ids[net.ea[e]] + '_' + net.ids[net.eb[e]]);
    while (pairs.length < pts.length - 1) pairs.push(null);
    return { pts, pairs, len: r.len, end: b };
  },
  /** itinéraire raisonnable (pas de détour absurde) */
  okRoute(sg, net, a, b) {
    if (!sg) return false;
    const crow = Math.hypot(net.x[a] - net.x[b], net.y[a] - net.y[b]) * G.mpu;
    return sg.len <= crow * 3.2 + 900;
  },
  /** Trajet retour d'une ligne de bus : du terminus vers le départ, en cherchant au besoin
   *  un point d'arrêt de l'autre côté de la rue (sens uniques, boulevards à deux chaussées). */
  buildBack(mode, stops) {
    if (mode !== 'bus') return null;
    const net = G.w.road, n = stops.length;
    const back = new Array(n), segs = [];
    back[n - 1] = stops[n - 1].node;
    let forced = false;
    for (let k = n - 1; k >= 1; k--) {
      const st = stops[k - 1];
      const cands = [st.node, ...net.nearestList(st.mx, st.my, 160, (i) => net.busNode(i), 10).filter((i) => i !== st.node)];
      let pickNode = -1, seg = null;
      for (const c of cands) {
        const sg = this.segNodes(net, back[k], c);
        if (this.okRoute(sg, net, back[k], c)) { pickNode = c; seg = sg; break; }
      }
      if (!seg) { seg = this.segNodes(net, back[k], st.node, { noOneway: true }); pickNode = st.node; forced = true; }
      if (!seg) return null;
      back[k - 1] = pickNode; segs.push(seg);
    }
    const rstops = stops.slice().reverse().map((st, j) => ({ mx: net.x[back[n - 1 - j]], my: net.y[back[n - 1 - j]] }));
    const path = this.assemble(rstops, segs, false);
    return { path, back, forced };
  },

  /** Assemble le chemin complet depuis les tronçons */
  assemble(stops, segs, loop) {
    const pts = [], pairs = [], stopIdx = [0];
    segs.forEach((sg, k) => {
      const start = pts.length ? 1 : 0;
      for (let i = start; i < sg.pts.length; i++) pts.push(sg.pts[i]);
      if (sg.pairs) {
        if (k > 0) {/* le premier point du tronçon est le dernier du précédent */ }
        for (const p of sg.pairs) pairs.push(p);
      } else for (let i = 1; i < sg.pts.length; i++) pairs.push(null);
      stopIdx.push(pts.length - 1);
    });
    if (!pts.length) pts.push([stops[0].mx, stops[0].my]);
    const path = { pts, pairs, stopPt: stopIdx };
    buildPathMeta(path);
    return path;
  },

  costOf(mode, stops, path) {
    const m = G.s.costMul;
    let infra = 0;
    const newStops = stops.filter((s) => !s.shared).length;
    if (mode === 'bus') infra = 5000 + newStops * 8000;
    else if (mode === 'metro') infra = (path ? path.L / 1000 : 0) * 0.6e6 + newStops * 350000 + (stops.length - newStops) * 120000;
    else if (mode === 'ter') infra = 80000 + newStops * 40000;
    else if (mode === 'boat') infra = 30000 + newStops * 60000;
    return Math.round(infra * m / 1000) * 1000;
  },

  nextNum(mode) {
    const used = new Set(G.s.lines.filter((l) => l.mode === mode).map((l) => l.num));
    let n = 1; while (used.has(n)) n++;
    return n;
  },
  nextColor() {
    const used = G.s.lines.map((l) => l.color);
    return LINE_COLORS.find((c) => !used.includes(c)) || pick(LINE_COLORS);
  },

  create(b, opts) {
    const s = G.s;
    const id = s.nextId++;
    const line = {
      id, mode: b.mode, num: opts.num || this.nextNum(b.mode), color: opts.color || this.nextColor(),
      name: '', loop: !!b.loop,
      stops: b.stops.map((st) => ({ mx: st.mx, my: st.my, name: st.name, nid: st.nid ?? null, shared: !!st.shared, bmx: st.bmx, bmy: st.bmy, bnid: st.bnid ?? null })),
      path: b.path, pathB: b.pathB || null, routedV2: true,
      prices: { week: MODES[b.mode].ref, weekend: MODES[b.mode].ref, night: MODES[b.mode].ref },
      hours: { start: 330, end: 30 }, night: false, busLane: false, signal: false,
      svc: { ...SERVICE_PRESETS.equilibre.v }, svcPreset: 'equilibre',
      status: b.mode === 'metro' ? 'construction' : 'active',
      buildEnd: b.mode === 'metro' ? s.min + (b.path.L > 4000 ? 2 : 1) * 1440 : 0,
      rep: 1, created: s.min, veh: [], od: null,
      today: Lines.blankStats(), hist: [],
    };
    this.autoName(line);
    s.lines.push(line);
    this.prepare(line);
    for (let k = 0; k < opts.count; k++) this.addVehicle(line, opts.model, true);
    this.placeVehicles(line);
    return line;
  },

  autoName(line) {
    const st = line.stops;
    line.name = line.loop ? 'Circulaire ' + st[0].name : st[0].name + ' ⇄ ' + st[st.length - 1].name;
  },
  blankStats() { return { pax: 0, fares: 0, ops: 0, ads: 0, mec: 0, loadSum: 0, loadN: 0, loadMax: 0, xin: 0, xout: 0 }; },
  pv: 0,

  /** Prépare les structures de simulation d'une ligne (après création ou chargement) */
  prepare(line) {
    const n = line.stops.length;
    buildPathMeta(line.path);
    const P = line.path;
    if (line.pathB) buildPathMeta(line.pathB);
    const PB = line.loop ? null : (line.pathB || reversePath(P));
    line.P = [P, PB];
    line.stopAt = P.stopPt.map((i) => P.cum[i]);
    const L = P.L;
    line.L0 = L;
    line.C = line.loop ? L : L + PB.L;
    const ev = [];
    for (let k = 0; k < n; k++) ev.push({ u: line.stopAt[k], k, d: 0 });
    if (!line.loop) PB.stopPt.forEach((pi, j) => ev.push({ u: L + PB.cum[pi], k: n - 1 - j, d: 1 }));
    ev.sort((a, b) => a.u - b.u || a.d - b.d);
    line.ev = ev;
    line.bbox = null;
    line.Wf = new Float64Array(n * n);
    line.Wb = new Float64Array(n * n);
    // correspondances : Xf/Xb voyageurs qui changeront de ligne à l'arrivée, Rf/Rb voyageurs arrivés d'une autre ligne (billet déjà payé)
    line.Xf = new Float64Array(n * n); line.Xb = new Float64Array(n * n);
    line.Rf = new Float64Array(n * n); line.Rb = new Float64Array(n * n);
    line.xgen = []; line.xcont = Array.from({ length: n }, () => []);
    line.sb = new Float64Array(n); line.sm = new Float64Array(n); // montées et mécontents du jour, par arrêt (carte de chaleur)
    line.pv = ++this.pv;
    if (!line.svc) { line.svc = { ...SERVICE_PRESETS.uniforme.v }; line.svcPreset = 'uniforme'; }
    line.segE = null;
    this.resolveEdges(line);
    if (!line.od || line.od.length !== n * n) this.computeOD(line);
    line.qual = 1; line.headway = 10; line.speedAvg = MODES[line.mode].refKmh;
    line.evMul = new Float64Array(n).fill(1);
    line.active = false;
    for (const v of line.veh) { v.on = new Float64Array(n); v.ont = new Float64Array(n); v.load = 0; }
    this.controls(line);
  },

  /** feux, stops et cédez-le-passage rencontrés sur le parcours (bus uniquement) */
  controls(line) {
    const w = G.w, out = [];
    if (line.mode === 'bus' && w.signals.length) {
      line.P.forEach((P, dir) => {
        if (!P) return;
        const base = dir ? line.L0 : 0, seen = new Set();
        P.pts.forEach((pt, i) => {
          for (const sg of w.signalsNear(pt[0], pt[1], 14)) {
            if (seen.has(sg.id)) continue;
            seen.add(sg.id);
            out.push({ u: base + P.cum[i], t: sg.t, sg });
          }
        });
      });
      out.sort((a, b) => a.u - b.u);
    }
    line.ctl = out;
    for (const v of line.veh) this.ctlPointer(line, v);
  },
  ctlPointer(line, v) {
    v.ci = 0; v.cwrap = false;
    const c = line.ctl || [];
    while (v.ci < c.length && c[v.ci].u <= v.u + 1e-6) v.ci++;
    if (v.ci >= c.length) { v.ci = 0; v.cwrap = true; }
  },

  /** Recalcule l'itinéraire d'une ligne existante sur le réseau actuel (sens uniques compris) */
  reroute(line) {
    if (line.mode === 'metro') return false;
    const net = this.netFor(line.mode);
    if (!net || !net.nE) return false;
    const rad = line.mode === 'bus' ? 250 : line.mode === 'ter' ? 450 : 300;
    const acc = line.mode === 'bus' ? (i) => net.busNode(i) : null;
    const st = [];
    for (const s0 of line.stops) {
      const cands = net.nearestList(s0.mx, s0.my, rad, acc, 8);
      if (!cands.length) return false;
      st.push({ ...s0, cands, node: cands[0] });
    }
    const segs = [];
    for (let k = 0; k < st.length - 1; k++) {
      let ok = null;
      for (const c of st[k + 1].cands) {
        const sg = this.segNodes(net, st[k].node, c);
        if (this.okRoute(sg, net, st[k].node, c)) { ok = sg; st[k + 1].node = c; break; }
      }
      if (!ok) return false;
      segs.push(ok);
    }
    if (line.loop) {
      const sg = this.segNodes(net, st[st.length - 1].node, st[0].node);
      if (!sg) return false;
      segs.push(sg);
    }
    for (const x of st) { x.mx = net.x[x.node]; x.my = net.y[x.node]; x.nid = net.ids[x.node]; }
    const path = this.assemble(st, segs, line.loop);
    let pathB = null;
    if (!line.loop && line.mode === 'bus') {
      const bk = this.buildBack('bus', st);
      if (!bk) return false;
      pathB = bk.path;
      st.forEach((x, k) => { const b = bk.back[k]; x.bmx = net.x[b]; x.bmy = net.y[b]; x.bnid = net.ids[b]; });
    }
    line.stops = st.map((x) => ({ mx: x.mx, my: x.my, name: x.name, nid: x.nid, shared: x.shared, bmx: x.bmx, bmy: x.bmy, bnid: x.bnid ?? null }));
    line.path = path; line.pathB = pathB; line.routedV2 = true;

    this.prepare(line);
