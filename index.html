function barChart(items, posOnly) {
  if (!items.length) return '<p class="note">Les chiffres apparaîtront après la première journée complète.</p>';
  const W = 320, H = 110, pad = 18;
  const max = Math.max(1, ...items.map((i) => Math.abs(i.v)));
  const hasNeg = !posOnly && items.some((i) => i.v < 0);
  const zero = hasNeg ? H / 2 : H - pad;
  const scale = (hasNeg ? H / 2 - 6 : H - pad - 8) / max;
  const bw = (W - 8) / items.length;
  const bars = items.map((it, i) => {
    const h = Math.abs(it.v) * scale;
    const x = 4 + i * bw + 2, y = it.v >= 0 ? zero - h : zero;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="1.5" fill="${it.v >= 0 ? (posOnly ? 'var(--accent)' : 'var(--ok)') : 'var(--bad)'}"/>` +
      (i % 2 === items.length % 2 || items.length < 8 ? `<text x="${(x + (bw - 4) / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${it.l}</text>` : '');
  }).join('');
  const last = items[items.length - 1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" class="axis"/>${bars}</svg><small>Dernier jour : <b>${posOnly ? fmtInt(last.v) : fmtEur(last.v)}</b> · max ${posOnly ? fmtInt(max) : fmtEur(max)}</small></div>`;
}

/** secondes pour atteindre la vitesse maximale depuis l'arrêt */
function accTime(md) { return Math.round(md.kmh / 3.6 / (md.acc || PHYS[md.mode].a)); }

function laneLength(l) {
  if (!l.segE) return 0;
  let m = 0; const net = G.w.road, P = l.path;
  for (let i = 0; i < P.pts.length - 1; i++) { const e = l.segE[i]; if (e >= 0 && net.cls[e] <= 3) m += P.cum[i + 1] - P.cum[i]; }
  return m;
}

/* =====================================================================
   CONSTRUCTION DE LIGNE
   ===================================================================== */
const Build = {
  b: null,
  color() { return this.b ? this.b.color : '#F2B705'; },
  start(mode) {
    const w = G.w;
    if (mode === 'bus' && !w.road.nE) { UI.toast('Les routes sont encore en chargement, patientez quelques secondes.', 'warn'); return; }
    if (mode === 'ter' && !w.rail.nE) { UI.toast('Aucune voie ferrée chargée dans votre territoire. Achetez des zones traversées par le train.', 'warn'); return; }
    if (mode === 'boat' && !w.water.nE) { UI.toast('Aucun fleuve ni canal dans votre territoire pour l’instant.', 'warn'); return; }
    UI.close(); UI.closeCard();
    this.b = { mode, stops: [], segs: [], loop: false, color: Lines.nextColor() };
    $('#buildbar').hidden = false; $('#nav').classList.add('dim');
    this.bar();
    UI.toast({ bus: 'Touchez une rue pour placer chaque arrêt de bus.', metro: 'Touchez la carte pour placer les stations. Retouchez la 1re pour une ligne circulaire.', ter: 'Touchez près d’une gare pour l’ajouter.', boat: 'Touchez le fleuve pour placer les pontons.' }[mode], 'info');
  },
  bar() {
    const b = this.b; if (!b) return;
    const path = b.segs.length ? Lines.assemble(b.stops, b.segs, b.loop) : null;
    const cost = Lines.costOf(b.mode, b.stops, path);
    $('#buildbar').innerHTML = `<div class="bb-t">${pict(b.mode)}<div><b>${b.stops.length} arrêt${b.stops.length > 1 ? 's' : ''}${path ? ' · ' + fmtKm(path.L) : ''}${b.loop ? ' · circulaire' : ''}</b><small>Infrastructure : ${fmtEur(cost)}</small></div></div>
      <div class="bb-a"><button class="icon-b" data-act="bUndo" aria-label="Retirer le dernier arrêt" ${b.stops.length ? '' : 'disabled'}>${icon('undo')}</button><button class="icon-b" data-act="bCancel" aria-label="Annuler">${icon('close')}</button><button class="btn primary sm" data-act="bOk" ${b.stops.length >= 2 ? '' : 'disabled'}>${icon('check')} Valider</button></div>`;
  },
  allStops(mode) {
    const out = [];
    for (const l of G.s.lines) if (l.mode === mode) for (const st of l.stops) out.push(st);
    return out;
  },
  stopName(mx, my, mode, nodeName) {
    const w = G.w;
    const used = new Set(this.b.stops.map((s) => s.name));
    let name = '';
    const pois = w.poisNear(mx, my, mode === 'ter' ? 800 : 180).filter((p) => p.name && (mode !== 'ter' || p.kind === 'station'));
    if (pois.length) { pois.sort((a, b) => dist(a.mx, a.my, mx, my) - dist(b.mx, b.my, mx, my)); name = pois[0].name; }
    if (!name && nodeName) name = nodeName;
    if (!name && w.road.nE) {
      const i = w.road.nearest(mx, my, 150);
      if (i >= 0) { const nm = w.road.adj[i].map((e) => w.road.name[e]).filter(Boolean); if (nm.length) name = nm[0]; }
    }
    if (mode === 'boat' && name && !pois.length) name = 'Quai ' + name.replace(/^(rue|avenue|boulevard|chemin|route|allée|place)\s+(de la |du |des |de l’|de l'|de |d’)?/i, '');
    const z = w.zoneAt(mx, my);
    if (!name) name = z ? z.name : 'Arrêt';
    if (used.has(name) && z && !used.has(z.name)) name = z.name;
    let n = name, k = 2;
    const ROM = ['', '', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    while (used.has(n)) { n = name + ' ' + (k < ROM.length ? ROM[k] : k); k++; }
    return n.trim();
  },
  tap(mx, my) {
    const b = this.b, w = G.w, mode = b.mode;
    let st = null;
    // reprise de la 1re station : ligne circulaire
    if (b.stops.length >= 3 && MODES[mode].loop && !b.loop) {
      const f = b.stops[0];
      const o = Render.origin();
      const px = Math.hypot((f.mx - mx) * o.k, (f.my - my) * o.k);
      if (px < 26) return this.closeLoop();
    }
    if (b.loop) { UI.toast('La ligne est déjà bouclée. Validez ou retirez un arrêt.', 'info'); return; }
    if (mode === 'metro') {
      const ex = this.allStops('metro').find((s) => dist(s.mx, s.my, mx, my) < 90);
      st = ex ? { mx: ex.mx, my: ex.my, name: ex.name, shared: true } : { mx, my };
    } else if (mode === 'bus') {
      const ex = this.allStops('bus').find((s) => dist(s.mx, s.my, mx, my) < 35);
      const net = w.road;
      const cands = ex && ex.nid != null && net.idx.has(ex.nid) ? [net.idx.get(ex.nid)] : net.nearestList(mx, my, 180, (n) => net.busNode(n), 8);
      if (!cands.length) { UI.toast('Aucune rue à proximité : touchez plus près d’une route.', 'warn'); return; }
      const last0 = b.stops[b.stops.length - 1];
      let i = cands[0], pre = null;
      if (last0) {
        // premier point de la rue réellement atteignable dans le bon sens de circulation
        i = -1;
        for (const c of cands) {
          const sg = Lines.segNodes(net, last0.node, c);
          if (Lines.okRoute(sg, net, last0.node, c)) { i = c; pre = sg; break; }
        }
        if (i < 0) { UI.toast('Aucun itinéraire respectant les sens de circulation jusqu’ici. Essayez une autre rue.', 'warn'); return; }
      }
      st = { mx: net.x[i], my: net.y[i], node: i, nid: net.ids[i], name: ex ? ex.name : null, shared: !!ex, pre };
    } else if (mode === 'ter') {
      const gares = w.pois.filter((p) => p.kind === 'station' && p.train && dist(p.mx, p.my, mx, my) < 700).sort((a, b) => dist(a.mx, a.my, mx, my) - dist(b.mx, b.my, mx, my));
      if (!gares.length) { UI.toast('Pas de gare ici. Touchez près d’une gare existante.', 'warn'); return; }
      const g = gares[0];
      const i = w.rail.nearest(g.mx, g.my, 450);
      if (i < 0) { UI.toast('Cette gare n’est reliée à aucune voie chargée.', 'warn'); return; }
      const ex = this.allStops('ter').find((s) => dist(s.mx, s.my, g.mx, g.my) < 80);
      st = { mx: w.rail.x[i], my: w.rail.y[i], node: i, nid: w.rail.ids[i], name: g.name || null, shared: !!ex };
    } else if (mode === 'boat') {
      const i = w.water.nearest(mx, my, 300);
      if (i < 0) { UI.toast('Touchez directement le fleuve ou le canal.', 'warn'); return; }
      st = { mx: w.water.x[i], my: w.water.y[i], node: i, nid: w.water.ids[i] };
    }
    const z = w.zoneAt(st.mx, st.my);
    if (!z || !z.owned) { UI.toast('Cet emplacement est hors de votre zone d’exploitation. Achetez la zone d’abord.', 'warn'); return; }
    const last = b.stops[b.stops.length - 1];
    if (last && ((st.node !== undefined && st.node === last.node) || dist(st.mx, st.my, last.mx, last.my) < 60)) { UI.toast('Arrêt trop proche du précédent.', 'warn'); return; }
    if (!st.name) st.name = this.stopName(st.mx, st.my, mode);
    else { const used = new Set(b.stops.map((s) => s.name)); let n = st.name, k = 2; while (used.has(n)) n = st.name + ' ' + k++; st.name = n; }
    if (last) {
      const sg = st.pre || Lines.segment(mode, last, st);
      delete st.pre;
      if (!sg) { UI.toast(mode === 'bus' ? 'Pas d’itinéraire routier entre ces deux arrêts.' : 'Pas de liaison continue entre ces deux points.', 'warn'); return; }
      if (sg.pts.length < 2) sg.pts.push([st.mx, st.my]);
      b.segs.push(sg);
    }
    b.stops.push(st);
    if (navigator.vibrate) navigator.vibrate(12);
    this.bar();
  },
  closeLoop() {
    const b = this.b;
    const f = b.stops[0], last = b.stops[b.stops.length - 1];
    const sg = Lines.segment(b.mode, last, f);
    if (!sg) { UI.toast('Impossible de boucler la ligne ici.', 'warn'); return; }
    b.segs.push(sg); b.loop = true;
    this.bar();
  },
  undo() {
    const b = this.b; if (!b) return;
    if (b.loop) { b.loop = false; b.segs.pop(); }
    else if (b.stops.length) { b.stops.pop(); if (b.segs.length >= b.stops.length && b.segs.length) b.segs.pop(); }
    this.bar();
  },
  cancel() {
    this.b = null; $('#buildbar').hidden = true; $('#nav').classList.remove('dim');
  },
  confirm() {
    const b = this.b; if (!b || b.stops.length < 2) return;
    const path = Lines.assemble(b.stops, b.segs, b.loop);
    b.pathB = null;
    if (b.mode === 'bus' && !b.loop) {
      const bk = Lines.buildBack('bus', b.stops);
      if (!bk) { UI.toast('Impossible de trouver un trajet retour respectant les sens de circulation.', 'warn'); return; }
      const net = G.w.road;
      b.pathB = bk.path;
      b.stops.forEach((st, k) => { const n = bk.back[k]; st.bmx = net.x[n]; st.bmy = net.y[n]; st.bnid = net.ids[n]; });
      if (bk.forced) UI.toast('Attention : une partie du retour emprunte un sens interdit faute d’alternative.', 'warn');
    }
    const infra = Lines.costOf(b.mode, b.stops, path);
    const cat = CATALOG[b.mode];
    G.ui.bSel = { model: cat[b.mode === 'bus' ? 1 : 0].id, count: b.mode === 'bus' ? 3 : 2, color: b.color, path, infra };
    this.dialog();
  },
  dialog() {
    const b = this.b, q = G.ui.bSel;
    const md = MODEL[q.model];
    const vehCost = Math.round(md.price * G.s.costMul) * q.count;
    const total = q.infra + vehCost;
    const sp = { bus: 4.2, metro: 12.4, ter: 18, boat: 5.5 }[b.mode];
    const cyc = (b.loop ? q.path.L : 2 * q.path.L) / sp / 60 + b.stops.length * 2 * 0.6;
    const hw = cyc / q.count;
    const cat = CATALOG[b.mode].map((m) => `<button class="catrow ${m.id === q.model ? 'on' : ''}" data-act="bModel" data-arg="${m.id}"><span><b>${esc(m.name)}</b><small>${esc(m.desc)} · ${m.cap} pl. · ${m.kmh} km/h en ${accTime(m)} s · ${fmtEur(m.op * G.s.costMul)}/h</small></span><em>${fmtEur(m.price * G.s.costMul)}</em></button>`).join('');
    const sw = LINE_COLORS.map((c) => `<button class="sw ${c === q.color ? 'on' : ''}" style="background:${c}" data-act="bColor" data-arg="${c}" aria-label="Couleur ${c}"></button>`).join('');
    UI.modal(`<div class="plate big">${pict(b.mode)} Nouvelle ligne · ${esc(MODES[b.mode].label)}</div>
      <p class="sub">${b.stops.length} arrêts · ${fmtKm(q.path.L)}${b.loop ? ' · circulaire' : ''} · de ${esc(b.stops[0].name)} à ${esc(b.loop ? b.stops[0].name : b.stops[b.stops.length - 1].name)}${b.mode === 'metro' ? `<br>Chantier : ${q.path.L > 4000 ? '2 jours' : '1 jour'} avant l’ouverture.` : ''}</p>
      <h3 class="sec">Couleur</h3><div class="swatches">${sw}</div>
      <h3 class="sec">Véhicules</h3>${cat}
      <div class="vrow"><div><b>Nombre</b><small>passage toutes les ~${Math.max(1, Math.round(hw))} min</small></div><div class="stepper"><button data-act="bCount" data-arg="-1">−</button><b>${q.count}</b><button data-act="bCount" data-arg="1">+</button></div></div>
      <table class="tbl mini"><tbody><tr><th>Infrastructure</th><td>${fmtEur(q.infra)}</td></tr><tr><th>${q.count} × ${esc(md.name)}</th><td>${fmtEur(vehCost)}</td></tr><tr class="tot"><th>Total</th><td>${fmtEur(total)}</td></tr>${Eco.free() ? '<tr><th>Argent illimité</th><td>gratuit</td></tr>' : `<tr><th>Trésorerie après</th><td class="${G.s.money - total < 0 ? 'neg' : ''}">${fmtEur(G.s.money - total)}</td></tr>`}</tbody></table>
      <div class="row2"><button class="btn" data-act="closeModal">Retour</button><button class="btn primary" data-act="bBuild" ${Eco.canAfford(total) ? '' : 'disabled'}>Construire</button></div>`);
  },
  build() {
    const b = this.b, q = G.ui.bSel;
    const md = MODEL[q.model];
    const total = q.infra + Math.round(md.price * G.s.costMul) * q.count;
    if (!Eco.spend(total, 'capex')) return;
    b.path = q.path;
    const line = Lines.create(b, { model: q.model, count: q.count, color: q.color });
    Render.lineBox(line);
    Sim.lineQuality(line);
    Events.log('Nouvelle ligne ' + MODES[line.mode].label.toLowerCase() + ' ' + Lines.label(line) + ' : ' + line.name + '.', 'ok');
    UI.closeModal(); this.cancel();
    UI.toast(line.status === 'construction' ? 'Chantier lancé ! Ouverture le ' + Time.label(line.buildEnd).day + ' à ' + Time.label(line.buildEnd).time : 'Ligne ' + Lines.label(line) + ' ouverte !', 'ok');
    Render.dirty = true; UI.refreshTop();
    Save.auto();
  },
};

/* =====================================================================
   ACTIONS
   ===================================================================== */
const findLine = (id) => G.s.lines.find((l) => l.id === +id);
const APP_VERSION = '1.6';
const ACT = {
  nav(k) {
    if (Build.b) Build.cancel();
    if (RailBuild.b) RailBuild.cancel();
    if (G.ui.sheet === k && UI.sheetOpen()) { UI.close(); return; }
    UI.open(k);
  },
  menu() { if (G.ui.sheet === 'menu' && UI.sheetOpen()) UI.close(); else UI.open('menu'); },
  closeSheet() { UI.close(); },
  closeCard() { UI.closeCard(); },
  closeModal() { UI.closeModal(); },
  play() { G.paused = !G.paused; if (!G.paused && G.speed === 'rt') RealTime.sync(); UI.refreshTop(); },
  speed() {
    const v = [1, 5, 20, 60, 'rt'];
    const next = v[(v.indexOf(G.speed) + 1) % v.length];
    if (next === 'rt') {
      const t = Time.label((RealTime.parisMs() - G.s.startMs) / 60000);
      UI.modal(`<div class="plate big">${icon('target')} Temps réel</div>
        <p>Le jeu avancera au rythme de la vraie vie : 1 minute de jeu = 1 minute réelle. L’horloge se cale sur l’heure de Paris : <b>${t.day}, ${t.time}</b>.</p>
        <p class="sub">${G.s.min / 1440 > (RealTime.parisMs() - G.s.startMs) / 864e5 ? 'Votre partie est en avance sur le temps réel : l’horloge reviendra à la date du jour.' : 'Si le saut est long, vos véhicules repartent de leurs terminus.'} Appli fermée, le jeu continue au même rythme.</p>
        <label class="tgl"><input type="checkbox" data-change="setting" data-arg="realWeather" ${G.s.settings.realWeather ? 'checked' : ''}><span>Météo réelle de ${esc(G.s.city.nom)} (Météo-France)</span></label>
        <div class="row2"><button class="btn" data-act="rtCancel">Annuler</button><button class="btn primary" data-act="rtOn">Passer en temps réel</button></div>`);
      return;
    }
    if (G.speed === 'rt') RealTime.disable();
    G.speed = next; G.paused = false; UI.refreshTop();
  },
  rtOn() { UI.closeModal(); RealTime.enable(); },
  rtCancel() { UI.closeModal(); G.speed = 1; G.paused = false; UI.refreshTop(); },
  openLine(id) { UI.open('line', id); Render.dirty = true; },
  follow() { G.ui.follow = G.ui.follow === G.ui.selVeh ? null : G.ui.selVeh; UI.renderVehCard(); },
  buildMode(m) { if (RailBuild.b) RailBuild.cancel(); Build.start(m); },
  railMode(k) { RailBuild.start(k); },
  rbRot(d) { RailBuild.rotate(+d); },
  rbCancel() { RailBuild.cancel(); },
  rbOk() { RailBuild.confirm(); },
  rbUndo() { RailBuild.undo(); },
  stRot(arg) {
    const [id, d] = arg.split('|'); const g = Rail.stationById(+id); if (!g) return;
    g.ang += (+d) * Math.PI / 12; Render.dirty = true; UI.showStation(g);
  },
  stTrack(id) {
    const g = Rail.stationById(+id); if (!g) return;
    RailBuild.start('track'); RailBuild.tap(g.mx, g.my);
  },
  poiTrack(arg) {
    const [mx, my] = arg.split(',').map(Number);
    RailBuild.start('track'); RailBuild.tap(mx, my);
  },
  stDemolish(id, el) {
    const g = Rail.stationById(+id); if (!g || Rail.stationUsed(g)) return;
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer la démolition'; return; }
    const R = Rail.st();
    R.stations = R.stations.filter((x) => x !== g);
    G.w.pois = G.w.pois.filter((p) => p.sid !== g.id); G.w.poiSeen.delete('gs' + g.id);
    Eco.earn(Math.round(Rail.stationCost() * 0.3), 'sales');
    UI.closeCard(); Render.dirty = true; UI.toast(g.name + ' démolie.', 'info');
  },
  bUndo() { Build.undo(); },
  bCancel() { Build.cancel(); },
  bOk() { Build.confirm(); },
  bModel(id) { G.ui.bSel.model = id; Build.dialog(); },
  bColor(c) { G.ui.bSel.color = c; Build.b.color = c; Build.dialog(); },
  bCount(d) { G.ui.bSel.count = clamp(G.ui.bSel.count + +d, 1, 40); Build.dialog(); },
  bBuild() { Build.build(); },
  buyVeh(arg) {
    const [id, m] = arg.split('|'); const l = findLine(id); if (!l) return;
    if (Lines.addVehicle(l, m)) { UI.toast(MODEL[m].name + ' ajouté à la ligne ' + Lines.label(l) + '.', 'ok'); Sim.lineQuality(l); }
    UI.refreshSheet();
  },
  sellVeh(arg) {
    const [id, m] = arg.split('|'); const l = findLine(id); if (!l) return;
    Lines.sellVehicle(l, m); Sim.lineQuality(l); UI.refreshSheet();
  },
  price(arg) {
    const [id, k, d] = arg.split('|'); const l = findLine(id); if (!l) return;
    l.prices[k] = Math.round(clamp(l.prices[k] + +d, 0, 15) * 10) / 10; UI.refreshSheet();
  },
  busLane(id) {
    const l = findLine(id); if (!l || l.busLane) return;
    const km = laneLength(l) / 1000;
    const cost = Math.round(km * 90000 * G.s.costMul / 1000) * 1000;
    if (Eco.spend(cost, 'capex')) { l.busLane = true; l.laneKm = km; Sim.lineQuality(l); UI.toast('Couloirs de bus aménagés sur la ligne ' + Lines.label(l) + '.', 'ok'); }
    UI.refreshSheet();
  },
  signal(id) {
    const l = findLine(id); if (!l || l.signal) return;
    const cost = Math.round(l.stops.length * 25000 * G.s.costMul / 1000) * 1000;
    if (Eco.spend(cost, 'capex')) { l.signal = true; Sim.lineQuality(l); UI.toast('Priorité aux feux activée.', 'ok'); }
    UI.refreshSheet();
  },
  reroute(id) {
    const l = findLine(id); if (!l) return;
    if (Lines.reroute(l)) { Render.lineBox(l); Render.dirty = true; Sim.lineQuality(l); UI.toast('Itinéraire recalculé.', 'ok'); }
    else UI.toast('Recalcul impossible : réseau pas encore chargé autour de tous les arrêts.', 'warn');
    UI.refreshSheet();
  },
  lineColor(arg) { const [id, c] = arg.split('|'); const l = findLine(id); if (l) { l.color = c; Render.dirty = true; UI.refreshSheet(); } },
  centerLine(id) {
    const l = findLine(id); if (!l) return;
    Render.lineBox(l);
    const b = l.bbox;
    G.map.fitBounds([[myToLat(b.maxy), mxToLon(b.minx)], [myToLat(b.miny), mxToLon(b.maxx)]], { padding: [40, 40], paddingBottomRight: [20, Math.round(window.innerHeight * 0.45)] });
  },
  delLine(id, el) {
    const l = findLine(id); if (!l) return;
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer : supprimer'; return; }
    Lines.remove(l); UI.close(); Render.dirty = true;
    UI.toast('Ligne supprimée. Véhicules revendus.', 'info');
  },
  buyZone(code) {
    const z = G.w.zones.get(code); if (!z || z.owned) return;
    if (!G.w.purchasable(z)) { UI.toast('Cette zone n’est pas contiguë à votre territoire.', 'warn'); return; }
    if (!Eco.spend(z.price, 'zones')) return;
    z.owned = true;
    Events.log('Zone achetée : ' + z.name + ' (' + z.commune + ').', 'ok');
    UI.toast('Zone acquise : ' + z.name + '.', 'ok');
    Render.dirty = true;
    if (G.ui.cardType === 'zone') UI.showZone(z);
    if (UI.sheetOpen()) UI.refreshSheet();
    Loader.ensureAround();
    Save.auto();
  },
  seeZone(code) {
    const z = G.w.zones.get(code); if (!z) return;
    UI.close();
    G.map.setView([myToLat(z.cy), mxToLon(z.cx)], Math.max(G.map.getZoom(), 14));
    UI.showZone(z);
  },
  borrow(i) { Eco.borrow(Eco.loanOffers()[+i]); UI.refreshSheet(); },
  repay(arg) { const [id, f] = arg.split('|'); const ln = G.s.loans.find((x) => x.id === +id); if (ln) Eco.repay(ln, f === '1' ? ln.amount : Math.ceil(ln.amount * 0.25)); UI.refreshSheet(); },
  ads(arg) { const [m, k] = arg.split('|'); G.s.ads[m] = +k; UI.refreshSheet(); },
  statsSet(arg) { const [k, v] = arg.split('|'); G.ui[k] = v; UI.refreshSheet(); },
  strikeYes(id) {
    const e = G.s.events.find((x) => x.id === +id);
    if (e && Eco.canAfford(e.cost)) { Eco.charge(e.cost, 'events'); e.resolved = true; Events.log('Grève évitée après négociation (' + fmtEur(e.cost) + ').', 'ok'); UI.toast('Accord trouvé : la grève est levée.', 'ok'); }
    else if (e) { UI.toast('Trésorerie insuffisante pour négocier.', 'bad'); }
    UI.closeModal(); UI.refreshTop();
  },
  strikeNo() { UI.closeModal(); },
  saveSlot(n) { if (Save.write(+n)) UI.toast('Partie sauvegardée dans l’emplacement ' + n + '.', 'ok'); UI.refreshSheet(); },
  loadSlot(n) { Save.auto(); Game.load(+n); },
  base(v) { G.s.settings.base = v; Game.setBase(); UI.updateTint(); UI.refreshSheet(); },
  centerHome() { const c = G.s.city; G.map.setView([c.lat, c.lon], 14); UI.close(); },
  quit(_, el) {
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer (partie sauvegardée)'; return; }
    Save.auto(); UI.close(); Game.stop(); UI.showStart();
  },
  offlineOk() { UI.closeModal(); },
  seeEvent(id) {
    const e = G.s.events.find((x) => x.id === +id); if (!e) return;
    const p = Events.where(e); if (!p) return;
    UI.close();
    G.map.setView([myToLat(p[1]), mxToLon(p[0])], Math.max(G.map.getZoom(), 15));
    UI.showEvent(e);
  },
  // écran d'accueil
  stHome() { StartScreen.render('home'); },
  stNew() { StartScreen.render('new'); },
  stLoad() { StartScreen.render('load'); },
  stContinue() { const n = +localStorage.getItem('corr.last'); if (n) Game.load(n); },
  stPickCity(i) { StartScreen.city = StartScreen.results[+i]; StartScreen.render('new'); },
  stDiff(d) { StartScreen.diff = d; StartScreen.render('new'); },
  stSlot(n) { StartScreen.slot = +n; StartScreen.render('new'); },
  stGo() { StartScreen.go(); },
  stLoadSlot(n) { Game.load(+n); },
  stDelSlot(n, el) { if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer'; return; } Save.remove(+n); StartScreen.render('load'); },
};
const INP = {
  citySearch(v) { StartScreen.search(v); },
};
const CHG = {
  hStart(v, el) { const l = findLine(el.dataset.arg); if (l) { l.hours.start = +v; } },
  hEnd(v, el) { const l = findLine(el.dataset.arg); if (l) { l.hours.end = +v; } },
  night(_, el) { const l = findLine(el.dataset.arg); if (l) { l.night = el.checked; UI.refreshSheet(); } },
  setting(_, el) {
    G.s.settings[el.dataset.arg] = el.checked; Render.dirty = true;
    if (el.dataset.arg === 'realWeather') { if (el.checked) RealWeather.refresh(true); else { G.s.wxReal = null; UI.refreshTop(); } }
  },
  statsAdv(_, el) { G.ui.statsAdv = el.checked; UI.refreshSheet(); },
  unlimited(_, el) { Eco.setUnlimited(el.checked); UI.refreshSheet(); },
};

/* =====================================================================
   ÉCRAN D'ACCUEIL
   ===================================================================== */
const StartScreen = {
  city: null, diff: 'normal', slot: 1, results: [], timer: null, q: '',
  render(view) {
    const box = $('#startBox');
    const last = +localStorage.getItem('corr.last');
    const slots = Save.list();
    if (view === 'home') {
      const lm = last ? slots[last - 1].meta : null;
      box.innerHTML = `<div class="logo"><span class="pict pict-metro">M</span><h1>Correspondance</h1></div>
        <p class="tagline">Bâtissez le réseau de transport de votre ville, sur la vraie carte de France.</p>
        <div class="stack">
          ${lm ? `<button class="btn primary big" data-act="stContinue">Continuer · ${esc(lm.city)}<small>${esc(lm.date)} · ${lm.unlimited ? 'argent illimité' : fmtEur(lm.money)}</small></button>` : ''}
          <button class="btn ${lm ? '' : 'primary'} big" data-act="stNew">Nouvelle partie</button>
          ${slots.some((s) => s.meta) ? '<button class="btn big" data-act="stLoad">Charger une partie</button>' : ''}
        </div>
        <p class="credits">Version ${APP_VERSION} · Photos et données IGN (BD TOPO) · Signalisation © OpenStreetMap · Connexion internet requise</p>`;
    } else if (view === 'new') {
      if (!this.slot || slots[this.slot - 1].meta) { const free = slots.find((s) => !s.meta); this.slot = free ? free.n : this.slot || 1; }
      box.innerHTML = `<div class="plate big">Nouvelle partie</div>
        <label class="lab" for="citySearch">Ville de départ</label>
        <input id="citySearch" class="inp" type="search" placeholder="Ex. Lyon, Nantes, Annecy…" autocomplete="off" data-input="citySearch" value="${esc(this.q)}">
        <div id="cityRes" class="cityres">${this.resHTML()}</div>
        ${this.city ? `<div class="chosen">${icon('ok')} <b>${esc(this.city.nom)}</b> <small>${esc(this.city.codesPostaux?.[0] || this.city.codeDepartement || '')} · ${fmtInt(this.city.population || 0)} hab.</small></div>` : ''}
        <label class="lab">Difficulté</label>
        <div class="seg">${Object.entries(DIFF).map(([k, d]) => `<button class="${this.diff === k ? 'on' : ''}" data-act="stDiff" data-arg="${k}">${d.label}</button>`).join('')}</div>
        <p class="sub">Capital de départ : ${fmtEur(DIFF[this.diff].money)} · coûts ×${DIFF[this.diff].cost.toLocaleString('fr-FR')}</p>
        <label class="lab">Emplacement de sauvegarde</label>
        <div class="seg wrap">${slots.map((s) => `<button class="${this.slot === s.n ? 'on' : ''}" data-act="stSlot" data-arg="${s.n}">${s.n}${s.meta ? ' · ' + esc(s.meta.city) : ' · libre'}</button>`).join('')}</div>
        ${slots[this.slot - 1].meta ? '<p class="note warn">Cet emplacement contient une partie : elle sera remplacée.</p>' : ''}
        <div class="row2"><button class="btn" data-act="stHome">Retour</button><button class="btn primary" data-act="stGo" ${this.city ? '' : 'disabled'}>Démarrer</button></div>`;
      const inp = $('#citySearch');
      if (inp && !this.city) inp.focus();
    } else if (view === 'load') {
      box.innerHTML = `<div class="plate big">Charger une partie</div>
        ${slots.map(({ n, meta }) => `<div class="vrow"><div><b>Emplacement ${n}</b><small>${meta ? esc(meta.city) + ' · ' + esc(meta.date) + ' · ' + (meta.unlimited ? 'illimité' : fmtEur(meta.money)) + ' · ' + meta.lines + ' lignes' : 'vide'}</small></div>${meta ? `<div class="row2 tight"><button class="btn sm primary" data-act="stLoadSlot" data-arg="${n}">Jouer</button><button class="btn sm danger" data-act="stDelSlot" data-arg="${n}">Effacer</button></div>` : ''}</div>`).join('')}
        <button class="btn wide" data-act="stHome">Retour</button>`;
    } else if (view === 'loading') {
      box.innerHTML = `<div class="logo"><span class="pict pict-metro">M</span><h1>Correspondance</h1></div>
        <div class="loadbox"><span class="spin big"></span><p id="loadMsg">${esc(this.loadMsg || 'Chargement…')}</p></div>`;
    }
  },
  resHTML() {
    if (!this.results.length) return this.q.length >= 2 ? '<p class="note">Aucune commune trouvée.</p>' : '';
    return this.results.map((c, i) => `<button class="cityrow ${this.city && this.city.code === c.code ? 'on' : ''}" data-act="stPickCity" data-arg="${i}"><b>${esc(c.nom)}</b><small>${esc(c.codesPostaux?.[0] || '')} · ${fmtInt(c.population || 0)} hab.</small></button>`).join('');
  },
  search(v) {
    this.q = v;
    clearTimeout(this.timer);
    if (v.trim().length < 2) { this.results = []; $('#cityRes').innerHTML = ''; return; }
    this.timer = setTimeout(async () => {
      try {
        this.results = (await API.searchCommunes(v.trim())).filter((c) => c.centre);
        $('#cityRes').innerHTML = this.resHTML();
      } catch (e) { $('#cityRes').innerHTML = '<p class="note bad">Recherche impossible : vérifiez la connexion internet.</p>'; }
    }, 300);
  },
  setMsg(t) { this.loadMsg = t; const el = $('#loadMsg'); if (el) el.textContent = t; },
  go() {
    if (!this.city) return;
    const c = this.city;
    const city = { nom: c.nom, code: c.code, lat: c.centre.coordinates[1], lon: c.centre.coordinates[0] };
    Game.newGame(city, this.diff, this.slot);
  },
};

/* =====================================================================
   PARTIE
   ===================================================================== */
const Game = {
  baseLayers: {},
  initMap() {
    if (G.map) return;
    G.map = L.map('map', { zoomControl: false, zoomSnap: 0.5, zoomDelta: 0.5, maxZoom: 19.5, minZoom: 6, maxBounds: [[40.8, -6.5], [52, 10.5]], maxBoundsViscosity: 0.8, tap: true });
    this.baseLayers.photo = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', { maxNativeZoom: 19, maxZoom: 20, attribution: '© IGN Géoplateforme · © contributeurs OpenStreetMap' });
    this.baseLayers.plan = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', { maxNativeZoom: 18, maxZoom: 20, attribution: '© IGN Géoplateforme · © contributeurs OpenStreetMap' });
    G.map.attributionControl.setPrefix(false);
    G.map.on('click', (e) => this.onTap(e));
    Render.init();
  },
  setBase() {
    const want = G.s.settings.base === 'plan' ? 'plan' : 'photo';
    for (const [k, lay] of Object.entries(this.baseLayers)) {
      if (k === want && !G.map.hasLayer(lay)) lay.addTo(G.map);
      if (k !== want && G.map.hasLayer(lay)) G.map.removeLayer(lay);
    }
  },
  onTap(e) {
    if (!G.ready) return;
    const mx = lonToMx(e.latlng.lng), my = latToMy(e.latlng.lat);
    if (RailBuild.b) { RailBuild.tap(mx, my); return; }
    if (Build.b) { Build.tap(mx, my); return; }
    const h = Render.hit(e.containerPoint.x, e.containerPoint.y);
    if (h && h.type === 'event') { UI.showEvent(h.e); return; }
    if (h && h.type === 'station') { UI.showStation(h.g); return; }
    if (h && h.type === 'poi') { UI.showPoi(h.p); return; }
    if (h && h.type === 'veh') { UI.showVehicle(h.l, h.v); return; }
    if (h && h.type === 'stop') { UI.showStop(h.l, h.k); return; }
    const z = G.w.zoneAt(mx, my);
    if (z) { UI.showZone(z); return; }
    UI.closeCard();
  },

  async newGame(city, diff, slot) {
    StartScreen.render('loading');
    StartScreen.setMsg('Préparation de ' + city.nom + '…');
    G.s = Sim.newState(city, diff, slot);
    G.mpu = mPerUnit(city.lat);
    G.w = new World();
    const [ci, cj] = chunkOf(city.lat, city.lon);
    const chunks = [];
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) chunks.push([ci + di, cj + dj]);
    chunks.sort((a, b) => Math.abs(a[0] - ci) + Math.abs(a[1] - cj) - Math.abs(b[0] - ci) - Math.abs(b[1] - cj));
    StartScreen.setMsg('Chargement des quartiers (IGN)…');
    await Loader.zonesFor(chunks);
    if (!G.w.zones.size) {
      StartScreen.render('new');
      UI.toast('Impossible de charger les quartiers. Vérifiez la connexion et réessayez.', 'bad');
      return;
    }
    // territoire de départ
    const cmx = lonToMx(city.lon), cmy = latToMy(city.lat);
    const center = G.w.zoneAt(cmx, cmy);
    let n = 0;
    for (const z of G.w.zones.values()) if (dist(z.cx, z.cy, cmx, cmy) < 1300) { z.owned = true; n++; }
    if (center) center.owned = true;
    if (!n && !center) {
      let best = null, bd = Infinity;
      for (const z of G.w.zones.values()) { const d = dist(z.cx, z.cy, cmx, cmy); if (d < bd) { bd = d; best = z; } }
      if (best) best.owned = true;
    }
    G.s.zoneMode = G.w.mode;
    Events.log('Bienvenue à ' + city.nom + ' ! Votre compagnie démarre avec ' + [...G.w.zones.values()].filter((z) => z.owned).length + ' zone(s).', 'ok');
    await this.enter(true);
    Save.write(slot);
  },

  async load(n) {
    const data = Save.read(n);
    if (!data) { UI.toast('Sauvegarde introuvable.', 'bad'); return; }
    this.stop();
    $('#start').hidden = false; $('#game').hidden = true;
    StartScreen.render('loading');
    StartScreen.setMsg('Chargement de ' + data.city.nom + '…');
    G.s = Save.hydrate(data);
    G.s.slot = n;
    G.mpu = mPerUnit(G.s.city.lat);
    G.w = new World();
    G.w.mode = G.s.zoneMode || 'iris';
    // zones possédées : on recharge la grille autour d'elles
    const boxes = G.s.ownedBoxes || [];
    const chunks = new Map();
    const add = (c) => chunks.set(c.join(':'), c);
    const [ci, cj] = chunkOf(G.s.city.lat, G.s.city.lon);
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) add([ci + di, cj + dj]);
    for (const b of boxes) for (const c of chunksForMercBox(b, 1)) add(c);
    StartScreen.setMsg('Chargement des quartiers (IGN)…');
    await Loader.zonesFor([...chunks.values()]);
    const own = new Set(G.s.owned);
    for (const z of G.w.zones.values()) if (own.has(z.code)) z.owned = true;
    await this.enter(false);
    if (G.s.settings.realWeather) RealWeather.refresh(true);
    // progression hors-ligne
    if (G.s.realtime) {
      G.speed = 'rt';
      const el = (Date.now() - (G.s.lastReal || Date.now())) / 1000;
      const r = el > 60 ? Sim.offline(el, el / 60) : null;
      RealTime.jump(RealTime.targetSec());
      if (r && r.gameMin >= 30) {
        UI.modal(`<div class="plate big">${icon('sun')} Pendant votre absence</div>
          <p>Le réseau a tourné en temps réel pendant <b>${Math.floor(r.gameMin / 1440)} j ${Math.floor((r.gameMin % 1440) / 60)} h ${Math.round(r.gameMin % 60)} min</b>.</p>
          <p class="big-num ${r.gain < 0 ? 'neg' : 'pos'}">${r.gain >= 0 ? '+' : ''}${fmtEur(r.gain)}</p>
          <button class="btn primary wide" data-act="offlineOk">Reprendre</button>`, { pause: true });
      }
      UI.refreshTop();
    } else if (G.s.settings.idle && G.s.lastReal) {
      const r = Sim.offline((Date.now() - G.s.lastReal) / 1000);
      if (r) {
        UI.modal(`<div class="plate big">${icon('sun')} Pendant votre absence</div>
          <p>Le réseau a continué de tourner pendant <b>${Math.floor(r.gameMin / 1440)} j ${Math.floor((r.gameMin % 1440) / 60)} h</b> de jeu.</p>
          <p class="big-num ${r.gain < 0 ? 'neg' : 'pos'}">${r.gain >= 0 ? '+' : ''}${fmtEur(r.gain)}</p>
          <p class="sub">Calcul basé sur le résultat moyen des 3 derniers jours.</p>
          <button class="btn primary wide" data-act="offlineOk">Reprendre</button>`, { pause: true });
        UI.refreshTop();
      }
    }
  },

  async enter(isNew) {
    UI.showGame();
    this.initMap();
    G.paused = false; G.speed = 1;
    this.setBase();
    const v = G.s.view;
    if (v) G.map.setView([v.lat, v.lng], v.z, { animate: false });
    else G.map.setView([G.s.city.lat, G.s.city.lon], 14.5, { animate: false });
    if (!G.s.rail) G.s.rail = { stations: [], tracks: [] };
    if (G.s.settings.pois === undefined) G.s.settings.pois = true;
    if (G.s.settings.lights === undefined) G.s.settings.lights = true;
    Rail.inject();
    for (const l of G.s.lines) { Lines.prepare(l); Render.lineBox(l); }
    G.ready = true;
    Render.resize(); Render.dirty = true;
    UI.refreshTop(); UI.updateTint(); UI.refreshInfoBadge();
    Traffic.update();
    for (const l of G.s.lines) Sim.lineQuality(l);
    if (isNew) setTimeout(() => UI.toast('Touchez « Construire » pour créer votre première ligne de bus.', 'info'), 1200);
    Loader.ensureAround().then(() => {
      for (const l of G.s.lines) { Lines.resolveEdges(l); if (!l.catchPop) Lines.computeOD(l); Sim.lineQuality(l); }
    });
  },

  stop() { G.ready = false; Build.cancel(); if (RailBuild.b) RailBuild.cancel(); UI.closeCard(); UI.closeModal(); },
};

/* ownedBoxes ajouté à la sauvegarde pour recharger le bon secteur */
const _ser = Save.serialize.bind(Save);
Save.serialize = function () {
  const raw = JSON.parse(_ser());
  raw.ownedBoxes = [...G.w.zones.values()].filter((z) => z.owned).map((z) => z.bbox);
  return JSON.stringify(raw);
};

/* =====================================================================
   BOUCLE PRINCIPALE
   ===================================================================== */
let lastFrame = performance.now(), lastCard = 0, lastAuto = Date.now(), lastTop = 0, lastSync = 0, lastWx = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (G.ready && G.s) {
    if (!G.paused) Sim.advance(G.speed === 'rt' ? dt : dt * 60 * G.speed);
    if (G.speed === 'rt' && !G.paused && now - lastSync > 30000) { lastSync = now; RealTime.sync(); }
    if (now - lastWx > 60000) { lastWx = now; RealWeather.refresh(); }
    Render.tick(now);
    if (now - lastTop > 500) { lastTop = now; UI.refreshTop(); }
    if (now - lastCard > 400) {
      lastCard = now;
      if (G.ui.cardType === 'veh') UI.renderVehCard();
      if (G.ui.follow) {
        const l = G.ui.cardLine, v = G.ui.follow;
        if (l && l.veh.includes(v)) {
          const p = Lines.posOf(l, v);
          const pt = G.map.latLngToContainerPoint([myToLat(p.my), mxToLon(p.mx)]);
          const c = G.map.getSize();
          if (Math.abs(pt.x - c.x / 2) > 40 || Math.abs(pt.y - c.y * 0.4) > 40) G.map.panTo([myToLat(p.my), mxToLon(p.mx)], { animate: true, duration: 0.35 });
        }
      }
    }
    if (Date.now() - lastAuto > 60000) { lastAuto = Date.now(); Save.auto(); }
  }
  requestAnimationFrame(frame);
}

function boot() {
  UI.init();
  UI.showStart();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.ready) Save.auto();
    if (!document.hidden && G.ready && G.speed === 'rt' && !G.paused) RealTime.sync(); // rattrapage au retour dans l'appli
  });
  window.addEventListener('pagehide', () => { if (G.ready) Save.auto(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // mise à jour automatique : on vérifie à chaque ouverture et on recharge quand une nouvelle version prend la main
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      if (G.ready) Save.auto();
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      reg.update().catch(() => { });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => { }); });
    }).catch(() => { });
  }
  requestAnimationFrame(frame);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
