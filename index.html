      ctx.setLineDash([]);
      if (G.ui.selLine === l) { ctx.strokeStyle = 'rgba(35,35,35,.28)'; ctx.lineWidth = lw + 12; ctx.stroke(); }
      ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = lw + 3.5; ctx.stroke();
      if (l.status === 'construction') ctx.setLineDash([lw * 1.6, lw * 1.2]);
      else if (l.mode === 'boat') ctx.setLineDash([lw * 2.4, lw * 0.9]);
      ctx.strokeStyle = l.color; ctx.lineWidth = lw; ctx.globalAlpha = l.active || l.status !== 'active' ? 1 : 0.5; ctx.stroke();
      ctx.globalAlpha = 1;
      if (l.mode === 'ter') { ctx.setLineDash([lw, lw * 1.3]); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = lw * 0.28; ctx.stroke(); }
      ctx.setLineDash([]);
    }

    /* correspondances : liaison piétonne entre les quais de deux lignes */
    this.xpos = [];
    if (z >= 12.5) {
      ctx.lineCap = 'round'; ctx.setLineDash([]);
      for (const h of Transfers.hubs) {
        const [x1, y1] = this.stopXY(h.A, h.ka, o, zf), [x2, y2] = this.stopXY(h.B, h.kb, o, zf);
        if (out(x1, y1, 30) && out(x2, y2, 30)) continue;
        this.xpos.push({ x: (x1 + x2) / 2, y: (y1 + y2) / 2, h });
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = INK; ctx.lineWidth = 9 * zf; ctx.stroke();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4.6 * zf; ctx.stroke();
      }
    }

    /* arrêts + noms */
    const labels = [];
    for (const l of order) {
      if (!inView(l.bbox)) continue;
      const showNames = s.settings.names && ((l.mode === 'metro' || l.mode === 'ter') ? z >= 14 : z >= 16);
      l.stops.forEach((st, k) => {
        const [x, y] = this.stopXY(l, k, o, zf);
        if (out(x, y, 10)) return;
        ctx.setLineDash([]);
        ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = INK;
        if (l.mode === 'metro') {
          ctx.beginPath(); ctx.arc(x, y, 7 * zf, 0, 7); ctx.fill();
          ctx.lineWidth = 3.2 * zf; ctx.stroke();
        } else if (l.mode === 'ter') {
          const r = 6.5 * zf; ctx.beginPath(); ctx.rect(x - r, y - r, 2 * r, 2 * r); ctx.fill();
          ctx.lineWidth = 3 * zf; ctx.stroke();
        } else if (l.mode === 'boat') {
          const r = 8 * zf; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.9, y + r * 0.6); ctx.lineTo(x - r * 0.9, y + r * 0.6); ctx.closePath();
          ctx.fill(); ctx.lineWidth = 2.8 * zf; ctx.lineJoin = 'round'; ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(x, y, 4.6 * zf, 0, 7); ctx.fill();
          ctx.lineWidth = 2.4 * zf; ctx.stroke();
          // arrêt du sens retour, de l'autre côté de la rue
          if (st.bmx !== undefined && dist(st.bmx, st.bmy, st.mx, st.my) > 15) {
            const [bx, by] = this.stopXY(l, k, o, zf, true);
            ctx.beginPath(); ctx.arc(bx, by, 3.4 * zf, 0, 7); ctx.fill();
            ctx.lineWidth = 1.8 * zf; ctx.stroke();
          }
        }
        if (showNames) labels.push({ x, y, t: st.name, pri: l.mode === 'metro' || l.mode === 'ter' ? 0 : 1 });
      });
    }
    /* gares construites (quais orientés) */
    this.stpos = [];
    for (const g of R.stations) {
      const x = X(g.mx), y = Y(g.my);
      if (out(x, y, 20)) continue;
      this.stpos.push({ x, y, g });
      this.platform(ctx, x, y, g.ang, zf, '#FFFFFF');
      if (s.settings.names && z >= 13.5) labels.push({ x, y, t: g.name, pri: 0 });
    }

    /* lieux d'intérêt */
    this.poipos = [];
    if (s.settings.pois !== false && z >= 13.5) {
      const r = z >= 16 ? 10 : z >= 15 ? 9 : 7.5;
      const placed = [];
      const pois = w.pois.filter((p) => !p.own && POI_ICON[p.kind] && (POI_ICON[p.kind].major ? true : z >= 15.5));
      pois.sort((a, b) => (POI_ICON[b.kind].major ? 1 : 0) - (POI_ICON[a.kind].major ? 1 : 0) || b.w - a.w);
      for (const p of pois) {
        const x = X(p.mx), y = Y(p.my);
        if (out(x, y, 5)) continue;
        if (placed.some((q) => (q[0] - x) ** 2 + (q[1] - y) ** 2 < (2 * r + 3) ** 2)) continue;
        placed.push([x, y]);
        this.poipos.push({ x, y, p });
        const ic = POI_ICON[p.kind];
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = POI_CAT[ic.cat]; ctx.fill();
        ctx.lineWidth = 1.6; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
        ctx.save(); ctx.translate(x - r * 0.62, y - r * 0.62); ctx.scale(r * 1.24 / 24, r * 1.24 / 24);
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = ic.w || 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.stroke(poiPath(p.kind)); ctx.restore();
        if (s.settings.names && p.name && (ic.major ? z >= 15.5 : z >= 17)) labels.push({ x: x + r - 6, y, t: p.name, pri: 2 });
      }
    }
    labels.sort((a, b) => a.pri - b.pri);
    ctx.font = '500 12.5px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const boxes = [];
    for (const lb of labels) {
      const tw = ctx.measureText(lb.t).width + 4;
      const bx = lb.x + 11, by = lb.y - 9, bw = tw, bh = 18;
      if (boxes.some((b) => bx < b[0] + b[2] && bx + bw > b[0] && by < b[1] + b[3] && by + bh > b[1])) continue;
      boxes.push([bx, by, bw, bh]);
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 4; ctx.strokeText(lb.t, bx, by + bh / 2 + 0.5);
      ctx.fillStyle = INK; ctx.fillText(lb.t, bx, by + bh / 2 + 0.5);
    }

    /* marqueurs d'événements (touchables) */
    this.evpos = [];
    const showEv = Events.active().concat(Events.upcoming().filter((e) => (e.announce || e.kind === 'big') && e.tone > 0 && e.start - s.min < 720));
    for (const e of showEv) {
      if (e.veh && e.start <= s.min) continue; // dessiné sur le véhicule (calque dynamique)
      const pos = Events.where(e); if (!pos) continue;
      const x = X(pos[0]), y = Y(pos[1]);
      if (out(x, y, 10)) continue;
      this.evpos.push({ x, y, e });
      const col = Events.color(e), up = e.start > s.min;
      ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = col; ctx.setLineDash(up ? [4, 3] : []); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = INK; ctx.font = '700 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Events.glyph(e), x, y + 1);
    }
  },

  lineBox(l) {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const p of l.pathB ? l.path.pts.concat(l.pathB.pts) : l.path.pts) { if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0]; if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1]; }
    l.bbox = { minx, miny, maxx, maxy };
  },

  /* ---------- calque dynamique : véhicules, construction ---------- */
  drawDyn() {
    const tn = performance.now();
    this.fdt = this.lastDyn ? Math.min(0.1, (tn - this.lastDyn) / 1000) : 0.016;
    this.lastDyn = tn;
    const o = this.origin();
    const ctx = this.ctxD, W = this.W, H = this.H, s = G.s, z = o.z;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const X = (mx) => mx * o.k - o.x, Y = (my) => my * o.k - o.y;
    const zf = z >= 17 ? 1.6 : z >= 15.5 ? 1.25 : z >= 13 ? 1 : 0.8;
    /* feux tricolores, stops, cédez-le-passage */
    if (z >= 16 && G.w.signals.length) {
      const tSec = s.sec;
      const ref = { signal: false };
      const r = z >= 17.5 ? 4 : 3;
      for (const sg of G.w.signals) {
        const x = X(sg.mx), y = Y(sg.my);
        if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
        if (sg.t === 'sig') {
          const green = Sim.ctlWait(ref, { t: 'sig', sg }, tSec) === 0;
          ctx.beginPath(); ctx.arc(x, y, r + 1.6, 0, 7); ctx.fillStyle = INK; ctx.fill();
          ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = green ? '#58B368' : '#E2563F'; ctx.fill();
        } else if (z >= 17) {
          if (sg.t === 'stop') {
            ctx.beginPath();
            for (let k = 0; k < 8; k++) { const a = Math.PI / 8 + k * Math.PI / 4; ctx.lineTo(x + 5 * Math.cos(a), y + 5 * Math.sin(a)); }
            ctx.closePath(); ctx.fillStyle = '#E3051C'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(x - 5, y - 4); ctx.lineTo(x + 5, y - 4); ctx.lineTo(x, y + 5); ctx.closePath();
            ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#E3051C'; ctx.stroke();
          }
        }
      }
    }
    this.vpos = []; this.evposD = [];
    for (const l of s.lines) {
      if (!l.active) continue;
      if (l.mode === 'bus' && z < 11.5) continue;
      for (const v of l.veh) {
        if (v.hidden) continue;
        const md = MODEL[v.model];
        const p = Lines.posOf(l, v, (md.len || 12) / 2);
        let x = X(p.mx), y = Y(p.my);
        const PO = l.P[p.dir] && l.P[p.dir].off;
        if (PO) {
          const i = p.seg, j = Math.min(PO.length / 2 - 1, i + 1), t = p.t || 0, zl = this.lineZf(z);
          x += (PO[2 * i] * (1 - t) + PO[2 * j] * t) * zl; y += (PO[2 * i + 1] * (1 - t) + PO[2 * j + 1] * t) * zl;
        }
        if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
        // rotation lissée : la corde suit déjà les virages ; les demi-tours au terminus sont animés
        if (v.angD === undefined) v.angD = p.ang;
        let da = p.ang - v.angD; da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) > 1.0) {
          const rate = 7 * Math.max(1, (G.speed === 'rt' ? 1 : 60 * G.speed) / 15) * this.fdt;
          v.angD += clamp(da, -rate, rate);
        } else v.angD += da * Math.min(1, this.fdt / 0.08); // lissage léger, sans retard visible
        p.ang = v.angD;
        const cap = md.cap, f = v.load / cap;
        this.vpos.push({ x, y, l, v });
        const dims = { bus: [13, 7], metro: [19, 8.5], ter: [22, 8.5], boat: [15, 8.5] }[l.mode];
        const L2 = dims[0] * zf / 2, W2 = dims[1] * zf / 2;
        const nl = this.nf > 0.15 && Night.lightsOn() ? clamp((this.nf - 0.15) / 0.45, 0, 1) : 0;
        if (nl > 0) Night.vehicle(ctx, l, x, y, p.ang, L2, W2, zf, nl);
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.ang || 0);
        this.rr(ctx, -L2, -W2, 2 * L2, 2 * W2, l.mode === 'boat' ? W2 : Math.min(3, W2));
        ctx.fillStyle = l.color; ctx.fill();
        ctx.lineWidth = f >= 0.9 && s.settings.fill ? 2.4 : 1.4; ctx.strokeStyle = f >= 0.9 && s.settings.fill ? '#D9433A' : '#FFFFFF'; ctx.stroke();
        if (s.settings.fill && zf >= 0.8) {
          // voyageurs à bord, en petits points blancs (6 = complet)
          const nd = v.load > 0.5 ? Math.max(1, Math.round(Math.min(1, f) * 6)) : 0;
          const dr = Math.max(1, W2 * 0.3), sx = (2 * L2) / 4;
          ctx.fillStyle = inkOn(l.color);
          for (let k = 0; k < nd; k++) {
            const cx = -L2 + sx * (1 + (k % 3)), cy = k < 3 ? -W2 * 0.42 : W2 * 0.42;
            ctx.beginPath(); ctx.arc(cx, cy, dr, 0, 7); ctx.fill();
          }
        }
        ctx.restore();
        if (v.incUntil > s.sec && v.incEv) {
          // incident en cours sur ce véhicule : pastille touchable
          const e = s.events.find((x) => x.id === v.incEv);
          if (e) {
            const bx = x + L2 + 6, by = y - L2 - 6, br = 9;
            ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
            ctx.lineWidth = 2.6; ctx.strokeStyle = Events.color(e); ctx.stroke();
            ctx.fillStyle = INK; ctx.font = '700 11px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(Events.glyph(e), bx, by + 0.5);
            this.evposD.push({ x: bx, y: by, e });
          }
        }
        if (G.ui.selVeh === v) {
          ctx.beginPath(); ctx.arc(x, y, L2 + 7, 0, 7); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
        }
      }
    }
    /* aperçu : gare ou voie ferrée */
    const rb = RailBuild.b;
    if (rb && rb.kind === 'gare' && rb.pos) {
      this.platform(ctx, X(rb.pos[0]), Y(rb.pos[1]), rb.ang, Math.max(1.2, zf), '#F2B705');
      const L = 34;
      ctx.save(); ctx.translate(X(rb.pos[0]), Y(rb.pos[1])); ctx.rotate(rb.ang);
      ctx.setLineDash([5, 5]); ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-L - 30, 0); ctx.lineTo(-L + 10, 0); ctx.moveTo(L - 10, 0); ctx.lineTo(L + 30, 0); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }
    if (rb && rb.kind === 'track') {
      if (rb.pts) {
        ctx.beginPath();
        rb.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 8; ctx.stroke();
        ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.setLineDash([10, 6]); ctx.stroke(); ctx.setLineDash([]);
      }
      rb.ctrl.forEach((p, i) => {
        const x = X(p[0]), y = Y(p[1]);
        const anchored = (i === 0 && rb.a) || (i === rb.ctrl.length - 1 && i > 0 && rb.end);
        ctx.beginPath(); ctx.arc(x, y, anchored ? 9 : 7, 0, 7); ctx.fillStyle = anchored ? '#F2B705' : '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
      });
    }

    /* aperçu de construction */
    const b = Build.b;
    if (b) {
      const col = Build.color();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const sg of b.segs) {
        ctx.beginPath();
        sg.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 9; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 5.5; ctx.setLineDash([10, 6]); ctx.stroke(); ctx.setLineDash([]);
      }
      b.stops.forEach((st, i) => {
        const x = X(st.mx), y = Y(st.my);
        if (b.edit && b.sel === i) { ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fillStyle = 'rgba(242,183,5,.55)'; ctx.fill(); }
        const isNew = b.edit && !b.orig.has(Math.round(st.mx * G.mpu) + ',' + Math.round(st.my * G.mpu));
        ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fillStyle = isNew ? '#F2B705' : '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        ctx.fillStyle = INK; ctx.font = '600 11px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x, y + 0.5);
      });
    }
  },

  /** quai de gare : rectangle orienté */
  platform(ctx, x, y, ang, zf, fill) {
    const L = 15 * zf, Wd = 5.5 * zf;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
    this.rr(ctx, -L, -Wd, 2 * L, 2 * Wd, 2.5);
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-L + 4, 0); ctx.lineTo(L - 4, 0); ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  },

  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },

  /** élément touché sur la carte */
  hit(px, py) {
    for (const it of (this.evposD || []).concat(this.evpos || [])) if ((it.x - px) ** 2 + (it.y - py) ** 2 < 22 * 22) return { type: 'event', e: it.e };
    let best = null, bd = 24 * 24;
    for (const it of this.vpos || []) { const d = (it.x - px) ** 2 + (it.y - py) ** 2; if (d < bd) { bd = d; best = { type: 'veh', ...it }; } }
    if (best) return best;
    const o = this.origin();
    bd = 20 * 20;
    for (const l of G.s.lines) l.stops.forEach((st, k) => {
      const x = st.mx * o.k - o.x, y = st.my * o.k - o.y;
      const d = (x - px) ** 2 + (y - py) ** 2;
      if (d < bd) { bd = d; best = { type: 'stop', l, k, st }; }
    });
    if (best) return best;
    for (const it of this.stpos || []) if ((it.x - px) ** 2 + (it.y - py) ** 2 < 20 * 20) return { type: 'station', g: it.g };
    for (const it of this.xpos || []) if ((it.x - px) ** 2 + (it.y - py) ** 2 < 14 * 14) return { type: 'stop', l: it.h.A, k: it.h.ka, st: it.h.A.stops[it.h.ka] };
    let bp = null, bpd = 16 * 16;
    for (const it of this.poipos || []) { const d = (it.x - px) ** 2 + (it.y - py) ** 2; if (d < bpd) { bpd = d; bp = { type: 'poi', p: it.p }; } }
    return bp;
  },
};

'use strict';
/* =====================================================================
   CORRESPONDANCE — plan schématique du réseau (sans carte, façon plan de métro)
   Disposition : positions réelles, puis relaxation vers des tronçons à 0/45/90°
   et des interstations régulières ; export en image PNG à partager.
   ===================================================================== */

const Plan = {
  filter: 'all', layout: null,

  open() {
    if (!G.s.lines.length) { UI.toast('Construisez d’abord une ligne pour voir le plan du réseau.', 'info'); return; }
    UI.close(); UI.closeCard();
    let el = document.getElementById('plan');
    if (!el) {
      el = document.createElement('div'); el.id = 'plan';
      el.innerHTML = `<div class="plan-h"><button class="icon-b" data-act="planClose" aria-label="Fermer">${icon('close')}</button><b>Plan du réseau</b><button class="btn sm primary" data-act="planShare">Partager l’image</button></div>
        <div class="seg plan-f" id="planFilter"></div><div class="plan-c"><canvas id="planCv"></canvas></div>`;
      document.getElementById('game').appendChild(el);
      window.addEventListener('resize', () => { if (!el.hidden) this.draw(); });
    }
    el.hidden = false;
    this.layout = null;
    this.refresh();
  },
  close() { const el = document.getElementById('plan'); if (el) el.hidden = true; },
  setFilter(f) { this.filter = f; this.layout = null; this.refresh(); },
  modesFor(f) { return f === 'rail' ? ['metro', 'ter'] : f === 'bus' ? ['bus'] : MODE_ORDER; },
  refresh() {
    const has = (ms) => G.s.lines.some((l) => ms.includes(l.mode));
    const opts = [['all', 'Tout le réseau']];
    if (has(['metro', 'ter']) && has(['bus', 'boat'])) opts.push(['rail', 'Métro et TER']);
    if (has(['bus']) && has(['metro', 'ter', 'boat'])) opts.push(['bus', 'Bus']);
    if (!opts.some((o) => o[0] === this.filter)) this.filter = 'all';
    const fe = document.getElementById('planFilter');
    fe.hidden = opts.length < 2;
    fe.innerHTML = opts.map(([k, t]) => `<button class="${this.filter === k ? 'on' : ''}" data-act="planFilter" data-arg="${k}">${t}</button>`).join('');
    this.draw();
  },

  /* ---------- graphe : stations regroupées (arrêts proches et correspondances) ---------- */
  build(modes) {
    const lines = G.s.lines.filter((l) => modes.includes(l.mode)).sort((a, b) => MODE_ORDER.indexOf(a.mode) - MODE_ORDER.indexOf(b.mode) || a.num - b.num);
    const stops = [];
    lines.forEach((l) => l.stops.forEach((st, k) => stops.push({ l, k, st })));
    const par = stops.map((_, i) => i);
    const find = (i) => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
    const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[b] = a; };
    const idx = new Map(); stops.forEach((s, i) => idx.set(s.l.id + ':' + s.k, i));
    for (let i = 0; i < stops.length; i++) for (let j = i + 1; j < stops.length; j++) {
      if (stops[i].l === stops[j].l) continue;
      if (dist(stops[i].st.mx, stops[i].st.my, stops[j].st.mx, stops[j].st.my) < 120) uni(i, j);
    }
    for (const h of Transfers.hubs) {
      const a = idx.get(h.A.id + ':' + h.ka), b = idx.get(h.B.id + ':' + h.kb);
      if (a !== undefined && b !== undefined) uni(a, b);
    }
    const nodes = new Map();
    stops.forEach((s, i) => {
      const r = find(i);
      let n = nodes.get(r);
      if (!n) { n = { id: nodes.size, mx: 0, my: 0, cnt: 0, names: [], lines: new Set() }; nodes.set(r, n); }
      n.mx += s.st.mx; n.my += s.st.my; n.cnt++; n.lines.add(s.l.id);
      n.names.push({ t: s.st.name, pri: MODE_ORDER.indexOf(s.l.mode) === 1 || s.l.mode === 'ter' ? 0 : 1 });
      s.node = n;
    });
    const N = [...nodes.values()];
    for (const n of N) {
      n.mx /= n.cnt; n.my /= n.cnt;
      n.names.sort((a, b) => a.pri - b.pri);
      n.base = n.names[0].t.replace(/ (II|III|IV|V|VI|\d+)$/, '');
    }
    // nom simplifié (« Gare II » → « Gare ») seulement s'il reste unique sur le plan
    const cnt = new Map();
    for (const n of N) cnt.set(n.base, (cnt.get(n.base) || 0) + 1);
    for (const n of N) n.name = cnt.get(n.base) > 1 ? n.names[0].t : n.base;
    const seqs = lines.map((l) => {
      const seq = [];
      for (const s of stops) if (s.l === l && seq[seq.length - 1] !== s.node.id) seq.push(s.node.id);
      if (l.loop && seq.length > 2 && seq[0] === seq[seq.length - 1]) seq.pop();
      return { l, seq };
    });
    const ekeys = new Set(), edges = [];
    for (const { l, seq } of seqs) {
      const m = seq.length;
      for (let i = 0; i < m - 1 + (l.loop && m > 2 ? 1 : 0); i++) {
        const a = seq[i], b = seq[(i + 1) % m]; if (a === b) continue;
        const k = Math.min(a, b) + ':' + Math.max(a, b);
        if (!ekeys.has(k)) { ekeys.add(k); edges.push([Math.min(a, b), Math.max(a, b)]); }
      }
    }
    return { lines, nodes: N, seqs, edges };
  },

  /* ---------- disposition octolinéaire ---------- */
  relax(g) {
    const N = g.nodes, E = g.edges;
    if (!N.length) return;
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const n of N) { minx = Math.min(minx, n.mx); maxx = Math.max(maxx, n.mx); miny = Math.min(miny, n.my); maxy = Math.max(maxy, n.my); }
    const sc = 1 / Math.max(1e-12, maxx - minx, maxy - miny);
    for (const n of N) { n.gx = (n.mx - minx) * sc; n.gy = (n.my - miny) * sc; n.x = n.gx; n.y = n.gy; }
    const lens = E.map(([a, b]) => Math.hypot(N[a].x - N[b].x, N[a].y - N[b].y)).sort((p, q) => p - q);
    const Lt = Math.max(1e-4, lens.length ? lens[Math.floor(lens.length / 2)] : 0.1);
    const triples = [];
    for (const { l, seq } of g.seqs) {
      const m = seq.length;
      for (let i = 1; i < m - 1; i++) triples.push([seq[i - 1], seq[i], seq[i + 1]]);
      if (l.loop && m > 3) { triples.push([seq[m - 2], seq[m - 1], seq[0]]); triples.push([seq[m - 1], seq[0], seq[1]]); }
    }
    const A8 = Math.PI / 4;
    for (let it = 0; it < 420; it++) {
      const k = it < 300 ? 0.35 : 0.5;
      for (const [a, b] of E) {
        const p = N[a], q = N[b];
        const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1e-9;
        const ang = Math.round(Math.atan2(dy, dx) / A8) * A8;
        const L = lerp(len, Lt, 0.45);
        const cx = (Math.cos(ang) * L - dx) * k * 0.5, cy = (Math.sin(ang) * L - dy) * k * 0.5;
        p.x -= cx; p.y -= cy; q.x += cx; q.y += cy;
      }
      // les lignes cherchent à rester droites aux stations de passage
      for (const [a, b, c] of triples) {
        const p = N[a], q = N[b], r = N[c];
        q.x += ((p.x + r.x) / 2 - q.x) * 0.04; q.y += ((p.y + r.y) / 2 - q.y) * 0.04;
      }
      // les stations ne se superposent pas
      const R = Lt * 0.85;
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
        const p = N[i], q = N[j];
        const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
        if (d < R) {
          const f = (R - Math.max(d, 1e-6)) / Math.max(d, 1e-6) * 0.25;
          const ux = d > 1e-6 ? dx : (i % 2 ? 1 : -1) * 1e-3, uy = d > 1e-6 ? dy : 1e-3;
          p.x -= ux * f; p.y -= uy * f; q.x += ux * f; q.y += uy * f;
        }
      }
      // fidélité à la géographie
      const ga = it < 300 ? 0.02 : 0.005;
      for (const n of N) { n.x += (n.gx - n.x) * ga; n.y += (n.gy - n.y) * ga; }
    }
    this.Lt = Lt;
    this.snap(g, Lt / 4);
  },

  /** accrochage sur une grille puis petites retouches : tronçons exactement à 0, 45 ou 90° */
  snap(g, gs) {
    const N = g.nodes, E = g.edges;
    const adj = N.map(() => []);
    for (const [a, b] of E) { adj[a].push(b); adj[b].push(a); }
    const occ = new Map(), key = (x, y) => x + ',' + y;
    const order = N.map((n, i) => i).sort((a, b) => adj[b].length - adj[a].length);
    for (const i of order) {
      const n = N[i], cx = Math.round(n.x / gs), cy = Math.round(n.y / gs);
      let done = false;
      for (let r = 0; r < 8 && !done; r++) for (let dx = -r; dx <= r && !done; dx++) for (let dy = -r; dy <= r && !done; dy++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r || occ.has(key(cx + dx, cy + dy))) continue;
        n.cx = cx + dx; n.cy = cy + dy; occ.set(key(n.cx, n.cy), i); done = true;
      }
    }
    const octo = (a, b) => { const dx = Math.abs(N[a].cx - N[b].cx), dy = Math.abs(N[a].cy - N[b].cy); return dx === 0 || dy === 0 || dx === dy; };
    const bad = (i, x, y) => {
      let c = 0;
      for (const j of adj[i]) {
        const dx = Math.abs(x - N[j].cx), dy = Math.abs(y - N[j].cy);
        if (dx === 0 && dy === 0) return 99;
        if (!(dx === 0 || dy === 0 || dx === dy)) c++;
        if (Math.max(dx, dy) < 2) c += 0.5; // tronçon trop court pour être lisible
      }
      return c;
    };
    for (let pass = 0; pass < 4; pass++) {
      let moved = 0;
      for (const i of [...order].reverse()) {
        const n = N[i];
        if (adj[i].every((j) => octo(i, j))) continue;
        let best = bad(i, n.cx, n.cy), bx = n.cx, by = n.cy;
        for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) {
          if (!dx && !dy) continue;
          const x = n.cx + dx, y = n.cy + dy;
          if (occ.has(key(x, y))) continue;
          const c = bad(i, x, y) + (Math.abs(dx) + Math.abs(dy)) * 0.05;
          if (c < best - 1e-9) { best = c; bx = x; by = y; }
        }
        if (bx !== n.cx || by !== n.cy) { occ.delete(key(n.cx, n.cy)); n.cx = bx; n.cy = by; occ.set(key(bx, by), i); moved++; }
      }
      if (!moved) break;
    }
    for (const n of N) { n.x = n.cx * gs; n.y = n.cy * gs; }
  },

  /** tracé d'un tronçon entre deux stations : droit si déjà à 0/45/90°, sinon un coude arrondi */
  edgePts(p, q) {
    const dx = q[0] - p[0], dy = q[1] - p[1], ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < 1e-9 && ay < 1e-9) return [p, q];
    const ang = Math.atan2(dy, dx), A8 = Math.PI / 4;
    if (Math.abs(ang - Math.round(ang / A8) * A8) < 0.03) return [p, q];
    const c = this.corner(p, q);
    return c.length ? [p, ...c, q] : [p, q];
  },
  corner(p, q) {
    const dx = q[0] - p[0], dy = q[1] - p[1], ax = Math.abs(dx), ay = Math.abs(dy);
    const sx = Math.sign(dx) || 1, sy = Math.sign(dy) || 1;
    const c = ax > ay ? [p[0] + sx * (ax - ay), p[1]] : [p[0], p[1] + sy * (ay - ax)];
    const l1 = Math.hypot(c[0] - p[0], c[1] - p[1]), l2 = Math.hypot(q[0] - c[0], q[1] - c[1]);
    if (l1 < 1e-6 || l2 < 1e-6) return [];
    const r = Math.min(l1, l2) * 0.45;
    const p1 = [c[0] - (c[0] - p[0]) / l1 * r, c[1] - (c[1] - p[1]) / l1 * r];
    const p2 = [c[0] + (q[0] - c[0]) / l2 * r, c[1] + (q[1] - c[1]) / l2 * r];
    const out = [p1];
    for (let k = 1; k < 4; k++) { const t = k / 4, u = 1 - t; out.push([u * u * p1[0] + 2 * u * t * c[0] + t * t * p2[0], u * u * p1[1] + 2 * u * t * c[1] + t * t * p2[1]]); }
    out.push(p2);
    return out;
  },

  /* ---------- dessin ---------- */
  draw() {
    const cv = document.getElementById('planCv'); if (!cv) return;
    const box = cv.parentElement, W = box.clientWidth, H = box.clientHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.render(ctx, W, H, Math.min(1.15, Math.max(0.8, W / 420)), false);
  },
  ensureLayout() {
    if (this.layout) return this.layout;
    const g = this.build(this.modesFor(this.filter));
    this.relax(g);
    this.layout = g;
    return g;
  },
  /** dessine le plan dans un rectangle W×H (s : échelle des traits et textes) */
  render(ctx, W, H, s, forImage) {
    const g = this.ensureLayout(), N = g.nodes;
    ctx.fillStyle = '#F4F2EC'; ctx.fillRect(0, 0, W, H);
    // en-tête et légende (dans l'image seulement : à l'écran, la barre du haut suffit)
    let top = 16 * s, bottom = 16 * s;
    const legend = g.lines.map((l) => ({ l, t: l.name }));
    const legRows = [];
    ctx.font = `500 ${12.5 * s}px ${FONT}`;
    {
      let row = [], x = 0; const maxW = W - 32 * s;
      for (const it of legend) {
        const w = 34 * s + Math.min(ctx.measureText(it.t).width, 230 * s) + 18 * s;
        if (x + w > maxW && row.length) { legRows.push(row); row = []; x = 0; }
        row.push({ ...it, w }); x += w;
      }
      if (row.length) legRows.push(row);
    }
    if (forImage) top = 78 * s;
    bottom = legRows.length * 26 * s + 22 * s + (forImage ? 18 * s : 0);
    // mise à l'échelle de la disposition
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const n of N) { minx = Math.min(minx, n.x); maxx = Math.max(maxx, n.x); miny = Math.min(miny, n.y); maxy = Math.max(maxy, n.y); }
    const padX = 70 * s, padY = 34 * s;
    const aw = W - 2 * padX, ah = H - top - bottom - 2 * padY;
    const k = Math.min(aw / Math.max(1e-9, maxx - minx), ah / Math.max(1e-9, maxy - miny));
    const ox = padX + (aw - (maxx - minx) * k) / 2 - minx * k, oy = top + padY + (ah - (maxy - miny) * k) / 2 - miny * k;
    const P = (n) => [Math.round((n.x * k + ox) * 2) / 2, Math.round((n.y * k + oy) * 2) / 2];
    // polylignes des lignes (coudes identiques pour les lignes qui partagent un tronçon)
    const LW = { metro: 7, ter: 6, bus: 4.5, boat: 4.5 };
    const items = [];
    for (const { l, seq } of g.seqs) {
      const m = seq.length; if (m < 2) continue;
      const pts = [P(N[seq[0]])];
      const cnt = m - 1 + (l.loop && m > 2 ? 1 : 0);
      for (let i = 0; i < cnt; i++) {
        const a = seq[i], b = seq[(i + 1) % m];
        const pa = P(N[a]), pb = P(N[b]);
        let mid = a < b ? this.edgePts(pa, pb).slice(1, -1) : this.edgePts(pb, pa).slice(1, -1).reverse();
        for (const p of mid) pts.push(p);
        pts.push(pb);
      }
      items.push({ pts, g: l.id, w: LW[l.mode] * s, ord: MODE_ORDER.indexOf(l.mode) * 1e5 + l.num, l });
    }
    bundleOffsets(items, (p) => Math.round(p[0] * 4) + ',' + Math.round(p[1] * 4), 1.6 * s);
    const opts = (it) => it.pts.map((p, i) => it.off ? [p[0] + it.off[2 * i], p[1] + it.off[2 * i + 1]] : p);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const it of items) {
      const q = opts(it); it.q = q;
      ctx.beginPath(); q.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      if (it.l.loop) ctx.closePath();
      ctx.setLineDash([]); ctx.strokeStyle = '#F4F2EC'; ctx.lineWidth = it.w + 3 * s; ctx.stroke();
      if (it.l.mode === 'boat') ctx.setLineDash([it.w * 2.2, it.w * 1]);
      ctx.strokeStyle = it.l.color; ctx.lineWidth = it.w; ctx.stroke();
      if (it.l.mode === 'ter') { ctx.setLineDash([it.w, it.w * 1.3]); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = it.w * 0.3; ctx.stroke(); }
      ctx.setLineDash([]);
    }
    // stations
    const boxes = [];
    const segsAll = items.map((it) => it.q);
    for (const n of N) {
      const [x, y] = P(n), multi = n.lines.size > 1;
      // largeur du faisceau à cet endroit
      let half = 0;
      for (const it of items) {
        if (!it.off) continue;
        it.pts.forEach((p, i) => { if (Math.abs(p[0] - x) < 0.6 && Math.abs(p[1] - y) < 0.6) half = Math.max(half, Math.hypot(it.off[2 * i], it.off[2 * i + 1]) + it.w / 2); });
      }
      const r = multi ? Math.max(7 * s, half + 3.5 * s) : 5 * s;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.lineWidth = (multi ? 3 : 2.4) * s; ctx.strokeStyle = INK; ctx.stroke();
      n.px = x; n.py = y; n.r = r;
      boxes.push([x - r, y - r, 2 * r, 2 * r]);
    }
    // noms : position libre autour de la station, sans chevauchement
    const fs = 12 * s;
    ctx.font = `500 ${fs}px ${FONT}`; ctx.textBaseline = 'middle';
    const hitSeg = (bx) => {
      for (const q of segsAll) for (let i = 0; i < q.length - 1; i++) {
        const [x1, y1] = q[i], [x2, y2] = q[i + 1];
        for (let t = 0; t <= 1; t += 0.25) { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; if (x > bx[0] && x < bx[0] + bx[2] && y > bx[1] && y < bx[1] + bx[3]) return true; }
      }
      return false;
    };
    const order = [...N].sort((a, b) => b.lines.size - a.lines.size);
    for (const n of order) {
      const t = n.name, tw = ctx.measureText(t).width, th = fs * 1.25, gap = n.r + 4 * s;
      const cand = [[gap, -th / 2, 'left'], [-gap - tw, -th / 2, 'left'], [-tw / 2, -gap - th, 'left'], [-tw / 2, gap, 'left'],
        [gap * 0.75, -gap * 0.75 - th, 'left'], [gap * 0.75, gap * 0.75, 'left'], [-gap * 0.75 - tw, -gap * 0.75 - th, 'left'], [-gap * 0.75 - tw, gap * 0.75, 'left']];
      let pick = null;
      for (const [dx, dy] of cand) {
        const bx = [n.px + dx - 2, n.py + dy, tw + 4, th];
        if (bx[0] < 2 || bx[0] + bx[2] > W - 2 || bx[1] < top - 10 * s || bx[1] + bx[3] > H - bottom + 6 * s) continue;
        if (boxes.some((b) => bx[0] < b[0] + b[2] && bx[0] + bx[2] > b[0] && bx[1] < b[1] + b[3] && bx[1] + bx[3] > b[1])) continue;
        if (hitSeg(bx)) continue;
        pick = bx; break;
      }
      if (!pick) {
        // dernier recours : on accepte de croiser une ligne, pas un autre nom
        for (const [dx, dy] of cand) {
          const bx = [n.px + dx - 2, n.py + dy, tw + 4, th];
          if (bx[0] < 2 || bx[0] + bx[2] > W - 2) continue;
          if (boxes.some((b) => bx[0] < b[0] + b[2] && bx[0] + bx[2] > b[0] && bx[1] < b[1] + b[3] && bx[1] + bx[3] > b[1])) continue;
          pick = bx; break;
        }
      }
      if (!pick) continue;
      boxes.push(pick);
      ctx.textAlign = 'left';
      ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(244,242,236,.95)'; ctx.lineWidth = 4 * s;
      ctx.font = `${n.lines.size > 1 ? 600 : 500} ${fs}px ${FONT}`;
      ctx.strokeText(t, pick[0] + 2, pick[1] + th / 2 + 0.5);
      ctx.fillStyle = INK; ctx.fillText(t, pick[0] + 2, pick[1] + th / 2 + 0.5);
    }
    // en-tête (image)
    if (forImage) {
      ctx.textAlign = 'left'; ctx.fillStyle = INK;
      ctx.font = `600 ${30 * s}px ${FONT}`; ctx.fillText(G.s.city.nom, 24 * s, 34 * s);
      ctx.font = `400 ${15 * s}px ${FONT}`; ctx.fillStyle = '#5b5b5b';
      const nb = g.lines.length;
      ctx.fillText('Plan du réseau · ' + nb + ' ligne' + (nb > 1 ? 's' : '') + ' · ' + N.length + ' stations · ' + Time.label(G.s.min).day, 24 * s, 60 * s);
    }
    // légende
    let ly = H - bottom + 16 * s;
    ctx.strokeStyle = 'rgba(35,35,35,.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(16 * s, ly - 6 * s); ctx.lineTo(W - 16 * s, ly - 6 * s); ctx.stroke();
    for (const row of legRows) {
      let x = 16 * s; const y = ly + 10 * s;
      for (const it of row) {
        const l = it.l, lab = Lines.label(l);
        ctx.font = `600 ${11.5 * s}px ${FONT}`;
        const bw = Math.max(24 * s, ctx.measureText(lab).width + 12 * s);
        Render.rr(ctx, x, y - 10 * s, bw, 20 * s, l.mode === 'metro' ? 10 * s : 4 * s);
        ctx.fillStyle = l.color; ctx.fill();
        ctx.fillStyle = inkOn(l.color); ctx.textAlign = 'center'; ctx.fillText(lab, x + bw / 2, y + 0.5);
        ctx.textAlign = 'left'; ctx.fillStyle = INK; ctx.font = `500 ${12.5 * s}px ${FONT}`;
        let t = it.t; while (ctx.measureText(t).width > 230 * s && t.length > 4) t = t.slice(0, -2);
        if (t !== it.t) t += '…';
        ctx.fillText(t, x + bw + 6 * s, y + 0.5);
        x += it.w;
      }
      ly += 26 * s;
    }
    if (forImage) {
      ctx.font = `400 ${11 * s}px ${FONT}`; ctx.fillStyle = '#8a8a8a'; ctx.textAlign = 'right';
      ctx.fillText('Correspondance', W - 16 * s, H - 12 * s);
    }
  },

  /** image haute définition : partage (Android) ou téléchargement */
  async share() {
    const g = this.ensureLayout();
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const n of g.nodes) { minx = Math.min(minx, n.x); maxx = Math.max(maxx, n.x); miny = Math.min(miny, n.y); maxy = Math.max(maxy, n.y); }
    const ar = clamp((maxy - miny) / Math.max(1e-9, maxx - minx), 0.55, 1.6);
    const s = 2, W = 1800, H = Math.round(W * ar * 0.92 + 200 * s + Math.ceil(g.lines.length / 3) * 26 * s);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    this.render(cv.getContext('2d'), W, H, s, true);
    const name = 'plan-' + (G.s.city.nom || 'reseau').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-') + '.png';
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    if (!blob) { UI.toast('Image impossible à générer.', 'bad'); return; }
    const file = new File([blob], name, { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Plan du réseau · ' + G.s.city.nom });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    UI.toast('Image du plan enregistrée dans vos téléchargements.', 'ok');
  },
};

const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ''}</svg>`;
const pict = (mode) => `<span class="pict pict-${mode}" aria-label="${MODES[mode].label}">${mode === 'metro' ? 'M' : mode === 'bus' ? 'BUS' : mode === 'ter' ? 'TER' : '≈'}</span>`;
const badge = (l) => `<span class="lbadge lb-${l.mode}" style="background:${l.color};color:${inkOn(l.color)}">${esc(l.mode === 'ter' ? l.num : l.mode === 'boat' ? 'N' + l.num : l.num)}</span>`;
const badgeFull = (l) => `${pict(l.mode)}${badge(l)}`;

const $ = (sel) => document.querySelector(sel);

/* =====================================================================
   UI
   ===================================================================== */
const UI = {
  init() {
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#speedMenu, #btnSpeed')) { const sm = $('#speedMenu'); if (sm && !sm.hidden) sm.hidden = true; }
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const fn = ACT[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el.dataset.arg, el, e); }
    });
    document.addEventListener('input', (e) => {
      const el = e.target.closest('[data-input]');
      if (el && INP[el.dataset.input]) INP[el.dataset.input](el.value, el);
    });
    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-change]');
      if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el.value, el);
    });
    $('#btnMenu').innerHTML = icon('menu');
    $('#nav').innerHTML = [
      ['lines', 'net', 'Réseau'], ['build', 'plus', 'Construire'], ['zones', 'zones', 'Zones'],
      ['finance', 'euro', 'Finances'], ['stats', 'chart', 'Stats'], ['infos', 'info', 'Infos'],
    ].map(([k, ic, t]) => `<button class="nav-b ${k === 'build' ? 'nav-build' : ''}" data-act="nav" data-arg="${k}" id="nav-${k}">${icon(ic)}<span>${t}</span>${k === 'infos' ? '<i class="dot" id="infoDot" hidden></i>' : ''}</button>`).join('');
    Loader.listeners.push((msg) => {
      const c = $('#chip');
      if (msg || Loader.busy > 0) { c.hidden = false; c.innerHTML = '<span class="spin"></span>' + esc(msg || 'Chargement…'); }
      else c.hidden = true;
    });
  },

  /* ---- barre du haut ---- */
  refreshTop() {
    if (!G.s) return;
    const s = G.s;
    const t = Time.label(s.min);
    const prof = s.days[0] ? Eco.dayProfit(s.days[0]) : null;
    $('#cash').innerHTML = s.unlimited ? `<b>∞ Illimité</b><small>sans limite</small>`
      : `<b class="${s.money < 0 ? 'neg' : ''}">${fmtEur(s.money)}</b><small>${prof === null ? 'trésorerie' : (prof >= 0 ? '+' : '') + fmtEur(prof) + ' hier'}</small>`;
    const mod = Time.mod(s.min), ah = ((mod / 60) % 12) * 30, am = (mod % 60) * 6;
    const night = Time.night(s.min);
    $('#clock').innerHTML = `<svg class="dial" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="${night ? '#232323' : '#fff'}" stroke="#232323" stroke-width="2.5"/>${[0, 90, 180, 270].map((a) => `<line x1="17" y1="4.5" x2="17" y2="7" stroke="${night ? '#fff' : '#232323'}" stroke-width="2" stroke-linecap="round" transform="rotate(${a} 17 17)"/>`).join('')}<line x1="17" y1="17" x2="17" y2="9.5" stroke="${night ? '#fff' : '#232323'}" stroke-width="3" stroke-linecap="round" transform="rotate(${ah} 17 17)"/><line x1="17" y1="17" x2="17" y2="6.5" stroke="${night ? '#F2B705' : '#E2563F'}" stroke-width="1.8" stroke-linecap="round" transform="rotate(${am} 17 17)"/><circle cx="17" cy="17" r="2" fill="${night ? '#fff' : '#232323'}"/></svg><span><b>${t.time}</b><small class="wxs">${icon(EV_INFO[Events.weather()].icon)}${RealWeather.active() ? Math.round(s.wxReal.temp) + '° ' : ''}${t.day}</small></span>`;
    $('#wx').innerHTML = icon(EV_INFO[Events.weather()].icon);
    $('#wx').title = EV_INFO[Events.weather()].title;
    $('#btnPlay').innerHTML = G.paused ? icon('play') : icon('pause');
    $('#btnPlay').setAttribute('aria-label', G.paused ? 'Reprendre' : 'Pause');
    $('#btnSpeed').innerHTML = (G.speed === 'rt' ? 'Réel' : '×' + G.speed) + '<i class="caret"></i>';
    $('#btnSpeed').classList.toggle('rt', G.speed === 'rt');
  },
  refreshInfoBadge() {
    const n = Notif.unread();
    const d = $('#infoDot'); if (d) { d.hidden = n === 0; d.textContent = n > 9 ? '9+' : String(n); }
  },
  /** la photo reste en version jour : la nuit est un calque percé de lumières.
   *  Pendant une animation de zoom seulement, on assombrit directement la photo. */
  updateTint(zoomDark) {
    if (!G.map || !G.s) return;
    const nf = Night.factor();
    const p = G.map.getPane('tilePane');
    if (!p) return;
    const k = zoomDark ? 1 - 0.8 * nf : 1;
    if (G.s.settings.base === 'pale') p.style.filter = `grayscale(1) sepia(.18) contrast(.62) brightness(${(1.28 * k).toFixed(2)})`;
    else p.style.filter = k < 1 ? `brightness(${k.toFixed(2)}) saturate(${(1 - 0.4 * nf).toFixed(2)})` : 'none';
    if (Math.abs(nf - (this.lastNf ?? -1)) > 0.01) { this.lastNf = nf; Render.dirty = true; }
  },

  /** menu déroulant des vitesses, du temps réel et de la météo */
  speedMenu(open) {
    const m = $('#speedMenu');
    if (!open) { m.hidden = true; return; }
    const s = G.s, cur = G.paused ? 'pause' : G.speed;
    const items = [['pause', 'Pause', ''], [1, '×1', '1 min de jeu par seconde'], [5, '×5', '5 min par seconde'], [20, '×20', '20 min par seconde'], [60, '×60', '1 h de jeu par seconde'], ['rt', 'Temps réel', 'Heure de Paris, 1 min = 1 min']];
    const wx = s.settings.realWeather && s.wxReal ? s.wxReal.label + ', ' + Math.round(s.wxReal.temp) + ' °C' : 'Météo-France, ville de départ';
    m.innerHTML = items.map(([v, lab, sub]) => `<button class="sm-it ${String(cur) === String(v) ? 'on' : ''} ${v === 'rt' ? 'sm-rt' : ''}" data-act="setSpeed" data-arg="${v}"><b>${lab}</b>${sub ? `<small>${sub}</small>` : ''}${String(cur) === String(v) ? icon('check') : ''}</button>`).join('') +
      `<label class="tgl sm-wx"><input type="checkbox" data-change="setting" data-arg="realWeather" ${s.settings.realWeather ? 'checked' : ''}><span><b>Météo réelle</b><br><small>${esc(wx)}</small></span></label>`;
    m.hidden = false;
  },

  /* ---- notifications ---- */
  toast(text, kind = 'info') {
    const box = $('#toasts'); if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast t-' + kind;
    el.textContent = text;
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, kind === 'bad' ? 5200 : 4000);
  },

  /* ---- panneau du bas ---- */
  open(name, arg) {
    G.ui.sheet = name; G.ui.sheetArg = arg;
    document.querySelectorAll('#toasts .nban').forEach((b) => b.remove());
    this.closeCard();
    const sh = $('#sheet');
    sh.hidden = false;
    document.querySelectorAll('.nav-b').forEach((b) => b.classList.toggle('on', b.dataset.arg === name || (name === 'line' && b.dataset.arg === 'lines')));
    this.refreshSheet(true);
  },
  sheetOpen() { return !$('#sheet').hidden; },
  close() {
    $('#sheet').hidden = true; G.ui.sheet = null;
    document.querySelectorAll('.nav-b').forEach((b) => b.classList.remove('on'));
    if (G.ui.selLine) { G.ui.selLine = null; Render.dirty = true; }
  },
  refreshSheet(scrollTop) {
    if (!this.sheetOpen()) return;
    const f = SHEETS[G.ui.sheet]; if (!f) return;
    const r = f(G.ui.sheetArg);
    if (!r) { this.close(); return; }
    const body = $('#sheetBody');
    const keep = body.scrollTop;
    const opened = [...body.querySelectorAll('details')].map((d) => d.open);
    $('#sheetTitle').innerHTML = r.title;
    body.innerHTML = r.html;
    if (!scrollTop) body.querySelectorAll('details').forEach((d, i) => { if (opened[i]) d.open = true; });
    body.scrollTop = scrollTop ? 0 : keep;
  },

  /* ---- carte flottante (véhicule, arrêt, zone) ---- */
  card(html) { if (this.sheetOpen()) { const keep = [G.ui.selVeh, G.ui.selZone, G.ui.cardType]; this.close(); [G.ui.selVeh, G.ui.selZone, G.ui.cardType] = keep; } const c = $('#card'); c.innerHTML = html; c.hidden = false; },
  closeCard() {
    $('#card').hidden = true;
    const changed = G.ui.selZone || G.ui.selVeh;
    G.ui.selZone = null; G.ui.selVeh = null; G.ui.follow = null; G.ui.cardType = null;
    if (changed) Render.dirty = true;
  },
  showVehicle(l, v) {
    G.ui.selVeh = v; G.ui.selZone = null; G.ui.cardType = 'veh'; G.ui.cardLine = l;
    this.renderVehCard();
  },
  renderVehCard() {
    const v = G.ui.selVeh, l = G.ui.cardLine;
    if (!v || !l || !l.veh.includes(v)) { this.closeCard(); return; }
    const md = MODEL[v.model], f = v.load / md.cap;
    const n = l.stops.length;
    let next = '—', dir = '';
    const evt = l.ev[v.ev];
    if (evt) { next = l.stops[evt.k].name; dir = evt.d === 0 ? l.stops[n - 1].name : l.stops[0].name; if (l.loop) dir = 'circulaire'; }
    this.card(`<div class="card-h">${badgeFull(l)}<div class="card-t"><b>${esc(md.name)}</b><small>${esc(md.desc)}</small></div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>
      <div class="fillbar"><i style="width:${Math.min(100, f * 100).toFixed(0)}%;background:${fillCol(f)}"></i></div>
      <div class="kv"><span>À bord</span><b>${fmtInt(v.load)} / ${md.cap} · ${fmtPct(f)}</b></div>
      <div class="kv"><span>Prochain arrêt</span><b>${esc(next)}</b></div>
      <div class="kv"><span>Direction</span><b>${esc(dir)}</b></div>
      <div class="kv"><span>Vitesse${Lines.limitAt(l, v) ? ' · limitée à ' + Lines.limitAt(l, v) + ' km/h' : ''}</span><b>${v.incUntil > G.s.sec ? 'immobilisé (incident)' : v.hold === 'queue' ? 'derrière le véhicule précédent' : v.dwell > 0 ? ({ sig: 'au feu rouge', stop: 'au stop', yield: 'cède le passage', reg: 'régulation (garde l’écart)', queue: 'derrière le véhicule précédent', incident: 'immobilisé (incident)' }[v.hold] || 'à quai') : Math.round((v.spd || 0) * 3.6) + ' km/h'}</b></div>
      <div class="row2"><button class="btn sm ${G.ui.follow === v ? 'on' : ''}" data-act="follow">${icon('follow')} ${G.ui.follow === v ? 'Suivi actif' : 'Suivre'}</button><button class="btn sm" data-act="openLine" data-arg="${l.id}">Voir la ligne</button></div>`);
  },
  showStop(l, k) {
    G.ui.cardType = 'stop'; G.ui.selVeh = null;
    const st = l.stops[k];
    const near = [];
    for (const ln of G.s.lines) ln.stops.forEach((s2, k2) => { if (dist(s2.mx, s2.my, st.mx, st.my) < 60) near.push([ln, k2]); });
    const rows = near.map(([ln, k2]) => {
      const n = ln.stops.length;
      let w = 0; for (let j = 0; j < n; j++) w += ln.Wf[k2 * n + j] + ln.Wb[k2 * n + j] + ln.Xf[k2 * n + j] + ln.Xb[k2 * n + j] + ln.Rf[k2 * n + j] + ln.Rb[k2 * n + j];
      const hw = ln.active ? '~' + Math.max(1, Math.round(ln.headway)) + ' min' : ln.status === 'construction' ? 'en travaux' : 'hors service';
      return `<button class="lrow" data-act="openLine" data-arg="${ln.id}">${badgeFull(ln)}<span class="lrow-t">${esc(ln.name)}</span><span class="lrow-v"><b>${fmtInt(w)}</b> en attente<br><small>passage ${hw}</small></span></button>`;
    }).join('');
    const z = G.w.zoneAt(st.mx, st.my);
    const seen = new Set(near.map(([ln]) => ln.id));
    const xs = [];
    for (const [ln, k2] of near) for (const x of Transfers.at(ln, k2)) if (!seen.has(x.line.id)) { seen.add(x.line.id); xs.push(x); }
    const xrows = xs.map((x) => `<button class="lrow" data-act="openLine" data-arg="${x.line.id}">${badgeFull(x.line)}<span class="lrow-t">${esc(x.line.stops[x.k].name)}<small>correspondance · ${Math.max(1, Math.round(x.walk / 70))} min à pied (${Math.round(x.walk)} m)</small></span></button>`).join('');
    this.card(`<div class="card-h"><div class="plate">${esc(st.name)}</div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>
      ${z ? `<p class="sub">${esc(z.name)} · ${esc(z.commune)}</p>` : ''}${rows}${xrows ? `<div class="sec">Correspondances</div>${xrows}` : ''}`);
  },
  showZone(z) {
    G.ui.selZone = z; G.ui.selVeh = null; G.ui.cardType = 'zone';
    Render.dirty = true;
    const buyable = G.w.purchasable(z);
    const t = IRIS_TYPES[z.type] || 'Zone';
    this.card(`<div class="card-h"><div class="card-t"><b>${esc(z.name)}</b><small>${esc(z.commune)} · quartier ${esc(t.toLowerCase())}</small></div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>
      <div class="kv"><span>Habitants ${z.popReal ? '(' + esc(z.popReal) + ')' : '(estim.)'}</span><b>${fmtInt(z.pop)}</b></div>
      <div class="kv"><span>Emplois (estim.)</span><b>${fmtInt(z.jobs)}</b></div>
      <div class="kv"><span>Densité</span><b>${fmtInt(z.density)} hab./km²</b></div>
      <div class="kv"><span>Surface</span><b>${z.areaKm2.toLocaleString('fr-FR', { maximumFractionDigits: 2 })} km²</b></div>
      ${Events.active().some((e) => e.kind === 'works' && e.zone === z.code) ? '<p class="note warn">Travaux de voirie en cours dans ce quartier.</p>' : ''}
      ${z.owned ? '<p class="note ok">Dans votre zone d’exploitation.</p>'
        : buyable ? `<button class="btn primary wide" data-act="buyZone" data-arg="${esc(z.code)}">Acheter · ${fmtEur(z.price)}</button>`
          : `<p class="note">Zone non contiguë : achetez d’abord une zone voisine. Prix : ${fmtEur(z.price)}.</p>`}`);
  },

  showPoi(p) {
    G.ui.cardType = 'poi'; G.ui.selVeh = null; G.ui.selZone = null;
    const ic = POI_ICON[p.kind], col = POI_CAT[ic ? ic.cat : 'admin'];
    const stars = p.w >= 2000 ? 3 : p.w >= 800 ? 2 : 1;
    const near = G.s.lines.filter((l) => l.stops.some((st) => dist(st.mx, st.my, p.mx, p.my) < MODES[l.mode].catch + 150));
    const svg = ic ? `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="${ic.w || 2.4}" stroke-linecap="round" stroke-linejoin="round"><path d="${ic.d}"/></svg>` : '';
    this.card(`<div class="card-h"><span class="evcard-ic" style="background:${col};box-shadow:none">${svg}</span><div class="card-t"><b>${esc(p.name || POI_LABEL[p.kind] || 'Lieu')}</b><small>${esc(POI_LABEL[p.kind] || '')}</small></div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>
      <div class="kv"><span>Attractivité</span><b>${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</b></div>
      <p class="sub">${stars === 3 ? 'Génère beaucoup de déplacements : un arrêt à proximité fera le plein.' : stars === 2 ? 'Attire un flux régulier de voyageurs.' : 'Petit générateur de déplacements.'}</p>
      ${near.length ? `<div class="sec">Desservi par</div>${near.map((l) => `<button class="lrow" data-act="openLine" data-arg="${l.id}">${badgeFull(l)}<span class="lrow-t">${esc(l.name)}</span></button>`).join('')}` : '<p class="note">Aucune de vos lignes ne dessert ce lieu.</p>'}
      ${p.kind === 'station' && p.train ? `<div class="row2"><button class="btn" data-act="buildMode" data-arg="ter">Ligne TER</button><button class="btn" data-act="poiTrack" data-arg="${p.mx},${p.my}">Voie depuis ici</button></div>` : ''}`);
  },
  showStation(g) {
    G.ui.cardType = 'station'; G.ui.selVeh = null; G.ui.selZone = null; G.ui.cardStation = g;
    const deg = Math.round(((g.ang * 180 / Math.PI) % 180 + 180) % 180);
    const used = Rail.stationUsed(g);
    const tracks = Rail.st().tracks.filter((t) => t.aNid === g.nid || t.bNid === g.nid).length;
    this.card(`<div class="card-h"><span class="pict pict-ter">GARE</span><div class="card-t"><b>${esc(g.name)}</b><small>Gare construite · orientation ${deg}°</small></div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>
      <div class="kv"><span>Voies raccordées</span><b>${tracks}</b></div>
      <div class="vrow"><div><b>Orientation</b><small>Les nouvelles voies partent dans l’axe du quai</small></div><div class="stepper"><button data-act="stRot" data-arg="${g.id}|-1" aria-label="Tourner à gauche">⟲</button><b>${deg}°</b><button data-act="stRot" data-arg="${g.id}|1" aria-label="Tourner à droite">⟳</button></div></div>
      <div class="row2"><button class="btn" data-act="stTrack" data-arg="${g.id}">Tracer une voie</button><button class="btn" data-act="buildMode" data-arg="ter">Ligne TER</button></div>
      ${used ? '' : `<button class="btn danger wide" data-act="stDemolish" data-arg="${g.id}">Démolir (remboursé 30 %)</button>`}`);
  },
  showEvent(e) {
    G.ui.cardType = 'event'; G.ui.selVeh = null; G.ui.selZone = null;
    const s = G.s, info = EV_INFO[e.kind] || {};
    const up = e.start > s.min;
    const total = Math.max(1, e.end - e.start), done = clamp((s.min - e.start) / total, 0, 1);
    const lab = (m) => Time.label(m).time + (Math.floor(m / 1440) !== Math.floor(s.min / 1440) ? ' (' + Time.label(m).day + ')' : '');
    const fx = Events.effects(e), tone = Events.tone(e), cat = Events.cat(e);
    const direct = new Set([e.lineId, e.halt && e.halt.lineId, e.veh && e.veh.lineId].filter(Boolean));
    const lines = G.s.lines.filter((l) => { if (direct.has(l.id)) return true; if (e.halt && e.halt.mode === l.mode) return true; const p = (e.traffic || e.demand) && Events.where(e); return p && l.stops.some((st) => dist(st.mx, st.my, p[0], p[1]) < 900); });
    this.card(`<div class="card-h"><span class="evcard-ic" style="--c:${Events.color(e)}">${esc(Events.glyph(e))}</span><div class="card-t"><b>${esc(e.title)}</b><small>${esc(cat.label)} · ${up ? 'à venir · début ' + lab(e.start) : e.end - e.start <= 60 && !e.veh ? lab(e.start) : 'en cours · fin prévue ' + lab(e.end)}</small></div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>
      <p class="sub">${esc(e.desc.charAt(0).toUpperCase() + e.desc.slice(1))}</p>
      <div class="tone tone-${tone < 0 ? 'neg' : tone > 0 ? 'pos' : 'neu'}">${Notif.toneLabel(tone)} <span>${tone <= -3 ? 'Très pénalisant' : tone === -2 ? 'Pénalisant' : tone === -1 ? 'Gênant' : tone >= 3 ? 'Excellente nouvelle' : tone === 2 ? 'Très favorable' : tone === 1 ? 'Favorable' : 'Mitigé'}</span></div>
      ${!up && e.end - e.start > 60 ? `<div class="timeline"><i style="width:${(done * 100).toFixed(0)}%"></i></div><small>${lab(e.start)} → ${lab(e.end)}</small>` : ''}
      ${fx.length ? `<ul class="fx">${fx.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${lines.length ? `<div class="sec">Lignes concernées</div>${lines.map((l) => `<button class="lrow" data-act="openLine" data-arg="${l.id}">${badgeFull(l)}<span class="lrow-t">${esc(l.name)}</span></button>`).join('')}` : ''}`);
  },

  /* ---- fenêtre modale ---- */
  modal(html, opts = {}) {
    const m = $('#modal');
    $('#modalBox').innerHTML = html;
    m.hidden = false;
    if (opts.pause) { G.ui.prevPaused = G.paused; G.paused = true; this.refreshTop(); G.ui.modalPaused = true; }
  },
  closeModal() {
    $('#modal').hidden = true;
    if (G.ui.modalPaused) { G.paused = G.ui.prevPaused; G.ui.modalPaused = false; this.refreshTop(); }
  },
  choiceDialog(e) {
    if (e.decided || !e.q) return;
    if (!$('#modal').hidden) { e.dialogOpen = false; return; } // une autre fenêtre est ouverte : on reproposera plus tard
    e.dialogOpen = true;
    const c = Events.cat(e);
    this.modal(`<div class="plate big"><span class="evcard-ic" style="--c:${c.col}">${esc(Events.glyph(e))}</span> ${esc(e.title)}</div>
      <p>${esc(e.q)}</p>
      <div class="row2">${e.opts.map((o, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-act="evChoose" data-arg="${e.id}|${i}">${esc(o)}</button>`).join('')}</div>`, { pause: true });
  },
  strikeDialog(e) {
    this.modal(`<div class="plate big">${icon('strike')} Préavis de grève</div>
      <p>Les agents ${e.mode === 'bus' ? 'des bus' : 'du métro'} menacent d’arrêter le travail demain toute la journée. Toutes les lignes ${e.mode === 'bus' ? 'de bus' : 'de métro'} seront à l’arrêt.</p>
      <p>Une négociation immédiate (primes, embauches) peut éviter le mouvement.</p>
      <div class="row2"><button class="btn" data-act="strikeNo" data-arg="${e.id}">Laisser faire</button><button class="btn primary" data-act="strikeYes" data-arg="${e.id}">Négocier · ${fmtEur(e.cost)}</button></div>`, { pause: true });
  },

  /* ---- écrans ---- */
  showStart() {
    G.ready = false;
    $('#start').hidden = false;
    $('#game').hidden = true;
    StartScreen.render('home');
  },
  showGame() { $('#start').hidden = true; $('#game').hidden = false; setTimeout(() => G.map && G.map.invalidateSize(), 50); },
};

/* =====================================================================
   PANNEAUX
   ===================================================================== */
const statLine = (label, val, cls = '') => `<div class="kv ${cls}"><span>${label}</span><b>${val}</b></div>`;
const section = (t) => `<h3 class="sec">${t}</h3>`;

function lineToday(l) {
  const t = l.today;
  return { pax: t.pax, fares: t.fares + t.ads, ops: t.ops, mec: t.mec, fill: t.loadN ? t.loadSum / t.loadN : 0 };
}
function lineAgg(l, period) {
  if (period === 'today') return lineToday(l);
  const arr = period === 'yesterday' ? l.hist.slice(0, 1) : l.hist.slice(0, 7);
  if (!arr.length) return { pax: 0, fares: 0, ops: 0, mec: 0, fill: 0 };
  const sum = (k) => arr.reduce((a, d) => a + (d[k] || 0), 0);
  return { pax: sum('pax'), fares: sum('fares') + sum('ads'), ops: sum('ops'), mec: sum('mec'), fill: sum('fill') / arr.length };
}

const SHEETS = {
  lines() {
    const s = G.s;
    if (!s.lines.length) return { title: 'Réseau', html: `<div class="empty">${pict('metro')}${pict('bus')}<p>Aucune ligne pour l’instant.</p><button class="btn primary" data-act="nav" data-arg="build">${icon('plus')} Créer une première ligne</button></div>` };
    const rows = MODE_ORDER.map((m) => {
      const ls = s.lines.filter((l) => l.mode === m).sort((a, b) => a.num - b.num);
      if (!ls.length) return '';
      return section(MODES[m].label) + ls.map((l) => {
        const t = lineToday(l);
        const st = l.status === 'construction' ? `<em class="tag warn">Travaux · ${Time.label(l.buildEnd).day}</em>` : Events.halted(l) ? '<em class="tag bad">Interrompue</em>' : !l.active ? '<em class="tag">Hors service</em>' : '';
        return `<button class="lrow" data-act="openLine" data-arg="${l.id}">${badgeFull(l)}<span class="lrow-t">${esc(l.name)}<small>${l.veh.length} véhicule${l.veh.length > 1 ? 's' : ''} · ${l.stops.length} arrêts · ${fmtKm(l.path.L)} ${st}</small></span><span class="lrow-v"><b>${fmtInt(t.pax)}</b> voy.<br><small>${fmtPct(t.fill)} rempli</small></span></button>`;
      }).join('');
    }).join('');
    return { title: 'Réseau', html: `<div class="row2"><button class="btn" data-act="openPlan">${icon('target')} Plan du réseau</button><button class="btn" data-act="nav" data-arg="staff">${icon('user')} Personnel</button></div>` + rows + `<button class="btn wide" data-act="nav" data-arg="build">${icon('plus')} Nouvelle ligne</button>` };
  },

  line(id) {
    const l = G.s.lines.find((x) => x.id === +id);
    if (!l) return null;
    G.ui.selLine = l;
    const t = lineToday(l), y = l.hist[0];
    const cap = Lines.capacity(l);
    const groups = {};
    for (const v of l.veh) groups[v.model] = (groups[v.model] || 0) + 1;
    const vrows = Object.entries(groups).map(([m, c]) => {
      const md = MODEL[m];
      return `<div class="vrow"><div><b>${esc(md.name)}</b><small>${md.cap} places · ${md.kmh} km/h · ${fmtEur(md.op * G.s.costMul)}/h</small></div><div class="stepper"><button data-act="sellVeh" data-arg="${l.id}|${m}" aria-label="Vendre">−</button><b>${c}</b><button data-act="buyVeh" data-arg="${l.id}|${m}" aria-label="Acheter">+</button></div></div>`;
    }).join('') || '<p class="note">Aucun véhicule : la ligne ne transporte personne.</p>';
    const cat = CATALOG[l.mode].map((md) => `<button class="catrow" data-act="buyVeh" data-arg="${l.id}|${md.id}"><span><b>${esc(md.name)}</b><small>${esc(md.desc)} · ${md.cap} pl. · ${md.kmh} km/h en ${accTime(md)} s · ${fmtEur(md.op * G.s.costMul)}/h</small></span><em>${fmtEur(md.price * G.s.costMul)}</em></button>`).join('');
    const price = (k, lab) => `<div class="vrow"><div><b>${lab}</b><small>réf. ${MODES[l.mode].ref.toFixed(2).replace('.', ',')} €</small></div><div class="stepper"><button data-act="price" data-arg="${l.id}|${k}|-0.1">−</button><b>${l.prices[k].toFixed(2).replace('.', ',')} €</b><button data-act="price" data-arg="${l.id}|${k}|0.1">+</button></div></div>`;
    const hourOpts = (vals, cur) => vals.map((v) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${Time.hhmm(v)}</option>`).join('');
    const laneKm = l.mode === 'bus' ? laneLength(l) / 1000 : 0;
    const laneCost = Math.round(laneKm * 90000 * G.s.costMul / 1000) * 1000;
    const sigCost = Math.round(l.stops.length * 25000 * G.s.costMul / 1000) * 1000;
    const status = l.status === 'construction' ? `<p class="note warn">Chantier en cours : ouverture le ${Time.label(l.buildEnd).day} à ${Time.label(l.buildEnd).time}.</p>` : Events.halted(l) ? '<p class="note bad">Ligne interrompue (événement en cours).</p>' : '';
    const xc = []; l.stops.forEach((_, k) => { for (const x of Transfers.at(l, k)) xc.push(x); });
    const svcRows = SERVICE_KEYS.filter(([k]) => k !== 'night' || l.night).map(([k, lab, sub]) => {
      const cur = l.svc[k] ?? 1, nv = Math.max(1, Math.round(l.veh.length * cur));
      return `<div class="vrow"><div><b>${lab}</b><small>${sub} · ${l.veh.length ? nv + ' véhicule' + (nv > 1 ? 's' : '') : '—'}</small></div><select data-change="svc" data-arg="${l.id}|${k}">${SERVICE_STEPS.map((v) => `<option value="${v}" ${Math.abs(v - cur) < 0.01 ? 'selected' : ''}>${Math.round(v * 100)} %</option>`).join('')}</select></div>`;
    }).join('');
    const presets = Object.entries(SERVICE_PRESETS).map(([k, p]) => `<button class="${l.svcPreset === k ? 'on' : ''}" data-act="svcPreset" data-arg="${l.id}|${k}">${p.label}</button>`).join('');
    const swatches = LINE_COLORS.map((c) => `<button class="sw ${c === l.color ? 'on' : ''}" style="background:${c}" data-act="lineColor" data-arg="${l.id}|${c}" aria-label="Couleur ${c}"></button>`).join('');
    const html = `${status}
      <div class="stops">${l.stops.map((s2, i) => `<span>${i ? '<i></i>' : ''}${esc(s2.name)}</span>`).join('')}</div>
      <div class="kpis">
        <div><small>Voyageurs aujourd’hui</small><b>${fmtInt(t.pax)}</b></div>
        <div><small>Remplissage moyen · pic</small><b>${fmtPct(t.fill)} · <span style="color:${fillCol(l.today.loadMax || 0)}">${fmtPct(l.today.loadMax || 0)}</span></b></div>
        <div><small>Recettes − coûts</small><b class="${t.fares - t.ops < 0 ? 'neg' : 'pos'}">${fmtEur(t.fares - t.ops)}</b></div>
        <div><small>Mécontents</small><b>${fmtInt(t.mec)}</b></div>
      </div>
      ${statLine('Passage', l.veh.length ? 'toutes les ~' + Math.max(1, Math.round(l.headway)) + ' min' : '—')}
      ${statLine('En service', l.active ? Lines.running(l) + ' / ' + l.veh.length + ' véhicules · ' + SERVICE_KEYS.find((k) => k[0] === Lines.serviceKey(G.s.min))[1].toLowerCase() : 'au dépôt')}
      ${statLine('Tour complet', l.cycleMin ? Math.round(l.cycleMin) + ' min' : '—')}
      ${statLine('Vitesse commerciale', Math.round(l.speedAvg || 0) + ' km/h')}
      ${statLine('Capacité totale', fmtInt(cap) + ' places')}
      ${statLine('Population desservie', fmtInt(l.catchPop || 0))}
      ${l.mode === 'bus' ? statLine('Limitations sur le parcours', limRange(l)) : ''}
      ${l.mode === 'bus' ? statLine('Feux · stops · cédez-le-passage', ['sig', 'stop', 'yield'].map((t) => (l.ctl || []).filter((c) => c.t === t).length).join(' · ')) : ''}
      ${xc.length ? statLine('Correspondances', xc.map((x) => Lines.label(x.line)).filter((v, i, a) => a.indexOf(v) === i).join(' · ')) : ''}
      ${xc.length ? statLine('Voyageurs en correspondance', fmtInt(l.today.xin || 0) + ' arrivés · ' + fmtInt(l.today.xout || 0) + ' partis') : ''}
      ${y ? statLine('Hier', fmtInt(y.pax) + ' voy. · ' + fmtEur(y.fares + y.ads - y.ops)) : ''}
      ${section('Véhicules')}${vrows}
      <details class="cat"><summary>${icon('plus')} Acheter un véhicule</summary>${cat}</details>
      ${section('Tarifs par période')}${price('week', 'Semaine')}${price('weekend', 'Week-end')}${price('night', 'Nuit (22 h – 5 h)')}
      ${section('Horaires')}
      <div class="vrow"><div><b>Premier départ</b></div><select data-change="hStart" data-arg="${l.id}" ${l.night ? 'disabled' : ''}>${hourOpts([240, 270, 300, 330, 360, 390, 420], l.hours.start)}</select></div>
      <div class="vrow"><div><b>Fin de service</b></div><select data-change="hEnd" data-arg="${l.id}" ${l.night ? 'disabled' : ''}>${hourOpts([1260, 1320, 1380, 0, 30, 60, 120], l.hours.end)}</select></div>
      <label class="tgl"><input type="checkbox" data-change="night" data-arg="${l.id}" ${l.night ? 'checked' : ''}><span>Service de nuit (24 h/24)</span></label>
      ${section('Grille horaire')}
      <p class="sub">Part de la flotte en service selon la période. Les véhicules en trop rentrent au dépôt depuis le terminus (sans coût d’exploitation) et ressortent pour les renforts.</p>
      <div class="seg wrap">${presets}${l.svcPreset === 'perso' ? '<button class="on">Personnalisée</button>' : ''}</div>${svcRows}
      ${l.mode === 'bus' ? `${section('Aménagements')}
        <div class="vrow"><div><b>Couloirs de bus</b><small>${laneKm.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} km sur axes principaux · les bus évitent 75 % des bouchons</small></div>${l.busLane ? '<em class="tag ok">Réalisé</em>' : `<button class="btn sm primary" data-act="busLane" data-arg="${l.id}">${fmtEur(laneCost)}</button>`}</div>
        <div class="vrow"><div><b>Priorité aux feux</b><small>+10 % de vitesse</small></div>${l.signal ? '<em class="tag ok">Réalisé</em>' : `<button class="btn sm primary" data-act="signal" data-arg="${l.id}">${fmtEur(sigCost)}</button>`}</div>` : ''}
      ${section('Couleur')}<div class="swatches">${swatches}</div>
      ${section('Actions')}
      <button class="btn wide" data-act="editLine" data-arg="${l.id}">${icon('plus')} Modifier les arrêts (ajouter, déplacer, retirer)</button>
      ${l.mode !== 'metro' ? `<button class="btn wide" data-act="reroute" data-arg="${l.id}">${icon('undo')} Recalculer l’itinéraire (sens de circulation)</button>` : ''}
      <div class="row2"><button class="btn" data-act="centerLine" data-arg="${l.id}">${icon('target')} Voir sur la carte</button><button class="btn danger" data-act="delLine" data-arg="${l.id}">Supprimer</button></div>`;
    return { title: `${badgeFull(l)}<span>${esc(l.name)}</span>`, html };
  },

  staff() {
    const s = Staff.st(), busy = s.training.length;
    const cards = STAFF.map((d) => {
      const lv = Staff.L(d.id), tr = Staff.training(d.id), cost = Staff.cost(d.id);
      const dots = [1, 2, 3].map((k) => `<i class="${k <= lv ? 'on' : tr && tr.level === k ? 'tr' : ''}" style="--c:${d.col}"></i>`).join('');
      const now = lv ? d.fx(lv) : [];
      const next = lv < 3 ? d.fx(lv + 1) : null;
      let act;
      if (tr) {
        const p = clamp((G.s.min - tr.start) / (tr.end - tr.start), 0, 1);
        act = `<div class="timeline"><i style="width:${(p * 100).toFixed(0)}%;background:${d.col}"></i></div><small>En formation : niveau ${tr.level} · fin le ${Time.label(tr.end).day} à ${Time.label(tr.end).time}</small>`;
      } else if (lv >= 3) act = '<em class="tag ok">Niveau maximal</em>';
      else act = `<button class="btn sm ${Staff.canStart(d.id) ? 'primary' : ''}" data-act="staffTrain" data-arg="${d.id}" ${Staff.canStart(d.id) && Eco.canAfford(cost) ? '' : 'disabled'}>Former au niveau ${lv + 1} · ${Eco.free() ? 'gratuit' : fmtEur(cost)} · ${STAFF_DAYS[lv]} j</button>${!Staff.canStart(d.id) && busy >= STAFF_MAX_PARALLEL ? '<small>Le centre de formation est complet (2 promotions à la fois).</small>' : ''}`;
      return `<div class="staffc"><div class="staff-h"><span class="evcard-ic" style="--c:${d.col}">${icon(d.icon)}</span><div><b>${esc(d.name)}</b><small>${esc(d.who)} · ${lv ? 'niveau ' + lv + ' : ' + esc(d.lv[lv - 1]) : 'non formés'}</small></div><span class="lvdots">${dots}</span></div>
        ${now.length ? `<ul class="fx">${now.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${next ? `<p class="sub nextlv">Niveau ${lv + 1} « ${esc(d.lv[lv])} » : ${esc(next.join(' · '))}</p>` : ''}
        ${act}</div>`;
    }).join('');
    const tot = Staff.total(), wage = Math.round((Staff.opsMult() - 1) * 100);
    return {
      title: 'Personnel et formations',
      html: `<p class="sub">Former vos équipes réduit la fraude, les pannes et la durée des incidents, et améliore l’image du réseau. Chaque niveau acquis augmente un peu les salaires (+1 % d’exploitation), l’éco-conduite fait économiser de l’énergie.</p>
        <div class="kpis"><div><small>Niveaux acquis</small><b>${tot} / ${STAFF.length * 3}</b></div><div><small>Effet sur l’exploitation</small><b class="${wage > 0 ? 'neg' : 'pos'}">${wage > 0 ? '+' : ''}${wage} %</b></div><div><small>Formations en cours</small><b>${busy} / ${STAFF_MAX_PARALLEL}</b></div><div><small>Recettes billets</small><b class="pos">+${Math.round((Staff.fareMult() - 1) * 100)} %</b></div></div>
        ${cards}`,
    };
  },

  build() {
    const cards = MODE_ORDER.map((m) => {
      const hint = { bus: 'Suit les vraies routes, subit le trafic. ≈ 15-20 km/h. 8 k€ par arrêt.', metro: 'Souterrain, tracé libre. ≈ 30-35 km/h. 600 k€/km + 350 k€ par station. 1 à 2 jours de chantier.', ter: 'De gare en gare sur les voies ferrées. Le plus rapide : jusqu’à 100 km/h, ≈ 40-75 km/h de moyenne selon l’écart entre gares.', boat: 'Sur les fleuves et canaux. Le plus lent : ≈ 10 km/h, mais apprécié des touristes. 60 k€ par ponton.' }[m];
      const cheapest = CATALOG[m][0];
      return `<button class="modecard" data-act="buildMode" data-arg="${m}">${pict(m)}<span><b>${MODES[m].label}</b><small>${hint}</small><small>Véhicules dès ${fmtEur(cheapest.price * G.s.costMul)}</small></span></button>`;
    }).join('');
    const infra = `<h3 class="sec">Infrastructures ferroviaires</h3>
      <button class="modecard" data-act="railMode" data-arg="gare"><span class="pict pict-ter">GARE</span><span><b>Nouvelle gare</b><small>Posée sur une voie existante ou en pleine ville, orientable. ${fmtEur(Rail.stationCost())}.</small></span></button>
      <button class="modecard" data-act="railMode" data-arg="track"><span class="pict pict-ter">═</span><span><b>Nouvelle voie ferrée</b><small>Tracée en longues courbes, de gare en gare ou en se branchant sur les voies existantes. ${fmtEur(Rail.KM * G.s.costMul)}/km.</small></span></button>`;
    return { title: 'Construire', html: `<p class="sub">Choisissez un mode, puis touchez la carte pour placer les arrêts dans vos zones.</p>${cards}${infra}` };
  },

  zones() {
    const w = G.w;
    const owned = [...w.zones.values()].filter((z) => z.owned);
    const buy = [...w.zones.values()].filter((z) => w.purchasable(z)).sort((a, b) => b.density - a.density);
    const pop = owned.reduce((a, z) => a + z.pop, 0), area = owned.reduce((a, z) => a + z.areaKm2, 0);
    const rows = buy.slice(0, 40).map((z) => `<div class="zrow"><button class="zrow-t" data-act="seeZone" data-arg="${esc(z.code)}"><b>${esc(z.name)}</b><small>${esc(z.commune)} · ${fmtInt(z.density)} hab./km² · ${IRIS_TYPES[z.type]}</small></button><button class="btn sm primary" data-act="buyZone" data-arg="${esc(z.code)}">${fmtEur(z.price)}</button></div>`).join('');
    return {
      title: 'Zones d’exploitation',
      html: `<div class="kpis"><div><small>Zones</small><b>${owned.length}</b></div><div><small>Habitants</small><b>${fmtInt(pop)}</b></div><div><small>Surface</small><b>${area.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} km²</b></div><div><small>Achetables</small><b>${buy.length}</b></div></div>
      <p class="sub">Les zones jaunes en pointillés sont voisines de votre territoire. Le prix dépend de la densité d’habitants et d’emplois.</p>
      ${section('Zones achetables, des plus denses aux moins denses')}${rows || '<p class="note">Aucune zone voisine chargée pour l’instant.</p>'}`,
    };
  },

  finance() {

function barChart(items, posOnly) {
  if (!items.length) return '<p class="note">Les chiffres apparaîtront après la première journée complète.</p>';
  const W = 320, H = 110, pad = 18;
  const max = Math.max(1, ...items.map((i) => Math.abs(i.v)));
  const hasNeg = !posOnly && items.some((i) => i.v < 0);
  const zero = hasNeg ? H / 2 : H - pad;
  const scale = (hasNeg ? H / 2 - 6 : H - pad - 8) / max;
  const bw = (W - 8) / items.length;
  const bars = items.map((it, i) => {
    const h = Math.abs(it.v) * scale;
    const x = 4 + i * bw + 2, y = it.v >= 0 ? zero - h : zero;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="1.5" fill="${it.v >= 0 ? (posOnly ? 'var(--accent)' : 'var(--ok)') : 'var(--bad)'}"/>` +
      (i % 2 === items.length % 2 || items.length < 8 ? `<text x="${(x + (bw - 4) / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${it.l}</text>` : '');
  }).join('');
  const last = items[items.length - 1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" class="axis"/>${bars}</svg><small>Dernier jour : <b>${posOnly ? fmtInt(last.v) : fmtEur(last.v)}</b> · max ${posOnly ? fmtInt(max) : fmtEur(max)}</small></div>`;
}

/** plage des limitations de vitesse rencontrées par une ligne de bus, pondérée par la distance */
function limRange(l) {
  const net = G.w.road, by = {};
  (l.P || [l.path]).forEach((P, dir) => {
    if (!P) return;
    const segE = l.segEs ? l.segEs[dir] : null; if (!segE) return;
    for (let i = 0; i < P.pts.length - 1; i++) { const e = segE[i]; if (e < 0) continue; const v = net.lim[e] > 0 ? net.lim[e] : 50; by[v] = (by[v] || 0) + (P.cum[i + 1] - P.cum[i]); }
  });
  const tot = Object.values(by).reduce((a, b) => a + b, 0);
  if (!tot) return '—';
  return Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([v, d]) => `${v} km/h (${Math.round(d / tot * 100)} %)`).join(' · ');
}

/** secondes pour atteindre la vitesse maximale depuis l'arrêt */
function accTime(md) { return Math.round(md.kmh / 3.6 / (md.acc || PHYS[md.mode].a)); }

function laneLength(l) {
  if (!l.segE) return 0;
  let m = 0; const net = G.w.road, P = l.path;
  for (let i = 0; i < P.pts.length - 1; i++) { const e = l.segE[i]; if (e >= 0 && net.cls[e] <= 3) m += P.cum[i + 1] - P.cum[i]; }
  return m;
}
