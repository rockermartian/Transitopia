<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Correspondance</title>
<meta name="description" content="Jeu de gestion de transports sur la vraie carte de France">
<meta name="theme-color" content="#13294F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Signalétique de métro : plaques émaillées bleu nuit, lettrage condensé blanc cassé, jaune ligne 1 pour l'action */
:root{
  --enamel:#13294F; --enamel-2:#1B3666; --enamel-3:#274677; --ink:#0B1834;
  --paper:#F5F2E9; --muted:#A7B5D1; --line:rgba(245,242,233,.16);
  --yellow:#FFCD00; --ok:#3DDC84; --warn:#FFB020; --bad:#F0483E;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow Semi Condensed","Segoe UI",Roboto,Arial,sans-serif;
  --r:6px; --nav-h:58px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font:15px/1.35 var(--f-body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none}
small{font-size:12.5px;color:var(--muted)}
.neg{color:var(--bad)!important}.pos{color:var(--ok)!important}

/* pictogrammes et badges */
.pict{display:inline-grid;place-items:center;flex:none;font:700 13px/1 var(--f-display);color:var(--enamel);background:var(--paper);height:24px;min-width:24px;border-radius:5px;padding:0 4px;letter-spacing:.02em}
.pict-metro{border-radius:50%;width:24px;padding:0;font-size:16px}
.pict-boat{border-radius:50%;width:24px;padding:0;font-size:17px}
.pict-ter{font-size:11.5px}
.pict-bus{font-size:11px}
.lbadge{display:inline-grid;place-items:center;flex:none;font:700 15px/1 var(--f-display);height:26px;min-width:26px;padding:0 6px;border-radius:5px;margin-left:4px;box-shadow:0 0 0 1.5px rgba(245,242,233,.7)}
.lb-metro{border-radius:50%;width:26px;padding:0}
.plate{display:inline-flex;align-items:center;gap:8px;background:var(--enamel);color:var(--paper);font:600 17px/1.1 var(--f-display);padding:6px 12px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--enamel),inset 0 0 0 3.5px rgba(245,242,233,.85);text-wrap:balance}
.plate.big{font-size:21px;padding:9px 14px;margin-bottom:6px}
.plate .ic{width:20px;height:20px}

/* écran d'accueil */
#start{position:fixed;inset:0;overflow:auto;background:
  repeating-linear-gradient(90deg,transparent 0 58px,rgba(245,242,233,.025) 58px 60px),
  radial-gradient(120% 70% at 50% 0%,#1E3B70 0%,var(--enamel) 45%,var(--ink) 100%);
  padding:calc(24px + var(--sat)) max(16px,var(--sar)) calc(24px + var(--sab)) max(16px,var(--sal))}
#startBox{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:12px;margin-top:6vh}
.logo .pict{width:52px;height:52px;font-size:34px;background:var(--yellow);color:var(--ink)}
.logo h1{font:700 clamp(24px,8.2vw,46px)/1 var(--f-display);margin:0;letter-spacing:0;text-transform:uppercase;min-width:0}
.tagline{font-size:17px;color:var(--paper);opacity:.88;margin:4px 0 18px;max-width:30ch}
.stack{display:flex;flex-direction:column;gap:10px}
.credits{margin-top:28px;font-size:12px;color:var(--muted)}
.lab{font:600 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.inp{width:100%;font:inherit;font-size:16px;color:var(--paper);background:var(--enamel-2);border:1.5px solid var(--line);border-radius:var(--r);padding:12px}
.cityres{display:flex;flex-direction:column;gap:4px}
.cityrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--enamel-2);text-align:left}
.cityrow.on{box-shadow:inset 0 0 0 2px var(--yellow)}
.chosen{display:flex;align-items:center;gap:8px;color:var(--ok)}
.chosen b{color:var(--paper)}
.loadbox{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10vh;text-align:center}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:var(--r);background:var(--enamel-3);color:var(--paper);font:600 16px/1.1 var(--f-display);letter-spacing:.02em;text-align:center}
.btn.primary{background:var(--yellow);color:var(--ink)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad);color:#FF8A82}
.btn.big{min-height:56px;font-size:19px;flex-direction:column;gap:2px}
.btn.big small{color:inherit;opacity:.75;font-family:var(--f-body)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14.5px}
.btn.wide{width:100%;margin-top:10px}
.btn.on{box-shadow:inset 0 0 0 2px var(--yellow)}
.btn .ic{width:18px;height:18px}
.icon-b{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r);color:var(--paper)}
.row2{display:flex;gap:8px;margin-top:10px}.row2>*{flex:1}
.row2.tight{margin:0;flex:none;gap:6px}.row2.tight>*{flex:none}
.seg{display:flex;gap:4px;background:var(--ink);padding:3px;border-radius:var(--r);flex-wrap:nowrap}
.seg.wrap{flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;min-height:34px;padding:4px 8px;border-radius:4px;font:600 14px/1 var(--f-display);color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink)}

/* jeu */
#game{position:fixed;inset:0}
#map{position:absolute;inset:0;z-index:0;background:#0d1a33}
.leaflet-container{font-family:var(--f-body);background:#0d1a33}
.leaflet-control-attribution{background:rgba(11,24,52,.7)!important;color:var(--muted)!important;font-size:10px!important;margin-bottom:calc(var(--nav-h) + var(--sab) + 2px)!important}
.leaflet-control-attribution a{color:var(--paper)!important}
.ov{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ov-s{z-index:410}.ov-d{z-index:420}

#top{position:absolute;left:0;right:0;top:0;z-index:900;display:flex;align-items:stretch;gap:6px;padding:calc(6px + var(--sat)) max(8px,var(--sar)) 6px max(8px,var(--sal));background:linear-gradient(var(--enamel),rgba(19,41,79,.92));box-shadow:0 2px 0 rgba(245,242,233,.75),0 4px 14px rgba(0,0,0,.35)}
#top .icon-b{width:40px;height:44px}
.tplate{display:flex;flex-direction:column;justify-content:center;padding:2px 10px;border-radius:4px;background:var(--ink);min-width:0}
.tplate b{font:700 19px/1.05 var(--f-display);white-space:nowrap}
.tplate small{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cash{flex:1.15}#clock{flex:1}
#wx{display:grid;place-items:center;width:30px;color:var(--yellow)}
#wx .ic{width:22px;height:22px}
.speed{display:flex;gap:2px;background:var(--ink);border-radius:4px;padding:2px}
.speed button{width:38px;display:grid;place-items:center;border-radius:3px;font:700 15px/1 var(--f-display)}
.speed button .ic{width:18px;height:18px}
#btnSpeed{color:var(--yellow)}

#chip{position:absolute;z-index:880;top:calc(64px + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:13px;white-space:nowrap}
.spin{width:14px;height:14px;border:2px solid rgba(245,242,233,.25);border-top-color:var(--yellow);border-radius:50%;animation:sp 0.8s linear infinite}
.spin.big{width:36px;height:36px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}

#toasts{position:absolute;z-index:1300;top:calc(64px + var(--sat));left:max(10px,var(--sal));right:max(10px,var(--sar));display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{max-width:460px;width:100%;background:rgba(19,41,79,.96);border-left:4px solid var(--muted);padding:6px 10px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.4);font-size:13.5px;line-height:1.3;animation:tin .25s ease-out}
.t-ok{border-color:var(--ok)}.t-warn{border-color:var(--warn)}.t-bad{border-color:var(--bad)}.t-info{border-color:var(--yellow)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

#nav{position:absolute;z-index:900;left:0;right:0;bottom:0;display:flex;background:var(--enamel);padding:0 max(4px,var(--sar)) var(--sab) max(4px,var(--sal));box-shadow:0 -2px 0 rgba(245,242,233,.75)}
#nav.dim{opacity:.35;pointer-events:none}
.nav-b{position:relative;flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.nav-b.on{color:var(--paper)}
.nav-b.on::after{content:"";position:absolute;bottom:4px;width:22px;height:3px;border-radius:2px;background:var(--yellow)}
.nav-b .ic{width:26px;height:26px}
.nav-build .ic{background:var(--yellow);color:var(--ink);border-radius:50%;padding:3px}
.dot{position:absolute;top:8px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--enamel)}

#sheet{position:absolute;z-index:950;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab));max-height:min(74%,calc(100% - 140px - var(--sat)));display:flex;flex-direction:column;background:var(--enamel);border-radius:12px 12px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.45);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px max(10px,var(--sar)) 8px max(16px,var(--sal));border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0;display:flex;align-items:center;gap:4px;margin:0;font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.sheet-h h2 span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;margin-left:6px;font-size:18px}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:8px max(16px,var(--sar)) 18px max(16px,var(--sal))}

#card{position:absolute;z-index:940;left:max(10px,var(--sal));right:max(10px,var(--sar));bottom:calc(var(--nav-h) + var(--sab) + 10px);max-width:460px;margin:0 auto;background:var(--enamel);border-radius:10px;padding:10px 12px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);animation:up .18s ease-out;max-height:55%;overflow:auto}
.card-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card-t{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:4px}
.card-t b{font:700 18px/1.1 var(--f-display)}
.card-h .plate{flex:1;min-width:0}
.sub{color:var(--muted);margin:4px 0 8px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.fillbar{height:8px;background:var(--ink);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.fillbar i{display:block;height:100%}
.note{font-size:13.5px;color:var(--muted);margin:8px 0;padding:8px 10px;background:rgba(11,24,52,.55);border-radius:var(--r)}
.note.ok{color:var(--ok)}.note.warn{color:var(--warn)}.note.bad{color:#FF8A82}

#buildbar{position:absolute;z-index:960;left:max(10px,var(--sal));right:max(10px,var(--sar));bottom:calc(var(--nav-h) + var(--sab) + 10px);max-width:460px;margin:0 auto;display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--enamel);padding:8px 8px 8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 2px var(--yellow)}
.bb-t{display:flex;align-items:center;gap:8px;min-width:0}
.bb-t b{font:700 17px/1.1 var(--f-display);display:block}
.bb-a{display:flex;align-items:center;gap:2px;flex:none}

#modal{position:fixed;inset:0;z-index:1200;background:rgba(5,12,28,.72);display:flex;align-items:flex-end;justify-content:center;padding:calc(20px + var(--sat)) 0 0}
.modal-box{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--enamel);border-radius:14px 14px 0 0;padding:16px max(16px,var(--sar)) calc(16px + var(--sab)) max(16px,var(--sal));animation:up .22s ease-out}
.big-num{font:700 40px/1 var(--f-display);margin:10px 0}

/* contenus de panneaux */
.sec{font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--yellow);margin:18px 0 6px}
.lrow{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
.lrow-t{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:6px;font-weight:600;overflow-wrap:anywhere}
.lrow-t small{font-weight:400}
.lrow-v{text-align:right;font-size:13px;color:var(--muted);flex:none}
.lrow-v b{color:var(--paper);font:700 17px/1 var(--f-display)}
.tag{font-style:normal;font-size:11.5px;padding:1px 6px;border-radius:3px;background:var(--enamel-3);color:var(--paper);margin-left:4px}
.tag.ok{background:rgba(61,220,132,.18);color:var(--ok)}.tag.warn{background:rgba(255,176,32,.18);color:var(--warn)}.tag.bad{background:rgba(240,72,62,.2);color:#FF8A82}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 4px}
.kpis>div{background:var(--ink);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis b{font:700 21px/1.1 var(--f-display);overflow-wrap:anywhere}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow>div:first-child{min-width:0;display:flex;flex-direction:column}
.stepper{display:flex;align-items:center;background:var(--ink);border-radius:var(--r);flex:none}
.stepper button{width:40px;height:38px;font:700 22px/1 var(--f-display);color:var(--yellow)}
.stepper b{min-width:56px;text-align:center;font:700 16px/1 var(--f-display)}
.catrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin:4px 0;border-radius:var(--r);background:var(--enamel-2)}
.catrow span{display:flex;flex-direction:column;min-width:0}
.catrow em{font:700 16px/1 var(--f-display);font-style:normal;color:var(--yellow);flex:none}
.catrow.on{box-shadow:inset 0 0 0 2px var(--yellow)}
details.cat{margin:8px 0}
details.cat summary{display:flex;align-items:center;gap:6px;font:600 16px/1 var(--f-display);color:var(--yellow);padding:8px 0;cursor:pointer;list-style:none}
details.cat summary::-webkit-details-marker{display:none}
select{font:inherit;color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.tgl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tgl input{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--ink);position:relative;flex:none;border:1px solid var(--line);margin:0}
.tgl input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.15s}
.tgl input:checked{background:var(--yellow)}
.tgl input:checked::after{left:20px;background:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px rgba(245,242,233,.35)}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.stops{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;font-size:13px;color:var(--muted);margin:2px 0 10px}
.stops span{display:inline-flex;align-items:center}
.stops i{display:inline-block;width:14px;height:2px;background:var(--muted);margin:0 6px}
.modecard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin:8px 0;border-radius:8px;background:var(--enamel-2);box-shadow:inset 0 0 0 1px var(--line)}
.modecard .pict{margin-top:2px;width:auto;min-width:34px;height:30px}
.modecard .pict-metro,.modecard .pict-boat{width:30px;min-width:30px}
.modecard>span:last-child{display:flex;flex-direction:column;gap:3px}
.modecard b{font:700 19px/1 var(--f-display)}
.empty{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.zrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.zrow-t{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.tblw{overflow-x:auto;margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child{text-align:left;font-weight:500;color:var(--muted)}
.tbl thead th{font:600 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl tr.tot th,.tbl tr.tot td{font:700 16px/1 var(--f-display);color:var(--paper)}
.tbl.lines tbody tr{cursor:pointer}
.tbl.mini{margin:10px 0}
.chart{background:var(--ink);border-radius:var(--r);padding:8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 9px var(--f-display);fill:var(--muted)}
.chart .axis{stroke:rgba(245,242,233,.3);stroke-width:1}
.evrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.evrow .ic{color:var(--yellow);margin-top:2px}
.evrow.bad .ic{color:var(--warn)}
.evrow div{display:flex;flex-direction:column;gap:2px}
.wxbig{display:flex;gap:12px;align-items:center;background:var(--ink);padding:12px;border-radius:8px}
.wxbig .ic{width:34px;height:34px;color:var(--yellow)}
.wxbig div{display:flex;flex-direction:column}
.wxbig b{font:700 20px/1.1 var(--f-display)}
.jrow{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){#sheet{left:auto;right:16px;width:440px;bottom:calc(var(--nav-h) + var(--sab) + 10px);border-radius:12px}}
</style>
</head>
<body>
<div id="start"><div id="startBox"></div></div>
<div id="game" hidden>
  <div id="map"></div>
  <header id="top">
    <button class="icon-b" id="btnMenu" data-act="menu" aria-label="Menu"></button>
    <div class="tplate" id="cash"></div>
    <div class="tplate" id="clock"></div>
    <div id="wx"></div>
    <div class="speed"><button id="btnPlay" data-act="play" aria-label="Pause"></button><button id="btnSpeed" data-act="speed" aria-label="Vitesse">×1</button></div>
  </header>
  <div id="chip" hidden></div>
  <div id="card" hidden></div>
  <div id="buildbar" hidden></div>
  <section id="sheet" hidden><div class="sheet-h"><h2 id="sheetTitle"></h2><button class="icon-b" data-act="closeSheet" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-b" id="sheetBody"></div></section>
  <nav id="nav"></nav>
</div>
<div id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   CORRESPONDANCE — cœur : utilitaires, géographie, données réelles,
   cache, monde (zones + réseaux), itinéraires
   ===================================================================== */

const EARTH = 40075016.686;
const G = { s: null, w: null, map: null, speed: 1, paused: false, ready: false };

/* ---------- utilitaires ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function hash32(n) {
  n = n | 0;
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return (n ^ (n >>> 16)) >>> 0;
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rnd01 = (seed) => hash32(seed) / 4294967296;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const lonToMx = (lon) => (lon + 180) / 360;
function latToMy(lat) {
  const s = Math.sin((lat * Math.PI) / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}
const mxToLon = (mx) => mx * 360 - 180;
function myToLat(my) {
  const n = Math.PI - 2 * Math.PI * my;
  return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}
const mPerUnit = (lat) => EARTH * Math.cos((lat * Math.PI) / 180);
/** distance en mètres entre deux points mercator (échelle locale de la partie) */
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by) * G.mpu;
const meters = (m) => m / G.mpu; // mètres -> unités mercator

function fmtInt(n) { return Math.round(n).toLocaleString('fr-FR'); }
function fmtEur(n, exact) {
  const a = Math.abs(n);
  if (exact || a < 10000) return Math.round(n).toLocaleString('fr-FR') + ' €';
  if (a < 1e6) return (n / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' k€';
  return (n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: a < 1e7 ? 2 : 1 }) + ' M€';
}
function fmtKm(m) { return (m / 1000).toLocaleString('fr-FR', { maximumFractionDigits: m < 10000 ? 1 : 0 }) + ' km'; }
function fmtPct(x) { return Math.round(x * 100) + ' %'; }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Tas binaire (A*) */
class Heap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v;
    let i = k.length; k.push(key); v.push(val);
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (k[p] <= key) break;
      k[i] = k[p]; v[i] = v[p]; i = p;
    }
    k[i] = key; v[i] = val;
  }
  pop() {
    const k = this.k, v = this.v;
    const top = v[0];
    const lk = k.pop(), lv = v.pop();
    if (k.length) {
      let i = 0; const n = k.length;
      while (true) {
        let c = 2 * i + 1;
        if (c >= n) break;
        if (c + 1 < n && k[c + 1] < k[c]) c++;
        if (k[c] >= lk) break;
        k[i] = k[c]; v[i] = v[c]; i = c;
      }
      k[i] = lk; v[i] = lv;
    }
    return top;
  }
}

/* ---------- cache IndexedDB ---------- */
const Cache = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('correspondance', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(key, maxAgeDays = 90) {
    try {
      const db = await this.open();
      const v = await new Promise((res) => {
        const q = db.transaction('kv').objectStore('kv').get(key);
        q.onsuccess = () => res(q.result);
        q.onerror = () => res(undefined);
      });
      if (!v) return undefined;
      if (Date.now() - v.t > maxAgeDays * 864e5) return undefined;
      return v.d;
    } catch (e) { return undefined; }
  },
  async set(key, d) {
    try {
      const db = await this.open();
      await new Promise((res) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put({ t: Date.now(), d }, key);
        tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
      });
    } catch (e) { /* stockage plein ou indisponible : on continue sans cache */ }
  },
};

/* ---------- accès réseau ---------- */
async function fetchJSON(url, opts = {}, timeout = 60000) {
  const ac = new AbortController();
  const tm = setTimeout(() => ac.abort(), timeout);
  try {
    const r = await fetch(url, { ...opts, signal: ac.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];
const HW = 'motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link|busway';

const API = {
  async searchCommunes(q) {
    const u = 'https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(q) +
      '&fields=nom,code,codesPostaux,population,centre,codeDepartement&boost=population&limit=8';
    return fetchJSON(u, {}, 15000);
  },
  async communePop(code) {
    const k = 'pop:' + code;
    const c = await Cache.get(k, 365);
    if (c !== undefined) return c;
    let pop = null;
    try {
      const j = await fetchJSON('https://geo.api.gouv.fr/communes/' + code + '?fields=population', {}, 15000);
      pop = j && j.population;
    } catch (e) {
      try {
        const j = await fetchJSON('https://geo.api.gouv.fr/communes?code=' + code + '&type=arrondissement-municipal&fields=population', {}, 15000);
        pop = j && j[0] && j[0].population;
      } catch (e2) { /* pas grave */ }
    }
    if (pop) await Cache.set(k, pop);
    return pop || null;
  },
  async irisBBox(s, w, n, e) {
    const u = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature' +
      '&TYPENAMES=STATISTICALUNITS.IRIS:contours_iris&OUTPUTFORMAT=application/json&COUNT=3000' +
      '&BBOX=' + [s, w, n, e].map((x) => x.toFixed(5)).join(',') + ',urn:ogc:def:crs:EPSG::4326';
    return fetchJSON(u, {}, 60000);
  },
  async communesDept(dep) {
    const u = 'https://geo.api.gouv.fr/departements/' + dep +
      '/communes?fields=nom,code,population,surface&format=geojson&geometry=contour';
    return fetchJSON(u, {}, 60000);
  },
  async deptAt(lat, lon) {
    const j = await fetchJSON('https://geo.api.gouv.fr/communes?lat=' + lat + '&lon=' + lon + '&fields=codeDepartement', {}, 15000);
    return j && j[0] && j[0].codeDepartement;
  },
  async overpass(s, w, n, e) {
    const bb = [s, w, n, e].map((x) => x.toFixed(5)).join(',');
    const q = `[out:json][timeout:120][bbox:${bb}];
(way[highway~"^(${HW})$"];way[railway=rail][!service];way[waterway~"^(river|canal)$"];)->.l;
.l out body qt;
.l >;
out skel qt;
nwr[railway~"^(station|halt)$"];out center tags qt;
nwr[amenity~"^(school|college|university|hospital|townhall|marketplace|cinema|theatre|library)$"];out center tags qt;
nwr[shop~"^(mall|department_store|supermarket)$"];out center tags qt;
nwr[tourism~"^(attraction|museum)$"];out center tags qt;`;
    let lastErr;
    for (let attempt = 0; attempt < 6; attempt++) {
      const ep = OVERPASS[attempt % OVERPASS.length];
      try {
        return await fetchJSON(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(q),
        }, 150000);
      } catch (e) {
        lastErr = e;
        await sleep(1500 + attempt * 2500);
      }
    }
    throw lastErr || new Error('Overpass indisponible');
  },
};

/* ---------- grille de chargement ---------- */
const CH_LAT = 0.03, CH_LON = 0.04;
const chunkOf = (lat, lon) => [Math.floor(lat / CH_LAT), Math.floor(lon / CH_LON)];
const chunkBox = (i, j) => ({ s: i * CH_LAT, n: (i + 1) * CH_LAT, w: j * CH_LON, e: (j + 1) * CH_LON });
function chunksForMercBox(b, pad = 0) {
  const s = myToLat(b.maxy), n = myToLat(b.miny), w = mxToLon(b.minx), e = mxToLon(b.maxx);
  const [i0, j0] = chunkOf(s, w), [i1, j1] = chunkOf(n, e);
  const out = [];
  for (let i = i0 - pad; i <= i1 + pad; i++) for (let j = j0 - pad; j <= j1 + pad; j++) out.push([i, j]);
  return out;
}

/* ---------- réseaux (routes, rail, fleuves) ---------- */
const GCELL = 2e-6; // ~50 m
const ROAD_CLS = {
  motorway: 0, trunk: 0, motorway_link: 0, trunk_link: 0,
  primary: 1, primary_link: 1, secondary: 2, secondary_link: 2, tertiary: 3, tertiary_link: 3,
};
const ROAD_KMH = {
  motorway: 110, trunk: 90, motorway_link: 60, trunk_link: 50, primary: 50, primary_link: 40,
  secondary: 50, secondary_link: 40, tertiary: 45, tertiary_link: 40, unclassified: 40,
  residential: 30, living_street: 15, busway: 45,
};

class Net {
  constructor(kind) {
    this.kind = kind;
    this.idx = new Map(); this.ids = [];
    this.x = []; this.y = []; this.adj = [];
    this.ea = []; this.eb = []; this.len = []; this.cls = []; this.spd = []; this.name = [];
    this.seen = new Set(); this.pair = new Map(); this.grid = new Map();
    this.dens = []; this.zone = []; this.noise = []; this.traffic = [];
    this.version = 0;
  }
  get nE() { return this.ea.length; }
  node(id, mx, my) {
    let i = this.idx.get(id);
    if (i !== undefined) return i;
    i = this.x.length;
    this.idx.set(id, i); this.ids.push(id); this.x.push(mx); this.y.push(my); this.adj.push([]);
    const k = Math.floor(mx / GCELL) + ',' + Math.floor(my / GCELL);
    let c = this.grid.get(k); if (!c) { c = []; this.grid.set(k, c); } c.push(i);
    return i;
  }
  edge(a, b, cls, kmh, name, key) {
    if (this.seen.has(key) || a === b) return;
    this.seen.add(key);
    const e = this.ea.length;
    this.ea.push(a); this.eb.push(b);
    this.len.push(dist(this.x[a], this.y[a], this.x[b], this.y[b]));
    this.cls.push(cls); this.spd.push(kmh / 3.6); this.name.push(name || '');
    this.dens.push(-1); this.zone.push(null);
    this.noise.push(0.7 + 0.6 * rnd01(hashStr(key)));
    this.traffic.push(0.2);
    this.adj[a].push(e); this.adj[b].push(e);
    this.pair.set(this.ids[a] + '_' + this.ids[b], e);
    this.pair.set(this.ids[b] + '_' + this.ids[a], e);
  }
  other(e, u) { return this.ea[e] === u ? this.eb[e] : this.ea[e]; }
  nearest(mx, my, maxM, accept) {
    const r = Math.ceil(meters(maxM) / GCELL);
    const cx = Math.floor(mx / GCELL), cy = Math.floor(my / GCELL);
    let best = -1, bd = Infinity;
    for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
      const c = this.grid.get((cx + dx) + ',' + (cy + dy));
      if (!c) continue;
      for (const i of c) {
        const d = (this.x[i] - mx) ** 2 + (this.y[i] - my) ** 2;
        if (d < bd && (!accept || accept(i))) { bd = d; best = i; }
      }
    }
    if (best < 0) return -1;
    return Math.sqrt(bd) * G.mpu <= maxM ? best : -1;
  }
}

/** A* (coût = temps pour la route, distance sinon). Renvoie {nodes, edges, len} ou null */
function route(net, from, to, maxIter = 400000) {
  if (from === to) return { nodes: [from], edges: [], len: 0 };
  const n = net.x.length;
  const g = new Float64Array(n).fill(Infinity);
  const prevE = new Int32Array(n).fill(-1);
  const closed = new Uint8Array(n);
  const tx = net.x[to], ty = net.y[to];
  const vmax = net.kind === 'road' ? 30 : 1;
  const h = (i) => (Math.hypot(net.x[i] - tx, net.y[i] - ty) * G.mpu) / vmax;
  const heap = new Heap();
  g[from] = 0; heap.push(h(from), from);
  let it = 0;
  while (heap.size && it++ < maxIter) {
    const u = heap.pop();
    if (closed[u]) continue;
    if (u === to) break;
    closed[u] = 1;
    for (const e of net.adj[u]) {
      const v = net.other(e, u);
      if (closed[v]) continue;
      let c = net.len[e];
      if (net.kind === 'road') {
        c = c / net.spd[e];
        if (net.cls[e] === 0) c *= 1.4; // les bus évitent un peu les voies rapides
      }
      const ng = g[u] + c;
      if (ng < g[v]) { g[v] = ng; prevE[v] = e; heap.push(ng + h(v), v); }
    }
  }
  if (!isFinite(g[to])) return null;
  const nodes = [to], edges = [];
  let cur = to, L = 0;
  while (cur !== from) {
    const e = prevE[cur];
    if (e < 0) return null;
    edges.push(e); L += net.len[e];
    cur = net.other(e, cur); nodes.push(cur);
  }
  nodes.reverse(); edges.reverse();
  return { nodes, edges, len: L };
}

/* ---------- géométrie des zones ---------- */
function ringArea(r) {
  let a = 0;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]);
  return a / 2;
}
function pointInRings(x, y, rings) {
  let inside = false;
  for (const r of rings) {
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
  }
  return inside;
}

const ZCELL = 4e-5; // ~1 km
const IRIS_TYPES = { H: 'Habitat', A: 'Activité', D: 'Divers', Z: 'Commune' };

/* ---------- le monde ---------- */
class World {
  constructor() {
    this.zones = new Map();
    this.zgrid = new Map();
    this.vkeys = new Map();
    this.road = new Net('road'); this.rail = new Net('rail'); this.water = new Net('water');
    this.pois = []; this.poiSeen = new Set();
    this.zoneChunks = new Set(); this.roadChunks = new Set();
    this.mode = 'iris';
    this.deptsLoaded = new Set();
    this.version = 0;
  }

  addZone(z) {
    if (this.zones.has(z.code)) return false;
    let area = 0, minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    let cx = 0, cy = 0, best = 0;
    z.rings.forEach((r, k) => {
      const a = ringArea(r);
      area += z.outer[k] ? Math.abs(a) : -Math.abs(a);
      for (const p of r) {
        if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
        if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
      }
      if (z.outer[k] && Math.abs(a) > best) {
        best = Math.abs(a);
        let sx = 0, sy = 0, sa = 0;
        for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
          const f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
          sx += (r[j][0] + r[i][0]) * f; sy += (r[j][1] + r[i][1]) * f; sa += f;
        }
        if (Math.abs(sa) > 1e-20) { cx = sx / (3 * sa); cy = sy / (3 * sa); }
        else { cx = r[0][0]; cy = r[0][1]; }
      }
    });
    z.bbox = { minx, miny, maxx, maxy };
    z.areaKm2 = Math.max(0.01, Math.abs(area) * G.mpu * G.mpu / 1e6);
    if (!pointInRings(cx, cy, z.rings)) {
      // centroïde hors du polygone (forme en C) : on prend un sommet intérieur approximatif
      const r = z.rings[0]; cx = (r[0][0] + r[Math.floor(r.length / 2)][0]) / 2; cy = (r[0][1] + r[Math.floor(r.length / 2)][1]) / 2;
      if (!pointInRings(cx, cy, z.rings)) { cx = r[0][0]; cy = r[0][1]; }
    }
    z.cx = cx; z.cy = cy;
    z.neighbors = new Set();
    this.estimate(z);
    this.zones.set(z.code, z);
    for (let gx = Math.floor(minx / ZCELL); gx <= Math.floor(maxx / ZCELL); gx++)
      for (let gy = Math.floor(miny / ZCELL); gy <= Math.floor(maxy / ZCELL); gy++) {
        const k = gx + ',' + gy; let c = this.zgrid.get(k); if (!c) { c = []; this.zgrid.set(k, c); } c.push(z.code);
      }
    for (const r of z.rings) for (let i = 0; i < r.length; i += 1) {
      const k = Math.round(r[i][0] * 1e6) + ':' + Math.round(r[i][1] * 1e6);
      let s = this.vkeys.get(k);
      if (!s) { s = new Set(); this.vkeys.set(k, s); }
      for (const o of s) if (o !== z.code) { z.neighbors.add(o); const oz = this.zones.get(o); if (oz) oz.neighbors.add(z.code); }
      s.add(z.code);
    }
    return true;
  }

  estimate(z) {
    const r = rnd01(hashStr(z.code));
    if (z.type === 'H') { z.pop = 2300 * (0.75 + 0.5 * r); z.jobs = z.pop * 0.35; }
    else if (z.type === 'A') { z.pop = 650 * (0.6 + 0.8 * r); z.jobs = 3500 * (0.7 + 0.6 * r); }
    else if (z.type === 'D') { z.pop = 120 * (0.5 + r); z.jobs = 300 * (0.5 + r); }
    else { z.pop = z.pop || 1500; z.jobs = z.pop * 0.4; }
    this.reprice(z);
  }
  reprice(z) {
    z.density = z.pop / z.areaKm2;
    z.jobDensity = z.jobs / z.areaKm2;
    const raw = 110000 + z.density * 32 + z.jobDensity * 14 + Math.min(z.pop, 30000) * 18;
    z.price = Math.round(clamp(raw, 90000, 6e6) * (G.s ? G.s.costMul : 1) / 10000) * 10000;
  }

  zoneAt(mx, my) {
    const c = this.zgrid.get(Math.floor(mx / ZCELL) + ',' + Math.floor(my / ZCELL));
    if (!c) return null;
    for (const code of c) {
      const z = this.zones.get(code); const b = z.bbox;
      if (mx < b.minx || mx > b.maxx || my < b.miny || my > b.maxy) continue;
      if (pointInRings(mx, my, z.rings)) return z;
    }
    return null;
  }
  densAt(mx, my) { const z = this.zoneAt(mx, my); return z ? z : null; }

  /* ---- ingestion IRIS ---- */
  ingestIris(gj) {
    let added = 0;
    for (const f of gj.features || []) {
      const p = f.properties || {}; const g = f.geometry;
      if (!g || !p.code_iris) continue;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
      const rings = [], outer = [];
      for (const poly of polys) poly.forEach((ring, k) => {
        const step = ring.length > 400 ? 2 : 1;
        const rr = [];
        for (let i = 0; i < ring.length; i += step) rr.push([lonToMx(ring[i][0]), latToMy(ring[i][1])]);
        rings.push(rr); outer.push(k === 0);
      });
      if (!rings.length) continue;
      const type = (p.type_iris || 'Z').toUpperCase();
      const z = {
        code: p.code_iris, insee: p.code_insee, commune: p.nom_commune || '',
        name: (type === 'Z' || /non iris/i.test(p.nom_iris || '')) ? (p.nom_commune || p.nom_iris) : (p.nom_iris || p.nom_commune),
        type: IRIS_TYPES[type] ? type : 'Z', rings, outer, owned: false,
      };
      if (this.addZone(z)) added++;
    }
    return added;
  }
  ingestCommunes(gj) {
    let added = 0;
    for (const f of gj.features || []) {
      const p = f.properties || {}; const g = f.geometry;
      if (!g) continue;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
      const rings = [], outer = [];
      for (const poly of polys) poly.forEach((ring, k) => { rings.push(ring.map((c) => [lonToMx(c[0]), latToMy(c[1])])); outer.push(k === 0); });
      const z = { code: 'C' + p.code, insee: p.code, commune: p.nom, name: p.nom, type: 'Z', pop: p.population || 800, rings, outer, owned: false };
      if (this.addZone(z)) added++;
    }
    return added;
  }

  /* ---- ingestion OpenStreetMap ---- */
  ingestOSM(json) {
    const nodes = new Map();
    for (const el of json.elements) if (el.type === 'node' && el.lat !== undefined) nodes.set(el.id, el);
    for (const el of json.elements) {
      const t = el.tags;
      if (!t) continue;
      if (el.type === 'way' && el.nodes) {
        let net = null, cls = 4, kmh = 30;
        if (t.highway) {
          net = this.road;
          cls = ROAD_CLS[t.highway] ?? 4;
          kmh = ROAD_KMH[t.highway] || 30;
          const ms = parseInt(t.maxspeed, 10); if (ms > 4 && ms < 140) kmh = ms;
        } else if (t.railway === 'rail') {
          if (t.usage === 'industrial' || t.usage === 'military' || t.usage === 'test') continue;
          net = this.rail; cls = 0; kmh = 120;
          const ms = parseInt(t.maxspeed, 10); if (ms > 20 && ms < 330) kmh = ms;
        } else if (t.waterway) { net = this.water; cls = 0; kmh = 20; }
        if (!net) continue;
        const name = t.name || t.ref || '';
        let prev = -1;
        for (let k = 0; k < el.nodes.length; k++) {
          const nd = nodes.get(el.nodes[k]);
          if (!nd) { prev = -1; continue; }
          const i = net.node(el.nodes[k], lonToMx(nd.lon), latToMy(nd.lat));
          if (prev >= 0) net.edge(prev, i, cls, kmh, name, el.id + ':' + k);
          prev = i;
        }
        net.version++;
      }
      const isPoi = t.amenity || t.shop || t.tourism || (t.railway === 'station' || t.railway === 'halt');
      if (isPoi) {
        const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
        if (lat === undefined) continue;
        const key = el.type + el.id;
        if (this.poiSeen.has(key)) continue;
        this.poiSeen.add(key);
        let kind = t.amenity || t.shop || t.tourism || 'station';
        let train = false;
        if (t.railway === 'station' || t.railway === 'halt') {
          kind = 'station';
          train = t.station !== 'subway' && t.station !== 'light_rail' && t.subway !== 'yes' && t.station !== 'monorail';
          if (!train) kind = 'metro_station';
        }
        this.pois.push({ mx: lonToMx(lon), my: latToMy(lat), kind, name: t.name || '', w: POI_W[kind] || 300, train });
      }
    }
    this.version++;
  }

  /** Recalcule la densité rattachée à chaque tronçon routier (après ajout de zones ou de routes) */
  attachDensity(all = false) {
    const n = this.road;
    for (let e = 0; e < n.nE; e++) {
      if (!all && n.dens[e] >= 0) continue;
      const mx = (n.x[n.ea[e]] + n.x[n.eb[e]]) / 2, my = (n.y[n.ea[e]] + n.y[n.eb[e]]) / 2;
      const z = this.zoneAt(mx, my);
      n.dens[e] = z ? z.density + z.jobDensity * 0.5 : 250;
      n.zone[e] = z ? z.code : null;
    }
  }

  poisNear(mx, my, rM) {
    const r2 = meters(rM) ** 2; const out = [];
    for (const p of this.pois) if ((p.mx - mx) ** 2 + (p.my - my) ** 2 < r2) out.push(p);
    return out;
  }
  ownedBox() {
    let b = null;
    for (const z of this.zones.values()) if (z.owned) {
      if (!b) b = { ...z.bbox };
      else { b.minx = Math.min(b.minx, z.bbox.minx); b.miny = Math.min(b.miny, z.bbox.miny); b.maxx = Math.max(b.maxx, z.bbox.maxx); b.maxy = Math.max(b.maxy, z.bbox.maxy); }
    }
    return b;
  }
  purchasable(z) {
    if (z.owned) return false;
    for (const c of z.neighbors) { const o = this.zones.get(c); if (o && o.owned) return true; }
    return false;
  }
}

/* ---------- gestionnaire de chargement ---------- */
const Loader = {
  busy: 0,
  failures: 0,
  listeners: [],
  status(msg) { for (const f of this.listeners) f(msg); },

  async zonesFor(chunks) {
    const w = G.w; let added = 0;
    for (const [i, j] of chunks) {
      const key = i + ':' + j;
      if (w.zoneChunks.has(key)) continue;
      const b = chunkBox(i, j);
      this.busy++; this.status('Quartiers IGN…');
      try {
        if (w.mode === 'iris') {
          let gj = await Cache.get('iris:' + key);
          if (!gj) {
            try { gj = await API.irisBBox(b.s, b.w, b.n, b.e); await Cache.set('iris:' + key, gj); }
            catch (e) {
              this.failures++;
              if (this.failures >= 2 && w.zones.size === 0) { w.mode = 'commune'; }
              else throw e;
            }
          }
          if (gj) added += w.ingestIris(gj);
        }
        if (w.mode === 'commune') {
          const dep = await API.deptAt((b.s + b.n) / 2, (b.w + b.e) / 2).catch(() => null);
          if (dep && !w.deptsLoaded.has(dep)) {
            let gj = await Cache.get('dep:' + dep);
            if (!gj) { gj = await API.communesDept(dep); await Cache.set('dep:' + dep, gj); }
            w.deptsLoaded.add(dep);
            added += w.ingestCommunes(gj);
          }
        }
        w.zoneChunks.add(key);
      } catch (e) {
        console.warn('zones', key, e);
        UI.toast('Quartiers indisponibles pour le moment, nouvel essai plus tard.', 'warn');
      } finally { this.busy--; }
    }
    if (added) {
      // populations communales pour les communes non découpées
      for (const z of w.zones.values()) if (z.type === 'Z' && !z.popFetched && w.mode === 'iris') {
        z.popFetched = true;
        API.communePop(z.insee).then((p) => { if (p) { z.pop = p; z.jobs = p * 0.4; w.reprice(z); Render.dirty = true; } });
      }
      w.attachDensity(true);
      w.version++;
      Render.dirty = true;
    }
    this.status(null);
    return added;
  },

  async roadsFor(chunks) {
    const w = G.w; let n = 0;
    for (const [i, j] of chunks) {
      const key = i + ':' + j;
      if (w.roadChunks.has(key)) continue;
      w.roadChunks.add(key);
      const b = chunkBox(i, j);
      this.busy++; this.status('Routes OpenStreetMap…');
      try {
        let js = await Cache.get('osm:' + key);
        if (!js) { js = await API.overpass(b.s, b.w, b.n, b.e); await Cache.set('osm:' + key, js); }
        w.ingestOSM(js);
        w.attachDensity(false);
        n++;
        Render.dirty = true;
        Sim.onNetworkGrow();
      } catch (e) {
        console.warn('osm', key, e);
        w.roadChunks.delete(key);
        UI.toast('Routes indisponibles (serveur OpenStreetMap saturé). Nouvel essai dans 1 min.', 'warn');
        setTimeout(() => Loader.ensureAround(), 60000);
      } finally { this.busy--; }
    }
    this.status(null);
    return n;
  },

  /** S'assure que les données autour du territoire possédé sont chargées */
  async ensureAround() {
    const w = G.w; const b = w.ownedBox();
    if (!b) return;
    await this.zonesFor(chunksForMercBox(b, 1));
    const roadChunks = [];
    for (const z of w.zones.values()) if (z.owned) for (const c of chunksForMercBox(z.bbox, 0)) roadChunks.push(c);
    const uniq = [...new Map(roadChunks.map((c) => [c.join(':'), c])).values()];
    await this.roadsFor(uniq);
  },
};
