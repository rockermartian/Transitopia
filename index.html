        else { const N = o.length / 2, r = new Float32Array(o.length); for (let i = 0; i < N; i++) { r[2 * i] = o[2 * (N - 1 - i)]; r[2 * i + 1] = o[2 * (N - 1 - i) + 1]; } PB.off = r; }
      }
    }
  },
  /** facteur de zoom des lignes (identique pour le calque statique et les véhicules) */
  lineZf(z) { return z >= 16 ? 1.35 : z >= 14 ? 1 : 0.75; },
  /** position dessinée d'un arrêt (décalé avec sa ligne) */
  stopXY(l, k, o, zf, back) {
    const P = back ? l.pathB : l.path;
    const st = l.stops[k];
    let x = (back ? st.bmx : st.mx) * o.k - o.x, y = (back ? st.bmy : st.my) * o.k - o.y;
    if (P && P.off && P.stopPt) {
      const i = back ? P.stopPt[l.stops.length - 1 - k] : P.stopPt[k];
      if (i !== undefined) { x += P.off[2 * i] * zf; y += P.off[2 * i + 1] * zf; }
    }
    return [x, y];
  },

  init() {
    const map = G.map, c = map.getContainer();
    // calque de nuit : plus grand que l'écran (marges) pour couvrir les bords pendant un glissement
    this.cvN = document.createElement('canvas'); this.cvN.className = 'ov ov-n';
    this.cvS = document.createElement('canvas'); this.cvS.className = 'ov ov-s';
    this.cvD = document.createElement('canvas'); this.cvD.className = 'ov ov-d';
    c.appendChild(this.cvN); c.appendChild(this.cvS); c.appendChild(this.cvD);
    this.ctxN = this.cvN.getContext('2d');
    this.ctxS = this.cvS.getContext('2d'); this.ctxD = this.cvD.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => { this.resize(); });
    map.on('resize', () => this.resize());
    map.on('movestart', () => { this.moving = true; });
    map.on('move', () => {
      if (!this.o0 || this.zooming) return;
      const o = this.origin();
      if (Math.abs(o.k - this.o0.k) > 1e-6) { this.cvS.style.opacity = '0'; return; }
      const dx = this.o0.x - o.x, dy = this.o0.y - o.y;
      this.cvS.style.transform = `translate(${dx}px,${dy}px)`;
      const oN = this.oN || this.o0, nx = oN.x - o.x, ny = oN.y - o.y;
      this.cvN.style.transform = `translate(${nx}px,${ny}px)`;
      // les calques débordent de l'écran (marges) : les lignes restent entières pendant le glissement ;
      // au-delà d'une marge, on redessine aussitôt (le voile de nuit seulement si nécessaire)
      if (this.nf > 0.02 && (Math.abs(nx) > this.W * 0.42 || Math.abs(ny) > this.H * 0.42)) this.drawStatic();
      else if (Math.abs(dx) > this.MX * 0.85 || Math.abs(dy) > this.MY * 0.85) this.drawStatic({ night: false });
    });
    map.on('moveend', () => { this.moving = false; this.dirty = true; this.drawStatic(); });
    map.on('zoomstart', () => {
      this.zooming = true; this.cvS.style.opacity = '0'; this.cvD.style.opacity = '0';
      if (this.nf > 0.02) { this.cvN.style.opacity = '0'; UI.updateTint(true); } // pendant l'animation : carte simplement assombrie
    });
    map.on('zoomend', () => { this.zooming = false; this.cvD.style.opacity = '1'; this.dirty = true; this.drawStatic(); UI.updateTint(); });
  },

  resize() {
    const c = G.map.getContainer();
    this.W = c.clientWidth; this.H = c.clientHeight;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    const cvD = this.cvD;
    cvD.width = Math.round(this.W * this.dpr); cvD.height = Math.round(this.H * this.dpr);
    cvD.style.width = this.W + 'px'; cvD.style.height = this.H + 'px';
    // calque statique avec marges (40 % de l'écran de chaque côté)
    this.MX = Math.round(this.W * 0.4); this.MY = Math.round(this.H * 0.4);
    const sw = this.W + 2 * this.MX, sh = this.H + 2 * this.MY;
    this.cvS.width = Math.round(sw * this.dpr); this.cvS.height = Math.round(sh * this.dpr);
    this.cvS.style.width = sw + 'px'; this.cvS.style.height = sh + 'px';
    this.cvS.style.left = -this.MX + 'px'; this.cvS.style.top = -this.MY + 'px';
    // nuit : lumière douce, une résolution réduite suffit (agrandie par le navigateur) ; marge d'un demi-écran de chaque côté
    this.NQ = 0.6;
    this.cvN.width = Math.round(this.W * 2 * this.NQ); this.cvN.height = Math.round(this.H * 2 * this.NQ);
    this.cvN.style.width = this.W * 2 + 'px'; this.cvN.style.height = this.H * 2 + 'px';
    this.cvN.style.left = -this.W / 2 + 'px'; this.cvN.style.top = -this.H / 2 + 'px';
    this.oN = null; // canevas vidé : le voile de nuit doit être redessiné
    this.dirty = true;
  },

  origin() {
    const m = G.map, z = m.getZoom();
    const p = m.project(m.containerPointToLatLng([0, 0]), z);
    return { x: p.x, y: p.y, k: 256 * Math.pow(2, z), z };
  },

  tick(now) {
    if (!G.ready) return;
    // à grande vitesse, le trafic change très souvent : le calque statique est rafraîchi au plus une fois par seconde
    const every = G.speed !== 'rt' && G.speed >= 20 ? 1000 : 300;
    if (this.dirty && !this.moving && !this.zooming && now - this.last > every) this.drawStatic();
    if (!this.zooming) this.drawDyn();
  },

  /* ---------- calque statique : zones, trafic, lignes, arrêts ---------- */
  drawStatic(opts) {
    if (!G.ready || this.zooming) return;
    this.dirty = false; this.last = performance.now();
    const o = this.origin(); this.o0 = o;
    // le voile de nuit n'est redessiné que s'il le faut : zoom, déplacement au-delà de sa marge,
    // luminosité qui a changé, réseau ou éclairage modifiés (pas à chaque mise à jour du trafic)
    const gs = G.s, nSig = G.w.road.version + ':' + [...G.w.zones.values()].reduce((a, z) => a + (z.owned ? 1 : 0), 0) + ':' + gs.lines.reduce((a, l) => a + l.stops.length, 0) + ':' + gs.lines.length + ':' + (gs.settings.lights !== false) + ':' + this.W + 'x' + this.H;
    const nfNow = Night.factor();
    const oN0 = this.oN;
    const doNight = !oN0 || Math.abs(oN0.k - o.k) > 1e-6 || (opts && opts.night === true) ||
      (!(opts && opts.night === false) && (Math.abs(oN0.x - o.x) > this.W * 0.3 || Math.abs(oN0.y - o.y) > this.H * 0.3 || Math.abs(nfNow - (this.nfN ?? -1)) > 0.03 ||
        // réseau qui s'agrandit : nouveau voile seulement une fois le chargement terminé
        (nSig !== this.nSig && Loader.busy === 0)));
    const ctx = this.ctxS, W = this.W, H = this.H, s = G.s, w = G.w, z = o.z, MX = this.MX, MY = this.MY;
    // coordonnées écran conservées ; le canevas couvre aussi les marges autour de l'écran
    ctx.setTransform(this.dpr, 0, 0, this.dpr, MX * this.dpr, MY * this.dpr);
    ctx.clearRect(-MX, -MY, W + 2 * MX, H + 2 * MY);
    this.cvS.style.transform = 'translate(0px,0px)'; this.cvS.style.opacity = '1';
    const vb = { minx: (o.x - MX - 0.05 * W) / o.k, maxx: (o.x + W + MX + 0.05 * W) / o.k, miny: (o.y - MY - 0.05 * H) / o.k, maxy: (o.y + H + MY + 0.05 * H) / o.k };
    const L0 = -MX - 10, R0 = W + MX + 10, T0 = -MY - 10, B0 = H + MY + 10;
    const out = (x, y, m) => x < L0 - m || y < T0 - m || x > R0 + m || y > B0 + m;
    const X = (mx) => mx * o.k - o.x, Y = (my) => my * o.k - o.y;
    const inView = (b) => !(b.maxx < vb.minx || b.minx > vb.maxx || b.maxy < vb.miny || b.miny > vb.maxy);
    const nf = Night.factor();
    this.nf = nf;
    // calque de nuit séparé : voile bleu nuit percé de trous de lumière (la photo reste en version jour)
    if (doNight) {
      const cn = this.ctxN;
      cn.setTransform(1, 0, 0, 1, 0, 0);
      cn.clearRect(0, 0, this.cvN.width, this.cvN.height);
      cn.setTransform(this.NQ, 0, 0, this.NQ, 0, 0);
      this.cvN.style.transform = 'translate(0px,0px)'; this.cvN.style.opacity = '1';
      if (nf > 0.02) Night.draw(cn, { x: o.x - W / 2, y: o.y - H / 2, k: o.k, z: o.z }, nf, W * 2, H * 2);
      this.oN = o; this.nfN = nf; this.nSig = nSig; this.nT = performance.now();
    } else if (oN0) this.cvN.style.transform = `translate(${oN0.x - o.x}px,${oN0.y - o.y}px)`;
    const za = 1 - 0.7 * nf;

    /* zones */
    if (s.settings.zones) {
      const works = new Set(Events.active().filter((e) => e.kind === 'works').map((e) => e.zone));
      const tags = [];
      for (const zn of w.zones.values()) {
        if (!inView(zn.bbox)) continue;
        const buyable = !zn.owned && w.purchasable(zn);
        ctx.beginPath();
        for (const r of zn.rings) {
          let lx = -1e9, ly = -1e9;
          r.forEach((p, i) => {
            const x = X(p[0]), y = Y(p[1]);
            if (i === 0) { ctx.moveTo(x, y); lx = x; ly = y; }
            else if (Math.abs(x - lx) + Math.abs(y - ly) > 1.2) { ctx.lineTo(x, y); lx = x; ly = y; }
          });
          ctx.closePath();
        }
        if (zn.owned) {
          if (z >= 12) { ctx.strokeStyle = nf > 0.3 ? 'rgba(255,236,200,.22)' : 'rgba(29,34,64,.16)'; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.stroke(); }
          if (works.has(zn.code)) { ctx.strokeStyle = EV_COL.works; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]); }
        } else {
          // voile blanc, visible aussi de nuit (un peu plus léger pour ne pas éblouir)
          ctx.fillStyle = `rgba(244,242,236,${((buyable ? 0.42 : 0.7) * (1 - 0.45 * nf)).toFixed(3)})`;
          ctx.fill('evenodd');
          if (buyable) {
            ctx.strokeStyle = nf > 0.3 ? 'rgba(255,214,120,.7)' : 'rgba(29,34,64,.45)'; ctx.lineWidth = nf > 0.3 ? 1.6 : 1.3; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
            if (z >= 14) tags.push(zn);
          }
        }
        if (G.ui.selZone === zn) { ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.setLineDash([]); ctx.stroke(); }
      }
      ctx.font = '600 11px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const zn of tags) {
        const x = X(zn.cx), y = Y(zn.cy), t = fmtEur(zn.price);
        const tw = ctx.measureText(t).width + 14;
        ctx.fillStyle = INK; this.rr(ctx, x - tw / 2, y - 9, tw, 18, 9); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.fillText(t, x, y + 0.5);
      }
    }

    /* trafic routier */
    const net = w.road;
    if (s.settings.traffic && net.nE) {
      const maxCls = z < 11.5 ? 1 : z < 13 ? 2 : z < 14.5 ? 3 : 4;
      const zf = z >= 17 ? 2 : z >= 16 ? 1.5 : z >= 14 ? 1 : 0.75;
      const baseW = [4, 3.2, 2.6, 2, 1.3];
      const buckets = [];
      for (let k = 0; k < 25; k++) buckets.push([]);
      const nx = net.x, ny = net.y, ea = net.ea, eb = net.eb, cls = net.cls, tr = net.traffic;
      for (let e = 0; e < net.nE; e++) {
        const c = cls[e]; if (c > maxCls) continue;
        const a = ea[e], b = eb[e];
        const x1 = nx[a] * o.k - o.x, y1 = ny[a] * o.k - o.y, x2 = nx[b] * o.k - o.x, y2 = ny[b] * o.k - o.y;
        if ((x1 < L0 && x2 < L0) || (x1 > R0 && x2 > R0) || (y1 < T0 && y2 < T0) || (y1 > B0 && y2 > B0)) continue;
        const t = tr[e];
        const bk = t < 0.45 ? 0 : t < 0.7 ? 1 : t < 0.9 ? 2 : 3;
        buckets[c * 5 + bk].push(x1, y1, x2, y2);
      }
      ctx.lineCap = 'round';
      for (let c = 4; c >= 0; c--) for (let bk = 0; bk < 5; bk++) {
        const arr = buckets[c * 5 + bk]; if (!arr.length) continue;
        ctx.beginPath();
        for (let i = 0; i < arr.length; i += 4) { ctx.moveTo(arr[i], arr[i + 1]); ctx.lineTo(arr[i + 2], arr[i + 3]); }
        // carte dessinée : les rues y sont déjà peintes, le trafic n'est qu'un fin liseré central
        const dz = G.s.settings.base === 'dessin';
        ctx.lineWidth = baseW[c] * zf * (dz ? 0.4 : 1);
        ctx.strokeStyle = TR_COL[bk];
        ctx.globalAlpha = (c === 4 ? 0.6 : 0.85) * (dz ? 0.8 : 1) * (1 - 0.55 * (this.nf || 0));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    /* voies ferrées (réelles et construites) */
    const rn = w.rail;
    if (rn.nE && z >= 11) {
      ctx.beginPath();
      for (let e = 0; e < rn.nE; e++) {
        const a = rn.ea[e], b2 = rn.eb[e];
        const x1 = X(rn.x[a]), y1 = Y(rn.y[a]), x2 = X(rn.x[b2]), y2 = Y(rn.y[b2]);
        if ((x1 < L0 && x2 < L0) || (x1 > R0 && x2 > R0) || (y1 < T0 && y2 < T0) || (y1 > B0 && y2 > B0)) continue;
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      }
      ctx.lineCap = 'butt'; ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(29,34,64,.5)'; ctx.lineWidth = z >= 15 ? 2.4 : 1.5; ctx.stroke();
      if (z >= 15) { ctx.setLineDash([1.6, 6]); ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(29,34,64,.3)'; ctx.stroke(); ctx.setLineDash([]); }
    }
    const R = G.s.rail || { stations: [], tracks: [] };
    for (const t of R.tracks) {
      ctx.beginPath();
      t.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.strokeStyle = INK; ctx.lineWidth = z >= 15 ? 3 : 2; ctx.stroke();
    }

    /* lignes (côte à côte quand elles partagent une rue ou un tunnel) */
    const zf = this.lineZf(z);
    this.ensureOffsets();
    this.drawHeat(ctx, o, zf, inView);
    const order = [...s.lines].sort((a, b) => MODE_ORDER.indexOf(a.mode) - MODE_ORDER.indexOf(b.mode));
    for (const l of order) {
      if (!l.bbox) this.lineBox(l);
      if (!inView(l.bbox)) continue;
      ctx.beginPath();
      for (const PP of [l.path, l.pathB]) {
        if (!PP) continue;
        const P = PP.pts, off = PP.off;
        let lx = -1e9, ly = -1e9;
        P.forEach((p, i) => {
          let x = X(p[0]), y = Y(p[1]);
          if (off) { x += off[2 * i] * zf; y += off[2 * i + 1] * zf; }
          if (i === 0) { ctx.moveTo(x, y); lx = x; ly = y; } else if (Math.abs(x - lx) + Math.abs(y - ly) > 0.8 || i === P.length - 1) { ctx.lineTo(x, y); lx = x; ly = y; }
        });
      }
      if (l.loop) ctx.closePath();
      const lw = LINE_W[l.mode] * zf;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.setLineDash([]);
      if (G.ui.selLine === l) { ctx.strokeStyle = 'rgba(29,34,64,.28)'; ctx.lineWidth = lw + 12; ctx.stroke(); }
      ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = lw + 3.5; ctx.stroke();
      if (l.status === 'construction') ctx.setLineDash([lw * 1.6, lw * 1.2]);
      else if (l.mode === 'boat') ctx.setLineDash([lw * 2.4, lw * 0.9]);
      ctx.strokeStyle = l.color; ctx.lineWidth = lw; ctx.globalAlpha = l.active || l.status !== 'active' ? 1 : 0.5; ctx.stroke();
      ctx.globalAlpha = 1;
      if (l.mode === 'ter') { ctx.setLineDash([lw, lw * 1.3]); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = lw * 0.28; ctx.stroke(); }
      ctx.setLineDash([]);
    }

    /* correspondances : liaison piétonne entre les quais de deux lignes */
    this.xpos = [];
    if (z >= 12.5) {
      ctx.lineCap = 'round'; ctx.setLineDash([]);
      for (const h of Transfers.hubs) {
        const [x1, y1] = this.stopXY(h.A, h.ka, o, zf), [x2, y2] = this.stopXY(h.B, h.kb, o, zf);
        if (out(x1, y1, 30) && out(x2, y2, 30)) continue;
        this.xpos.push({ x: (x1 + x2) / 2, y: (y1 + y2) / 2, h });
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = INK; ctx.lineWidth = 9 * zf; ctx.stroke();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4.6 * zf; ctx.stroke();
      }
    }

    /* arrêts + noms */
    const labels = [];
    for (const l of order) {
      if (!inView(l.bbox)) continue;
      const showNames = s.settings.names && ((l.mode === 'metro' || l.mode === 'ter') ? z >= 14 : z >= 16);
      l.stops.forEach((st, k) => {
        const [x, y] = this.stopXY(l, k, o, zf);
        if (out(x, y, 10)) return;
        ctx.setLineDash([]);
        ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = INK;
        if (l.mode === 'metro') {
          ctx.beginPath(); ctx.arc(x, y, 7 * zf, 0, 7); ctx.fill();
          ctx.lineWidth = 3.2 * zf; ctx.stroke();
        } else if (l.mode === 'ter') {
          const r = 6.5 * zf; ctx.beginPath(); ctx.rect(x - r, y - r, 2 * r, 2 * r); ctx.fill();
          ctx.lineWidth = 3 * zf; ctx.stroke();
        } else if (l.mode === 'boat') {
          const r = 8 * zf; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.9, y + r * 0.6); ctx.lineTo(x - r * 0.9, y + r * 0.6); ctx.closePath();
          ctx.fill(); ctx.lineWidth = 2.8 * zf; ctx.lineJoin = 'round'; ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(x, y, 4.6 * zf, 0, 7); ctx.fill();
          ctx.lineWidth = 2.4 * zf; ctx.stroke();
          // arrêt du sens retour, de l'autre côté de la rue
          if (st.bmx !== undefined && dist(st.bmx, st.bmy, st.mx, st.my) > 15) {
            const [bx, by] = this.stopXY(l, k, o, zf, true);
            ctx.beginPath(); ctx.arc(bx, by, 3.4 * zf, 0, 7); ctx.fill();
            ctx.lineWidth = 1.8 * zf; ctx.stroke();
          }
        }
        if (showNames) labels.push({ x, y, t: st.name, pri: l.mode === 'metro' || l.mode === 'ter' ? 0 : 1 });
      });
    }
    /* gares construites (quais orientés) */
    this.stpos = [];
    for (const g of R.stations) {
      const x = X(g.mx), y = Y(g.my);
      if (out(x, y, 20)) continue;
      this.stpos.push({ x, y, g });
      this.platform(ctx, x, y, g.ang, zf, '#FFFFFF');
      if (s.settings.names && z >= 13.5) labels.push({ x, y, t: g.name, pri: 0 });
    }

    /* lieux d'intérêt */
    this.poipos = [];
    if (s.settings.pois !== false && z >= 13.5) {
      const r = z >= 16 ? 10 : z >= 15 ? 9 : 7.5;
      const placed = [];
      const pois = w.pois.filter((p) => !p.own && POI_ICON[p.kind] && (POI_ICON[p.kind].major ? true : z >= 15.5));
      pois.sort((a, b) => (POI_ICON[b.kind].major ? 1 : 0) - (POI_ICON[a.kind].major ? 1 : 0) || b.w - a.w);
      for (const p of pois) {
        const x = X(p.mx), y = Y(p.my);
        if (out(x, y, 5)) continue;
        if (placed.some((q) => (q[0] - x) ** 2 + (q[1] - y) ** 2 < (2 * r + 3) ** 2)) continue;
        placed.push([x, y]);
        this.poipos.push({ x, y, p });
        const ic = POI_ICON[p.kind];
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = POI_CAT[ic.cat]; ctx.fill();
        ctx.lineWidth = 1.6; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
        ctx.save(); ctx.translate(x - r * 0.62, y - r * 0.62); ctx.scale(r * 1.24 / 24, r * 1.24 / 24);
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = ic.w || 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.stroke(poiPath(p.kind)); ctx.restore();
        if (s.settings.names && p.name && (ic.major ? z >= 15.5 : z >= 17)) labels.push({ x: x + r - 6, y, t: p.name, pri: 2 });
      }
    }
    labels.sort((a, b) => a.pri - b.pri);
    ctx.font = '500 12.5px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const boxes = [];
    for (const lb of labels) {
      const tw = ctx.measureText(lb.t).width + 4;
      const bx = lb.x + 11, by = lb.y - 9, bw = tw, bh = 18;
      if (boxes.some((b) => bx < b[0] + b[2] && bx + bw > b[0] && by < b[1] + b[3] && by + bh > b[1])) continue;
      boxes.push([bx, by, bw, bh]);
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 4; ctx.strokeText(lb.t, bx, by + bh / 2 + 0.5);
      ctx.fillStyle = INK; ctx.fillText(lb.t, bx, by + bh / 2 + 0.5);
    }

    /* marqueurs d'événements (touchables) */
    this.evpos = [];
    const showEv = Events.active().concat(Events.upcoming().filter((e) => (e.announce || e.kind === 'big') && e.tone > 0 && e.start - s.min < 720));
    const marks = [];
    for (const e of showEv) {
      if (e.veh && e.start <= s.min) continue; // dessiné sur le véhicule (calque dynamique)
      const pos = Events.where(e); if (!pos) continue;
      const x = X(pos[0]), y = Y(pos[1]);
      if (out(x, y, 10)) continue;
      marks.push({ x, y, e });
    }
    // vue large : les repères proches sont regroupés en une pastille numérotée
    const groups = [];
    const RC = z < 14.5 ? 46 : 0;
    for (const mk of marks) {
      const g = RC ? groups.find((q) => (q.x - mk.x) ** 2 + (q.y - mk.y) ** 2 < RC * RC) : null;
      if (g) { g.items.push(mk); g.x = (g.x * (g.items.length - 1) + mk.x) / g.items.length; g.y = (g.y * (g.items.length - 1) + mk.y) / g.items.length; }
      else groups.push({ x: mk.x, y: mk.y, items: [mk] });
    }
    for (const g of groups) {
      if (g.items.length < 2) continue;
      const worst = g.items.reduce((a, it) => (Events.tone(it.e) < Events.tone(a.e) ? it : a), g.items[0]).e;
      const col = Events.tone(worst) < 0 ? Events.color(worst) : '#FFC21A';
      ctx.beginPath(); ctx.arc(g.x, g.y, 15, 0, 7); ctx.fillStyle = INK; ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = col; ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '700 14px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(g.items.length), g.x, g.y + 1);
      this.evpos.push({ x: g.x, y: g.y, cluster: g.items.map((it) => it.e), cx: g.items.reduce((a, it) => a + it.x, 0) / g.items.length, cy: g.items.reduce((a, it) => a + it.y, 0) / g.items.length });
    }
    for (const g of groups) {
      if (g.items.length > 1) continue;
      const { x, y, e } = g.items[0];
      this.evpos.push({ x, y, e });
      const col = Events.color(e), up = e.start > s.min;
      ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = col; ctx.setLineDash(up ? [4, 3] : []); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = INK; ctx.font = '700 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Events.glyph(e), x, y + 1);
    }
  },

  /** carte de chaleur : affluence ou mécontents par arrêt, rentabilité par ligne (sous les lignes) */
  drawHeat(ctx, o, zf, inView) {
    const mode = G.s.settings.heat; if (!mode) return;
    const ls = G.s.lines;
    ctx.save();
    if (mode === 'profit') {
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const l of ls) {
        if (!l.bbox) this.lineBox(l);
        if (!inView(l.bbox)) continue;
        const res = l.today.fares + l.today.ads - l.today.ops, km = Math.max(0.5, l.path.L / 1000);
        const f = clamp(0.5 + res / km / 4000, 0, 1); // ±2 000 € par km et par jour : rouge -> vert
        const col = f < 0.5 ? `rgba(217,67,58,${(0.35 + (0.5 - f) * 0.9).toFixed(2)})` : `rgba(46,158,91,${(0.35 + (f - 0.5) * 0.9).toFixed(2)})`;
        ctx.beginPath();
        for (const PP of [l.path, l.pathB]) if (PP) PP.pts.forEach((p, i) => { const x = p[0] * o.k - o.x, y = p[1] * o.k - o.y; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.strokeStyle = col; ctx.lineWidth = (LINE_W[l.mode] + 14) * zf; ctx.stroke();
      }
    } else {
      let max = 1;
      for (const l of ls) { const a = mode === 'pax' ? l.sb : l.sm; if (a) for (const v of a) if (v > max) max = v; }
      const rgb = mode === 'pax' ? '242,183,5' : '226,86,63';
      for (const l of ls) {
        const a = mode === 'pax' ? l.sb : l.sm; if (!a) continue;
        l.stops.forEach((st, k) => {
          const v = a[k]; if (v < 0.5) return;
          const x = st.mx * o.k - o.x, y = st.my * o.k - o.y, f = Math.sqrt(v / max);
          const r = (10 + 44 * f) * zf;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, `rgba(${rgb},${(0.35 + 0.5 * f).toFixed(2)})`); g.addColorStop(1, `rgba(${rgb},0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
        });
      }
    }
    ctx.restore();
  },

  lineBox(l) {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const p of l.pathB ? l.path.pts.concat(l.pathB.pts) : l.path.pts) { if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0]; if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1]; }
    l.bbox = { minx, miny, maxx, maxy };
  },

  /* ---------- calque dynamique : véhicules, construction ---------- */
  drawDyn() {
    const tn = performance.now();
    this.fdt = this.lastDyn ? Math.min(0.1, (tn - this.lastDyn) / 1000) : 0.016;
    this.lastDyn = tn;
    const o = this.origin();
    const ctx = this.ctxD, W = this.W, H = this.H, s = G.s, z = o.z;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const X = (mx) => mx * o.k - o.x, Y = (my) => my * o.k - o.y;
    const zf = z >= 17 ? 1.6 : z >= 15.5 ? 1.25 : z >= 13 ? 1 : 0.8;
    /* feux tricolores, stops, cédez-le-passage */
    if (z >= 16 && G.w.signals.length) {
      const tSec = s.sec;
      const ref = { signal: false };
      const r = z >= 17.5 ? 4 : 3;
      for (const sg of G.w.signals) {
        const x = X(sg.mx), y = Y(sg.my);
        if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
        if (sg.t === 'sig') {
          const green = Sim.ctlWait(ref, { t: 'sig', sg }, tSec) === 0;
          ctx.beginPath(); ctx.arc(x, y, r + 1.6, 0, 7); ctx.fillStyle = INK; ctx.fill();
          ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = green ? '#3FA34D' : '#F0583A'; ctx.fill();
        } else if (z >= 17) {
          if (sg.t === 'stop') {
            ctx.beginPath();
            for (let k = 0; k < 8; k++) { const a = Math.PI / 8 + k * Math.PI / 4; ctx.lineTo(x + 5 * Math.cos(a), y + 5 * Math.sin(a)); }
            ctx.closePath(); ctx.fillStyle = '#E3051C'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(x - 5, y - 4); ctx.lineTo(x + 5, y - 4); ctx.lineTo(x, y + 5); ctx.closePath();
            ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#E3051C'; ctx.stroke();
          }
        }
      }
    }
    this.vpos = []; this.evposD = [];
    for (const l of s.lines) {
      if (!l.active) continue;
      if (l.mode === 'bus' && z < 11.5) continue;
      for (const v of l.veh) {
        if (v.hidden) continue;
        const md = MODEL[v.model];
        const p = Lines.posOf(l, v, (md.len || 12) / 2);
        let x = X(p.mx), y = Y(p.my);
        const PO = l.P[p.dir] && l.P[p.dir].off;
        if (PO) {
          const i = p.seg, j = Math.min(PO.length / 2 - 1, i + 1), t = p.t || 0, zl = this.lineZf(z);
          x += (PO[2 * i] * (1 - t) + PO[2 * j] * t) * zl; y += (PO[2 * i + 1] * (1 - t) + PO[2 * j + 1] * t) * zl;
        }
        if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
        // rotation lissée : la corde suit déjà les virages ; les demi-tours au terminus sont animés
        if (v.angD === undefined) v.angD = p.ang;
        let da = p.ang - v.angD; da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) > 1.0) {
          const rate = 7 * Math.max(1, (G.speed === 'rt' ? 1 : 60 * G.speed) / 15) * this.fdt;
          v.angD += clamp(da, -rate, rate);
        } else v.angD += da * Math.min(1, this.fdt / 0.08); // lissage léger, sans retard visible
        p.ang = v.angD;
        const cap = md.cap, f = v.load / cap;
        this.vpos.push({ x, y, l, v });
        const dims = { bus: [13, 7], metro: [19, 8.5], ter: [22, 8.5], boat: [15, 8.5] }[l.mode];
        const L2 = dims[0] * zf / 2, W2 = dims[1] * zf / 2;
        const nl = this.nf > 0.15 && Night.lightsOn() ? clamp((this.nf - 0.15) / 0.45, 0, 1) : 0;
        if (nl > 0) Night.vehicle(ctx, l, x, y, p.ang, L2, W2, zf, nl);
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.ang || 0);
        this.rr(ctx, -L2, -W2, 2 * L2, 2 * W2, l.mode === 'boat' ? W2 : Math.min(3, W2));
        ctx.fillStyle = l.color; ctx.fill();
        ctx.lineWidth = f >= 0.9 && s.settings.fill ? 2.4 : 1.4; ctx.strokeStyle = f >= 0.9 && s.settings.fill ? '#EF3E36' : '#FFFFFF'; ctx.stroke();
        if (s.settings.fill && zf >= 0.8) {
          // voyageurs à bord, en petits points blancs (6 = complet)
          const nd = v.load > 0.5 ? Math.max(1, Math.round(Math.min(1, f) * 6)) : 0;
          const dr = Math.max(1, W2 * 0.3), sx = (2 * L2) / 4;
          ctx.fillStyle = inkOn(l.color);
          for (let k = 0; k < nd; k++) {
            const cx = -L2 + sx * (1 + (k % 3)), cy = k < 3 ? -W2 * 0.42 : W2 * 0.42;
            ctx.beginPath(); ctx.arc(cx, cy, dr, 0, 7); ctx.fill();
          }
        }
        ctx.restore();
        if (v.incUntil > s.sec && v.incEv) {
          // incident en cours sur ce véhicule : pastille touchable
          const e = s.events.find((x) => x.id === v.incEv);
          if (e) {
            const bx = x + L2 + 6, by = y - L2 - 6, br = 9;
            ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
            ctx.lineWidth = 2.6; ctx.strokeStyle = Events.color(e); ctx.stroke();
            ctx.fillStyle = INK; ctx.font = '700 11px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(Events.glyph(e), bx, by + 0.5);
            this.evposD.push({ x: bx, y: by, e });
          }
        }
        if (G.ui.selVeh === v) {
          ctx.beginPath(); ctx.arc(x, y, L2 + 7, 0, 7); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
        }
      }
    }
    /* taxis et dépôt */
    Taxi.draw(ctx, X, Y, zf, z, W, H, this.nf > 0.15 && Night.lightsOn() ? clamp((this.nf - 0.15) / 0.45, 0, 1) : 0);
    /* aperçu : gare ou voie ferrée */
    const rb = RailBuild.b;
    if (rb && rb.kind === 'gare' && rb.pos) {
      this.platform(ctx, X(rb.pos[0]), Y(rb.pos[1]), rb.ang, Math.max(1.2, zf), '#FFC21A');
      const L = 34;
      ctx.save(); ctx.translate(X(rb.pos[0]), Y(rb.pos[1])); ctx.rotate(rb.ang);
      ctx.setLineDash([5, 5]); ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-L - 30, 0); ctx.lineTo(-L + 10, 0); ctx.moveTo(L - 10, 0); ctx.lineTo(L + 30, 0); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }
    if (rb && rb.kind === 'track') {
      if (rb.pts) {
        ctx.beginPath();
        rb.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 8; ctx.stroke();
        ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.setLineDash([10, 6]); ctx.stroke(); ctx.setLineDash([]);
      }
      rb.ctrl.forEach((p, i) => {
        const x = X(p[0]), y = Y(p[1]);
        const anchored = (i === 0 && rb.a) || (i === rb.ctrl.length - 1 && i > 0 && rb.end);
        ctx.beginPath(); ctx.arc(x, y, anchored ? 9 : 7, 0, 7); ctx.fillStyle = anchored ? '#FFC21A' : '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
      });
    }

    /* aperçu de construction */
    const b = Build.b;
    if (b) {
      const col = Build.color();
      // zone desservie autour de chaque arrêt (rayon d'attraction du mode)
      const rc = (MODES[b.mode].catch / G.mpu) * o.k;
      if (rc > 6) {
        ctx.save();
        for (const st of b.stops) { ctx.beginPath(); ctx.arc(X(st.mx), Y(st.my), rc, 0, 7); ctx.fillStyle = 'rgba(242,183,5,.10)'; ctx.fill(); }
        ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(29,34,64,.35)';
        for (const st of b.stops) { ctx.beginPath(); ctx.arc(X(st.mx), Y(st.my), rc, 0, 7); ctx.stroke(); }
        ctx.restore();
      }
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const sg of b.segs) {
        ctx.beginPath();
        sg.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 9; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 5.5; ctx.setLineDash([10, 6]); ctx.stroke(); ctx.setLineDash([]);
      }
      b.stops.forEach((st, i) => {
        const x = X(st.mx), y = Y(st.my);
        if (b.edit && b.sel === i) { ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fillStyle = 'rgba(242,183,5,.55)'; ctx.fill(); }
        const isNew = b.edit && !b.orig.has(Math.round(st.mx * G.mpu) + ',' + Math.round(st.my * G.mpu));
        ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fillStyle = isNew ? '#FFC21A' : '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        ctx.fillStyle = INK; ctx.font = '600 11px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x, y + 0.5);
      });
    }
  },

  /** quai de gare : rectangle orienté */
  platform(ctx, x, y, ang, zf, fill) {
    const L = 15 * zf, Wd = 5.5 * zf;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
    this.rr(ctx, -L, -Wd, 2 * L, 2 * Wd, 2.5);
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-L + 4, 0); ctx.lineTo(L - 4, 0); ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  },

  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },

  /** élément touché sur la carte */
  hit(px, py) {
    for (const it of (this.evposD || []).concat(this.evpos || [])) if ((it.x - px) ** 2 + (it.y - py) ** 2 < 22 * 22) return it.cluster ? { type: 'cluster', x: it.x, y: it.y, items: it.cluster } : { type: 'event', e: it.e };
    let best = null, bd = 24 * 24;
    for (const it of this.tpos || []) { const d = (it.x - px) ** 2 + (it.y - py) ** 2; if (d < bd) { bd = d; best = { type: 'taxi', t: it.t }; } }
    if (best) return best;
    if (this.dpos && (this.dpos.x - px) ** 2 + (this.dpos.y - py) ** 2 < 24 * 24) return { type: 'depot' };
    for (const it of this.vpos || []) { const d = (it.x - px) ** 2 + (it.y - py) ** 2; if (d < bd) { bd = d; best = { type: 'veh', ...it }; } }
    if (best) return best;
    const o = this.origin();
    bd = 20 * 20;
    for (const l of G.s.lines) l.stops.forEach((st, k) => {
      const x = st.mx * o.k - o.x, y = st.my * o.k - o.y;
      const d = (x - px) ** 2 + (y - py) ** 2;
      if (d < bd) { bd = d; best = { type: 'stop', l, k, st }; }
    });
    if (best) return best;
    for (const it of this.stpos || []) if ((it.x - px) ** 2 + (it.y - py) ** 2 < 20 * 20) return { type: 'station', g: it.g };
    for (const it of this.xpos || []) if ((it.x - px) ** 2 + (it.y - py) ** 2 < 14 * 14) return { type: 'stop', l: it.h.A, k: it.h.ka, st: it.h.A.stops[it.h.ka] };
    let bp = null, bpd = 16 * 16;
    for (const it of this.poipos || []) { const d = (it.x - px) ** 2 + (it.y - py) ** 2; if (d < bpd) { bpd = d; bp = { type: 'poi', p: it.p }; } }
    return bp;
  },
};

'use strict';
/* =====================================================================
   TRANSITOPIA — plan schématique du réseau (sans carte, façon plan de métro)
   Disposition : positions réelles, puis relaxation vers des tronçons à 0/45/90°
   et des interstations régulières ; export en image PNG à partager.
   ===================================================================== */

const Plan = {
  filter: 'all', layout: null,

  open() {
    if (!G.s.lines.length) { UI.toast('Construisez d’abord une ligne pour voir le plan du réseau.', 'info'); return; }
    UI.close(); UI.closeCard();
    let el = document.getElementById('plan');
    if (!el) {
      el = document.createElement('div'); el.id = 'plan';
      el.innerHTML = `<div class="plan-h"><button class="icon-b" data-act="planClose" aria-label="Fermer">${icon('close')}</button><b>Plan du réseau</b><button class="btn sm primary" data-act="planShare">Partager l’image</button></div>
        <div class="seg plan-f" id="planFilter"></div><div class="plan-c"><canvas id="planCv"></canvas></div>`;
      document.getElementById('game').appendChild(el);
      window.addEventListener('resize', () => { if (!el.hidden) this.draw(); });
    }
    el.hidden = false;
    document.body.classList.add('plan-open');
    this.layout = null; this.drawn = false;
    this.refresh();
  },
  close() { const el = document.getElementById('plan'); if (el) el.hidden = true; document.body.classList.remove('plan-open'); },
  setFilter(f) { this.filter = f; this.layout = null; this.drawn = false; this.refresh(); },
  modesFor(f) { return f === 'rail' ? ['metro', 'ter'] : f === 'bus' ? ['bus'] : MODE_ORDER; },
  refresh() {
    const has = (ms) => G.s.lines.some((l) => ms.includes(l.mode));
    const opts = [['all', 'Tout le réseau']];
    if (has(['metro', 'ter']) && has(['bus', 'boat'])) opts.push(['rail', 'Métro et TER']);
    if (has(['bus']) && has(['metro', 'ter', 'boat'])) opts.push(['bus', 'Bus']);
    if (!opts.some((o) => o[0] === this.filter)) this.filter = 'all';
    const fe = document.getElementById('planFilter');
    fe.hidden = opts.length < 2;
    fe.innerHTML = opts.map(([k, t]) => `<button class="${this.filter === k ? 'on' : ''}" data-act="planFilter" data-arg="${k}">${t}</button>`).join('');
    this.draw();
  },

  /* ---------- graphe : stations regroupées (arrêts proches et correspondances) ---------- */
  build(modes) {
    const lines = G.s.lines.filter((l) => modes.includes(l.mode)).sort((a, b) => MODE_ORDER.indexOf(a.mode) - MODE_ORDER.indexOf(b.mode) || a.num - b.num);
    const stops = [];
    lines.forEach((l) => l.stops.forEach((st, k) => stops.push({ l, k, st })));
    const par = stops.map((_, i) => i);
    const find = (i) => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
    const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[b] = a; };
    const idx = new Map(); stops.forEach((s, i) => idx.set(s.l.id + ':' + s.k, i));
    for (let i = 0; i < stops.length; i++) for (let j = i + 1; j < stops.length; j++) {
      if (stops[i].l === stops[j].l) continue;
      if (dist(stops[i].st.mx, stops[i].st.my, stops[j].st.mx, stops[j].st.my) <= xferWalk(stops[i].l.mode, stops[j].l.mode)) uni(i, j);
    }
    for (const h of Transfers.hubs) {
      const a = idx.get(h.A.id + ':' + h.ka), b = idx.get(h.B.id + ':' + h.kb);
      if (a !== undefined && b !== undefined) uni(a, b);
    }
    const nodes = new Map();
    stops.forEach((s, i) => {
      const r = find(i);
      let n = nodes.get(r);
      if (!n) { n = { id: nodes.size, mx: 0, my: 0, cnt: 0, names: [], lines: new Set() }; nodes.set(r, n); }
      n.mx += s.st.mx; n.my += s.st.my; n.cnt++; n.lines.add(s.l.id);
      n.names.push({ t: s.st.name, pri: MODE_ORDER.indexOf(s.l.mode) === 1 || s.l.mode === 'ter' ? 0 : 1 });
      s.node = n;
    });
    const N = [...nodes.values()];
    for (const n of N) {
      n.mx /= n.cnt; n.my /= n.cnt;
      n.names.sort((a, b) => a.pri - b.pri);
      n.base = n.names[0].t.replace(/ (II|III|IV|V|VI|\d+)$/, '');
    }

    const hitsSeg = (P, sg) => inPoly(P, sg[0], sg[1]) || inPoly(P, sg[2], sg[3]) || [0, 1, 2, 3].some((i) => segX(P[i], P[(i + 1) % 4], [sg[0], sg[1]], [sg[2], sg[3]]));
    const overlap = (A, B) => { // séparation d'axes pour deux quadrilatères convexes
      for (const P of [A, B]) for (let i = 0; i < 4; i++) {
        const nx = P[(i + 1) % 4][1] - P[i][1], ny = P[i][0] - P[(i + 1) % 4][0];
        let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
        for (const p of A) { const v = p[0] * nx + p[1] * ny; a0 = Math.min(a0, v); a1 = Math.max(a1, v); }
        for (const p of B) { const v = p[0] * nx + p[1] * ny; b0 = Math.min(b0, v); b1 = Math.max(b1, v); }
        if (a1 <= b0 || b1 <= a0) return false;
      }
      return true;
    };
    const wrap = (t, f) => {
      ctx.font = f;
      if (ctx.measureText(t).width < 8.5 * fs0 || !t.includes(' ')) return [t];
      const words = t.split(' '); let best = null;
      for (let i = 1; i < words.length; i++) {
        const l1 = words.slice(0, i).join(' '), l2 = words.slice(i).join(' ');
        const w = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width);
        if (!best || w < best.w) best = { w, lines: [l1, l2] };
      }
      return best.lines;
    };
    const order = [...N].sort((a, b) => b.lines.size - a.lines.size || b.name.length - a.name.length);
    const minY = top - 10 * s, maxY = H - bottom + 6 * s;
    const D45 = Math.PI / 4;
    for (const n of order) {
      let best = null;
      for (const scale of [1, 0.86, 0.74]) {
        const fs = fs0 * scale, font = `${n.lines.size > 1 ? 600 : 500} ${fs}px ${FONT}`;
        const lines = wrap(n.name, font);
        ctx.font = font;
        const tw = Math.max(...lines.map((l) => ctx.measureText(l).width)), th = lines.length * fs * LH;
        const g = n.r + 4 * s, pad = 2.5 * s;
        // [angle, x0, y0 (coin haut-gauche dans le repère tourné), alignement, préférence]
        const cand = [
          [0, g, -th / 2, 'left', 0], [0, -g - tw, -th / 2, 'right', 0.2],
          [-D45, g, -th / 2, 'left', 0.5], [D45, g, -th / 2, 'left', 0.6],
          [-D45, -g - tw, -th / 2, 'right', 0.7], [D45, -g - tw, -th / 2, 'right', 0.8],
          [0, -tw / 2, -g - th, 'center', 0.9], [0, -tw / 2, g, 'center', 1],
          [0, g * 0.7, -g * 0.7 - th, 'left', 1.1], [0, g * 0.7, g * 0.7, 'left', 1.2],
          [0, -g * 0.7 - tw, -g * 0.7 - th, 'right', 1.3], [0, -g * 0.7 - tw, g * 0.7, 'right', 1.4],
          // plus loin le long des diagonales, quand tout est encombré près de la station
          [-D45, g * 1.9, -th / 2, 'left', 1.8], [D45, g * 1.9, -th / 2, 'left', 1.9],
          [-D45, -g * 1.9 - tw, -th / 2, 'right', 2], [D45, -g * 1.9 - tw, -th / 2, 'right', 2.1],
        ];
        for (const [ang, x0, y0, align, pref] of cand) {
          const c = Math.cos(ang), sn = Math.sin(ang);
          const loc = [[x0 - pad, y0 - pad], [x0 + tw + pad, y0 - pad], [x0 + tw + pad, y0 + th + pad], [x0 - pad, y0 + th + pad]];
          const P = loc.map(([u, v]) => [n.px + u * c - v * sn, n.py + u * sn + v * c]);
          if (P.some((p) => p[0] < 2 || p[0] > W - 2 || p[1] < minY || p[1] > maxY)) continue;
          if (placed.some((B) => overlap(P, B))) continue;
          let hits = 0, cover = 0;
          for (const sg of segs) { const c = coverLen(P, sg); if (c > 0.5) { hits++; cover += c; } }
          // pénalité proportionnelle à la longueur de ligne masquée (un nom couché le long d'une ligne est le pire cas)
          const score = cover * 0.4 + hits * 4 + pref + (1 - scale) * 6;
          if (!best || score < best.score) best = { score, P, ang, x0, y0, align, lines, fs, font, tw, th, hits };
        }
        if (best && best.hits === 0) break; // position libre trouvée : inutile de réduire le texte
      }
      if (!best) continue;
      placed.push(best.P);
      ctx.save();
      ctx.translate(n.px, n.py); ctx.rotate(best.ang);
      ctx.font = best.font; ctx.textBaseline = 'middle'; ctx.textAlign = best.align;
      // nom qui croise malgré tout une ligne : contour clair translucide pour que la ligne reste visible
      ctx.lineJoin = 'round'; ctx.strokeStyle = best.hits ? 'rgba(244,242,236,.5)' : 'rgba(244,242,236,.95)'; ctx.lineWidth = (best.hits ? 3 : 4) * s; ctx.fillStyle = INK;
      const tx = best.align === 'left' ? best.x0 : best.align === 'right' ? best.x0 + best.tw : best.x0 + best.tw / 2;
      best.lines.forEach((l, i) => {
        const ty = best.y0 + best.fs * LH * (i + 0.5) + 0.5;
        ctx.strokeText(l, tx, ty); ctx.fillText(l, tx, ty);
      });
      ctx.restore();
      this.labelHits = (this.labelHits || 0) + best.hits; this.labelPlaced = (this.labelPlaced || 0) + 1;
    }
    // en-tête (image)
    if (forImage) {
      ctx.textAlign = 'left'; ctx.fillStyle = INK;
      ctx.font = `600 ${30 * s}px ${FONT}`; ctx.fillText(G.s.city.nom, 24 * s, 34 * s);
      ctx.font = `400 ${15 * s}px ${FONT}`; ctx.fillStyle = '#5b5b5b';
      const nb = g.lines.length;
      ctx.fillText('Plan du réseau · ' + nb + ' ligne' + (nb > 1 ? 's' : '') + ' · ' + N.length + ' stations · ' + Time.label(G.s.min).day, 24 * s, 60 * s);
    }
    // légende
    let ly = H - bottom + 16 * s;
    ctx.strokeStyle = 'rgba(29,34,64,.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(16 * s, ly - 6 * s); ctx.lineTo(W - 16 * s, ly - 6 * s); ctx.stroke();
    for (const row of legRows) {
      let x = 16 * s; const y = ly + 10 * s;
      for (const it of row) {
        const l = it.l, lab = Lines.label(l);
        ctx.font = `600 ${11.5 * s}px ${FONT}`;
        const bw = Math.max(24 * s, ctx.measureText(lab).width + 12 * s);
        Render.rr(ctx, x, y - 10 * s, bw, 20 * s, l.mode === 'metro' ? 10 * s : 4 * s);
        ctx.fillStyle = l.color; ctx.fill();
        ctx.fillStyle = inkOn(l.color); ctx.textAlign = 'center'; ctx.fillText(lab, x + bw / 2, y + 0.5);
        ctx.textAlign = 'left'; ctx.fillStyle = INK; ctx.font = `500 ${12.5 * s}px ${FONT}`;
        let t = it.t; while (ctx.measureText(t).width > 230 * s && t.length > 4) t = t.slice(0, -2);
        if (t !== it.t) t += '…';
        ctx.fillText(t, x + bw + 6 * s, y + 0.5);
        x += it.w;
      }
      ly += 26 * s;
    }
    if (forImage) {
      ctx.font = `400 ${11 * s}px ${FONT}`; ctx.fillStyle = '#8a8a8a'; ctx.textAlign = 'right';
      ctx.fillText('Transitopia', W - 16 * s, H - 12 * s);
    }
  },

  /** image haute définition : partage (Android) ou téléchargement */
  async share() {
    const g = this.ensureLayout();
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const n of g.nodes) { minx = Math.min(minx, n.x); maxx = Math.max(maxx, n.x); miny = Math.min(miny, n.y); maxy = Math.max(maxy, n.y); }
    const ar = clamp((maxy - miny) / Math.max(1e-9, maxx - minx), 0.55, 1.6);
    const s = 2;
    const [W, H] = this.sizeFor(s, 1800, Math.round(1800 * ar * 0.92 + 200 * s), true, 5000, 7000);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    this.render(cv.getContext('2d'), W, H, s, true);
    const name = 'plan-' + (G.s.city.nom || 'reseau').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-') + '.png';
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    if (!blob) { UI.toast('Image impossible à générer.', 'bad'); return; }
    const file = new File([blob], name, { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Plan du réseau · ' + G.s.city.nom });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    UI.toast('Image du plan enregistrée dans vos téléchargements.', 'ok');
  },
};

    this.card(`<div class="card-h"><span class="evcard-ic" style="--c:${Events.color(e)}">${esc(Events.glyph(e))}</span><div class="card-t"><b>${esc(e.title)}</b><small>${esc(cat.label)} · ${up ? 'à venir · début ' + lab(e.start) : e.end - e.start <= 60 && !e.veh ? lab(e.start) : 'en cours · fin prévue ' + lab(e.end)}</small></div><button class="icon-b" data-act="closeCard" aria-label="Fermer">${icon('close')}</button></div>

/* =====================================================================
   PANNEAUX
   ===================================================================== */
const statLine = (label, val, cls = '') => `<div class="kv ${cls}"><span>${label}</span><b>${val}</b></div>`;
const section = (t) => `<h3 class="sec">${t}</h3>`;

function lineToday(l) {
  const t = l.today;
  return { pax: t.pax, fares: t.fares + t.ads, ops: t.ops, mec: t.mec, fill: t.loadN ? t.loadSum / t.loadN : 0 };
}
function lineAgg(l, period) {
  if (period === 'today') return lineToday(l);
  const arr = period === 'yesterday' ? l.hist.slice(0, 1) : l.hist.slice(0, 7);
  if (!arr.length) return { pax: 0, fares: 0, ops: 0, mec: 0, fill: 0 };
  const sum = (k) => arr.reduce((a, d) => a + (d[k] || 0), 0);
  return { pax: sum('pax'), fares: sum('fares') + sum('ads'), ops: sum('ops'), mec: sum('mec'), fill: sum('fill') / arr.length };
}

const SHEETS = {
  lines() {
    const s = G.s;
    const T = Taxi.st();
    const taxiRow = T ? section('Taxis') + `<button class="lrow" data-act="nav" data-arg="taxi"><span class="pict pict-taxi">TAXI</span><span class="lrow-t">${esc(T.depot.name)}<small>${T.fleet.length} taxi${T.fleet.length > 1 ? 's' : ''} · ${Taxi.open(s.min) ? Taxi.count((t) => t.st !== 'depot' && t.st !== 'repair') + ' en circulation' : 'fermé (' + TAXI_HOURS[T.hours][2] + ')'}</small></span><span class="lrow-v"><b>${fmtInt(T.today.n)}</b> courses<br><small>${fmtEur(T.today.rev - T.today.ops)}</small></span></button>` : '';
    if (!s.lines.length && T) return { title: 'Réseau', html: taxiRow + `<button class="btn wide" data-act="nav" data-arg="build">${icon('plus')} Nouvelle ligne</button>` };
    if (!s.lines.length) return { title: 'Réseau', html: `<div class="empty">${pict('metro')}${pict('bus')}<p>Aucune ligne pour l’instant.</p><button class="btn primary" data-act="nav" data-arg="build">${icon('plus')} Créer une première ligne</button></div>` };
    const rows = MODE_ORDER.map((m) => {
      const ls = s.lines.filter((l) => l.mode === m).sort((a, b) => a.num - b.num);
      if (!ls.length) return '';
      return section(MODES[m].label) + ls.map((l) => {
        const t = lineToday(l);
        const st = l.status === 'construction' ? `<em class="tag warn">Travaux · ${Time.label(l.buildEnd).day}</em>` : Events.halted(l) ? '<em class="tag bad">Interrompue</em>' : !l.active ? '<em class="tag">Hors service</em>' : '';
        return `<button class="lrow" data-act="openLine" data-arg="${l.id}">${badgeFull(l)}<span class="lrow-t">${esc(l.name)}<small>${l.veh.length} véhicule${l.veh.length > 1 ? 's' : ''} · ${l.stops.length} arrêts · ${fmtKm(l.path.L)} ${st}</small></span><span class="lrow-v"><b>${fmtInt(t.pax)}</b> voy.<br><small>${fmtPct(t.fill)} rempli</small></span></button>`;
      }).join('');
    }).join('');
    return { title: 'Réseau', html: `<div class="row2"><button class="btn" data-act="openPlan">${icon('target')} Plan du réseau</button><button class="btn" data-act="nav" data-arg="staff">${icon('user')} Personnel</button></div>` + rows + taxiRow + `<button class="btn wide" data-act="nav" data-arg="build">${icon('plus')} Nouvelle ligne</button>` };
  },

  line(id) {
    const l = G.s.lines.find((x) => x.id === +id);
    if (!l) return null;
    G.ui.selLine = l;
    const t = lineToday(l), y = l.hist[0];
    const cap = Lines.capacity(l);
    const groups = {};
    for (const v of l.veh) groups[v.model] = (groups[v.model] || 0) + 1;
    const vrows = Object.entries(groups).map(([m, c]) => {
      const md = MODEL[m];
      return `<div class="vrow"><div><b>${esc(md.name)}</b><small>${md.cap} places · ${md.kmh} km/h · ${fmtEur(md.op * G.s.costMul)}/h</small></div><div class="stepper"><button data-act="sellVeh" data-arg="${l.id}|${m}" aria-label="Vendre">−</button><b>${c}</b><button data-act="buyVeh" data-arg="${l.id}|${m}" aria-label="Acheter">+</button></div></div>`;
    }).join('') || '<p class="note">Aucun véhicule : la ligne ne transporte personne.</p>';
    const cat = CATALOG[l.mode].map((md) => `<button class="catrow" data-act="buyVeh" data-arg="${l.id}|${md.id}"><span><b>${esc(md.name)}</b><small>${esc(md.desc)} · ${md.cap} pl. · ${md.kmh} km/h en ${accTime(md)} s · ${fmtEur(md.op * G.s.costMul)}/h</small></span><em>${fmtEur(md.price * G.s.costMul)}</em></button>`).join('');
    const price = (k, lab) => `<div class="vrow"><div><b>${lab}</b><small>réf. ${MODES[l.mode].ref.toFixed(2).replace('.', ',')} €</small></div><div class="stepper"><button data-act="price" data-arg="${l.id}|${k}|-0.1">−</button><b>${l.prices[k].toFixed(2).replace('.', ',')} €</b><button data-act="price" data-arg="${l.id}|${k}|0.1">+</button></div></div>`;
    const hourOpts = (vals, cur) => vals.map((v) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${Time.hhmm(v)}</option>`).join('');
    const laneKm = l.mode === 'bus' ? laneLength(l) / 1000 : 0;
    const laneCost = Math.round(laneKm * 90000 * G.s.costMul / 1000) * 1000;
    const sigCost = Math.round(l.stops.length * 25000 * G.s.costMul / 1000) * 1000;
    const status = l.status === 'construction' ? `<p class="note warn">Chantier en cours : ouverture le ${Time.label(l.buildEnd).day} à ${Time.label(l.buildEnd).time}.</p>` : Events.halted(l) ? '<p class="note bad">Ligne interrompue (événement en cours).</p>' : '';
    const xc = []; l.stops.forEach((_, k) => { for (const x of Transfers.at(l, k)) xc.push(x); });
    const svcRows = SERVICE_KEYS.filter(([k]) => k !== 'night' || l.night).map(([k, lab, sub]) => {
      const cur = l.svc[k] ?? 1, nv = Math.max(1, Math.round(l.veh.length * cur));
      return `<div class="vrow"><div><b>${lab}</b><small>${sub} · ${l.veh.length ? nv + ' véhicule' + (nv > 1 ? 's' : '') : '—'}</small></div><select data-change="svc" data-arg="${l.id}|${k}">${SERVICE_STEPS.map((v) => `<option value="${v}" ${Math.abs(v - cur) < 0.01 ? 'selected' : ''}>${Math.round(v * 100)} %</option>`).join('')}</select></div>`;
    }).join('');
    const presets = Object.entries(SERVICE_PRESETS).map(([k, p]) => `<button class="${l.svcPreset === k ? 'on' : ''}" data-act="svcPreset" data-arg="${l.id}|${k}">${p.label}</button>`).join('');
    const swatches = LINE_COLORS.map((c) => `<button class="sw ${c === l.color ? 'on' : ''}" style="background:${c}" data-act="lineColor" data-arg="${l.id}|${c}" aria-label="Couleur ${c}"></button>`).join('');
    // fiche en onglets : Résumé · Véhicules · Tarifs et horaires · Aménagements
    const tab = ['sum', 'veh', 'tarif', 'amen'].includes(G.ui.lineTab) ? G.ui.lineTab : 'sum';
    const tabs = `<div class="seg ltabs">${[['sum', 'Résumé'], ['veh', 'Véhicules'], ['tarif', 'Tarifs et horaires'], ['amen', 'Aménagements']].map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" data-act="lineTab" data-arg="${k}">${t}</button>`).join('')}</div>`;
    let body = '';
    if (tab === 'sum') body = `
      <div class="stops">${l.stops.map((s2, i) => `<span>${i ? '<i></i>' : ''}${esc(s2.name)}</span>`).join('')}</div>
      <div class="kpis">
        <div><small>Voyageurs aujourd’hui</small><b>${fmtInt(t.pax)}</b></div>
        <div><small>Remplissage moyen · pic</small><b>${fmtPct(t.fill)} · <span style="color:${fillCol(l.today.loadMax || 0)}">${fmtPct(l.today.loadMax || 0)}</span></b></div>
        <div><small>Recettes − coûts</small><b class="${t.fares - t.ops < 0 ? 'neg' : 'pos'}">${fmtEur(t.fares - t.ops)}</b></div>
        <div><small>Mécontents</small><b>${fmtInt(t.mec)}</b></div>
      </div>
      ${statLine('Passage', l.veh.length ? 'toutes les ~' + Math.max(1, Math.round(l.headway)) + ' min' : '—')}
      ${statLine('En service', l.active ? Lines.running(l) + ' / ' + l.veh.length + ' véhicules · ' + SERVICE_KEYS.find((k) => k[0] === Lines.serviceKey(G.s.min))[1].toLowerCase() : 'au dépôt')}
      ${statLine('Tour complet', l.cycleMin ? Math.round(l.cycleMin) + ' min' : '—')}
      ${statLine('Vitesse commerciale', Math.round(l.speedAvg || 0) + ' km/h')}
      ${statLine('Capacité totale', fmtInt(cap) + ' places')}
      ${statLine('Population desservie', fmtInt(l.catchPop || 0))}
      ${l.mode === 'bus' ? statLine('Limitations sur le parcours', limRange(l)) : ''}
      ${l.mode === 'bus' ? statLine('Feux · stops · cédez-le-passage', ['sig', 'stop', 'yield'].map((t) => (l.ctl || []).filter((c) => c.t === t).length).join(' · ')) : ''}
      ${xc.length ? statLine('Correspondances', xc.map((x) => Lines.label(x.line)).filter((v, i, a) => a.indexOf(v) === i).join(' · ')) : ''}
      ${xc.length ? statLine('Voyageurs en correspondance', fmtInt(l.today.xin || 0) + ' arrivés · ' + fmtInt(l.today.xout || 0) + ' partis') : ''}
      ${y ? statLine('Hier', fmtInt(y.pax) + ' voy. · ' + fmtEur(y.fares + y.ads - y.ops)) : ''}
      ${section('Actions')}
      <button class="btn wide" data-act="editLine" data-arg="${l.id}">${icon('plus')} Modifier les arrêts (ajouter, déplacer, retirer)</button>
      ${l.mode !== 'metro' ? `<button class="btn wide" data-act="reroute" data-arg="${l.id}">${icon('undo')} Recalculer l’itinéraire (sens de circulation)</button>` : ''}
      <div class="row2"><button class="btn" data-act="centerLine" data-arg="${l.id}">${icon('target')} Voir sur la carte</button><button class="btn danger" data-act="delLine" data-arg="${l.id}">Supprimer</button></div>`;
    else if (tab === 'veh') {
      const n = l.veh.length, key = Lines.serviceKey(G.s.min), per = SERVICE_KEYS.find((x) => x[0] === key)[1].toLowerCase();
      const now = headwayWith(l, n, key), plus = headwayWith(l, n + 1, key), minus = headwayWith(l, n - 1, key), peak = headwayWith(l, n, 'peak');
      body = `
      <div class="kpis">
        <div><small>Passage maintenant (${esc(per)})</small><b>${fmtHw(now)}</b></div>
        <div><small>En heure de pointe</small><b>${fmtHw(peak)}</b></div>
        <div><small>Avec 1 véhicule de plus</small><b class="pos">${fmtHw(plus)}</b></div>
        <div><small>Avec 1 véhicule de moins</small><b class="${n > 1 ? 'neg' : ''}">${n > 1 ? fmtHw(minus) : 'ligne à l’arrêt'}</b></div>
      </div>
      ${statLine('Capacité totale', fmtInt(cap) + ' places')}
      ${statLine('En service', l.active ? Lines.running(l) + ' / ' + l.veh.length + ' véhicules' : 'au dépôt')}
      ${section('Flotte')}${vrows}
      ${section('Acheter un véhicule')}${cat}`;
    }
    else if (tab === 'tarif') body = `
      ${section('Tarifs par période')}${price('week', 'Semaine')}${price('weekend', 'Week-end et fériés')}${price('night', 'Nuit (22 h – 5 h)')}
      ${section('Horaires')}
      <div class="vrow"><div><b>Premier départ</b></div><select data-change="hStart" data-arg="${l.id}" ${l.night ? 'disabled' : ''}>${hourOpts([240, 270, 300, 330, 360, 390, 420], l.hours.start)}</select></div>
      <div class="vrow"><div><b>Fin de service</b></div><select data-change="hEnd" data-arg="${l.id}" ${l.night ? 'disabled' : ''}>${hourOpts([1260, 1320, 1380, 0, 30, 60, 120], l.hours.end)}</select></div>
      <label class="tgl"><input type="checkbox" data-change="night" data-arg="${l.id}" ${l.night ? 'checked' : ''}><span>Service de nuit (24 h/24)</span></label>
      ${section('Grille horaire')}
      <p class="sub">Part de la flotte en service selon la période. Les véhicules en trop rentrent au dépôt depuis le terminus (sans coût d’exploitation) et ressortent pour les renforts.</p>
      <div class="seg wrap">${presets}${l.svcPreset === 'perso' ? '<button class="on">Personnalisée</button>' : ''}</div>${svcRows}`;
    else body = `
      ${l.mode === 'bus' ? `${section('Voirie')}
        <div class="vrow"><div><b>Couloirs de bus</b><small>${laneKm.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} km sur axes principaux · les bus évitent 75 % des bouchons</small></div>${l.busLane ? '<em class="tag ok">Réalisé</em>' : `<button class="btn sm primary" data-act="busLane" data-arg="${l.id}">${fmtEur(laneCost)}</button>`}</div>
        <div class="vrow"><div><b>Priorité aux feux</b><small>+10 % de vitesse</small></div>${l.signal ? '<em class="tag ok">Réalisé</em>' : `<button class="btn sm primary" data-act="signal" data-arg="${l.id}">${fmtEur(sigCost)}</button>`}</div>` : `<p class="note">Les aménagements de voirie concernent les lignes de bus.</p>`}
      ${section('Couleur')}<div class="swatches">${swatches}</div>`;
    const html = `${status}${tabs}${body}`;
    return { title: `${badgeFull(l)}<span>${esc(l.name)}</span>`, html };
  },

  staff() {
    const s = Staff.st(), busy = s.training.length;
    const cards = STAFF.map((d) => {
      const lv = Staff.L(d.id), tr = Staff.training(d.id), cost = Staff.cost(d.id);
      const dots = [1, 2, 3].map((k) => `<i class="${k <= lv ? 'on' : tr && tr.level === k ? 'tr' : ''}" style="--c:${d.col}"></i>`).join('');
      const now = lv ? d.fx(lv) : [];
      const next = lv < 3 ? d.fx(lv + 1) : null;
      let act;
      if (tr) {
        const p = clamp((G.s.min - tr.start) / (tr.end - tr.start), 0, 1);
        act = `<div class="timeline"><i style="width:${(p * 100).toFixed(0)}%;background:${d.col}"></i></div><small>En formation : niveau ${tr.level} · fin le ${Time.label(tr.end).day} à ${Time.label(tr.end).time}</small>`;
      } else if (lv >= 3) act = '<em class="tag ok">Niveau maximal</em>';
      else if (d.needs === 'taxi' && !Taxi.st()) act = '<small>Nécessite un dépôt de taxis (menu Construire).</small>';
      else act = `<button class="btn sm ${Staff.canStart(d.id) ? 'primary' : ''}" data-act="staffTrain" data-arg="${d.id}" ${Staff.canStart(d.id) && Eco.canAfford(cost) ? '' : 'disabled'}>Former au niveau ${lv + 1} · ${Eco.free() ? 'gratuit' : fmtEur(cost)} · ${STAFF_DAYS[lv]} j</button>${!Staff.canStart(d.id) && busy >= STAFF_MAX_PARALLEL ? '<small>Le centre de formation est complet (2 promotions à la fois).</small>' : ''}`;
      return `<div class="staffc"><div class="staff-h"><span class="evcard-ic" style="--c:${d.col}">${icon(d.icon)}</span><div><b>${esc(d.name)}</b><small>${esc(d.who)} · ${lv ? 'niveau ' + lv + ' : ' + esc(d.lv[lv - 1]) : 'non formés'}</small></div><span class="lvdots">${dots}</span></div>
        ${now.length ? `<ul class="fx">${now.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${next ? `<p class="sub nextlv">Niveau ${lv + 1} « ${esc(d.lv[lv])} » : ${esc(next.join(' · '))}</p>` : ''}
        ${act}</div>`;
    }).join('');
    const tot = Staff.total(), wage = Math.round((Staff.opsMult() - 1) * 100);
    return {
      title: 'Personnel et formations',
      html: `<p class="sub">Former vos équipes réduit la fraude, les pannes et la durée des incidents, et améliore l’image du réseau. Chaque niveau acquis augmente un peu les salaires (+1 % d’exploitation), l’éco-conduite fait économiser de l’énergie.</p>
        <div class="kpis"><div><small>Niveaux acquis</small><b>${tot} / ${STAFF.length * 3}</b></div><div><small>Effet sur l’exploitation</small><b class="${wage > 0 ? 'neg' : 'pos'}">${wage > 0 ? '+' : ''}${wage} %</b></div><div><small>Formations en cours</small><b>${busy} / ${STAFF_MAX_PARALLEL}</b></div><div><small>Recettes billets</small><b class="pos">+${Math.round((Staff.fareMult() - 1) * 100)} %</b></div></div>
        ${Gauges.html()}
        ${cards}`,
    };
  },

  taxi() {
    const T = Taxi.st(), s = G.s;
    if (!T) return { title: 'Taxis', html: `<div class="empty"><span class="pict pict-taxi">TAXI</span><p>Pas encore de dépôt de taxis.</p><p class="sub">Placez un dépôt dans une de vos zones : il stocke les taxis qui ne circulent pas et les répare.</p><button class="btn primary" data-act="taxiPlace">${icon('plus')} Placer le dépôt · ${fmtEur(Taxi.depotCost())}</button></div>` };
    const d = T.today, res = d.rev - d.ops, demand = d.calls + d.hails;
    const c = (sts) => T.fleet.filter((t) => sts.includes(t.st)).length;
    const L = Taxi.L(), auto = T.auto && L > 0, open = Taxi.open(s.min);
    const share = auto ? T.autoShare : T.roam;
    const chip = (col, n, lab) => n ? `<span><i style="background:${col}"></i>${n} ${lab}</span>` : '';
    const roamSeg = [0, 0.25, 0.5, 0.75, 1].map((v) => `<button class="${!auto && T.roam === v ? 'on' : ''}" data-act="taxiRoam" data-arg="${v}">${Math.round(v * 100)} %</button>`).join('')
      + (L > 0 ? `<button class="${auto ? 'on' : ''}" data-act="taxiRoam" data-arg="auto">Auto</button>` : '');
    const hours = Object.entries(TAXI_HOURS).map(([k, h]) => `<button class="${T.hours === k ? 'on' : ''}" data-act="taxiHours" data-arg="${k}">${h[2]}</button>`).join('');
    const pf = Taxi.priceFactor();
    const fleet = TAXI_MODELS.map((md) => {
      const n = T.fleet.filter((t) => t.model === md.id).length;
      return `<div class="vrow"><div><b>${esc(md.name)}</b><small>${esc(md.desc)} · ${md.km.toLocaleString('fr-FR', { minimumFractionDigits: 2 })} € de frais/km</small></div><div class="row2 tight"><button class="btn sm" data-act="taxiSell" data-arg="${md.id}" ${n ? '' : 'disabled'} aria-label="Vendre">−</button><b class="cnt">${n}</b><button class="btn sm primary" data-act="taxiBuy" data-arg="${md.id}">+ ${Eco.free() ? 'gratuit' : fmtEur(md.price * s.costMul)}</button></div></div>`;
    }).join('');
    const hist = T.hist.slice(0, 14).reverse().map((x) => ({ v: x.rev - x.ops, l: Time.dayLabel(x.date) }));
    return {
      title: '<span class="pict pict-taxi">TAXI</span><span>Taxis</span>',
      html: `<p class="sub">${esc(T.depot.name)} · ${open ? 'en service' : 'fermé'} (${TAXI_HOURS[T.hours][2]})</p>
      <div class="kpis"><div><small>Courses aujourd’hui</small><b>${fmtInt(d.n)}</b></div><div><small>Résultat du jour</small><b class="${res < 0 ? 'neg' : 'pos'}">${fmtEur(res)}</b></div>
      <div><small>Recettes</small><b>${fmtEur(d.rev)}</b></div><div><small>Coûts</small><b class="neg">${fmtEur(d.ops)}</b></div>
      <div><small>Attente moyenne</small><b>${d.waitN ? Math.round(d.wait / d.waitN) + ' min' : '—'}</b></div><div><small>Clients perdus</small><b>${fmtInt(d.lost + d.missed)} / ${fmtInt(demand)}</b></div>
      <div><small>Image des taxis</small><b>${Math.round(T.rep * 100)} %</b></div><div><small>Demandes en attente</small><b>${T.req.length}</b></div></div>
      <div class="txst">${chip('#3FD07A', c(['roam']), 'libres')}${chip('#F0583A', c(['pickup', 'ride']), 'en course')}${chip('#FFFFFF', c(['back']), 'rentrent')}${chip('#1D2240', c(['depot']), 'au dépôt')}${chip('#EF3E36', c(['broken', 'repair']), 'en panne ou à l’atelier')}${T.fleet.length ? '' : '<span>Aucun taxi : achetez-en ci-dessous.</span>'}</div>
      ${section('Taxis en maraude')}
      <p class="sub">En maraude, les taxis prennent les clients qui hèlent dans la rue et arrivent vite aux appels, mais roulent à vide (chauffeur et carburant). Au dépôt, ils ne coûtent presque rien mais ne prennent que les appels, avec un long trajet d’approche. Augmentez la maraude pendant les grands événements, les grèves ou la pluie.</p>
      <div class="seg wrap">${roamSeg}</div>
      ${auto ? `<p class="note ok">Centrale taxis niveau ${L} : ${Math.round(share * 100)} % des taxis en maraude en ce moment.</p>` : L > 0 ? '' : `<p class="note">Formez la <b>Centrale taxis</b> (Personnel) pour régler ce paramètre automatiquement.</p>`}
      ${section('Horaires de service')}<div class="seg wrap">${hours}</div>
      <p class="sub">Hors horaires, les taxis terminent leur course puis rentrent au dépôt.</p>
      ${section('Tarif')}
      <div class="vrow"><div><b>${T.perKm.toFixed(2).replace('.', ',')} € / km</b><small>+ ${TAXI_CFG.base.toFixed(2).replace('.', ',')} € de prise en charge · course de 5 km : ${fmtEur(Taxi.fare(5, 1), true)} · demande ${pf >= 1 ? '+' : '−'}${Math.round(Math.abs(pf - 1) * 100)} %</small></div><div class="row2 tight"><button class="btn sm" data-act="taxiPrice" data-arg="-0.1" aria-label="Baisser">−</button><button class="btn sm" data-act="taxiPrice" data-arg="0.1" aria-label="Augmenter">+</button></div></div>
      ${section('Flotte · ' + T.fleet.length + ' taxi' + (T.fleet.length > 1 ? 's' : ''))}${fleet}
      <p class="sub">Les vans prennent les groupes de 5 à 7 personnes (+20 % sur la course). Les taxis s’usent en roulant : plus ils sont usés, plus ils tombent en panne. Au dépôt, ils sont entretenus.</p>
      ${hist.length ? section('Résultat des taxis, 14 derniers jours') + barChart(hist) : ''}
      ${section('Dépôt')}<div class="row2"><button class="btn" data-act="taxiGoto">${icon('target')} Voir le dépôt</button><button class="btn" data-act="taxiPlace">Déplacer · ${fmtEur(Taxi.depotCost(true))}</button></div>
      <button class="btn wide" data-act="nav" data-arg="staff">${icon('user')} Centrale taxis : ${L ? 'niveau ' + L : 'non formée'}</button>`,
    };
  },

  build() {
    const cards = MODE_ORDER.map((m) => {
      const hint = { bus: 'Suit les vraies routes, subit le trafic. ≈ 15-20 km/h. 8 k€ par arrêt.', metro: 'Souterrain, tracé libre. ≈ 30-35 km/h. 600 k€/km + 350 k€ par station. 1 à 2 jours de chantier.', ter: 'De gare en gare sur les voies ferrées. Le plus rapide : jusqu’à 100 km/h, ≈ 40-75 km/h de moyenne selon l’écart entre gares.', boat: 'Sur les fleuves et canaux. Le plus lent : ≈ 10 km/h, mais apprécié des touristes. 60 k€ par ponton.' }[m];
      const cheapest = CATALOG[m][0];
      return `<button class="modecard" data-act="buildMode" data-arg="${m}">${pict(m)}<span><b>${MODES[m].label}</b><small>${hint}</small><small>Véhicules dès ${fmtEur(cheapest.price * G.s.costMul)}</small></span></button>`;
    }).join('');
    const infra = `<h3 class="sec">Infrastructures ferroviaires</h3>
      <button class="modecard" data-act="railMode" data-arg="gare"><span class="pict pict-ter">GARE</span><span><b>Nouvelle gare</b><small>Posée sur une voie existante ou en pleine ville, orientable. ${fmtEur(Rail.stationCost())}.</small></span></button>
      <button class="modecard" data-act="railMode" data-arg="track"><span class="pict pict-ter">═</span><span><b>Nouvelle voie ferrée</b><small>Tracée en longues courbes, de gare en gare ou en se branchant sur les voies existantes. ${fmtEur(Rail.KM * G.s.costMul)}/km.</small></span></button>`;
    const T = Taxi.st();
    const taxi = `<h3 class="sec">Taxis</h3>` + (T
      ? `<button class="modecard" data-act="nav" data-arg="taxi"><span class="pict pict-taxi">TAXI</span><span><b>Gérer les taxis</b><small>${esc(T.depot.name)} · ${T.fleet.length} taxi${T.fleet.length > 1 ? 's' : ''}. Flotte, maraude, horaires et tarif au kilomètre.</small></span></button>`
      : `<button class="modecard" data-act="taxiPlace"><span class="pict pict-taxi">TAXI</span><span><b>Dépôt de taxis</b><small>Un seul dépôt pour toute la ville. Les taxis prennent des courses partout dans vos zones, payées au kilomètre. ${fmtEur(Taxi.depotCost())}, taxis dès ${fmtEur(TAXI_MODELS[0].price * G.s.costMul)}.</small></span></button>`);
    return { title: 'Construire', html: `<p class="sub">Choisissez un mode, puis touchez la carte pour placer les arrêts dans vos zones.</p>${cards}${taxi}${infra}` };
  },

  zones() {
    const w = G.w;
    const owned = [...w.zones.values()].filter((z) => z.owned);
    const buy = [...w.zones.values()].filter((z) => w.purchasable(z)).sort((a, b) => b.density - a.density);
    const pop = owned.reduce((a, z) => a + z.pop, 0), area = owned.reduce((a, z) => a + z.areaKm2, 0);
    const rows = buy.slice(0, 40).map((z) => `<div class="zrow"><button class="zrow-t" data-act="seeZone" data-arg="${esc(z.code)}"><b>${esc(z.name)}</b><small>${esc(z.commune)} · ${fmtInt(z.density)} hab./km² · ${IRIS_TYPES[z.type]}</small></button><button class="btn sm primary" data-act="buyZone" data-arg="${esc(z.code)}">${fmtEur(z.price)}</button></div>`).join('');
    return {

function barChart(items, posOnly) {
  if (!items.length) return '<p class="note">Les chiffres apparaîtront après la première journée complète.</p>';
  const W = 320, H = 110, pad = 18;
  const max = Math.max(1, ...items.map((i) => Math.abs(i.v)));
  const hasNeg = !posOnly && items.some((i) => i.v < 0);
  const zero = hasNeg ? H / 2 : H - pad;
  const scale = (hasNeg ? H / 2 - 6 : H - pad - 8) / max;
  const bw = (W - 8) / items.length;
  const bars = items.map((it, i) => {
    const h = Math.abs(it.v) * scale;
    const x = 4 + i * bw + 2, y = it.v >= 0 ? zero - h : zero;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="1.5" fill="${it.v >= 0 ? (posOnly ? 'var(--accent)' : 'var(--ok)') : 'var(--bad)'}"/>` +
      (i % 2 === items.length % 2 || items.length < 8 ? `<text x="${(x + (bw - 4) / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${it.l}</text>` : '');
  }).join('');
  const last = items[items.length - 1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" class="axis"/>${bars}</svg><small>Dernier jour : <b>${posOnly ? fmtInt(last.v) : fmtEur(last.v)}</b> · max ${posOnly ? fmtInt(max) : fmtEur(max)}</small></div>`;
}

/** plage des limitations de vitesse rencontrées par une ligne de bus, pondérée par la distance */
function limRange(l) {
  const net = G.w.road, by = {};
  (l.P || [l.path]).forEach((P, dir) => {
    if (!P) return;
    const segE = l.segEs ? l.segEs[dir] : null; if (!segE) return;
    for (let i = 0; i < P.pts.length - 1; i++) { const e = segE[i]; if (e < 0) continue; const v = net.lim[e] > 0 ? net.lim[e] : 50; by[v] = (by[v] || 0) + (P.cum[i + 1] - P.cum[i]); }
  });
  const tot = Object.values(by).reduce((a, b) => a + b, 0);
  if (!tot) return '—';
  return Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([v, d]) => `${v} km/h (${Math.round(d / tot * 100)} %)`).join(' · ');
}

/** secondes pour atteindre la vitesse maximale depuis l'arrêt */
/** intervalle de passage (min) avec n véhicules, selon la grille horaire de la période donnée */
function headwayWith(l, n, key) {
  if (!l.cycleMin || n <= 0) return null;
  const f = l.svc ? (l.svc[key || Lines.serviceKey(G.s.min)] ?? 1) : 1;
  const run = Math.max(1, Math.round(n * f));
  return { hw: l.cycleMin / run, run };
}
const fmtMin = (m) => '~' + (m < 10 ? Math.max(0.5, Math.round(m * 2) / 2).toLocaleString('fr-FR') : Math.round(m)) + ' min';
const fmtHw = (h) => (h ? fmtMin(h.hw) : '—');
function accTime(md) { return Math.round(md.kmh / 3.6 / (md.acc || PHYS[md.mode].a)); }

function laneLength(l) {
  if (!l.segE) return 0;
  let m = 0; const net = G.w.road, P = l.path;
  for (let i = 0; i < P.pts.length - 1; i++) { const e = l.segE[i]; if (e >= 0 && net.cls[e] <= 3) m += P.cum[i + 1] - P.cum[i]; }
  return m;
}

  bar() {

  },
  allStops(mode) {

  },
  stopName(mx, my, mode, nodeName) {
    const w = G.w;

    if (pois.length) { pois.sort((a, b) => dist(a.mx, a.my, mx, my) - dist(b.mx, b.my, mx, my)); name = pois[0].name; }

  tap(mx, my) {

  },
  /* ---- modification d'une ligne existante : ajouter, déplacer, retirer des arrêts ---- */
  startEdit(line) {

  },
  editStop(mode, st) {

  },
  /** nouvel arrêt à l'endroit touché (sans contrainte d'ordre : l'insertion décide) */

    } else if (mode === 'ter') {

  segFor(A, B) {

  reseg() {

  snap() { const b = this.b; b.hist.push(b.stops.map((st) => ({ ...st }))); if (b.hist.length > 30) b.hist.shift(); },
  editTap(mx, my) {

        return;

  editCost(path) {
