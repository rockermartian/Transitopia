/* ---------- géométrie de ligne ---------- */
function buildPathMeta(path) {
  const pts = path.pts, cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]));
  path.cum = cum; path.L = cum[cum.length - 1];
}
function pointAt(path, s) {
  const cum = path.cum, pts = path.pts;
  if (s <= 0) return [pts[0][0], pts[0][1], 0, 0];
  if (s >= path.L) { const n = pts.length - 1; return [pts[n][0], pts[n][1], n - 1, 1]; }
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / Math.max(1e-9, cum[hi] - cum[lo]);
  return [lerp(pts[lo][0], pts[hi][0], t), lerp(pts[lo][1], pts[hi][1], t), lo, t];
}
/** Tracé « plan de métro » : segments à 0/45/90° avec coudes arrondis */
function octiPath(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const ax = Math.abs(dx), ay = Math.abs(dy);
  const sx = Math.sign(dx) || 1, sy = Math.sign(dy) || 1;
  let corner;
  if (ax > ay) corner = [a[0] + sx * (ax - ay), a[1]];
  else corner = [a[0], a[1] + sy * (ay - ax)];
  const l1 = Math.hypot(corner[0] - a[0], corner[1] - a[1]);
  const l2 = Math.hypot(b[0] - corner[0], b[1] - corner[1]);
  if (l1 < 1e-9 || l2 < 1e-9) return [a, b];
  const r = Math.min(meters(220), l1 * 0.45, l2 * 0.45);
  const p1 = [corner[0] - ((corner[0] - a[0]) / l1) * r, corner[1] - ((corner[1] - a[1]) / l1) * r];
  const p2 = [corner[0] + ((b[0] - corner[0]) / l2) * r, corner[1] + ((b[1] - corner[1]) / l2) * r];
  const out = [a, p1];
  for (let k = 1; k < 6; k++) {
    const t = k / 6, u = 1 - t;
    out.push([u * u * p1[0] + 2 * u * t * corner[0] + t * t * p2[0], u * u * p1[1] + 2 * u * t * corner[1] + t * t * p2[1]]);
  }
  out.push(p2, b);
  return out;
}

/* ---------- construction de ligne ---------- */
const Lines = {
  netFor(mode) { return mode === 'bus' ? G.w.road : mode === 'ter' ? G.w.rail : mode === 'boat' ? G.w.water : null; },

  /** Calcule le tronçon entre deux arrêts. Renvoie {pts, edges(pairs), nodeIds} */
  segment(mode, A, B) {
    if (mode === 'metro') {
      return { pts: octiPath([A.mx, A.my], [B.mx, B.my]), pairs: null };
    }
    const net = this.netFor(mode);
    const r = route(net, A.node, B.node);
    if (!r) return null;
    const pts = r.nodes.map((i) => [net.x[i], net.y[i]]);
    const pairs = r.edges.map((e) => net.ids[net.ea[e]] + '_' + net.ids[net.eb[e]]);
    return { pts, pairs, len: r.len };
  },

  /** Assemble le chemin complet depuis les tronçons */
  assemble(stops, segs, loop) {
    const pts = [], pairs = [], stopIdx = [0];
    segs.forEach((sg, k) => {
      const start = pts.length ? 1 : 0;
      for (let i = start; i < sg.pts.length; i++) pts.push(sg.pts[i]);
      if (sg.pairs) {
        if (k > 0) {/* le premier point du tronçon est le dernier du précédent */ }
        for (const p of sg.pairs) pairs.push(p);
      } else for (let i = 1; i < sg.pts.length; i++) pairs.push(null);
      stopIdx.push(pts.length - 1);
    });
    if (!pts.length) pts.push([stops[0].mx, stops[0].my]);
    const path = { pts, pairs, stopPt: stopIdx };
    buildPathMeta(path);
    return path;
  },

  costOf(mode, stops, path) {
    const m = G.s.costMul;
    let infra = 0;
    const newStops = stops.filter((s) => !s.shared).length;
    if (mode === 'bus') infra = 5000 + newStops * 8000;
    else if (mode === 'metro') infra = (path ? path.L / 1000 : 0) * 0.6e6 + newStops * 350000 + (stops.length - newStops) * 120000;
    else if (mode === 'ter') infra = 80000 + newStops * 40000;
    else if (mode === 'boat') infra = 30000 + newStops * 60000;
    return Math.round(infra * m / 1000) * 1000;
  },

  nextNum(mode) {
    const used = new Set(G.s.lines.filter((l) => l.mode === mode).map((l) => l.num));
    let n = 1; while (used.has(n)) n++;
    return n;
  },
  nextColor() {
    const used = G.s.lines.map((l) => l.color);
    return LINE_COLORS.find((c) => !used.includes(c)) || pick(LINE_COLORS);
  },

  create(b, opts) {
    const s = G.s;
    const id = s.nextId++;
    const line = {
      id, mode: b.mode, num: opts.num || this.nextNum(b.mode), color: opts.color || this.nextColor(),
      name: '', loop: !!b.loop,
      stops: b.stops.map((st) => ({ mx: st.mx, my: st.my, name: st.name, nid: st.nid ?? null, shared: !!st.shared })),
      path: b.path,
      prices: { week: MODES[b.mode].ref, weekend: MODES[b.mode].ref, night: MODES[b.mode].ref },
      hours: { start: 330, end: 30 }, night: false, busLane: false, signal: false,
      status: b.mode === 'metro' ? 'construction' : 'active',
      buildEnd: b.mode === 'metro' ? s.min + (b.path.L > 4000 ? 2 : 1) * 1440 : 0,
      rep: 1, created: s.min, veh: [], od: null,
      today: Lines.blankStats(), hist: [],
    };
    line.name = line.stops[0].name + ' ⇄ ' + (line.loop ? line.stops[Math.floor(line.stops.length / 2)].name : line.stops[line.stops.length - 1].name);
    if (line.loop) line.name = 'Circulaire ' + line.stops[0].name;
    s.lines.push(line);
    this.prepare(line);
    for (let k = 0; k < opts.count; k++) this.addVehicle(line, opts.model, true);
    this.placeVehicles(line);
    return line;
  },

  blankStats() { return { pax: 0, fares: 0, ops: 0, ads: 0, mec: 0, loadSum: 0, loadN: 0, loadMax: 0 }; },

  /** Prépare les structures de simulation d'une ligne (après création ou chargement) */
  prepare(line) {
    const n = line.stops.length;
    buildPathMeta(line.path);
    const P = line.path;
    line.stopAt = P.stopPt.map((i) => P.cum[i]);
    const L = P.L;
    line.C = line.loop ? L : 2 * L;
    const ev = [];
    for (let k = 0; k < n; k++) ev.push({ u: line.stopAt[k], k, d: 0 });
    if (!line.loop) for (let k = n - 1; k >= 0; k--) ev.push({ u: 2 * L - line.stopAt[k], k, d: 1 });
    ev.sort((a, b) => a.u - b.u || a.d - b.d);
    line.ev = ev;
    line.Wf = new Float64Array(n * n);
    line.Wb = new Float64Array(n * n);
    line.segE = null;
    this.resolveEdges(line);
    if (!line.od || line.od.length !== n * n) this.computeOD(line);
    line.qual = 1; line.headway = 10; line.speedAvg = MODES[line.mode].refKmh;
    line.evMul = new Float64Array(n).fill(1);
    line.active = false;
    for (const v of line.veh) { v.on = new Float64Array(n); v.load = 0; }
  },

  resolveEdges(line) {
    const net = this.netFor(line.mode);
    if (!net || !line.path.pairs) return;
    const segE = new Int32Array(line.path.pts.length).fill(-1);
    let found = 0;
    line.path.pairs.forEach((p, i) => {
      if (!p) return;
      const e = net.pair.get(p);
      if (e !== undefined) { segE[i] = e; found++; }
    });
    line.segE = segE;
    line.segFound = found;
  },

  /** Demande quotidienne origine-destination (lignes indépendantes, modèle gravitaire) */
  computeOD(line) {
    const mode = MODES[line.mode], n = line.stops.length, w = G.w;
    const P = [], A = [];
    const area = Math.PI * (mode.catch / 1000) ** 2;
    for (const st of line.stops) {
      let pop = 0, jobs = 0, cnt = 0;
      const r = meters(mode.catch * 0.5);
      for (const [dx, dy] of [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]]) {
        const z = w.zoneAt(st.mx + dx, st.my + dy);
        if (z) { pop += z.density; jobs += z.jobDensity; }
        cnt++;
      }
      pop = (pop / cnt) * area; jobs = (jobs / cnt) * area;
      let poi = 0;
      for (const p of w.poisNear(st.mx, st.my, mode.catch)) {
        let wgt = p.w;
        if (line.mode === 'boat' && (p.kind === 'attraction' || p.kind === 'museum')) wgt *= 2.5;
        if (line.mode === 'ter' && p.kind === 'station') wgt *= 3;
        poi += wgt;
      }
      P.push(pop + jobs * 0.25);
      A.push(jobs + pop * 0.45 + poi);
    }
    const od = new Float64Array(n * n);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      let d = Math.abs(line.stopAt[j] - line.stopAt[i]) / 1000;
      if (line.loop) d = Math.min(d, line.path.L / 1000 - d);
      let g;
      if (line.mode === 'bus') g = (1 - Math.exp(-d / 0.8)) * Math.exp(-d / 12);
      else if (line.mode === 'metro') g = (1 - Math.exp(-d / 1.0)) * Math.exp(-d / 25);
      else if (line.mode === 'ter') g = (1 - Math.exp(-d / 4)) * Math.exp(-d / 150);
      else g = (1 - Math.exp(-d / 1)) * Math.exp(-d / 15);
      od[i * n + j] = mode.K * Math.sqrt(P[i] * A[j]) * g;
    }
    line.od = od;
    line.catchPop = P.reduce((a, b) => a + b, 0);
  },

  addVehicle(line, modelId, free) {
    const md = MODEL[modelId];
    if (!free) {
      const price = Math.round(md.price * G.s.costMul);
      if (!Eco.spend(price, 'capex')) return false;
    }
    const v = { id: G.s.nextId++, model: modelId, u: 0, ev: 0, dwell: 0, on: new Float64Array(line.stops.length), load: 0, hidden: true };
    line.veh.push(v);
    if (line.active) this.placeVehicles(line);
    return true;
  },
  sellVehicle(line, modelId) {
    const i = line.veh.map((v) => v.model).lastIndexOf(modelId);
    if (i < 0) return;
    const v = line.veh[i];
    line.veh.splice(i, 1);
    Eco.earn(Math.round(MODEL[modelId].price * G.s.costMul * 0.6), 'sales');
    if (G.ui && G.ui.follow === v) G.ui.follow = null;
    this.placeVehicles(line);
  },
  placeVehicles(line) {
    const n = line.veh.length;
    line.veh.forEach((v, k) => {
      v.u = (line.C * k) / Math.max(1, n);
      v.ev = 0; v.wrap = false;
      while (v.ev < line.ev.length && line.ev[v.ev].u < v.u - 1e-6) v.ev++;
      if (v.ev >= line.ev.length) { v.ev = 0; v.wrap = true; }
      v.dwell = 0; if (v.on) v.on.fill(0); v.load = 0;
    });
  },
  remove(line) {
    const s = G.s;
    s.lines = s.lines.filter((l) => l !== line);
    let refund = line.veh.reduce((a, v) => a + MODEL[v.model].price * 0.6, 0) * s.costMul;
    Eco.earn(Math.round(refund), 'sales');
    if (G.ui && G.ui.follow && line.veh.includes(G.ui.follow)) G.ui.follow = null;
  },

  posOf(line, v) {
    const L = line.path.L;
    let s = v.u;
    let back = false;
    if (!line.loop && s > L) { s = 2 * L - s; back = true; }
    const p = pointAt(line.path, s);
    return { mx: p[0], my: p[1], seg: p[2], back };
  },
  label(line) {
    if (line.mode === 'metro') return String(line.num);
    if (line.mode === 'ter') return 'TER ' + line.num;
    if (line.mode === 'boat') return 'N' + line.num;
    return String(line.num);
  },
  capacity(line) { return line.veh.reduce((a, v) => a + MODEL[v.model].cap, 0); },
  isActiveAt(line, min) {
    if (line.status !== 'active') return false;
    if (Events.halted(line)) return false;
    if (line.night) return true;
    const m = Time.mod(min), st = line.hours.start, en = line.hours.end;
    return en > st ? m >= st && m < en : m >= st || m < en;
  },
  price(line, min) { return line.prices[Time.period(min)]; },
};

/* ---------- trafic routier (simulé) ---------- */
const Traffic = {
  update() {
    const s = G.s, net = G.w.road;
    const h = Time.hour(s.min), we = Time.weekend(s.min);
    const prof = (we ? PROF_WE[h] * 0.8 : PROF_WD[h]);
    const shift = Math.min(0.22, s.modalShift || 0);
    const wm = Events.weatherTraffic();
    const evs = Events.trafficEvents();
    for (let e = 0; e < net.nE; e++) {
      const d = net.dens[e] < 0 ? 250 : net.dens[e];
      let c = prof * (0.35 + 0.65 * Math.min(1.7, d / 7000)) * CLS_F[net.cls[e]] * net.noise[e] * wm * (1 - shift);
      if (evs.length) {
        const mx = (net.x[net.ea[e]] + net.x[net.eb[e]]) / 2, my = (net.y[net.ea[e]] + net.y[net.eb[e]]) / 2;
        for (const ev of evs) {
          if (ev.zone) { if (net.zone[e] === ev.zone) c *= ev.mult; }
          else if (ev.mx !== undefined) {
            const dd = dist(mx, my, ev.mx, ev.my);
            if (dd < ev.r) c *= 1 + (ev.mult - 1) * (1 - dd / ev.r);
          }
        }
      }
      net.traffic[e] = net.traffic[e] * 0.4 + c * 0.6;
    }
    Render.dirty = true;
  },
  /** facteur de vitesse d'un bus sur un tronçon */
  busFactor(e, line) {
    if (e < 0) return 0.75;
    const c = G.w.road.traffic[e] ?? 0.3;
    let f = 1 / (1 + 3 * Math.pow(Math.max(0, c - 0.3), 1.6));
    f = Math.max(0.22, f);
    if (line.busLane && G.w.road.cls[e] <= 3) f = 1 - (1 - f) * 0.25;
    return f;
  },
};

/* ---------- économie ---------- */
const Eco = {
  spend(amount, cat) {
    const s = G.s;
    if (amount > s.money) { UI.toast('Fonds insuffisants : il manque ' + fmtEur(amount - s.money) + '.', 'bad'); return false; }
    s.money -= amount; s.today[cat] = (s.today[cat] || 0) + amount;
    UI.refreshTop();
    return true;
  },
  charge(amount, cat) { const s = G.s; s.money -= amount; s.today[cat] = (s.today[cat] || 0) + amount; },
  earn(amount, cat) { const s = G.s; s.money += amount; s.today[cat] = (s.today[cat] || 0) + amount; UI.refreshTop(); },
  blankDay() { return { fares: 0, ads: 0, sales: 0, ops: 0, maint: 0, interest: 0, capex: 0, zones: 0, events: 0, loanIn: 0, repay: 0, pax: 0, mec: 0 }; },
  dayProfit(d) { return d.fares + d.ads - d.ops - d.maint - d.interest - d.events; },
  debt() { return G.s.loans.reduce((a, l) => a + l.amount, 0); },
  loanOffers() {
    const m = G.s.costMul;
    return [
      { amount: 1e6 * m, rate: 0.04, label: 'Prêt relais' },
      { amount: 3e6 * m, rate: 0.05, label: 'Prêt d’équipement' },
      { amount: 8e6 * m, rate: 0.06, label: 'Grand emprunt' },
    ];
  },
  maxDebt() { return 20e6 * G.s.costMul; },
  borrow(o) {
    const s = G.s;
    if (this.debt() + o.amount > this.maxDebt()) { UI.toast('La banque refuse : endettement maximum atteint (' + fmtEur(this.maxDebt()) + ').', 'bad'); return; }
    s.loans.push({ id: s.nextId++, amount: o.amount, rate: o.rate, taken: s.min });
    s.money += o.amount; s.today.loanIn += o.amount;
    UI.toast('Prêt accordé : +' + fmtEur(o.amount) + ' à ' + (o.rate * 100).toFixed(0) + ' %/an.', 'ok');
    UI.refreshTop();
  },
  repay(loan, part) {
    const s = G.s;
    const amt = Math.min(loan.amount, part);
    if (amt > s.money) { UI.toast('Pas assez de trésorerie pour rembourser.', 'bad'); return; }
    s.money -= amt; loan.amount -= amt; s.today.repay += amt;
    if (loan.amount < 1) s.loans = s.loans.filter((l) => l !== loan);
    UI.refreshTop();
  },
  /** coûts et recettes horaires */
  hourly() {
    const s = G.s;
    let maint = 0;
    for (const l of s.lines) {
      const nStops = l.stops.filter((x) => !x.shared).length;
      if (l.mode === 'bus') maint += nStops * MAINT.busStop;
      else if (l.mode === 'metro') maint += (l.path.L / 1000) * MAINT.metroKm + nStops * MAINT.metroStation;
      else if (l.mode === 'ter') maint += (l.path.L / 1000) * MAINT.terKm + nStops * MAINT.terStation;
      else maint += nStops * MAINT.boatStop;
      if (l.busLane) maint += (l.laneKm || 0) * 200;
    }
    this.charge((maint * s.costMul) / 24, 'maint');
    let interest = 0;
    for (const ln of s.loans) interest += (ln.amount * ln.rate) / 365 / 24;
    this.charge(interest, 'interest');
  },
};

/* ---------- événements ---------- */
const EV_INFO = {
  rain: { icon: 'rain', title: 'Pluie' },
  snow: { icon: 'snow', title: 'Neige' },
  heat: { icon: 'heat', title: 'Canicule' },
  storm: { icon: 'wind', title: 'Tempête' },
  sun: { icon: 'sun', title: 'Beau temps' },
  strike: { icon: 'strike', title: 'Préavis de grève' },
  works: { icon: 'works', title: 'Travaux de voirie' },
  accident: { icon: 'accident', title: 'Accident' },
  demo: { icon: 'demo', title: 'Manifestation' },
  big: { icon: 'star', title: 'Grand événement' },
  failure: { icon: 'alert', title: 'Incident technique' },
};
const Events = {
  active() { const m = G.s.min; return G.s.events.filter((e) => e.start <= m && e.end > m); },
  upcoming() { const m = G.s.min; return G.s.events.filter((e) => e.start > m); },
  weather() { return G.s.weather || 'sun'; },
  weatherTraffic() { const w = this.weather(); return w === 'rain' ? 1.1 : w === 'snow' ? 1.3 : w === 'storm' ? 1.12 : 1; },
  speedMult(mode) {
    const w = this.weather();
    if (mode === 'bus') return w === 'snow' ? 0.6 : w === 'rain' ? 0.92 : 1;
    if (mode === 'boat') return w === 'storm' ? 0 : 1;
    if (mode === 'ter') return w === 'snow' ? 0.85 : 1;
    return 1;
  },
  demandMult(mode) {
    const w = this.weather();
    const t = { sun: 1, rain: { bus: 1.1, metro: 1.15, ter: 1.05, boat: 0.7 }, snow: { bus: 0.9, metro: 1.2, ter: 1.05, boat: 0.6 }, heat: { bus: 0.9, metro: 0.95, ter: 1, boat: 1.35 }, storm: { bus: 0.95, metro: 1.1, ter: 1, boat: 0 } }[w];
    return t === 1 || !t ? 1 : t[mode];
  },
  trafficEvents() {
    return this.active().filter((e) => e.traffic).map((e) => e.traffic);
  },
  halted(line) {
    for (const e of this.active()) {
      if (e.kind === 'strike' && !e.resolved && e.mode === line.mode) return true;
      if (e.kind === 'failure' && e.lineId === line.id) return true;
    }
    if (line.mode === 'boat' && this.weather() === 'storm') return true;
    return false;
  },
  stopMult(line) {
    const m = line.evMul; m.fill(1);
    for (const e of this.active()) if (e.kind === 'big') {
      line.stops.forEach((st, k) => { const d = dist(st.mx, st.my, e.mx, e.my); if (d < 700) m[k] = Math.max(m[k], 1 + 3 * (1 - d / 700)); });
    }
  },
  log(text, kind) {
    const s = G.s;
    s.journal.unshift({ t: s.min, text, kind });
    if (s.journal.length > 60) s.journal.length = 60;
  },
  add(e) {
    e.id = G.s.nextId++;
    G.s.events.push(e);
    this.log(e.title + ' — ' + e.desc, e.kind);
    UI.toast(e.title + ' : ' + e.desc, e.bad ? 'warn' : 'info');
    Render.dirty = true;
    UI.refreshInfoBadge();
  },
  randomOwnedZone() {
    const z = [...G.w.zones.values()].filter((z) => z.owned);
    return z.length ? pick(z) : null;
  },
  randomRoadEdge() {
    const n = G.w.road; if (!n.nE) return -1;
    for (let k = 0; k < 40; k++) {
      const e = Math.floor(Math.random() * n.nE);
      if (n.cls[e] <= 2 && n.zone[e] && G.w.zones.get(n.zone[e])?.owned) return e;
    }
    return -1;
  },
  daily() {
    const s = G.s, m = s.min, month = Time.month(m);
    // météo du jour
    const r = Math.random();
    let w = 'sun';
    const winter = month === 11 || month <= 1, summer = month >= 5 && month <= 7;
    if (winter && r < 0.1) w = 'snow';
    else if (summer && r < 0.15) w = 'heat';
    else if (r < 0.04) w = 'storm';
    else if (r < 0.3) w = 'rain';
    s.weather = w;
    if (w !== 'sun') this.log('Météo : ' + EV_INFO[w].title.toLowerCase() + ' aujourd’hui.', w);
    if (w === 'storm' && s.lines.some((l) => l.mode === 'boat')) UI.toast('Tempête : les navettes fluviales restent à quai aujourd’hui.', 'warn');
    if (w === 'snow') UI.toast('Neige : les bus roulent au ralenti.', 'warn');
    // purge
    s.events = s.events.filter((e) => e.end > m - 1440);
    const modes = new Set(s.lines.map((l) => l.mode));
    const day0 = m - Time.mod(m);
    // grève (annoncée la veille)
    if (Math.random() < 0.035 && (modes.has('bus') || modes.has('metro'))) {
      const mode = modes.has('metro') && Math.random() < 0.5 ? 'metro' : modes.has('bus') ? 'bus' : 'metro';
      const cost = Math.round((40000 + s.lines.filter((l) => l.mode === mode).reduce((a, l) => a + l.veh.length, 0) * 6000) * s.costMul);
      this.add({ kind: 'strike', mode, start: day0 + 1440 + 300, end: day0 + 2880, title: 'Préavis de grève', desc: 'les agents ' + (mode === 'bus' ? 'des bus' : 'du métro') + ' cesseront le travail demain.', bad: true, cost, resolved: false, asked: false });
    }
    // travaux
    if (Math.random() < 0.22) {
      const z = this.randomOwnedZone();
      if (z) {
        const len = 2 + Math.floor(Math.random() * 3);
        this.add({ kind: 'works', start: day0 + 1440 + 420, end: day0 + 1440 * (1 + len), title: 'Travaux de voirie', desc: 'chantier à ' + z.name + ' pendant ' + len + ' jours, circulation difficile.', bad: true, zone: z.code, traffic: { zone: z.code, mult: 1.6 } });
      }
    }
    // grand événement
    if (Math.random() < 0.2 && s.lines.length) {
      const l = pick(s.lines); const st = pick(l.stops);
      const what = pick(['Match de football', 'Concert en plein air', 'Festival', 'Salon', 'Feu d’artifice', 'Marché de nuit']);
      const st0 = day0 + 1440 + 17 * 60;
      this.add({ kind: 'big', start: st0, end: st0 + 300, title: what, desc: 'demain soir près de ' + st.name + ', forte affluence attendue.', mx: st.mx, my: st.my, traffic: { mx: st.mx, my: st.my, r: 900, mult: 1.5 } });
    }
    // manifestation
    if (Math.random() < 0.06) {
      const c = G.s.city;
      const st0 = day0 + 1440 + 14 * 60;
      this.add({ kind: 'demo', start: st0, end: st0 + 180, title: 'Manifestation', desc: 'cortège demain après-midi en centre-ville, ralentissements prévus.', bad: true, mx: lonToMx(c.lon), my: latToMy(c.lat), traffic: { mx: lonToMx(c.lon), my: latToMy(c.lat), r: 900, mult: 1.8 } });
    }
  },
  hourly() {
    const s = G.s, m = s.min, h = Time.hour(m);
    // accident
    const peak = (h >= 7 && h <= 9) || (h >= 16 && h <= 19);
    if (Math.random() < (peak ? 0.08 : 0.025)) {
      const e = this.randomRoadEdge();
      if (e >= 0) {
        const n = G.w.road;
        const mx = n.x[n.ea[e]], my = n.y[n.ea[e]];
        const dur = 60 + Math.floor(Math.random() * 120);
        const where = n.name[e] || G.w.zoneAt(mx, my)?.name || 'centre';
        this.add({ kind: 'accident', start: m, end: m + dur, title: 'Accident', desc: (n.name[e] ? where : 'secteur ' + where) + ', bouchons pendant ' + Math.round(dur / 60) + ' h environ.', bad: true, mx, my, traffic: { mx, my, r: 550, mult: 2.2 } });
      }
    }
    // incident technique (métro / TER)
    const rail = s.lines.filter((l) => (l.mode === 'metro' || l.mode === 'ter') && l.status === 'active');
    if (rail.length && Math.random() < 0.012) {
      const l = pick(rail); const dur = 60 + Math.floor(Math.random() * 120);
      this.add({ kind: 'failure', lineId: l.id, start: m, end: m + dur, title: 'Incident technique', desc: 'ligne ' + Lines.label(l) + ' interrompue (' + pick(['panne de signalisation', 'rame en panne', 'colis suspect', 'panne électrique']) + ').', bad: true });
    }
    // grève à confirmer
    for (const e of s.events) if (e.kind === 'strike' && !e.asked && e.start - m < 1200) { e.asked = true; UI.strikeDialog(e); }
  },
};

/* ---------- moteur ---------- */
const Sim = {
  newState(city, diff, slot) {
    const d = DIFF[diff];
    const now = new Date();
    const startMs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return {
      v: 1, slot, city, diff, costMul: d.cost, money: d.money, loans: [], startMs, min: 300, sec: 300 * 60, nextMin: 301,
      owned: [], lines: [], nextId: 1, events: [], journal: [], weather: 'sun',
      today: Eco.blankDay(), days: [], ads: { bus: 1, metro: 1, ter: 1, boat: 1 },
      settings: { idle: true, fill: true, traffic: true, zones: true, names: true, base: 'photo' },
      modalShift: 0, view: null, lastReal: Date.now(), created: Date.now(), zoneMode: 'iris',
    };
  },

  onNetworkGrow() {
    for (const l of G.s.lines) {
      if (l.segE && l.segFound >= (l.path.pairs || []).filter(Boolean).length) continue;
      Lines.resolveEdges(l);
    }
  },

  advance(sec) {
    const s = G.s;
    let rem = sec;
    while (rem > 0) {
      const step = Math.min(rem, 10);
      rem -= step;
      s.sec += step;
      this.moveVehicles(step);
      while (s.sec >= s.nextMin * 60) { s.min = s.nextMin; this.minute(); s.nextMin++; }
    }
  },

  minute() {
    const s = G.s, m = s.min, mod = Time.mod(m);
    for (const l of s.lines) this.lineMinute(l, m);
    if (mod % 10 === 0) {
      Traffic.update();
      for (const l of s.lines) this.lineQuality(l);
    }
    if (mod % 60 === 0) this.hour();
    if (mod === 0) this.newDay();
    if (mod === 300) Events.daily();
    for (const l of s.lines) if (l.status === 'construction' && m >= l.buildEnd) {
      l.status = 'active';
      Events.log('Ligne ' + Lines.label(l) + ' du métro inaugurée.', 'ok');
      UI.toast('Inauguration : la ligne ' + Lines.label(l) + ' du métro ouvre au public !', 'ok');
      Render.dirty = true;
    }
  },

  lineMinute(l, m) {
    const was = l.active;
    l.active = Lines.isActiveAt(l, m);
    if (l.active && !was) { Lines.placeVehicles(l); for (const v of l.veh) v.hidden = false; Render.dirty = true; }
    if (!l.active) {
      if (was) { for (const v of l.veh) { v.hidden = true; v.on.fill(0); v.load = 0; } l.Wf.fill(0); l.Wb.fill(0); }
      return;
    }
    const s = G.s, n = l.stops.length, mode = MODES[l.mode];
    // coûts d'exploitation
    let op = 0;
    for (const v of l.veh) op += MODEL[v.model].op;
    op = (op * s.costMul) / 60;
    Eco.charge(op, 'ops'); l.today.ops += op;
    const adLvl = s.ads[l.mode] || 0;
    const adH = (ADS.perHour[l.mode][adLvl] * l.veh.length) / 60;
    if (adH) { s.money += adH; s.today.ads += adH; l.today.ads += adH; }
    if (!l.veh.length) return;
    // génération des voyageurs
    const h = Time.hour(m), we = Time.weekend(m);
    const prof = we ? (PROF_WE[h] / SUM_WE) * 0.75 : PROF_WD[h] / SUM_WD;
    const price = Lines.price(l, m);
    const pf = price <= 0.01 ? 2.2 : clamp(Math.pow(mode.ref / price, 0.55), 0.3, 2.2);
    const base = (prof / 60) * l.qual * pf * l.rep * Events.demandMult(l.mode) * ADS.demand[adLvl];
    if (base <= 0) return;
    const od = l.od, em = l.evMul;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const r = od[i * n + j] * base * Math.max(em[i], em[j]);
      if (l.loop || j > i) l.Wf[i * n + j] += r; else l.Wb[i * n + j] += r;
    }
    // abandons
    const rate = clamp(0.003 + Math.max(0, l.headway - 12) * 0.0015, 0.003, 0.05);
    let lost = 0;
    for (const W of [l.Wf, l.Wb]) for (let k = 0; k < W.length; k++) if (W[k] > 0) { const x = W[k] * rate; W[k] -= x; lost += x; }
    l.today.mec += lost; s.today.mec += lost;
  },

  lineQuality(l) {
    const mode = MODES[l.mode];
    Events.stopMult(l);
    let spd = 0;
    if (l.mode === 'bus') {
      let num = 0, den = 0;
      const P = l.path;
      for (let i = 0; i < P.pts.length - 1; i++) {
        const segL = P.cum[i + 1] - P.cum[i];
        const e = l.segE ? l.segE[i] : -1;
        const net = G.w.road;
        const vmax = Math.min(e >= 0 ? net.spd[e] : 8.3, 13.9);
        num += segL; den += segL / (vmax * Traffic.busFactor(e, l) * (l.signal ? 1.1 : 1) * Events.speedMult('bus'));
      }
      spd = den > 0 ? num / den : 6;
    } else {
      const v0 = l.veh[0] ? MODEL[l.veh[0].model].kmh / 3.6 : 10;
      spd = v0 * (l.mode === 'metro' ? 0.6 : l.mode === 'ter' ? 0.7 : 0.85) * (Events.speedMult(l.mode) || 0.01);
    }
    const nStopsCycle = l.ev.length;
    const cycle = l.C / Math.max(1, spd) + nStopsCycle * (mode.dwell + 10);
    const nA = Math.max(1, l.veh.length);
    l.headway = cycle / nA / 60;
    l.cycleMin = cycle / 60;
    l.speedAvg = (spd * 3.6) * (l.C / Math.max(1, cycle * spd));
    const qWait = clamp(1.25 - l.headway / 40, 0.25, 1.15);
    const qSpeed = clamp(Math.pow(l.speedAvg / mode.refKmh, 0.6), 0.55, 1.35);
    l.qual = l.veh.length ? qWait * qSpeed : 0;
  },

  vehSpeed(l, v, seg) {
    const md = MODEL[v.model];
    const vm = md.kmh / 3.6;
    const sm = Events.speedMult(l.mode);
    if (l.mode === 'bus') {
      const e = l.segE ? l.segE[seg] : -1;
      const net = G.w.road;
      const lim = e >= 0 ? net.spd[e] : 8.3;
      return Math.max(1.2, Math.min(vm, lim * 0.95) * Traffic.busFactor(e, l) * (l.signal ? 1.1 : 1) * sm);
    }
    if (l.mode === 'metro') return vm * 0.62;
    if (l.mode === 'ter') {
      const e = l.segE ? l.segE[seg] : -1;
      const lim = e >= 0 ? G.w.rail.spd[e] : vm;
      return Math.max(3, Math.min(vm, lim) * 0.72 * sm);
    }
    return Math.max(0.5, vm * 0.9 * (sm || 0.01));
  },

  moveVehicles(dt) {
    for (const l of G.s.lines) {
      if (!l.active || !l.veh.length) continue;
      for (const v of l.veh) {
        let t = dt, guard = 0;
        while (t > 1e-6 && guard++ < 50) {
          if (v.dwell > 0) { const d = Math.min(t, v.dwell); v.dwell -= d; t -= d; continue; }
          const evt = l.ev[v.ev];
          const target = evt.u + (v.wrap ? l.C : 0);
          const p = Lines.posOf(l, v);
          const spd = this.vehSpeed(l, v, p.seg);
          v.spd = spd;
          const remain = target - v.u;
          const need = remain / spd;
          if (need <= t) {
            v.u = target; t -= Math.max(0, need);
            if (v.wrap) { v.u -= l.C; v.wrap = false; if (v.u < 0) v.u = 0; }
            this.atStop(l, v, evt);
            v.ev++;
            if (v.ev >= l.ev.length) { v.ev = 0; v.wrap = true; }
          } else { v.u += spd * t; t = 0; }
        }
      }
    }
  },

  atStop(l, v, evt) {
    const s = G.s, n = l.stops.length, k = evt.k, mode = MODES[l.mode];
    const md = MODEL[v.model];
    // descente
    const off = v.on[k]; v.on[k] = 0; v.load = Math.max(0, v.load - off);
    if (!l.loop && ((evt.d === 0 && k === n - 1) || (evt.d === 1 && k === 0))) { v.on.fill(0); v.load = 0; }
    // montée
    const W = evt.d === 0 ? l.Wf : l.Wb;
    let want = 0;
    for (let j = 0; j < n; j++) if (j !== k) want += W[k * n + j];
    const space = Math.max(0, md.cap - v.load);
    const take = Math.min(space, want);
    if (want > 0 && take > 0) {
      const ratio = take / want;
      for (let j = 0; j < n; j++) {
        if (j === k) continue;
        const x = W[k * n + j] * ratio;
        W[k * n + j] -= x; v.on[j] += x;
      }
      v.load += take;
      const price = Lines.price(l, s.min);
      const fare = take * price;
      const adPax = take * ADS.perPax[s.ads[l.mode] || 0];
      s.money += fare + adPax;
      s.today.fares += fare; s.today.ads += adPax; s.today.pax += take;
      l.today.fares += fare; l.today.ads += adPax; l.today.pax += take;
    }
    if (want - take > 0.5) {
      const left = (want - take) * 0.3;
      l.today.mec += left; s.today.mec += left;
    }
    l.today.loadSum += v.load / md.cap; l.today.loadN++;
    if (v.load / md.cap > (l.today.loadMax || 0)) l.today.loadMax = v.load / md.cap;
    v.dwell = Math.min(mode.maxDwell, mode.dwell + (take + off) * mode.perPax);
    v.lastStop = k; v.dir = evt.d;
  },

  hour() {
    Eco.hourly();
    Events.hourly();
    UI.updateTint();
    UI.refreshTop();
    if (G.s.settings && UI.sheetOpen()) UI.refreshSheet();
  },

  newDay() {
    const s = G.s;
    const d = s.today;
    d.date = s.min - 1440;
    d.lines = {};
    for (const l of s.lines) {
      d.lines[l.id] = { pax: Math.round(l.today.pax), fares: Math.round(l.today.fares), ops: Math.round(l.today.ops), ads: Math.round(l.today.ads), mec: Math.round(l.today.mec), fill: l.today.loadN ? l.today.loadSum / l.today.loadN : 0, peak: l.today.loadMax || 0 };
      const ratio = l.today.mec / Math.max(1, l.today.pax);
      l.rep = clamp(l.rep + 0.02 - ratio * 0.6, 0.6, 1.05);
      l.hist.unshift(d.lines[l.id]); if (l.hist.length > 30) l.hist.length = 30;
      l.today = Lines.blankStats();
    }
    s.days.unshift(d); if (s.days.length > 60) s.days.length = 60;
    s.today = Eco.blankDay();
    const servedPop = this.servedPop();
    s.modalShift = Math.min(0.22, d.pax / Math.max(20000, servedPop * 2.8));
    if (Eco.dayProfit(d) < 0 && s.money < 0) UI.toast('Trésorerie négative : pensez à un prêt ou à ajuster vos tarifs.', 'bad');
    Save.auto();
  },

  servedPop() {
    let p = 0;
    for (const z of G.w.zones.values()) if (z.owned) p += z.pop;
    return p;
  },

  avgDailyProfit() {
    const ds = G.s.days.slice(0, 3);
    if (!ds.length) return 0;
    return ds.reduce((a, d) => a + Eco.dayProfit(d), 0) / ds.length;
  },

  /** progression pendant l'absence (mode « idle ») */
  offline(realSec) {
    const s = G.s;
    const gameMin = Math.min(realSec, 5 * 1440); // 1 min de jeu par seconde réelle, plafonné à 5 jours
    if (gameMin < 30) return null;
    const perMin = this.avgDailyProfit() / 1440;
    const gain = perMin * gameMin;
    const days = Math.floor((Time.mod(s.min) + gameMin) / 1440);
    s.money += gain;
    for (let k = 0; k < days; k++) {
      const d = Eco.blankDay(); d.date = s.min + k * 1440;
      const ref = s.days[0];
      if (ref) { d.fares = ref.fares; d.ads = ref.ads; d.ops = ref.ops; d.maint = ref.maint; d.interest = ref.interest; d.pax = ref.pax; d.mec = ref.mec; }
      d.offline = true;
      s.days.unshift(d);
    }
    if (s.days.length > 60) s.days.length = 60;
    s.min += Math.floor(gameMin); s.sec = s.min * 60; s.nextMin = s.min + 1;
    s.events = s.events.filter((e) => e.end > s.min);
    return { gameMin, gain };
  },
};

/* ---------- sauvegardes ---------- */
const SLOTS = 5;
const Save = {
  key: (n) => 'corr.slot.' + n,
  list() {
    const out = [];
    for (let n = 1; n <= SLOTS; n++) {
      let meta = null;
      try { const raw = localStorage.getItem('corr.meta.' + n); if (raw) meta = JSON.parse(raw); } catch (e) { }
      out.push({ n, meta });
    }
    return out;
  },
  serialize() {
    const s = G.s;
    const r6 = (x) => Math.round(x * 1e9) / 1e9;
    const lines = s.lines.map((l) => ({
      id: l.id, mode: l.mode, num: l.num, color: l.color, name: l.name, loop: l.loop,
      stops: l.stops, prices: l.prices, hours: l.hours, night: l.night, busLane: l.busLane, signal: l.signal, laneKm: l.laneKm || 0,
      status: l.status, buildEnd: l.buildEnd, rep: l.rep, created: l.created, hist: l.hist, today: l.today,
      veh: l.veh.map((v) => v.model),
      path: { pts: l.path.pts.map((p) => [r6(p[0]), r6(p[1])]), pairs: l.path.pairs, stopPt: l.path.stopPt },
      od: Array.from(l.od, (x) => Math.round(x * 100) / 100),
    }));
    const owned = [...G.w.zones.values()].filter((z) => z.owned).map((z) => z.code);
    const c = G.map.getCenter();
    return JSON.stringify({
      ...s, lines, owned, view: { lat: c.lat, lng: c.lng, z: G.map.getZoom() }, lastReal: Date.now(),
      zoneMode: G.w.mode,
    });
  },
  write(n) {
    if (!G.s) return false;
    G.s.slot = n;
    try {
      localStorage.setItem(this.key(n), this.serialize());
      const meta = { city: G.s.city.nom, date: Time.label(G.s.min).day, money: G.s.money, lines: G.s.lines.length, real: Date.now(), diff: G.s.diff };
      localStorage.setItem('corr.meta.' + n, JSON.stringify(meta));
      localStorage.setItem('corr.last', String(n));
      return true;
    } catch (e) {
      UI.toast('Sauvegarde impossible : stockage du téléphone plein ?', 'bad');
      return false;
    }
  },
  auto() { if (G.s && G.s.slot) this.write(G.s.slot); },
  read(n) {
    try { const raw = localStorage.getItem(this.key(n)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  remove(n) { try { localStorage.removeItem(this.key(n)); localStorage.removeItem('corr.meta.' + n); } catch (e) { } },
  /** Restaure l'état et reconstitue les lignes */
  hydrate(data) {
    const s = data;
    s.lines = s.lines.map((l) => {
      const line = { ...l, path: { pts: l.path.pts, pairs: l.path.pairs, stopPt: l.path.stopPt }, od: Float64Array.from(l.od || []), veh: [] };
      line.veh = l.veh.map((m) => ({ id: s.nextId++, model: m, u: 0, ev: 0, dwell: 0, on: null, load: 0, hidden: true }));
      if (!line.today) line.today = Lines.blankStats();
      return line;
    });
    return s;
  },
};

'use strict';
/* =====================================================================
   CORRESPONDANCE — rendu de la carte (calques canvas au-dessus de Leaflet)
   ===================================================================== */

const TR_COL = ['#3DDC84', '#FFB020', '#F0483E', '#9B1C1C'];

function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const inkOn = (hex) => (lum(hex) > 0.55 ? '#0B1834' : '#FFFFFF');
const fillCol = (f) => (f < 0.6 ? '#3DDC84' : f < 0.9 ? '#FFB020' : '#F0483E');

const Render = {
  dirty: true, last: 0, moving: false, zooming: false, o0: null,

  init() {
    const map = G.map, c = map.getContainer();
    this.cvS = document.createElement('canvas'); this.cvS.className = 'ov ov-s';
    this.cvD = document.createElement('canvas'); this.cvD.className = 'ov ov-d';
    c.appendChild(this.cvS); c.appendChild(this.cvD);
    this.ctxS = this.cvS.getContext('2d'); this.ctxD = this.cvD.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => { this.resize(); });
    map.on('resize', () => this.resize());
    map.on('movestart', () => { this.moving = true; });
    map.on('move', () => {
      if (!this.o0 || this.zooming) return;
      const o = this.origin();
      if (Math.abs(o.k - this.o0.k) > 1e-6) { this.cvS.style.opacity = '0'; return; }
      this.cvS.style.transform = `translate(${this.o0.x - o.x}px,${this.o0.y - o.y}px)`;
    });
    map.on('moveend', () => { this.moving = false; this.dirty = true; this.drawStatic(); });
    map.on('zoomstart', () => { this.zooming = true; this.cvS.style.opacity = '0'; this.cvD.style.opacity = '0'; });
    map.on('zoomend', () => { this.zooming = false; this.cvD.style.opacity = '1'; this.dirty = true; this.drawStatic(); });
  },

  resize() {
    const c = G.map.getContainer();
    this.W = c.clientWidth; this.H = c.clientHeight;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const cv of [this.cvS, this.cvD]) {
      cv.width = Math.round(this.W * this.dpr); cv.height = Math.round(this.H * this.dpr);
      cv.style.width = this.W + 'px'; cv.style.height = this.H + 'px';
    }
    this.dirty = true;
  },

  origin() {
    const m = G.map, z = m.getZoom();
    const p = m.project(m.containerPointToLatLng([0, 0]), z);
    return { x: p.x, y: p.y, k: 256 * Math.pow(2, z), z };
  },

  tick(now) {
    if (!G.ready) return;
    if (this.dirty && !this.moving && !this.zooming && now - this.last > 300) this.drawStatic();
    if (!this.zooming) this.drawDyn();
  },

  /* ---------- calque statique : zones, trafic, lignes, arrêts ---------- */
  drawStatic() {
    if (!G.ready || this.zooming) return;
    this.dirty = false; this.last = performance.now();
    const o = this.origin(); this.o0 = o;
    const ctx = this.ctxS, W = this.W, H = this.H, s = G.s, w = G.w, z = o.z;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    this.cvS.style.transform = 'translate(0px,0px)'; this.cvS.style.opacity = '1';
    const vb = { minx: o.x / o.k - 0.05 * W / o.k, maxx: (o.x + W * 1.05) / o.k, miny: o.y / o.k - 0.05 * H / o.k, maxy: (o.y + H * 1.05) / o.k };
    const X = (mx) => mx * o.k - o.x, Y = (my) => my * o.k - o.y;
    const inView = (b) => !(b.maxx < vb.minx || b.minx > vb.maxx || b.maxy < vb.miny || b.miny > vb.maxy);

    /* zones */
    if (s.settings.zones) {
      const works = new Set(Events.active().filter((e) => e.kind === 'works').map((e) => e.zone));
      const tags = [];
      for (const zn of w.zones.values()) {
        if (!inView(zn.bbox)) continue;
        const buyable = !zn.owned && w.purchasable(zn);
        ctx.beginPath();
        for (const r of zn.rings) {
          let lx = -1e9, ly = -1e9;
          r.forEach((p, i) => {
            const x = X(p[0]), y = Y(p[1]);
            if (i === 0) { ctx.moveTo(x, y); lx = x; ly = y; }
            else if (Math.abs(x - lx) + Math.abs(y - ly) > 1.2) { ctx.lineTo(x, y); lx = x; ly = y; }
          });
          ctx.closePath();
        }
        if (zn.owned) {
          if (z >= 12) { ctx.strokeStyle = 'rgba(245,242,233,.55)'; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.stroke(); }
          if (works.has(zn.code)) { ctx.strokeStyle = '#FF8A1F'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]); }
        } else {
          ctx.fillStyle = buyable ? 'rgba(8,17,40,.38)' : 'rgba(8,17,40,.6)';
          ctx.fill('evenodd');
          if (buyable) {
            ctx.strokeStyle = 'rgba(255,205,0,.75)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
            if (z >= 14) tags.push(zn);
          }
        }
        if (G.ui.selZone === zn) { ctx.strokeStyle = '#FFCD00'; ctx.lineWidth = 3; ctx.setLineDash([]); ctx.stroke(); }
      }
      ctx.font = '600 11px "Barlow Condensed", "Arial Narrow", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const zn of tags) {
        const x = X(zn.cx), y = Y(zn.cy), t = fmtEur(zn.price);
        const tw = ctx.measureText(t).width + 10;
        ctx.fillStyle = '#FFCD00'; this.rr(ctx, x - tw / 2, y - 8, tw, 16, 3); ctx.fill();
        ctx.fillStyle = '#0B1834'; ctx.fillText(t, x, y + 0.5);
      }
    }

    /* trafic routier */
    const net = w.road;
    if (s.settings.traffic && net.nE) {
      const maxCls = z < 11.5 ? 1 : z < 13 ? 2 : z < 14.5 ? 3 : 4;
      const zf = z >= 17 ? 2 : z >= 16 ? 1.5 : z >= 14 ? 1 : 0.75;
      const baseW = [4, 3.2, 2.6, 2, 1.3];
      const buckets = [];
      for (let k = 0; k < 25; k++) buckets.push([]);
      const nx = net.x, ny = net.y, ea = net.ea, eb = net.eb, cls = net.cls, tr = net.traffic;
      for (let e = 0; e < net.nE; e++) {
        const c = cls[e]; if (c > maxCls) continue;
        const a = ea[e], b = eb[e];
        const x1 = nx[a] * o.k - o.x, y1 = ny[a] * o.k - o.y, x2 = nx[b] * o.k - o.x, y2 = ny[b] * o.k - o.y;
        if ((x1 < -10 && x2 < -10) || (x1 > W + 10 && x2 > W + 10) || (y1 < -10 && y2 < -10) || (y1 > H + 10 && y2 > H + 10)) continue;
        const t = tr[e];
        const bk = c === 4 ? 4 : t < 0.45 ? 0 : t < 0.7 ? 1 : t < 0.9 ? 2 : 3;
        buckets[c * 5 + bk].push(x1, y1, x2, y2);
      }
      ctx.lineCap = 'round';
      for (let c = 4; c >= 0; c--) for (let bk = 0; bk < 5; bk++) {
        const arr = buckets[c * 5 + bk]; if (!arr.length) continue;
        ctx.beginPath();
        for (let i = 0; i < arr.length; i += 4) { ctx.moveTo(arr[i], arr[i + 1]); ctx.lineTo(arr[i + 2], arr[i + 3]); }
        ctx.lineWidth = baseW[c] * zf;
        ctx.strokeStyle = bk === 4 ? 'rgba(255,255,255,.32)' : TR_COL[bk];
        ctx.globalAlpha = bk === 4 ? 1 : 0.82;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    /* lignes */
    const zf = z >= 16 ? 1.35 : z >= 14 ? 1 : 0.75;
    const order = [...s.lines].sort((a, b) => MODE_ORDER.indexOf(a.mode) - MODE_ORDER.indexOf(b.mode));
    for (const l of order) {
      if (!l.bbox) this.lineBox(l);
      if (!inView(l.bbox)) continue;
      const P = l.path.pts;
      ctx.beginPath();
      let lx = -1e9, ly = -1e9;
      P.forEach((p, i) => {
        const x = X(p[0]), y = Y(p[1]);
        if (i === 0) { ctx.moveTo(x, y); lx = x; ly = y; } else if (Math.abs(x - lx) + Math.abs(y - ly) > 0.8 || i === P.length - 1) { ctx.lineTo(x, y); lx = x; ly = y; }
      });
      if (l.loop) ctx.closePath();
      const lw = ({ metro: 6, ter: 5, bus: 4, boat: 4 }[l.mode]) * zf;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.setLineDash([]);
      ctx.strokeStyle = l.mode === 'metro' || l.mode === 'ter' ? '#F5F2E9' : l.mode === 'boat' ? '#BDE8FF' : 'rgba(11,24,52,.85)';
      ctx.lineWidth = lw + 3; ctx.stroke();
      if (l.status === 'construction') ctx.setLineDash([10, 7]);
      ctx.strokeStyle = l.color; ctx.lineWidth = lw; ctx.globalAlpha = l.active || l.status !== 'active' ? 1 : 0.55; ctx.stroke();
      ctx.globalAlpha = 1;
      if (l.mode === 'ter') { ctx.setLineDash([6, 8]); ctx.strokeStyle = '#F5F2E9'; ctx.lineWidth = 1.4; ctx.stroke(); }
      ctx.setLineDash([]);
      if (G.ui.selLine === l) { ctx.strokeStyle = 'rgba(255,205,0,.6)'; ctx.lineWidth = lw + 8; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1; }
    }

    /* arrêts + noms */
    const labels = [];
    for (const l of order) {
      if (!inView(l.bbox)) continue;
      const showNames = s.settings.names && ((l.mode === 'metro' || l.mode === 'ter') ? z >= 14 : z >= 16);
      l.stops.forEach((st) => {
        const x = X(st.mx), y = Y(st.my);
        if (x < -20 || y < -20 || x > W + 20 || y > H + 20) return;
        ctx.setLineDash([]);
        if (l.mode === 'metro') {
          ctx.beginPath(); ctx.arc(x, y, 5.5 * zf, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = '#0B1834'; ctx.stroke();
        } else if (l.mode === 'ter') {
          const r = 5.5 * zf; ctx.fillStyle = '#FFFFFF'; this.rr(ctx, x - r, y - r, 2 * r, 2 * r, 2); ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = l.color; ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(x, y, (l.mode === 'bus' ? 4 : 5) * zf, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = l.mode === 'boat' ? '#1E88E5' : l.color; ctx.stroke();
        }
        if (showNames) labels.push({ x, y, t: st.name, pri: l.mode === 'metro' || l.mode === 'ter' ? 0 : 1 });
      });
    }
    labels.sort((a, b) => a.pri - b.pri);
    ctx.font = '600 11.5px "Barlow Condensed", "Arial Narrow", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const boxes = [];
    for (const lb of labels) {
      const tw = ctx.measureText(lb.t).width + 10;
      const bx = lb.x + 9, by = lb.y - 9, bw = tw, bh = 18;
      if (boxes.some((b) => bx < b[0] + b[2] && bx + bw > b[0] && by < b[1] + b[3] && by + bh > b[1])) continue;
      boxes.push([bx, by, bw, bh]);
      ctx.fillStyle = '#13294F'; this.rr(ctx, bx, by, bw, bh, 2); ctx.fill();
      ctx.strokeStyle = 'rgba(245,242,233,.8)'; ctx.lineWidth = 1; this.rr(ctx, bx + 1.5, by + 1.5, bw - 3, bh - 3, 1.5); ctx.stroke();
      ctx.fillStyle = '#F5F2E9'; ctx.fillText(lb.t, bx + 5, by + bh / 2 + 0.5);
    }

    /* marqueurs d'événements */
    for (const e of Events.active()) {
      if (e.mx === undefined) continue;
      const x = X(e.mx), y = Y(e.my);
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const col = e.kind === 'accident' ? '#F0483E' : e.kind === 'big' ? '#FFCD00' : '#B36BFF';
      ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.fillStyle = e.kind === 'big' ? '#0B1834' : '#FFFFFF';
      ctx.font = '700 13px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(e.kind === 'accident' ? '!' : e.kind === 'big' ? '★' : '✊', x, y + 1);
    }
  },

  lineBox(l) {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const p of l.path.pts) { if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0]; if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1]; }
    l.bbox = { minx, miny, maxx, maxy };
  },

  /* ---------- calque dynamique : véhicules, construction ---------- */
  drawDyn() {
    const o = this.origin();
    const ctx = this.ctxD, W = this.W, H = this.H, s = G.s, z = o.z;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const X = (mx) => mx * o.k - o.x, Y = (my) => my * o.k - o.y;
    const zf = z >= 17 ? 1.6 : z >= 15.5 ? 1.25 : z >= 13 ? 1 : 0.8;
    this.vpos = [];
    for (const l of s.lines) {
      if (!l.active) continue;
      if (l.mode === 'bus' && z < 11.5) continue;
      for (const v of l.veh) {
        if (v.hidden) continue;
        const p = Lines.posOf(l, v);
        const x = X(p.mx), y = Y(p.my);
        if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
        const cap = MODEL[v.model].cap, f = v.load / cap;
        const r = ({ bus: 5, metro: 6.5, ter: 6.5, boat: 6 }[l.mode]) * zf;
        this.vpos.push({ x, y, l, v });
        if (s.settings.fill) {
          ctx.beginPath(); ctx.arc(x, y, r + 3.2, 0, 7); ctx.fillStyle = 'rgba(11,24,52,.75)'; ctx.fill();
          ctx.beginPath(); ctx.arc(x, y, r + 2.4, -Math.PI / 2, -Math.PI / 2 + Math.max(0.05, Math.min(1, f)) * Math.PI * 2);
          ctx.strokeStyle = fillCol(f); ctx.lineWidth = 2.6; ctx.stroke();
        }
        ctx.beginPath();
        if (l.mode === 'metro' || l.mode === 'ter') { this.rr(ctx, x - r, y - r, 2 * r, 2 * r, r * 0.45); }
        else ctx.arc(x, y, r, 0, 7);
        ctx.fillStyle = l.color; ctx.fill();
        ctx.lineWidth = 1.4; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
        if (z >= 15.5) {
          ctx.fillStyle = inkOn(l.color); ctx.font = `700 ${Math.round(r * 1.25)}px "Barlow Condensed", sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(l.mode === 'ter' ? 'T' : l.mode === 'boat' ? 'N' : String(l.num), x, y + 0.5);
        }
        if (G.ui.selVeh === v) {
          ctx.beginPath(); ctx.arc(x, y, r + 8, 0, 7); ctx.strokeStyle = '#FFCD00'; ctx.lineWidth = 2.5; ctx.stroke();
        }
      }
    }
    /* aperçu de construction */
    const b = Build.b;
    if (b) {
      const col = Build.color();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (const sg of b.segs) {
        ctx.beginPath();
        sg.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.strokeStyle = '#0B1834'; ctx.lineWidth = 8; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.setLineDash([9, 6]); ctx.stroke(); ctx.setLineDash([]);
      }
      b.stops.forEach((st, i) => {
        const x = X(st.mx), y = Y(st.my);
        ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
        ctx.fillStyle = '#0B1834'; ctx.font = '700 11px "Barlow Condensed", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x, y + 0.5);
      });
    }
  },

  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },

  /** élément touché sur la carte */
  hit(px, py) {
    let best = null, bd = 24 * 24;
    for (const it of this.vpos || []) { const d = (it.x - px) ** 2 + (it.y - py) ** 2; if (d < bd) { bd = d; best = { type: 'veh', ...it }; } }
    if (best) return best;
    const o = this.origin();
    bd = 20 * 20;
    for (const l of G.s.lines) l.stops.forEach((st, k) => {
      const x = st.mx * o.k - o.x, y = st.my * o.k - o.y;
      const d = (x - px) ** 2 + (y - py) ** 2;
      if (d < bd) { bd = d; best = { type: 'stop', l, k, st }; }
    });
    return best;
  },
};

function lineToday(l) {
  const t = l.today;
  return { pax: t.pax, fares: t.fares + t.ads, ops: t.ops, mec: t.mec, fill: t.loadN ? t.loadSum / t.loadN : 0 };
}
function lineAgg(l, period) {
  if (period === 'today') return lineToday(l);
  const arr = period === 'yesterday' ? l.hist.slice(0, 1) : l.hist.slice(0, 7);
  if (!arr.length) return { pax: 0, fares: 0, ops: 0, mec: 0, fill: 0 };
  const sum = (k) => arr.reduce((a, d) => a + (d[k] || 0), 0);
  return { pax: sum('pax'), fares: sum('fares') + sum('ads'), ops: sum('ops'), mec: sum('mec'), fill: sum('fill') / arr.length };
}

function barChart(items, posOnly) {
  if (!items.length) return '<p class="note">Les chiffres apparaîtront après la première journée complète.</p>';
  const W = 320, H = 110, pad = 18;
  const max = Math.max(1, ...items.map((i) => Math.abs(i.v)));
  const hasNeg = !posOnly && items.some((i) => i.v < 0);
  const zero = hasNeg ? H / 2 : H - pad;
  const scale = (hasNeg ? H / 2 - 6 : H - pad - 8) / max;
  const bw = (W - 8) / items.length;
  const bars = items.map((it, i) => {
    const h = Math.abs(it.v) * scale;
    const x = 4 + i * bw + 2, y = it.v >= 0 ? zero - h : zero;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="1.5" fill="${it.v >= 0 ? (posOnly ? 'var(--yellow)' : 'var(--ok)') : 'var(--bad)'}"/>` +
      (i % 2 === items.length % 2 || items.length < 8 ? `<text x="${(x + (bw - 4) / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${it.l}</text>` : '');
  }).join('');
  const last = items[items.length - 1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" class="axis"/>${bars}</svg><small>Dernier jour : <b>${posOnly ? fmtInt(last.v) : fmtEur(last.v)}</b> · max ${posOnly ? fmtInt(max) : fmtEur(max)}</small></div>`;
}

function laneLength(l) {
  if (!l.segE) return 0;
  let m = 0; const net = G.w.road, P = l.path;
  for (let i = 0; i < P.pts.length - 1; i++) { const e = l.segE[i]; if (e >= 0 && net.cls[e] <= 3) m += P.cum[i + 1] - P.cum[i]; }
  return m;
}

/* =====================================================================
   CONSTRUCTION DE LIGNE
   ===================================================================== */
const Build = {
  b: null,
  color() { return this.b ? this.b.color : '#FFCD00'; },
  start(mode) {
    const w = G.w;
    if (mode === 'bus' && !w.road.nE) { UI.toast('Les routes sont encore en chargement, patientez quelques secondes.', 'warn'); return; }
    if (mode === 'ter' && !w.rail.nE) { UI.toast('Aucune voie ferrée chargée dans votre territoire. Achetez des zones traversées par le train.', 'warn'); return; }
    if (mode === 'boat' && !w.water.nE) { UI.toast('Aucun fleuve ni canal dans votre territoire pour l’instant.', 'warn'); return; }
    UI.close(); UI.closeCard();
    this.b = { mode, stops: [], segs: [], loop: false, color: Lines.nextColor() };
    $('#buildbar').hidden = false; $('#nav').classList.add('dim');
    this.bar();
    UI.toast({ bus: 'Touchez une rue pour placer chaque arrêt de bus.', metro: 'Touchez la carte pour placer les stations. Retouchez la 1re pour une ligne circulaire.', ter: 'Touchez près d’une gare pour l’ajouter.', boat: 'Touchez le fleuve pour placer les pontons.' }[mode], 'info');
  },
  bar() {
    const b = this.b; if (!b) return;
    const path = b.segs.length ? Lines.assemble(b.stops, b.segs, b.loop) : null;
    const cost = Lines.costOf(b.mode, b.stops, path);
    $('#buildbar').innerHTML = `<div class="bb-t">${pict(b.mode)}<div><b>${b.stops.length} arrêt${b.stops.length > 1 ? 's' : ''}${path ? ' · ' + fmtKm(path.L) : ''}${b.loop ? ' · circulaire' : ''}</b><small>Infrastructure : ${fmtEur(cost)}</small></div></div>
      <div class="bb-a"><button class="icon-b" data-act="bUndo" aria-label="Retirer le dernier arrêt" ${b.stops.length ? '' : 'disabled'}>${icon('undo')}</button><button class="icon-b" data-act="bCancel" aria-label="Annuler">${icon('close')}</button><button class="btn primary sm" data-act="bOk" ${b.stops.length >= 2 ? '' : 'disabled'}>${icon('check')} Valider</button></div>`;
  },
  allStops(mode) {
    const out = [];
    for (const l of G.s.lines) if (l.mode === mode) for (const st of l.stops) out.push(st);
    return out;
  },
  stopName(mx, my, mode, nodeName) {
    const w = G.w;
    const used = new Set(this.b.stops.map((s) => s.name));
    let name = '';
    const pois = w.poisNear(mx, my, mode === 'ter' ? 800 : 180).filter((p) => p.name && (mode !== 'ter' || p.kind === 'station'));
    if (pois.length) { pois.sort((a, b) => dist(a.mx, a.my, mx, my) - dist(b.mx, b.my, mx, my)); name = pois[0].name; }
    if (!name && nodeName) name = nodeName;
    if (!name && w.road.nE) {
      const i = w.road.nearest(mx, my, 150);
      if (i >= 0) { const nm = w.road.adj[i].map((e) => w.road.name[e]).filter(Boolean); if (nm.length) name = nm[0]; }
    }
    if (mode === 'boat' && name && !pois.length) name = 'Quai ' + name.replace(/^(rue|avenue|boulevard|chemin|route|allée|place)\s+(de la |du |des |de l’|de l'|de |d’)?/i, '');
    const z = w.zoneAt(mx, my);
    if (!name) name = z ? z.name : 'Arrêt';
    if (used.has(name) && z && !used.has(z.name)) name = z.name;
    let n = name, k = 2;
    const ROM = ['', '', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    while (used.has(n)) { n = name + ' ' + (k < ROM.length ? ROM[k] : k); k++; }
    return n.trim();
  },
  tap(mx, my) {
    const b = this.b, w = G.w, mode = b.mode;
    let st = null;
    // reprise de la 1re station : ligne circulaire
    if (b.stops.length >= 3 && MODES[mode].loop && !b.loop) {
      const f = b.stops[0];
      const o = Render.origin();
      const px = Math.hypot((f.mx - mx) * o.k, (f.my - my) * o.k);
      if (px < 26) return this.closeLoop();
    }
    if (b.loop) { UI.toast('La ligne est déjà bouclée. Validez ou retirez un arrêt.', 'info'); return; }
    if (mode === 'metro') {
      const ex = this.allStops('metro').find((s) => dist(s.mx, s.my, mx, my) < 90);
      st = ex ? { mx: ex.mx, my: ex.my, name: ex.name, shared: true } : { mx, my };
    } else if (mode === 'bus') {
      const ex = this.allStops('bus').find((s) => dist(s.mx, s.my, mx, my) < 35);
      const net = w.road;
      const i = ex && ex.nid != null && net.idx.has(ex.nid) ? net.idx.get(ex.nid) : net.nearest(mx, my, 180, (n) => net.adj[n].some((e) => net.cls[e] > 0));
      if (i < 0) { UI.toast('Aucune rue à proximité : touchez plus près d’une route.', 'warn'); return; }
      st = { mx: net.x[i], my: net.y[i], node: i, nid: net.ids[i], name: ex ? ex.name : null, shared: !!ex };
    } else if (mode === 'ter') {
      const gares = w.pois.filter((p) => p.kind === 'station' && p.train && dist(p.mx, p.my, mx, my) < 700).sort((a, b) => dist(a.mx, a.my, mx, my) - dist(b.mx, b.my, mx, my));
      if (!gares.length) { UI.toast('Pas de gare ici. Touchez près d’une gare existante.', 'warn'); return; }
      const g = gares[0];
      const i = w.rail.nearest(g.mx, g.my, 450);
      if (i < 0) { UI.toast('Cette gare n’est reliée à aucune voie chargée.', 'warn'); return; }
      const ex = this.allStops('ter').find((s) => dist(s.mx, s.my, g.mx, g.my) < 80);
      st = { mx: w.rail.x[i], my: w.rail.y[i], node: i, nid: w.rail.ids[i], name: g.name || null, shared: !!ex };
    } else if (mode === 'boat') {
      const i = w.water.nearest(mx, my, 300);
      if (i < 0) { UI.toast('Touchez directement le fleuve ou le canal.', 'warn'); return; }
      st = { mx: w.water.x[i], my: w.water.y[i], node: i, nid: w.water.ids[i] };
    }
    const z = w.zoneAt(st.mx, st.my);
    if (!z || !z.owned) { UI.toast('Cet emplacement est hors de votre zone d’exploitation. Achetez la zone d’abord.', 'warn'); return; }
    const last = b.stops[b.stops.length - 1];
    if (last && ((st.node !== undefined && st.node === last.node) || dist(st.mx, st.my, last.mx, last.my) < 60)) { UI.toast('Arrêt trop proche du précédent.', 'warn'); return; }
    if (!st.name) st.name = this.stopName(st.mx, st.my, mode);
    else { const used = new Set(b.stops.map((s) => s.name)); let n = st.name, k = 2; while (used.has(n)) n = st.name + ' ' + k++; st.name = n; }
    if (last) {
      const sg = Lines.segment(mode, last, st);
      if (!sg) { UI.toast(mode === 'bus' ? 'Pas d’itinéraire routier entre ces deux arrêts.' : 'Pas de liaison continue entre ces deux points.', 'warn'); return; }
      if (sg.pts.length < 2) sg.pts.push([st.mx, st.my]);
      b.segs.push(sg);
    }
    b.stops.push(st);
    if (navigator.vibrate) navigator.vibrate(12);
    this.bar();
  },
  closeLoop() {
    const b = this.b;
    const f = b.stops[0], last = b.stops[b.stops.length - 1];
    const sg = Lines.segment(b.mode, last, f);
    if (!sg) { UI.toast('Impossible de boucler la ligne ici.', 'warn'); return; }
    b.segs.push(sg); b.loop = true;
    this.bar();
  },
  undo() {
    const b = this.b; if (!b) return;
    if (b.loop) { b.loop = false; b.segs.pop(); }
    else if (b.stops.length) { b.stops.pop(); if (b.segs.length >= b.stops.length && b.segs.length) b.segs.pop(); }
    this.bar();
  },
  cancel() {
    this.b = null; $('#buildbar').hidden = true; $('#nav').classList.remove('dim');
  },
  confirm() {
    const b = this.b; if (!b || b.stops.length < 2) return;
    const path = Lines.assemble(b.stops, b.segs, b.loop);
    const infra = Lines.costOf(b.mode, b.stops, path);
    const cat = CATALOG[b.mode];
    G.ui.bSel = { model: cat[b.mode === 'bus' ? 1 : 0].id, count: b.mode === 'bus' ? 3 : 2, color: b.color, path, infra };
    this.dialog();
  },
  dialog() {
    const b = this.b, q = G.ui.bSel;
    const md = MODEL[q.model];
    const vehCost = Math.round(md.price * G.s.costMul) * q.count;
    const total = q.infra + vehCost;
    const sp = { bus: 4.2, metro: 12.4, ter: 18, boat: 5.5 }[b.mode];
    const cyc = (b.loop ? q.path.L : 2 * q.path.L) / sp / 60 + b.stops.length * 2 * 0.6;
    const hw = cyc / q.count;
    const cat = CATALOG[b.mode].map((m) => `<button class="catrow ${m.id === q.model ? 'on' : ''}" data-act="bModel" data-arg="${m.id}"><span><b>${esc(m.name)}</b><small>${esc(m.desc)} · ${m.cap} pl. · ${m.kmh} km/h · ${fmtEur(m.op * G.s.costMul)}/h</small></span><em>${fmtEur(m.price * G.s.costMul)}</em></button>`).join('');
    const sw = LINE_COLORS.map((c) => `<button class="sw ${c === q.color ? 'on' : ''}" style="background:${c}" data-act="bColor" data-arg="${c}" aria-label="Couleur ${c}"></button>`).join('');
    UI.modal(`<div class="plate big">${pict(b.mode)} Nouvelle ligne · ${esc(MODES[b.mode].label)}</div>
      <p class="sub">${b.stops.length} arrêts · ${fmtKm(q.path.L)}${b.loop ? ' · circulaire' : ''} · de ${esc(b.stops[0].name)} à ${esc(b.loop ? b.stops[0].name : b.stops[b.stops.length - 1].name)}${b.mode === 'metro' ? `<br>Chantier : ${q.path.L > 4000 ? '2 jours' : '1 jour'} avant l’ouverture.` : ''}</p>
      <h3 class="sec">Couleur</h3><div class="swatches">${sw}</div>
      <h3 class="sec">Véhicules</h3>${cat}
      <div class="vrow"><div><b>Nombre</b><small>passage toutes les ~${Math.max(1, Math.round(hw))} min</small></div><div class="stepper"><button data-act="bCount" data-arg="-1">−</button><b>${q.count}</b><button data-act="bCount" data-arg="1">+</button></div></div>
      <table class="tbl mini"><tbody><tr><th>Infrastructure</th><td>${fmtEur(q.infra)}</td></tr><tr><th>${q.count} × ${esc(md.name)}</th><td>${fmtEur(vehCost)}</td></tr><tr class="tot"><th>Total</th><td>${fmtEur(total)}</td></tr><tr><th>Trésorerie après</th><td class="${G.s.money - total < 0 ? 'neg' : ''}">${fmtEur(G.s.money - total)}</td></tr></tbody></table>
      <div class="row2"><button class="btn" data-act="closeModal">Retour</button><button class="btn primary" data-act="bBuild" ${G.s.money < total ? 'disabled' : ''}>Construire</button></div>`);
  },
  build() {
    const b = this.b, q = G.ui.bSel;
    const md = MODEL[q.model];
    const total = q.infra + Math.round(md.price * G.s.costMul) * q.count;
    if (!Eco.spend(total, 'capex')) return;
    b.path = q.path;
    const line = Lines.create(b, { model: q.model, count: q.count, color: q.color });
    Render.lineBox(line);
    Sim.lineQuality(line);
    Events.log('Nouvelle ligne ' + MODES[line.mode].label.toLowerCase() + ' ' + Lines.label(line) + ' : ' + line.name + '.', 'ok');
    UI.closeModal(); this.cancel();
    UI.toast(line.status === 'construction' ? 'Chantier lancé ! Ouverture le ' + Time.label(line.buildEnd).day + ' à ' + Time.label(line.buildEnd).time : 'Ligne ' + Lines.label(line) + ' ouverte !', 'ok');
    Render.dirty = true; UI.refreshTop();
    Save.auto();
  },
};

/* =====================================================================
   ACTIONS
   ===================================================================== */
const findLine = (id) => G.s.lines.find((l) => l.id === +id);
const ACT = {
  nav(k) {
    if (Build.b) Build.cancel();
    if (G.ui.sheet === k && UI.sheetOpen()) { UI.close(); return; }
    UI.open(k);
  },
  menu() { if (G.ui.sheet === 'menu' && UI.sheetOpen()) UI.close(); else UI.open('menu'); },
  closeSheet() { UI.close(); },
  closeCard() { UI.closeCard(); },
  closeModal() { UI.closeModal(); },
  play() { G.paused = !G.paused; UI.refreshTop(); },
  speed() { const v = [1, 5, 20, 60]; G.speed = v[(v.indexOf(G.speed) + 1) % v.length]; G.paused = false; UI.refreshTop(); },
  openLine(id) { UI.open('line', id); Render.dirty = true; },
  follow() { G.ui.follow = G.ui.follow === G.ui.selVeh ? null : G.ui.selVeh; UI.renderVehCard(); },
  buildMode(m) { Build.start(m); },
  bUndo() { Build.undo(); },
  bCancel() { Build.cancel(); },
  bOk() { Build.confirm(); },
  bModel(id) { G.ui.bSel.model = id; Build.dialog(); },
  bColor(c) { G.ui.bSel.color = c; Build.b.color = c; Build.dialog(); },
  bCount(d) { G.ui.bSel.count = clamp(G.ui.bSel.count + +d, 1, 40); Build.dialog(); },
  bBuild() { Build.build(); },
  buyVeh(arg) {
    const [id, m] = arg.split('|'); const l = findLine(id); if (!l) return;
    if (Lines.addVehicle(l, m)) { UI.toast(MODEL[m].name + ' ajouté à la ligne ' + Lines.label(l) + '.', 'ok'); Sim.lineQuality(l); }
    UI.refreshSheet();
  },
  sellVeh(arg) {
    const [id, m] = arg.split('|'); const l = findLine(id); if (!l) return;
    Lines.sellVehicle(l, m); Sim.lineQuality(l); UI.refreshSheet();
  },
  price(arg) {
    const [id, k, d] = arg.split('|'); const l = findLine(id); if (!l) return;
    l.prices[k] = Math.round(clamp(l.prices[k] + +d, 0, 15) * 10) / 10; UI.refreshSheet();
  },
  busLane(id) {
    const l = findLine(id); if (!l || l.busLane) return;
    const km = laneLength(l) / 1000;
    const cost = Math.round(km * 90000 * G.s.costMul / 1000) * 1000;
    if (Eco.spend(cost, 'capex')) { l.busLane = true; l.laneKm = km; Sim.lineQuality(l); UI.toast('Couloirs de bus aménagés sur la ligne ' + Lines.label(l) + '.', 'ok'); }
    UI.refreshSheet();
  },
  signal(id) {
    const l = findLine(id); if (!l || l.signal) return;
    const cost = Math.round(l.stops.length * 25000 * G.s.costMul / 1000) * 1000;
    if (Eco.spend(cost, 'capex')) { l.signal = true; Sim.lineQuality(l); UI.toast('Priorité aux feux activée.', 'ok'); }
    UI.refreshSheet();
  },
  lineColor(arg) { const [id, c] = arg.split('|'); const l = findLine(id); if (l) { l.color = c; Render.dirty = true; UI.refreshSheet(); } },
  centerLine(id) {
    const l = findLine(id); if (!l) return;
    Render.lineBox(l);
    const b = l.bbox;
    G.map.fitBounds([[myToLat(b.maxy), mxToLon(b.minx)], [myToLat(b.miny), mxToLon(b.maxx)]], { padding: [40, 40], paddingBottomRight: [20, Math.round(window.innerHeight * 0.45)] });
  },
  delLine(id, el) {
    const l = findLine(id); if (!l) return;
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer : supprimer'; return; }
    Lines.remove(l); UI.close(); Render.dirty = true;
    UI.toast('Ligne supprimée. Véhicules revendus.', 'info');
  },
  buyZone(code) {
    const z = G.w.zones.get(code); if (!z || z.owned) return;
    if (!G.w.purchasable(z)) { UI.toast('Cette zone n’est pas contiguë à votre territoire.', 'warn'); return; }
    if (!Eco.spend(z.price, 'zones')) return;
    z.owned = true;
    Events.log('Zone achetée : ' + z.name + ' (' + z.commune + ').', 'ok');
    UI.toast('Zone acquise : ' + z.name + '.', 'ok');
    Render.dirty = true;
    if (G.ui.cardType === 'zone') UI.showZone(z);
    if (UI.sheetOpen()) UI.refreshSheet();
    Loader.ensureAround();
    Save.auto();
  },
  seeZone(code) {
    const z = G.w.zones.get(code); if (!z) return;
    UI.close();
    G.map.setView([myToLat(z.cy), mxToLon(z.cx)], Math.max(G.map.getZoom(), 14));
    UI.showZone(z);
  },
  borrow(i) { Eco.borrow(Eco.loanOffers()[+i]); UI.refreshSheet(); },
  repay(arg) { const [id, f] = arg.split('|'); const ln = G.s.loans.find((x) => x.id === +id); if (ln) Eco.repay(ln, f === '1' ? ln.amount : Math.ceil(ln.amount * 0.25)); UI.refreshSheet(); },
  ads(arg) { const [m, k] = arg.split('|'); G.s.ads[m] = +k; UI.refreshSheet(); },
  statsSet(arg) { const [k, v] = arg.split('|'); G.ui[k] = v; UI.refreshSheet(); },
  strikeYes(id) {
    const e = G.s.events.find((x) => x.id === +id);
    if (e && G.s.money >= e.cost) { Eco.charge(e.cost, 'events'); e.resolved = true; Events.log('Grève évitée après négociation (' + fmtEur(e.cost) + ').', 'ok'); UI.toast('Accord trouvé : la grève est levée.', 'ok'); }
    else if (e) { UI.toast('Trésorerie insuffisante pour négocier.', 'bad'); }
    UI.closeModal(); UI.refreshTop();
  },
  strikeNo() { UI.closeModal(); },
  saveSlot(n) { if (Save.write(+n)) UI.toast('Partie sauvegardée dans l’emplacement ' + n + '.', 'ok'); UI.refreshSheet(); },
  loadSlot(n) { Save.auto(); Game.load(+n); },
  base(v) { G.s.settings.base = v; Game.setBase(); UI.refreshSheet(); },
  centerHome() { const c = G.s.city; G.map.setView([c.lat, c.lon], 14); UI.close(); },
  quit(_, el) {
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer (partie sauvegardée)'; return; }
    Save.auto(); UI.close(); Game.stop(); UI.showStart();
  },
  offlineOk() { UI.closeModal(); },
  // écran d'accueil
  stHome() { StartScreen.render('home'); },
  stNew() { StartScreen.render('new'); },
  stLoad() { StartScreen.render('load'); },
  stContinue() { const n = +localStorage.getItem('corr.last'); if (n) Game.load(n); },
  stPickCity(i) { StartScreen.city = StartScreen.results[+i]; StartScreen.render('new'); },
  stDiff(d) { StartScreen.diff = d; StartScreen.render('new'); },
  stSlot(n) { StartScreen.slot = +n; StartScreen.render('new'); },
  stGo() { StartScreen.go(); },
  stLoadSlot(n) { Game.load(+n); },
  stDelSlot(n, el) { if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer'; return; } Save.remove(+n); StartScreen.render('load'); },
};
const INP = {
  citySearch(v) { StartScreen.search(v); },
};
const CHG = {
  hStart(v, el) { const l = findLine(el.dataset.arg); if (l) { l.hours.start = +v; } },
  hEnd(v, el) { const l = findLine(el.dataset.arg); if (l) { l.hours.end = +v; } },
  night(_, el) { const l = findLine(el.dataset.arg); if (l) { l.night = el.checked; UI.refreshSheet(); } },
  setting(_, el) { G.s.settings[el.dataset.arg] = el.checked; Render.dirty = true; },
  statsAdv(_, el) { G.ui.statsAdv = el.checked; UI.refreshSheet(); },
};

/* =====================================================================
   ÉCRAN D'ACCUEIL

          <button class="btn ${lm ? '' : 'primary'} big" data-act="stNew">Nouvelle partie</button>
          ${slots.some((s) => s.meta) ? '<button class="btn big" data-act="stLoad">Charger une partie</button>' : ''}
