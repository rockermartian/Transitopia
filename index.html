      <p class="note">Les tarifs, la grille horaire et l’historique de la ligne sont conservés.</p>
      <div class="row2"><button class="btn" data-act="closeModal">Retour</button><button class="btn primary" data-act="bEditApply" ${Eco.canAfford(total) ? '' : 'disabled'}>Appliquer</button></div>`);
  },
  applyEdit() {
    const b = this.b, q = G.ui.editPend; if (!b || !q) return;
    const line = b.edit;
    const unit = Math.round(MODEL[q.model].price * G.s.costMul);
    const total = q.cost + (q.dv > 0 ? q.dv * unit : 0);
    if (total > 0 && !Eco.spend(total, 'capex')) return;
    Lines.applyEdit(line, b.stops, q.path, q.pathB);
    for (let k = 0; k < q.dv; k++) Lines.addVehicle(line, q.model, true);
    for (let k = 0; k < -q.dv; k++) Lines.sellVehicle(line, q.model);
    if (line.active) Lines.adjustFleet(line, G.s.min);
    Transfers.rebuild();
    Render.lineBox(line); Sim.lineQuality(line);
    Events.log('Ligne ' + Lines.label(line) + ' modifiée : ' + line.name + '.', 'ok');
    UI.closeModal(); this.cancel();
    UI.toast('Ligne ' + Lines.label(line) + ' modifiée.', 'ok');
    Render.dirty = true; UI.refreshTop(); Save.auto();
    UI.open('line', line.id);
  },

  closeLoop() {
    const b = this.b;
    const f = b.stops[0], last = b.stops[b.stops.length - 1];
    const sg = Lines.segment(b.mode, last, f);
    if (!sg) { UI.toast('Impossible de boucler la ligne ici.', 'warn'); return; }
    b.segs.push(sg); b.loop = true;
    this.bar();
  },
  undo() {
    const b = this.b; if (!b) return;
    if (b.edit) { if (b.hist.length) { b.stops = b.hist.pop(); b.sel = -1; this.reseg(); this.bar(); Render.dirty = true; } return; }
    if (b.loop) { b.loop = false; b.segs.pop(); }
    else if (b.stops.length) { b.stops.pop(); if (b.segs.length >= b.stops.length && b.segs.length) b.segs.pop(); }
    this.bar();
  },
  cancel() {
    this.b = null; $('#buildbar').hidden = true; $('#buildbar').classList.remove('edit'); $('#nav').classList.remove('dim'); Render.dirty = true;
  },
  confirm() {
    const b = this.b; if (!b || b.stops.length < 2) return;
    if (b.edit) return this.confirmEdit();
    const path = Lines.assemble(b.stops, b.segs, b.loop);
    b.pathB = null;
    if (b.mode === 'bus' && !b.loop) {
      const bk = Lines.buildBack('bus', b.stops);
      if (!bk) { UI.toast('Impossible de trouver un trajet retour respectant les sens de circulation.', 'warn'); return; }
      const net = G.w.road;
      b.pathB = bk.path;
      b.stops.forEach((st, k) => { const n = bk.back[k]; st.bmx = net.x[n]; st.bmy = net.y[n]; st.bnid = net.ids[n]; });
      if (bk.forced) UI.toast('Attention : une partie du retour emprunte un sens interdit faute d’alternative.', 'warn');
    }
    const infra = Lines.costOf(b.mode, b.stops, path);
    const cat = CATALOG[b.mode];
    G.ui.bSel = b.tuto
      ? { model: cat[0].id, count: 1, color: b.color, path, infra: 0 } // ligne offerte : 1 véhicule, le plus simple
      : { model: cat[b.mode === 'bus' ? 1 : 0].id, count: b.mode === 'bus' ? 3 : 2, color: b.color, path, infra };
    this.dialog();
  },
  dialog() {
    const b = this.b, q = G.ui.bSel;
    if (!b.tuto && q.infra === 0 && q.path) { q.infra = Lines.costOf(b.mode, b.stops, q.path); } // tutoriel passé en cours de route
    const md = MODEL[q.model];
    const vehCost = b.tuto ? 0 : Math.round(md.price * G.s.costMul) * q.count;
    const total = q.infra + vehCost;
    const sp = { bus: 4.2, metro: 12.4, ter: 18, boat: 5.5 }[b.mode];
    const cyc = (b.loop ? q.path.L : 2 * q.path.L) / sp / 60 + b.stops.length * 2 * 0.6;
    const hw = cyc / q.count;
    const cat = CATALOG[b.mode].filter((m) => !b.tuto || m.id === q.model).map((m) => `<button class="catrow ${m.id === q.model ? 'on' : ''}" data-act="bModel" data-arg="${m.id}"><span><b>${esc(m.name)}</b><small>${esc(m.desc)} · ${m.cap} pl. · ${m.kmh} km/h en ${accTime(m)} s · ${fmtEur(m.op * G.s.costMul)}/h</small></span><em>${fmtEur(m.price * G.s.costMul)}</em></button>`).join('');
    const sw = LINE_COLORS.map((c) => `<button class="sw ${c === q.color ? 'on' : ''}" style="background:${c}" data-act="bColor" data-arg="${c}" aria-label="Couleur ${c}"></button>`).join('');
    UI.modal(`<div class="plate big">${pict(b.mode)} Nouvelle ligne · ${esc(MODES[b.mode].label)}</div>
      <p class="sub">${b.stops.length} arrêts · ${fmtKm(q.path.L)}${b.loop ? ' · circulaire' : ''} · de ${esc(b.stops[0].name)} à ${esc(b.loop ? b.stops[0].name : b.stops[b.stops.length - 1].name)}${b.mode === 'metro' ? `<br>Chantier : ${q.path.L > 4000 ? '2 jours' : '1 jour'} avant l’ouverture.` : ''}</p>
      <h3 class="sec">Couleur</h3><div class="swatches">${sw}</div>
      <h3 class="sec">Véhicules</h3>${cat}
      ${b.tuto ? `<p class="note ok">Ligne offerte par le tutoriel : 1 véhicule, passage toutes les ~${Math.max(1, Math.round(hw))} min. Vous pourrez en ajouter ensuite depuis la fiche de la ligne.</p>`
        : `<div class="vrow"><div><b>Nombre</b><small>passage toutes les ~${Math.max(1, Math.round(hw))} min</small></div><div class="stepper"><button data-act="bCount" data-arg="-1">−</button><b>${q.count}</b><button data-act="bCount" data-arg="1">+</button></div></div>`}
      ${(() => { const est = Lines.estimate(b.mode, b.stops, q.path, b.loop); return est ? `<div class="kpis"><div><small>Voyageurs estimés</small><b>≈ ${fmtInt(Math.round(est.pax / 10) * 10)} / jour</b></div><div><small>Habitants et emplois desservis</small><b>${fmtInt(Math.round(est.pop / 100) * 100)}</b></div></div><p class="sub">Estimation un jour de semaine, avec un passage fréquent et le tarif de référence, hors correspondances.</p>` : ''; })()}
      <table class="tbl mini"><tbody><tr><th>Infrastructure</th><td>${fmtEur(q.infra)}</td></tr><tr><th>${q.count} × ${esc(md.name)}</th><td>${fmtEur(vehCost)}</td></tr><tr class="tot"><th>Total</th><td>${b.tuto ? 'offert' : fmtEur(total)}</td></tr>${b.tuto ? '' : Eco.free() ? '<tr><th>Argent illimité</th><td>gratuit</td></tr>' : `<tr><th>Trésorerie après</th><td class="${G.s.money - total < 0 ? 'neg' : ''}">${fmtEur(G.s.money - total)}</td></tr>`}</tbody></table>
      <div class="row2"><button class="btn" data-act="closeModal">Retour</button><button class="btn primary" data-act="bBuild" ${Eco.canAfford(total) ? '' : 'disabled'}>Construire</button></div>`);
  },
  build() {
    const b = this.b, q = G.ui.bSel;
    const md = MODEL[q.model];
    const gift = !!b.tuto;
    const total = gift ? 0 : q.infra + Math.round(md.price * G.s.costMul) * q.count;
    if (total > 0 && !Eco.spend(total, 'capex')) return;
    b.path = q.path;
    const line = Lines.create(b, { model: q.model, count: q.count, color: q.color });
    if (gift) { line.gift = q.count; Tuto.onBuilt(line); }
    Transfers.rebuild();
    Render.lineBox(line);
    Sim.lineQuality(line);
    Events.log('Nouvelle ligne ' + MODES[line.mode].label.toLowerCase() + ' ' + Lines.label(line) + ' : ' + line.name + '.', 'ok');
    UI.closeModal(); this.cancel();
    UI.toast(line.status === 'construction' ? 'Chantier lancé ! Ouverture le ' + Time.label(line.buildEnd).day + ' à ' + Time.label(line.buildEnd).time : 'Ligne ' + Lines.label(line) + ' ouverte !', 'ok');
    Render.dirty = true; UI.refreshTop();
    Save.auto();
  },
};

  taxiGoto() { const T = Taxi.st(); if (!T) return; UI.close(); G.map.setView([myToLat(T.depot.my), mxToLon(T.depot.mx)], 16.5); },
  buildMode(m) { if (RailBuild.b) RailBuild.cancel(); if (Tuto.offerMode(m)) return; Build.start(m); },
  tutoGo() { Tuto.goMain(); },
  tutoSkip() { if (!Tuto.cur) { UI.closeModal(); Tuto.st().main = Tuto.st().main === 'pending' ? 'skipped' : Tuto.st().main; return; } Tuto.skip(); },
  tutoNext() { Tuto.next(); },
  tutoModeGo(m) { Tuto.goMode(m); },
  tutoModeSkip(m) { Tuto.st().seen[m] = true; UI.closeModal(); Build.start(m); },
  railMode(k) { RailBuild.start(k); },
  rbRot(d) { RailBuild.rotate(+d); },
  rbCancel() { RailBuild.cancel(); },
  rbOk() { RailBuild.confirm(); },
  rbUndo() { RailBuild.undo(); },
  stRot(arg) {
    const [id, d] = arg.split('|'); const g = Rail.stationById(+id); if (!g) return;
    g.ang += (+d) * Math.PI / 12; Render.dirty = true; UI.showStation(g);

  stTrack(id) {

  },
  poiTrack(arg) {

  stDemolish(id, el) {

    const R = Rail.st();

    G.w.pois = G.w.pois.filter((p) => p.sid !== g.id); G.w.poiSeen.delete('gs' + g.id);
    Eco.earn(Math.round(Rail.stationCost() * 0.3), 'sales');
    UI.closeCard(); Render.dirty = true; UI.toast(g.name + ' démolie.', 'info');
  },
  bUndo() { Build.undo(); },
  bCancel() { Build.cancel(); },
  bOk() { Build.confirm(); },
  bModel(id) { if (Build.b && Build.b.tuto) return; G.ui.bSel.model = id; Build.dialog(); },
  bColor(c) { G.ui.bSel.color = c; Build.b.color = c; Build.dialog(); },
  bCount(d) { if (Build.b && Build.b.tuto) return; G.ui.bSel.count = clamp(G.ui.bSel.count + +d, 1, 40); Build.dialog(); },
  bBuild() { Build.build(); },
  bEditApply() { Build.applyEdit(); },
  bEditVeh(d) { const q = G.ui.editPend, l = Build.b && Build.b.edit; if (!q || !l) return; q.dv = Math.max(1 - l.veh.length, q.dv + +d); Build.editDialog(); },
  buyVeh(arg) {
    const [id, m] = arg.split('|'); const l = findLine(id); if (!l) return;
    const price = Math.round(MODEL[m].price * G.s.costMul);
    UX.confirmSpend(price, `${MODEL[m].name} pour la ligne ${Lines.label(l)}`, () => {
      if (!Lines.addVehicle(l, m)) { UI.refreshSheet(); return; }
      const v = l.veh[l.veh.length - 1];
      UX.undo(MODEL[m].name + ' ajouté à la ligne ' + Lines.label(l) + '.', () => {
        const i = l.veh.indexOf(v); if (i < 0) return;
        l.veh.splice(i, 1); if (G.ui.follow === v) G.ui.follow = null;
        UX.refund(price, 'capex'); Sim.lineQuality(l); UI.refreshSheet(); UI.toast('Achat annulé, remboursé.', 'info');
      });
      Sim.lineQuality(l); UI.refreshSheet();
    });
  },
  sellVeh(arg) {
    const [id, m] = arg.split('|'); const l = findLine(id); if (!l) return;

  price(arg) {

  },

      if (Eco.spend(cost, 'capex')) {
        l.busLane = true; l.laneKm = km; Sim.lineQuality(l); Dessin.refresh();

      }
      UI.refreshSheet();
    });

  },
  seeZone(code) {
    const z = G.w.zones.get(code); if (!z) return;
    UI.close();
    G.map.setView([myToLat(z.cy), mxToLon(z.cx)], Math.max(G.map.getZoom(), 14));
    UI.showZone(z);
  },
  borrow(i) { Eco.borrow(Eco.loanOffers()[+i]); UI.refreshSheet(); },
  repay(arg) { const [id, f] = arg.split('|'); const ln = G.s.loans.find((x) => x.id === +id); if (ln) Eco.repay(ln, f === '1' ? ln.amount : Math.ceil(ln.amount * 0.25)); UI.refreshSheet(); },
  ads(arg) { const [m, k] = arg.split('|'); G.s.ads[m] = +k; UI.refreshSheet(); },
  statsSet(arg) { const [k, v] = arg.split('|'); G.ui[k] = v; UI.refreshSheet(); },
  strikeYes(id) {
    const e = G.s.events.find((x) => x.id === +id);
    if (e && Eco.canAfford(e.cost)) { Eco.charge(e.cost, 'events'); e.resolved = true; Events.log('Grève évitée après négociation (' + fmtEur(e.cost) + ').', 'ok'); UI.toast('Accord trouvé : la grève est levée.', 'ok'); }
    else if (e) { UI.toast('Trésorerie insuffisante pour négocier.', 'bad'); }
    UI.closeModal(); UI.refreshTop();
  },
  strikeNo() { UI.closeModal(); },
  saveSlot(n) { if (Save.write(+n)) UI.toast('Partie sauvegardée dans l’emplacement ' + n + '.', 'ok'); UI.refreshSheet(); },
  loadSlot(n) { Save.auto(); Game.load(+n); },
  base(v) { G.s.settings.base = v; Game.setBase(); UI.updateTint(); UI.refreshSheet(); },
  centerHome() { const c = G.s.city; G.map.setView([c.lat, c.lon], 14); UI.close(); },
  quit(_, el) {
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer (partie sauvegardée)'; return; }
    Save.auto(); UI.close(); Game.stop(); UI.showStart();
  },
  offlineOk() { UI.closeModal(); },
  seeEvent(id) {
    const e = G.s.events.find((x) => x.id === +id); if (!e) return;
    const p = Events.where(e);
    if (!p) { UI.close(); UI.showEvent(e); return; }
    UI.close();
    G.map.setView([myToLat(p[1]), mxToLon(p[0])], Math.max(G.map.getZoom(), 15));
    UI.showEvent(e);
  },
  // écran d'accueil
  stHome() { StartScreen.render('home'); },
  stNew() { StartScreen.render('new'); },
  stLoad() { StartScreen.render('load'); },
  stContinue() { const n = +localStorage.getItem('corr.last'); if (n) Game.load(n); },
  stPickCity(i) { StartScreen.pick(i); },
  stDiff(d) { StartScreen.diff = d; StartScreen.render('new'); },
  stSlot(n) { StartScreen.slot = +n; StartScreen.render('new'); },
  stGo() { StartScreen.go(); },
  stLoadSlot(n) { Game.load(+n); },
  stDelSlot(n, el) { if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'Confirmer'; return; } Save.remove(+n); StartScreen.render('load'); },
};
const INP = {
  citySearch(v) { StartScreen.search(v); },
};
const CHG = {
  hStart(v, el) { const l = findLine(el.dataset.arg); if (l) { l.hours.start = +v; } },
  hEnd(v, el) { const l = findLine(el.dataset.arg); if (l) { l.hours.end = +v; } },
  night(_, el) { const l = findLine(el.dataset.arg); if (l) { l.night = el.checked; UI.refreshSheet(); } },
  svc(v, el) {
    const [id, k] = el.dataset.arg.split('|'); const l = findLine(id); if (!l) return;
    l.svc[k] = +v;
    const pk = Object.entries(SERVICE_PRESETS).find(([, p]) => SERVICE_KEYS.every(([kk]) => Math.abs((p.v[kk] ?? 1) - (l.svc[kk] ?? 1)) < 0.01));
    l.svcPreset = pk ? pk[0] : 'perso';
    if (l.active) Lines.adjustFleet(l, G.s.min);
    Sim.lineQuality(l); UI.refreshSheet();
  },
  setting(_, el) {
    G.s.settings[el.dataset.arg] = el.checked; Render.dirty = true;
    if (el.dataset.arg === 'realWeather') { if (el.checked) RealWeather.refresh(true); else { G.s.wxReal = null; UI.refreshTop(); } }
  },
  statsAdv(_, el) { G.ui.statsAdv = el.checked; UI.refreshSheet(); },
  unlimited(_, el) { Eco.setUnlimited(el.checked); UI.refreshSheet(); },
};

const StartScreen = {
  city: null, diff: 'normal', slot: 1, results: [], timer: null, q: '',
  render(view) {
    document.body.classList.remove('th-bd'); setFont('"Jost", "Futura", "Century Gothic", sans-serif');
    const prev = this.view; this.view = view; this.lastView = prev;
    const box = $('#startBox');
    const last = +localStorage.getItem('corr.last');
    const slots = Save.list();
    if (view === 'home') {
      const lm = last ? slots[last - 1].meta : null;
      box.innerHTML = `<div class="logo"><span class="pict pict-metro">T</span><h1>Transitopia</h1></div>
        <p class="verpill">Version ${APP_VERSION}</p>
        <p class="tagline">Bâtissez le réseau de transport de votre ville, sur la vraie carte de France.</p>
        <div class="stack">
          ${lm ? `<button class="btn primary big" data-act="stContinue">Continuer · ${esc(lm.city)}<small>${esc(lm.date)} · ${lm.unlimited ? 'argent illimité' : fmtEur(lm.money)}</small></button>` : ''}
          <button class="btn ${lm ? '' : 'primary'} big" data-act="stNew">Nouvelle partie</button>
          ${slots.some((s) => s.meta) ? '<button class="btn big" data-act="stLoad">Charger une partie</button>' : ''}
        </div>
        <p class="credits">Version ${APP_VERSION} · Photos et données IGN (BD TOPO) · Signalisation © OpenStreetMap · Connexion internet requise</p>`;
    } else if (view === 'new') {
      if (!this.slot || slots[this.slot - 1].meta) { const free = slots.find((s) => !s.meta); this.slot = free ? free.n : this.slot || 1; }
      box.innerHTML = `<div class="plate big">Nouvelle partie</div>
        <label class="lab" for="citySearch">Ville de départ</label>
        <input id="citySearch" class="inp" type="search" placeholder="Ex. Lyon, Nantes, Annecy…" autocomplete="off" data-input="citySearch" value="${esc(this.q)}">
        <div id="cityRes" class="cityres">${this.resHTML()}</div>
        <div id="chosenCity" class="chosen">${this.chosenHTML()}</div>
        <label class="lab">Difficulté</label>
        <div class="seg">${Object.entries(DIFF).map(([k, d]) => `<button class="${this.diff === k ? 'on' : ''}" data-act="stDiff" data-arg="${k}">${d.label}</button>`).join('')}</div>
        <p class="sub">Capital de départ : ${fmtEur(DIFF[this.diff].money)} · coûts ×${DIFF[this.diff].cost.toLocaleString('fr-FR')}</p>
        <label class="lab">Emplacement de sauvegarde</label>
        <div class="seg wrap">${slots.map((s) => `<button class="${this.slot === s.n ? 'on' : ''}" data-act="stSlot" data-arg="${s.n}">${s.n}${s.meta ? ' · ' + esc(s.meta.city) : ' · libre'}</button>`).join('')}</div>
        ${slots[this.slot - 1].meta ? '<p class="note warn">Cet emplacement contient une partie : elle sera remplacée.</p>' : ''}
        <div class="row2"><button class="btn" data-act="stHome">Retour</button><button class="btn primary" id="stGoBtn" data-act="stGo" ${this.city ? '' : 'disabled'}>Démarrer</button></div>`;
      // le clavier ne s'ouvre qu'en arrivant sur l'écran, pas à chaque choix de difficulté ou d'emplacement
      const inp = $('#citySearch');
      if (inp && !this.city && this.lastView !== 'new') inp.focus();
    } else if (view === 'load') {
      box.innerHTML = `<div class="plate big">Charger une partie</div>
        ${slots.map(({ n, meta }) => `<div class="vrow"><div><b>Emplacement ${n}</b><small>${meta ? esc(meta.city) + ' · ' + esc(meta.date) + ' · ' + (meta.unlimited ? 'illimité' : fmtEur(meta.money)) + ' · ' + meta.lines + ' lignes' : 'vide'}</small></div>${meta ? `<div class="row2 tight"><button class="btn sm primary" data-act="stLoadSlot" data-arg="${n}">Jouer</button><button class="btn sm danger" data-act="stDelSlot" data-arg="${n}">Effacer</button></div>` : ''}</div>`).join('')}
        <button class="btn wide" data-act="stHome">Retour</button>`;
    } else if (view === 'loading') {
      box.innerHTML = `<div class="logo"><span class="pict pict-metro">T</span><h1>Transitopia</h1></div>
        <div class="loadbox"><span class="spin big"></span><p id="loadMsg">${esc(this.loadMsg || 'Chargement…')}</p></div>`;
    }
  },
  resHTML() {
    if (this.busy && !this.results.length) return '<p class="note"><span class="spin"></span> Recherche…</p>';
    if (this.err) return '<p class="note bad">Recherche impossible : vérifiez la connexion internet.</p>';
    if (!this.results.length) return this.q.trim().length >= 2 && this.done === this.q.trim() ? '<p class="note">Aucune commune trouvée. Essayez sans accent, ou avec le code postal.</p>' : '';
    // homonymes : le département les distingue
    return this.results.map((c, i) => `<button class="cityrow ${this.city && this.city.code === c.code ? 'on' : ''}" data-act="stPickCity" data-arg="${i}"><span class="cr-n"><b>${esc(c.nom)}</b><small>${esc(c.codeDepartement || '')}${c.departement ? ' · ' + esc(c.departement.nom) : ''}</small></span><small class="cr-p">${fmtInt(c.population || 0)} hab.</small></button>`).join('');
  },
  /** n'affiche que si l'écran « Nouvelle partie » est toujours là */
  paintRes() {
    const r = $('#cityRes'); if (r) r.innerHTML = this.resHTML();
    const ch = $('#chosenCity'); if (ch) ch.innerHTML = this.chosenHTML();
    const go = $('#stGoBtn'); if (go) go.disabled = !this.city;
  },
  chosenHTML() { return this.city ? `${icon('ok')} <b>${esc(this.city.nom)}</b> <small>${esc(this.city.codeDepartement || '')}${this.city.departement ? ' · ' + esc(this.city.departement.nom) : ''} · ${fmtInt(this.city.population || 0)} hab.</small>` : ''; },
  search(v) {
    this.q = v;
    const t = v.trim();
    // le texte a changé : la ville choisie ne correspond plus forcément
    if (this.city && t !== this.city.nom) this.city = null;
    clearTimeout(this.timer);
    const id = this.reqId = (this.reqId || 0) + 1;
    this.err = false;
    if (t.length < 2) { this.results = []; this.busy = false; this.paintRes(); return; }
    this.busy = true; this.paintRes();
    this.timer = setTimeout(async () => {
      try {
        const res = await API.searchCommunes(t);
        if (id !== this.reqId) return; // une recherche plus récente est en cours : on ignore cette réponse
        this.results = res; this.done = t;
      } catch (e) { if (id !== this.reqId) return; this.results = []; this.err = true; }
      this.busy = false; this.paintRes();
    }, 300);
  },
  /** Entrée : la première commune proposée */
  enter() { if (this.results.length) { this.pick(0); $('#citySearch')?.blur(); } },
  pick(i) {
    const c = this.results[+i]; if (!c) return;
    this.city = c; this.q = c.nom;
    const inp = $('#citySearch'); if (inp) { inp.value = c.nom; inp.blur(); }
    this.paintRes();
  },
  setMsg(t) { this.loadMsg = t; const el = $('#loadMsg'); if (el) el.textContent = t; },
  go() {
    if (!this.city) return;
    const c = this.city;
    const city = { nom: c.nom, code: c.code, lat: c.centre.coordinates[1], lon: c.centre.coordinates[0] };
    Game.newGame(city, this.diff, this.slot);
  },
};

const Game = {
  baseLayers: {},
  initMap() {
    if (G.map) return;
    G.map = L.map('map', { zoomControl: false, zoomSnap: 0.5, zoomDelta: 0.5, maxZoom: 19.5, minZoom: 6, maxBounds: [[40.8, -6.5], [52, 10.5]], maxBoundsViscosity: 0.8, tap: true });
    const ORTHO = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
    const PLAN = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
    const at = '© IGN Géoplateforme · © contributeurs OpenStreetMap';
    // keepBuffer : les dalles autour de la vue restent en mémoire (6 rangées au lieu de 2)
    const opt = { maxZoom: 20, attribution: at, keepBuffer: 6, updateWhenZooming: false };
    this.baseLayers.photo = L.tileLayer(ORTHO, { ...opt, maxNativeZoom: 19 });
    this.baseLayers.plan = L.tileLayer(PLAN, { ...opt, maxNativeZoom: 18 });
    // sous-couches « de secours » : la même carte en basse définition (peu de dalles couvrent une grande surface),
    // affichée sous la carte nette : en dézoomant, les bords sont flous le temps du chargement au lieu d'être blancs
    const under = { maxZoom: 20, maxNativeZoom: 11, keepBuffer: 4, updateWhenZooming: false, className: 'tl-under' };
    this.underLayers = { photo: L.tileLayer(ORTHO, under), plan: L.tileLayer(PLAN, under) };
    this.baseLayers.dessin = Dessin.make(); // carte dessinée à partir de la photo et des données IGN
    G.map.attributionControl.setPrefix(false);
    G.map.on('click', (e) => this.onTap(e));
    Render.init();
  },
  setBase() {
    const want = G.s.settings.base === 'plan' ? 'plan' : G.s.settings.base === 'dessin' ? 'dessin' : 'photo';
    const uw = want === 'dessin' ? null : want; // la carte dessinée n'a pas besoin de photo dessous
    for (const [k, lay] of Object.entries(this.underLayers)) {
      if (k === uw && !G.map.hasLayer(lay)) { lay.addTo(G.map); lay.setZIndex(0); }
      if (k !== uw && G.map.hasLayer(lay)) G.map.removeLayer(lay);
    }
    for (const [k, lay] of Object.entries(this.baseLayers)) {
      if (k === want && !G.map.hasLayer(lay)) { lay.addTo(G.map); lay.setZIndex(1); }
      if (k !== want && G.map.hasLayer(lay)) G.map.removeLayer(lay);
    }
    // fond de la carte sous les dalles : teinte moyenne de la photo, ou papier pour le plan
    $('#map').classList.toggle('bg-photo', want === 'photo');
    // interface « ligne claire » avec la carte dessinée (lettrage à la main jusque sur la carte)
    const bd = want === 'dessin';
    if (document.body.classList.contains('th-bd') !== bd) {
      document.body.classList.toggle('th-bd', bd);
      setFont(bd ? '"Patrick Hand", "Comic Sans MS", cursive' : '"Jost", "Futura", "Century Gothic", sans-serif');
      const redraw = () => { if (G.ready) { Render.dirty = true; Render.drawStatic(); } };
      redraw();
      if (bd && document.fonts && document.fonts.load) document.fonts.load('12px "Patrick Hand"').then(redraw, () => {});
    }
  },
  onTap(e) {
    if (!G.ready) return;
    const mx = lonToMx(e.latlng.lng), my = latToMy(e.latlng.lat);
    if (RailBuild.b) { RailBuild.tap(mx, my); return; }
    if (Build.b) { Build.tap(mx, my); return; }
    if (G.ui.taxiPlace) { if (Taxi.placeDepot(mx, my)) { ACT.taxiPlaceCancel(); UI.open('taxi'); } return; }
    const h = Render.hit(e.containerPoint.x, e.containerPoint.y);
    if (h && h.type === 'event') { UI.showEvent(h.e); return; }
    if (h && h.type === 'cluster') { G.map.setView(G.map.containerPointToLatLng([h.x, h.y]), Math.min(18, G.map.getZoom() + 2)); return; }
    if (h && h.type === 'station') { UI.showStation(h.g); return; }
    if (h && h.type === 'poi') { UI.showPoi(h.p); return; }
    if (h && h.type === 'taxi') { UI.showTaxi(h.t); return; }
    if (h && h.type === 'depot') { UI.open('taxi'); return; }
    if (h && h.type === 'veh') { UI.showVehicle(h.l, h.v); return; }
    if (h && h.type === 'stop') { UI.showStop(h.l, h.k); return; }
    const z = G.w.zoneAt(mx, my);
    if (z) { UI.showZone(z); return; }
    UI.closeCard();
  },

  async newGame(city, diff, slot) {
    StartScreen.render('loading');
    StartScreen.setMsg('Préparation de ' + city.nom + '…');
    G.s = Sim.newState(city, diff, slot);
    G.mpu = mPerUnit(city.lat);
    G.w = new World();
    const [ci, cj] = chunkOf(city.lat, city.lon);
    const chunks = [];
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) chunks.push([ci + di, cj + dj]);
    chunks.sort((a, b) => Math.abs(a[0] - ci) + Math.abs(a[1] - cj) - Math.abs(b[0] - ci) - Math.abs(b[1] - cj));
    StartScreen.setMsg('Chargement des quartiers (IGN)…');
    await Loader.zonesFor(chunks);
    if (!G.w.zones.size) {
      StartScreen.render('new');
      UI.toast('Impossible de charger les quartiers. Vérifiez la connexion et réessayez.', 'bad');
      return;
    }
    // territoire de départ
    const cmx = lonToMx(city.lon), cmy = latToMy(city.lat);
    const center = G.w.zoneAt(cmx, cmy);
    let n = 0;
    for (const z of G.w.zones.values()) if (dist(z.cx, z.cy, cmx, cmy) < 1300) { z.owned = true; n++; }
    if (center) center.owned = true;
    if (!n && !center) {
      let best = null, bd = Infinity;
      for (const z of G.w.zones.values()) { const d = dist(z.cx, z.cy, cmx, cmy); if (d < bd) { bd = d; best = z; } }
      if (best) best.owned = true;
    }
    G.s.zoneMode = G.w.mode;
    Events.log('Bienvenue à ' + city.nom + ' ! Votre compagnie démarre avec ' + [...G.w.zones.values()].filter((z) => z.owned).length + ' zone(s).', 'ok');
    await this.enter(true);
    Save.write(slot);
  },

  async load(n) {
    const data = Save.read(n);
    if (!data) { UI.toast('Sauvegarde introuvable.', 'bad'); return; }
    this.stop();
    $('#start').hidden = false; $('#game').hidden = true;
    StartScreen.render('loading');
    StartScreen.setMsg('Chargement de ' + data.city.nom + '…');
    G.s = Save.hydrate(data);
    G.s.slot = n;
    G.mpu = mPerUnit(G.s.city.lat);
    G.w = new World();
    G.w.mode = G.s.zoneMode || 'iris';
    // zones possédées : on recharge la grille autour d'elles
    const boxes = G.s.ownedBoxes || [];
    const chunks = new Map();
    const add = (c) => chunks.set(c.join(':'), c);
    const [ci, cj] = chunkOf(G.s.city.lat, G.s.city.lon);
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) add([ci + di, cj + dj]);
    for (const b of boxes) for (const c of chunksForMercBox(b, 1)) add(c);
    StartScreen.setMsg('Chargement des quartiers (IGN)…');
    await Loader.zonesFor([...chunks.values()]);
    const own = new Set(G.s.owned);
    for (const z of G.w.zones.values()) if (own.has(z.code)) z.owned = true;
    await this.enter(false);
    if (G.s.settings.realWeather) RealWeather.refresh(true);
    // progression hors-ligne
    if (G.s.realtime) {
      G.speed = 'rt';
      const el = (Date.now() - (G.s.lastReal || Date.now())) / 1000;
      const r = el > 60 ? Sim.offline(el, el / 60) : null;
      RealTime.jump(RealTime.targetSec());
      if (r && r.gameMin >= 30) {
        UI.modal(`<div class="plate big">${icon('sun')} Pendant votre absence</div>
          <p>Le réseau a tourné en temps réel pendant <b>${Math.floor(r.gameMin / 1440)} j ${Math.floor((r.gameMin % 1440) / 60)} h ${Math.round(r.gameMin % 60)} min</b>.</p>
          <p class="big-num ${r.gain < 0 ? 'neg' : 'pos'}">${r.gain >= 0 ? '+' : ''}${fmtEur(r.gain)}</p>
          <button class="btn primary wide" data-act="offlineOk">Reprendre</button>`, { pause: true });
      }
      UI.refreshTop();
    } else if (G.s.settings.idle && G.s.lastReal) {
      const r = Sim.offline((Date.now() - G.s.lastReal) / 1000);
      if (r) {
        UI.modal(`<div class="plate big">${icon('sun')} Pendant votre absence</div>
          <p>Le réseau a continué de tourner pendant <b>${Math.floor(r.gameMin / 1440)} j ${Math.floor((r.gameMin % 1440) / 60)} h</b> de jeu.</p>
          <p class="big-num ${r.gain < 0 ? 'neg' : 'pos'}">${r.gain >= 0 ? '+' : ''}${fmtEur(r.gain)}</p>
          <p class="sub">Calcul basé sur le résultat moyen des 3 derniers jours.</p>
          <button class="btn primary wide" data-act="offlineOk">Reprendre</button>`, { pause: true });
        UI.refreshTop();
      }
    }
  },

  async enter(isNew) {
    UI.showGame();
    this.initMap();
    G.paused = false; G.speed = 1;
    this.setBase();
    const v = G.s.view;
    if (v) G.map.setView([v.lat, v.lng], v.z, { animate: false });
    else G.map.setView([G.s.city.lat, G.s.city.lon], 14.5, { animate: false });
    if (!G.s.rail) G.s.rail = { stations: [], tracks: [] };
    Tuto.normalize(isNew);
    if (G.s.settings.base === 'pale') G.s.settings.base = 'dessin'; // l'ancien fond « épuré » devient le fond dessiné
    if (G.s.settings.pois === undefined) G.s.settings.pois = true;
    if (G.s.settings.lights === undefined) G.s.settings.lights = true;
    if (!G.s.settings.notif) G.s.settings.notif = 'all';
    if (!G.s.settings.notifPause) G.s.settings.notifPause = 'choices';
    if (!G.s.notifs) G.s.notifs = [];
    for (const e of G.s.events) Events.normalize(e);
    Rail.inject();
    for (const l of G.s.lines) { Lines.prepare(l); Render.lineBox(l); }
    Transfers.rebuild();
    G.ready = true;
    UX.guard(); UI.refreshHeatChip();
    Render.resize(); Render.dirty = true;
    UI.refreshTop(); UI.updateTint(); UI.refreshInfoBadge();
    Traffic.update();
    for (const l of G.s.lines) Sim.lineQuality(l);
    if (isNew && G.s.tuto && G.s.tuto.main === 'pending') setTimeout(() => Tuto.startMain(), 900);
    Loader.ensureAround().then(() => {
      for (const l of G.s.lines) { Lines.resolveEdges(l); if (!l.catchPop) Lines.computeOD(l); }
      Transfers.rebuild();
      for (const l of G.s.lines) Sim.lineQuality(l);
    });
  },

  stop() { G.ready = false; Tuto.end(); Build.cancel(); if (RailBuild.b) RailBuild.cancel(); UI.closeCard(); UI.closeModal(); },
};

/* ownedBoxes ajouté à la sauvegarde pour recharger le bon secteur */
const _ser = Save.serialize.bind(Save);
Save.serialize = function () {
  const raw = JSON.parse(_ser());
  raw.ownedBoxes = [...G.w.zones.values()].filter((z) => z.owned).map((z) => z.bbox);
  return JSON.stringify(raw);
};

/* =====================================================================
   BOUCLE PRINCIPALE
   ===================================================================== */
let lastFrame = performance.now(), lastCard = 0, lastAuto = Date.now(), lastTop = 0, lastSync = 0, lastWx = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (G.ready && G.s) {
    if (!G.paused) Sim.advance(G.speed === 'rt' ? dt : dt * 60 * G.speed);
    if (G.speed === 'rt' && !G.paused && now - lastSync > 30000) { lastSync = now; RealTime.sync(); }
    if (now - lastWx > 60000) { lastWx = now; RealWeather.refresh(); }
    Render.tick(now);
    if (now - lastTop > 500) { lastTop = now; UI.refreshTop(); }
    if (now - lastCard > 400) {
      lastCard = now;
      if (G.ui.cardType === 'veh') UI.renderVehCard();
      if (G.ui.cardType === 'taxi') UI.renderTaxiCard();
      if (G.ui.follow && G.ui.follow === G.ui.selTaxi) {
        const t = G.ui.follow, pt = G.map.latLngToContainerPoint([myToLat(t.my), mxToLon(t.mx)]), c = G.map.getSize();
        if (Math.abs(pt.x - c.x / 2) > 40 || Math.abs(pt.y - c.y * 0.4) > 40) G.map.panTo([myToLat(t.my), mxToLon(t.mx)], { animate: true, duration: 0.35 });
      } else if (G.ui.follow) {
        const l = G.ui.cardLine, v = G.ui.follow;
        if (l && l.veh.includes(v)) {
          const p = Lines.posOf(l, v);
          const pt = G.map.latLngToContainerPoint([myToLat(p.my), mxToLon(p.mx)]);
          const c = G.map.getSize();
          if (Math.abs(pt.x - c.x / 2) > 40 || Math.abs(pt.y - c.y * 0.4) > 40) G.map.panTo([myToLat(p.my), mxToLon(p.mx)], { animate: true, duration: 0.35 });
        }
      }
    }
    if (Date.now() - lastAuto > 60000) { lastAuto = Date.now(); Save.auto(); }
  }
  requestAnimationFrame(frame);
}

function boot() {
  UI.init();
  UX.init();
  UI.showStart();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.ready) Save.auto();
    if (!document.hidden && G.ready && G.speed === 'rt' && !G.paused) RealTime.sync(); // rattrapage au retour dans l'appli
  });
  window.addEventListener('pagehide', () => { if (G.ready) Save.auto(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    // mise à jour automatique : on vérifie à chaque ouverture et on recharge quand une nouvelle version prend la main
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      if (G.ready) Save.auto();
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      reg.update().catch(() => { });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => { }); });
    }).catch(() => { });
  }
  requestAnimationFrame(frame);
}
document.addEventListener('DOMContentLoaded', boot);

'use strict';
/* =====================================================================
   TRANSITOPIA — confort d'utilisation : bouton retour Android,
   messages en bas d'écran, panneaux redimensionnables, mouvements
   d'argent animés, confirmation et annulation des grosses dépenses
   ===================================================================== */

const UX = {
  init() {
    this.initBack();
    this.initDrag();
  },

  /* ---------- bouton retour d'Android ---------- */
  guard() {
    if (!history.state || !history.state.corr) history.pushState({ corr: 1 }, '');
  },
  initBack() {
    window.addEventListener('popstate', () => {
      if (!G.ready) return; // écran d'accueil : comportement normal
      if (this.handleBack()) { history.pushState({ corr: 1 }, ''); this.lastBack = 0; return; }
      // plus rien à fermer : un second appui rapide quitte l'appli
      const now = Date.now();
      if (now - (this.lastBack || 0) < 2200) { Save.auto(); return; }
      this.lastBack = now;
      Save.auto();
      UI.toast('Appuyez encore sur retour pour quitter.', 'info');
      clearTimeout(this.backT);
      this.backT = setTimeout(() => { if (G.ready) this.guard(); }, 2300);
    });
  },
  /** ferme l'élément au premier plan ; renvoie false s'il n'y a rien à fermer */
  handleBack() {
    if (!$('#modal').hidden) { if (!G.ui.modalLocked) UI.closeModal(); return true; }
    const plan = document.getElementById('plan'); if (plan && !plan.hidden) { Plan.close(); return true; }
    if (RailBuild.b) { RailBuild.cancel(); return true; }
    if (Build.b) { Build.cancel(); return true; }
    if (G.ui.taxiPlace) { ACT.taxiPlaceCancel(); return true; }
    const sm = $('#speedMenu'); if (sm && !sm.hidden) { UI.speedMenu(false); return true; }
    if (!$('#card').hidden) { UI.closeCard(); return true; }
    if (UI.sheetOpen()) {
      if (G.ui.sheet === 'line' || G.ui.sheet === 'staff' || G.ui.sheet === 'taxi') UI.open('lines'); else UI.close();
      return true;
    }
    return false;
  },

  /* ---------- panneaux : glisser pour agrandir ou fermer ---------- */
  initDrag() {
    const sh = $('#sheet'), head = sh.querySelector('.sheet-h');
    let y0 = null, dy = 0, t0 = 0;
    const start = (y, target) => { if (target.closest('button')) return; y0 = y; dy = 0; t0 = Date.now(); sh.style.transition = 'none'; };
    const move = (y) => {
      if (y0 === null) return;
      dy = y - y0;
      sh.style.transform = dy > 0 ? `translateY(${dy}px)` : 'none';
    };
    const end = () => {
      if (y0 === null) return;
      y0 = null; sh.style.transition = ''; sh.style.transform = '';
      const quick = Date.now() - t0 < 250;
      if (Math.abs(dy) < 6 && quick) { sh.classList.toggle('full'); return; } // simple toucher de la poignée
      if (dy > 110 || (quick && dy > 40)) { if (sh.classList.contains('full')) sh.classList.remove('full'); else UI.close(); }
      else if (dy < -60 || (quick && dy < -25)) sh.classList.add('full');
    };
    head.addEventListener('touchstart', (e) => start(e.touches[0].clientY, e.target), { passive: true });
    head.addEventListener('touchmove', (e) => move(e.touches[0].clientY), { passive: true });
    head.addEventListener('touchend', end);
    head.addEventListener('mousedown', (e) => { start(e.clientY, e.target); const mm = (ev) => move(ev.clientY); const mu = () => { end(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); }; window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu); });
  },

  /* ---------- argent : petit chiffre animé près de la trésorerie ---------- */
  money(delta) {
    const s = G.s; if (!s || s.unlimited || !G.ready) return;
    if (Math.abs(delta) < Math.max(2000, Math.abs(s.money) * 0.004)) return;
    const top = document.getElementById('top'), cash = document.getElementById('cash'); if (!top || !cash) return;
    const el = document.createElement('span');
    el.className = 'mfloat ' + (delta < 0 ? 'neg' : 'pos');
    el.textContent = (delta < 0 ? '−' : '+') + fmtEur(Math.abs(delta));
    const r = cash.getBoundingClientRect(), rt = top.getBoundingClientRect();
    el.style.left = (r.left - rt.left + 14) + 'px'; el.style.top = (r.bottom - rt.top - 4) + 'px';
    top.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  },

  /* ---------- grosses dépenses : confirmation, puis annulation possible ---------- */
  /** fn est exécutée tout de suite, ou après confirmation si la dépense est importante */
  confirmSpend(amount, label, fn) {
    const s = G.s;
    if (Eco.free() || amount <= 0) return fn();
    const big = amount >= 1e6 || amount > Math.max(0, s.money) * 0.1;
    if (!big) return fn();
    if (amount > s.money) return fn(); // fonds insuffisants : le message habituel s'affiche
    this.pending = fn;
    UI.modal(`<div class="plate big">${icon('euro')} Confirmer la dépense</div>
      <p>${esc(label)}</p>
      <p class="big-num neg">−${fmtEur(amount)}</p>
      <p class="sub">${Math.round(amount / Math.max(1, s.money) * 100)} % de votre trésorerie · il restera ${fmtEur(s.money - amount)}.</p>
      <div class="row2"><button class="btn" data-act="spendNo">Annuler</button><button class="btn primary" data-act="spendOk">Confirmer</button></div>`);
  },
  /** rembourse exactement une dépense (annulation) */
  refund(amount, cat) {
    const s = G.s; if (s.unlimited) return;
    s.money += amount; s.today[cat] = Math.max(0, (s.today[cat] || 0) - amount);
    this.money(amount); UI.refreshTop();
  },
  /** message avec bouton « Annuler » pendant quelques secondes */
  undo(text, fn) {
    const id = 'u' + Date.now();
    this.undos = this.undos || {};
    this.undos[id] = fn;
    UI.toast(text, 'ok', { label: 'Annuler', act: 'undoAct', arg: id });
    setTimeout(() => { delete this.undos[id]; }, 7000);
  },
};

</script>
