const STAFF_DAYS = [2, 4, 7];
const STAFF_BASE = [40000, 90000, 180000];
const STAFF_MAX_PARALLEL = 2;

const Staff = {
  st() { const s = G.s; if (!s.staff) s.staff = {}; if (!s.training) s.training = []; return s; },
  L(id) { return (this.st().staff[id] || 0); },
  total() { const s = this.st(); return STAFF.reduce((a, d) => a + (s.staff[d.id] || 0), 0); },
  training(id) { return this.st().training.find((t) => t.id === id) || null; },
  size() { return G.s.lines.reduce((a, l) => a + l.veh.length, 0); },
  cost(id) {
    const lv = this.L(id); if (lv >= 3) return 0;
    return Math.round(STAFF_BASE[lv] * (1 + this.size() / 20) * G.s.costMul / 1000) * 1000;
  },
  canStart(id) {
    const s = this.st();
    if (id === 'centrale' && !Taxi.st()) return false;
    if (this.L(id) >= 3 || this.training(id)) return false;
    return s.training.length < STAFF_MAX_PARALLEL;
  },
  start(id) {
    const d = STAFF.find((x) => x.id === id); if (!d || !this.canStart(id)) return false;
    const cost = this.cost(id);
    if (!Eco.spend(cost, 'capex')) return false;
    const lv = this.L(id) + 1, days = STAFF_DAYS[lv - 1];
    this.st().training.push({ id, level: lv, start: G.s.min, end: G.s.min + days * 1440 });
    Events.log(`Formation lancée : ${d.name}, niveau ${lv} (${days} jours, ${fmtEur(cost)}).`, 'info');
    return true;
  },
  /** toutes les 10 minutes de jeu : fin des formations */
  tick() {
    const s = this.st(), m = s.min;
    const done = s.training.filter((t) => m >= t.end);
    if (!done.length) return;
    s.training = s.training.filter((t) => m < t.end);
    for (const t of done) {
      const d = STAFF.find((x) => x.id === t.id); if (!d) continue;
      s.staff[t.id] = Math.max(s.staff[t.id] || 0, t.level);
      Events.log(`Formation terminée : ${d.name} niveau ${t.level} (${d.lv[t.level - 1]}).`, 'ok');
      Notif.push({ title: `${d.name} : niveau ${t.level}`, desc: `Vos ${d.who} sont formés (« ${d.lv[t.level - 1]} »). ${d.fx(t.level)[0]}.`, tone: 1, cat: 'staff', glyph: '★' }, 'now');
    }
    for (const l of s.lines) Sim.lineQuality(l);
    if (UI.sheetOpen()) UI.refreshSheet();
  },

  /* ---- effets sur la simulation ---- */
  /** salaires : +1 % d'exploitation par niveau acquis ; éco-conduite : −3 % par niveau */
  opsMult() { return 1 + 0.01 * this.total() - 0.03 * this.L('conduite'); },
  fareMult() { return 1 + 0.02 * this.L('controle'); },
  qualMult() { return 1 + 0.02 * this.L('regulation'); },
  mecRepMult() { return 1 - 0.15 * this.L('accueil'); },
  strikeMult() { return 1 - 0.3 * this.L('social'); },
  negoMult() { return 1 - 0.2 * this.L('social'); },
  /** probabilité d'un événement selon les compétences du personnel */
  weight(id) {
    const L = (k) => this.L(k);
    switch (id) {
      case 'fraude': return 1 - 0.25 * L('controle');
      case 'altercation': return (1 - 0.2 * L('controle')) * (1 - 0.1 * L('accueil'));
      case 'portes': return 1 - 0.15 * L('accueil');
      case 'vandalisme': case 'tags': return 1 - 0.12 * L('controle');
      case 'panne_bus': return 1 - 0.22 * L('conduite');
      case 'panne_rame': return (1 - 0.22 * L('conduite')) * (1 - 0.1 * L('maintenance'));
      case 'failure': return 1 - 0.1 * L('maintenance');
      case 'malaise': return 1 - 0.08 * L('conduite');
      case 'heros': case 'naissance': return 1 + 0.5 * L('secours');
      case 'portefeuille': case 'ponctuelle': case 'prix': return 1 + 0.3 * L('accueil');
      case 'presse_plus': return (1 + 0.3 * L('accueil')) * (1 + 0.25 * L('communication'));
      case 'viral_plus': return 1 + 0.25 * L('communication');
      case 'presse_moins': case 'viral_moins': return 1 - 0.25 * L('communication');
      default: return 1;
    }
  },
  /** ajuste la gravité d'un événement au moment où il se produit */
  adjust(e) {
    const L = (k) => this.L(k);
    const shorten = (f) => { const d = e.end - e.start; e.end = e.start + Math.max(5, Math.round(d * f)); };
    if (e.kind === 'fraude' && e.fare) e.fare.mult = 1 - 0.25 * (1 - 0.25 * L('controle'));
    if (e.kind === 'controle' && e.fare) e.fare.mult = 1.12 + 0.04 * L('controle');
    if (e.veh && e.veh.type === 'hold') {
      let f = 1;
      if (e.kind === 'malaise') f *= 1 - 0.25 * L('secours');
      if (e.kind === 'altercation') f *= 1 - 0.2 * L('controle');
      f *= 1 - 0.15 * L('regulation');
      e.veh.min = Math.max(2, Math.round(e.veh.min * f));
    }
    if (e.veh && e.veh.type === 'breakdown') {
      shorten(1 - 0.3 * L('maintenance'));
      e.veh.min = Math.max(2, Math.round(e.veh.min * (1 - 0.15 * L('regulation'))));
    }
    if (e.money < 0 && ['panne_bus', 'panne_rame', 'vandalisme', 'tags'].includes(e.kind)) e.money = Math.round(e.money * (1 - 0.2 * L('maintenance')) / 100) * 100;
    if (e.halt && !e.halt.mode && ['failure', 'colis', 'animal'].includes(e.kind)) shorten(1 - 0.2 * L('regulation'));
    if (e.halt && e.halt.mode && e.kind === 'courant') shorten(1 - 0.2 * L('regulation'));
    if (e.rep && e.rep.delta < 0) e.rep.delta *= 1 - 0.25 * L('communication');
    if (e.kind === 'strike') e.cost = Math.round(e.cost * this.negoMult());
    return e;
  },
};

/* ---------- moteur des événements à choix ---------- */
const ChoiceFX = {
  scale() { return EvCtx.scale(); },
  /** contexte : ligne, arrêt, quartier ou lieu concerné */
  context(kind) {
    const v = { C: G.s.city.nom };
    const pickLine = (pred) => { const l = EvCtx.line(pred); if (!l) return false; v.line = l; v.L = lab(l); return true; };
    if (kind === 'none') return v;
    if (kind === 'taxi') return Taxi.st() && Taxi.st().fleet.length >= 2 ? v : null;
    if (kind === 'line' && !pickLine()) return null;
    if (kind === 'bus' && !pickLine((l) => l.mode === 'bus')) return null;
    if (kind === 'metro' && !pickLine((l) => l.mode === 'metro')) return null;
    if (kind === 'rail' && !pickLine((l) => l.mode === 'metro' || l.mode === 'ter')) return null;
    if (kind === 'boat' && !pickLine((l) => l.mode === 'boat')) return null;
    if (kind === 'stop') { if (!pickLine()) return null; const { st } = EvCtx.stop(v.line); v.S = st.name; v.mx = st.mx; v.my = st.my; }
    if (kind === 'zone') { const z = EvCtx.zone(); if (!z) return null; v.Z = z.name; v.zone = z.code; v.mx = z.cx; v.my = z.cy; }
    if (kind.startsWith('poi:')) { const p = EvCtx.poi(kind.slice(4).split(',')); if (!p) return null; v.P = p.name; v.mx = p.mx; v.my = p.my; }
    return v;
  },
  /** coût affiché sur le bouton (sans dévoiler les autres conséquences) */
  costLabel(fx, sc) {
    const m = ((fx.m || 0) * sc + (fx.m0 || 0)) * 1000;
    if (Math.abs(m) < 500) return '';
    return ' · ' + (m > 0 ? '+' : '') + fmtEur(m);
  },
  /** tonalité d'un résultat : grossièrement, le solde des conséquences */
  tone(fx, sc) {
    let t = ((fx.m || 0) * sc + (fx.m0 || 0)) / (25 * sc);
    t += ((fx.r || 0) + (fx.ra || 0) * 1.5 + (fx.rm ? fx.rm[1] : 0)) * 40;
    t += ((fx.so || 0) + (fx.ma || 0)) * 12 + (fx.txr || 0) * 25;
    if (fx.tx) t += (fx.tx - 1) * 8;
    for (const k of ['dl', 'da', 'dz', 'dp']) if (fx[k]) t += (fx[k] - 1) * 8;
    if (fx.h) t -= 2;
    return t > 2.5 ? 2 : t > 0.3 ? 1 : t < -2.5 ? -2 : t < -0.3 ? -1 : 0;
  },
  /** applique les effets d'une option à l'événement (effets temporaires : à partir de maintenant) */
  apply(e, fx, v, sc) {
    const s = G.s, m = s.min;
    e.start = m; e.end = m + (fx.d || 60); e.applied = false; e.moneyDone = false;
    const money = ((fx.m || 0) * sc + (fx.m0 || 0)) * 1000;
    if (money) e.money = Math.round(money / 100) * 100;
    const lid = v.line && v.line.id;
    if (fx.r && lid) e.rep = { lineId: lid, delta: fx.r }; else if (fx.r) e.rep = { all: true, delta: fx.r / 2 };
    if (fx.ra) e.rep = { all: true, delta: fx.ra };
    if (fx.rm) e.rep = { mode: fx.rm[0], delta: fx.rm[1] };
    if (fx.dl && lid) e.demand = { lineId: lid, mult: fx.dl };
    if (fx.da) e.demand = { all: true, mult: fx.da };
    if (fx.dm) e.demand = { mode: fx.dm[0], mult: fx.dm[1] };
    if ((fx.dz || fx.dp) && v.mx !== undefined) e.demand = { mx: v.mx, my: v.my, r: fx.dz ? 900 : 700, mult: fx.dz || fx.dp };
    if (fx.fl && lid) e.fare = { lineId: lid, mult: fx.fl };
    if (fx.fa !== undefined) e.fare = { all: true, mult: fx.fa };
    if (fx.fm) e.fare = { mode: fx.fm[0], mult: fx.fm[1] };
    if (fx.oa) e.ops = { all: true, mult: fx.oa };
    if (fx.om) e.ops = { mode: fx.om[0], mult: fx.om[1] };
    if (fx.ta) e.traffic = { all: fx.ta };
    if (fx.tz && v.zone) e.traffic = { zone: v.zone, mult: fx.tz };
    if (fx.ts && v.mx !== undefined) e.traffic = { mx: v.mx, my: v.my, r: 400, mult: fx.ts };
    if (fx.tc) { const c = EvCtx.center(); e.traffic = { mx: c.mx, my: c.my, r: 900, mult: fx.tc }; }
    if (fx.h === 'line' && lid) e.halt = { lineId: lid };
    else if (fx.h === 'all') e.halt = { all: true };
    else if (fx.h) e.halt = { mode: fx.h };
    if (fx.sp) e.speed = { mode: fx.sp[0], mult: fx.sp[1] };
    if (fx.so) e.social = fx.so;
    if (fx.tx) e.taxi = { mult: fx.tx };
    if (fx.txr) e.taxiRep = fx.txr;
    if (fx.ma) e.mairie = fx.ma;
    if (fx.add) e.addVeh = { model: fx.add[0], n: fx.add[1], lineId: lid };
    if (fx.lend && v.line) {
      const veh = EvCtx.veh(v.line);
      if (veh) { e.veh = { lineId: v.line.id, vehId: veh.id, type: 'breakdown', min: 3 }; e.end = m + fx.lend; }
    }
    if (v.mx !== undefined && e.mx === undefined && (e.demand || e.traffic)) { e.mx = v.mx; e.my = v.my; }
    // sans effet durable : l'événement ne reste pas « en cours »
    if (!(e.demand || e.traffic || e.halt || e.speed || e.fare || e.ops || e.veh || e.taxi)) e.end = m + 1;
  },
};

/** transforme chaque description en événement du catalogue */
for (const sp of CHOICE_SPECS) {
  const def = {
    id: sp.id, cat: sp.cat, tone: 0, title: sp.title, w: sp.w || 1, cd: sp.cd || 168, glyph: '?', choice: true, generic: true,
    when: sp.when,
    make() {
      const v = ChoiceFX.context(sp.ctx); if (!v) return null;
      const sc = ChoiceFX.scale();
      const opts = sp.opts.map(([label, fx]) => label + ChoiceFX.costLabel(fx, sc));
      const q = sp.q(v), lineId = v.line ? v.line.id : undefined;
      const vs = { ...v, line: undefined, lineId }; // la sauvegarde ne garde que l'identifiant de la ligne
      return { start: G.s.min + 90, dur: 1, q, opts, v: vs, sc, lineId, mx: v.mx, my: v.my, zone: v.zone, desc: q, dflt: sp.dflt ?? sp.opts.length - 1 };
    },
    choose(e, i) {
      const o = sp.opts[i] || sp.opts[sp.opts.length - 1];
      let fx = { ...o[1] }, out = o[2];
      delete fx.risk;
      if (o[1].risk && Math.random() < o[1].risk[0]) { fx = { ...fx, ...o[1].risk[1] }; out += ' ' + o[1].risk[2]; }
      const v = { ...(e.v || {}) };
      v.line = v.lineId !== undefined ? G.s.lines.find((l) => l.id === v.lineId) || null : null;
      ChoiceFX.apply(e, fx, v, e.sc || ChoiceFX.scale());
      e.choice = o[0]; e.desc = `« ${o[0]} » — ${out}`;
      e.tone = ChoiceFX.tone(fx, e.sc || 1); e.bad = e.tone < 0;
      Events.apply(e);
      Notif.push({ title: sp.title + ' : ' + o[0].toLowerCase(), desc: out, tone: e.tone, cat: sp.cat, glyph: e.tone >= 0 ? '✓' : '!' }, 'now');
    },
  };
  EVENTS.push(def); EVDEF[def.id] = def;
}

/* ---------- jauges durables : climat social et relations avec la mairie (de −1 à +1) ---------- */
const Gauges = {
  social() { return G.s.social || 0; },
  mairie() { return G.s.mairie || 0; },
  /** climat social : un bon climat éloigne les grèves, un mauvais les rapproche */
  strikeMult() { return clamp(1 - 0.6 * this.social(), 0.3, 1.8); },
  /** relations avec la mairie : subventions plus fréquentes, pénalités et travaux plus rares */
  weight(id) {
    const m = this.mairie();
    if (id === 'subvention' || id === 'mecene') return 1 + m;
    if (id === 'amende') return 1 - 0.5 * m;
    if (id === 'works') return 1 - 0.3 * m;
    return 1;
  },
  label(x) { return x >= 0.5 ? 'Excellent' : x >= 0.15 ? 'Bon' : x > -0.15 ? 'Neutre' : x > -0.5 ? 'Tendu' : 'Mauvais'; },
  tone(x) { return x >= 0.15 ? 'good' : x > -0.15 ? '' : 'bad'; },
  /** véhicules offerts ou rachetés : sur la ligne concernée, sinon sur la ligne du mode la plus chargée */
  addVehicles(e) {
    const a = e.addVeh, md = MODEL[a.model]; if (!md) return;
    const mode = Object.keys(CATALOG).find((k) => CATALOG[k].some((x) => x.id === a.model));
    let l = G.s.lines.find((x) => x.id === a.lineId && x.mode === mode);
    if (!l) l = G.s.lines.filter((x) => x.mode === mode && x.status === 'active').sort((p, q) => q.veh.length - p.veh.length)[0];
    if (!l) return;
    for (let k = 0; k < a.n; k++) Lines.addVehicle(l, a.model, true);
  },
  /** texte d'aide pour les fiches */
  html() {
    const row = (lab, x, help) => `<div class="gauge"><span>${lab}</span><i class="gbar"><b style="left:${50 + x * 50}%"></b></i><em class="${this.tone(x)}">${this.label(x)}</em><small>${help}</small></div>`;
    return row('Climat social', this.social(), 'Grèves plus ou moins probables, qualité de service')
      + row('Relations avec la mairie', this.mairie(), 'Prix des quartiers, subventions, pénalités, travaux');
  },
};

'use strict';
/* =====================================================================
   TRANSITOPIA — taxis
   Un seul dépôt (stockage illimité, atelier de réparation). Les taxis ne
   suivent pas de ligne : ils prennent des courses partout dans les zones
   d'exploitation, payées au kilomètre.
   - En maraude (« libres »), ils captent les clients qui hèlent dans la rue
     et répondent vite aux appels, mais roulent à vide (chauffeur + carburant).
   - Au dépôt, ils ne coûtent presque rien mais ne prennent que les appels,
     avec un long trajet d'approche.
   La part de taxis en maraude est réglée par le joueur, ou automatiquement
   par la centrale taxis (formation), plus ou moins finement selon son niveau.
   ===================================================================== */

const TAXI_MODELS = [
  { id: 'tx_ber', name: 'Berline', desc: 'Thermique · 4 places', cap: 4, price: 28000, km: 0.16, wear: 1 },
  { id: 'tx_hyb', name: 'Hybride', desc: 'Moins gourmande · 4 places', cap: 4, price: 36000, km: 0.10, wear: 0.85 },
  { id: 'tx_ev', name: 'Électrique', desc: 'Très économe, appréciée des clients · 4 places', cap: 4, price: 45000, km: 0.05, wear: 0.7 },
  { id: 'tx_van', name: 'Van', desc: 'Groupes et bagages · 7 places', cap: 7, price: 46000, km: 0.20, wear: 1.1 },
];
const TXM = {}; for (const m of TAXI_MODELS) TXM[m.id] = m;
/** plages horaires : [début, fin] en heures (fin > 24 = lendemain) */
const TAXI_HOURS = { jour: [6, 22, '6 h – 22 h'], etendu: [5, 25, '5 h – 1 h'], soir: [16, 30, '16 h – 6 h'], h24: [0, 24, '24 h/24'] };
/** demande de taxis selon l'heure (plus forte le soir et la nuit que celle des bus) */
const TAXI_PROF = [0.35, 0.3, 0.25, 0.15, 0.1, 0.15, 0.35, 0.7, 0.8, 0.55, 0.45, 0.5, 0.6, 0.5, 0.45, 0.5, 0.65, 0.85, 0.9, 0.8, 0.7, 0.65, 0.6, 0.5];
const TAXI_CFG = {
  depot: 180000, move: 60000,      // dépôt, déménagement
  base: 4.5, refKm: 2.2, minFare: 8, // prise en charge, tarif de référence au km, course minimum
  wage: 7, standby: 1.5, depotH: 6, insH: 0.5, // €/h : chauffeur hors dépôt, astreinte au dépôt, dépôt, assurance par taxi
  repair: 250, repairMin: 240,      // réparation : coût, durée
  hail: 700, hailWait: 3, out: 4,   // un client qui hèle voit un taxi libre à moins de 700 m et attend 3 min ; sortie du dépôt : 4 min
  roamSpd: 0.72,                    // en maraude, on roule doucement
};
const TAXI_CLSW = [0.15, 1.2, 1.3, 1.1, 0.8, 0.5];

const Taxi = {
  sess: Math.random(),
  st() { return G.s && G.s.taxi && G.s.taxi.depot ? G.s.taxi : null; },
  blank() { return { n: 0, rev: 0, ops: 0, km: 0, calls: 0, hails: 0, lost: 0, missed: 0, wait: 0, waitN: 0, broke: 0 }; },
  net() { return G.w.road; },
  L() { return Staff.L('centrale'); },

  /* ---------- dépôt ---------- */
  depotCost(move) { return Math.round((move ? TAXI_CFG.move : TAXI_CFG.depot) * G.s.costMul / 1000) * 1000; },
  canPlace(mx, my) {
    const z = G.w.zoneAt(mx, my);
    if (!z || !z.owned) return 'Le dépôt doit être dans une de vos zones.';
    const net = this.net(), i = net.nE ? net.nearest(mx, my, 150, (n) => net.busNode(n)) : -1;
    if (i < 0) return 'Placez le dépôt au bord d’une rue.';
    return i;
  },
  placeDepot(mx, my) {
    const r = this.canPlace(mx, my);
    if (typeof r === 'string') { UI.toast(r, 'warn'); return false; }
    const net = this.net(), move = !!this.st();
    if (!Eco.spend(this.depotCost(move), 'capex')) return false;
    const z = G.w.zoneAt(mx, my);
    const nm = net.adj[r].map((e) => net.name[e]).find(Boolean);
    const depot = { mx: net.x[r], my: net.y[r], name: 'Dépôt taxis ' + (nm ? nm.replace(/^(rue|avenue|boulevard|place|quai|chemin|route|allée|cours)\s+(de la |du |des |de l’|de l'|de |d’)?/i, '') : z.name) };
    if (move) {
      const T = G.s.taxi; T.depot = depot; this._dn = null;
      for (const t of T.fleet) if (t.st === 'depot' || t.st === 'repair') { t.mx = depot.mx; t.my = depot.my; }
      Events.log('Dépôt de taxis déplacé : ' + depot.name + '.', 'ok');
      UI.toast('Dépôt déplacé.', 'ok');
    } else {
      G.s.taxi = { depot, fleet: [], roam: 0.5, auto: false, autoShare: 0.5, hours: 'etendu', perKm: TAXI_CFG.refKm, req: [], rep: 1, today: this.blank(), hist: [], rq: [], nextAuto: 0 };
      Events.log('Dépôt de taxis ouvert : ' + depot.name + '.', 'ok');
      UI.toast('Dépôt ouvert ! Achetez vos premiers taxis.', 'ok');
    }
    Render.dirty = true;
    return true;
  },
  depotNode() {
    const T = this.st(), net = this.net(); if (!T || !net.nE) return -1;
    if (this._dn == null || this._dnV !== net.nE || this._dnS !== this.sess) {
      this._dn = net.nearest(T.depot.mx, T.depot.my, 300, (n) => net.busNode(n)); this._dnV = net.nE; this._dnS = this.sess;
    }
    return this._dn;
  },

  /* ---------- flotte ---------- */
  buy(model) {
    const T = this.st(), md = TXM[model]; if (!T || !md) return false;
    if (!Eco.spend(Math.round(md.price * G.s.costMul), 'capex')) return false;
    T.fleet.push({ id: G.s.nextId++, model, st: 'depot', mx: T.depot.mx, my: T.depot.my, wear: 0, km: 0 });
    return true;
  },
  sell(model) {
    const T = this.st(); if (!T) return;
    // de préférence un taxi au dépôt, sinon un taxi libre
    let i = T.fleet.findIndex((t) => t.model === model && t.st === 'depot');
    if (i < 0) i = T.fleet.findIndex((t) => t.model === model && (t.st === 'roam' || t.st === 'back'));
    if (i < 0) { UI.toast('Tous les taxis de ce modèle sont en course ou en réparation.', 'warn'); return; }
    const t = T.fleet[i];
    T.fleet.splice(i, 1);
    if (G.ui.selTaxi === t) UI.closeCard();
    Eco.earn(Math.round(TXM[model].price * G.s.costMul * 0.55 * (1 - 0.4 * Math.min(1, t.wear))), 'sales');
  },
  count(pred) { const T = this.st(); return T ? T.fleet.filter(pred).length : 0; },

  /* ---------- horaires, tarif ---------- */
  open(m) {
    const T = this.st(); if (!T) return false;
    const [a, b] = TAXI_HOURS[T.hours] || TAXI_HOURS.etendu;
    if (b - a >= 24) return true;
    const h = Time.mod(m) / 60;
    return (h >= a && h < b) || (h + 24 >= a && h + 24 < b);
  },
  priceFactor() { const T = this.st(); return clamp(Math.pow(TAXI_CFG.refKm / T.perKm, 1.2), 0.25, 2.5); },
  fare(km, size) { const T = this.st(); return Math.max(TAXI_CFG.minFare, TAXI_CFG.base + T.perKm * km) * (size > 4 ? 1.2 : 1); },

  /* ---------- demande ---------- */
  /** facteur commun : heure, météo, image, prix, événements, lignes à l'arrêt */
  demandMult(m) {
    const T = this.st(), s = G.s, h = Time.hour(m), dow = Time.dow(m);
    let f = TAXI_PROF[h];
    // nuits du vendredi et du samedi
    if ((h >= 22 && (dow === 5 || dow === 6)) || (h < 5 && (dow === 6 || dow === 0))) f *= 1.6;
    f *= { rain: 1.35, snow: 1.6, storm: 1.4, heat: 1.1 }[Events.weather()] || 1;
    f *= T.rep * this.priceFactor();
    // transports en commun en panne ou en grève : les voyageurs se rabattent sur le taxi
    const act = s.lines.filter((l) => l.status === 'active');
    if (act.length) { const halted = act.filter((l) => Events.halted(l)).length; f *= 1 + 1.2 * halted / act.length; }
    for (const e of Events.live()) {
      if (e.demand && e.demand.all) f *= 1 + (e.demand.mult - 1) * 0.6;
      if (e.taxi) f *= e.taxi.mult;
    }
    return f;
  },
  /** courses demandées par minute dans les zones (hors lieux d'événement) */
  rate(m) { return Sim.servedPop() / 1000 * 0.02 * this.demandMult(m); },
  /** points chauds : grands événements en cours */
  hotspots() {
    const out = [];
    for (const e of Events.live()) if (e.demand && e.demand.mx !== undefined && e.demand.mult > 1.2) out.push({ mx: e.demand.mx, my: e.demand.my, r: e.demand.r || 700, w: 0.15 * (e.demand.mult - 1) * (e.demand.r || 700) / 700 });
    return out;
  },
  /** arêtes de chaque zone possédée (pour placer les clients au bord des rues) */
  zoneEdges() {
    const net = this.net(), key = net.nE + ':' + G.s.owned.length + ':' + [...G.w.zones.values()].filter((z) => z.owned).length;
    if (this._ze && this._zeK === key) return this._ze;
    const m = new Map();
    for (let e = 0; e < net.nE; e++) {
      const z = net.zone[e]; if (!z || net.cls[e] === 0) continue;
      const zz = G.w.zones.get(z); if (!zz || !zz.owned) continue;
      let a = m.get(z); if (!a) { a = []; m.set(z, a); } a.push(e);
    }
    this._ze = m; this._zeK = key;
    return m;
  },
  pickZone(weight) {
    const ze = this.zoneEdges(); let tot = 0; const arr = [];
    for (const [code, es] of ze) { const z = G.w.zones.get(code); const w = weight(z); if (w > 0) { arr.push([w, z, es]); tot += w; } }
    if (!tot) return null;
    let r = Math.random() * tot;
    for (const x of arr) { r -= x[0]; if (r <= 0) return x; }
    return arr[arr.length - 1];
  },
  pointIn(es) { const net = this.net(), e = pick(es), i = Math.random() < 0.5 ? net.ea[e] : net.eb[e]; return { mx: net.x[i], my: net.y[i], n: i }; },
  nodeNear(mx, my) { const net = this.net(); return net.nearest(mx, my, 250, (n) => net.busNode(n)); },
  /** nouvelle demande de course */
  newRequest(o) {
    const T = this.st();
    // destination : plutôt proche, attirée par les habitants et les emplois
    let d = null;
    for (let k = 0; k < 4 && !d; k++) {
      const x = this.pickZone((z) => (z.pop + z.jobs) * Math.exp(-dist(z.cx, z.cy, o.mx, o.my) / 5000));
      if (!x) return null;
      const p = this.pointIn(x[2]);
      if (dist(p.mx, p.my, o.mx, o.my) > 900) d = p;
    }
    if (!d) return null;
    const size = Math.random() < 0.12 ? 5 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * Math.random() * 4);
    return { id: G.s.nextId++, t0: G.s.min, mx: o.mx, my: o.my, n: o.n, dx: d.mx, dy: d.my, dn: d.n, size, sess: this.sess, pat: 10 + (this.L() >= 2 ? 3 : 0) };
  },

  /* ---------- simulation : chaque minute ---------- */
  minute(m) {
    const T = this.st(); if (!T) return;
    this._sm = Events.speedMult('bus'); // météo et événements : une fois par minute
    const s = G.s, net = this.net(); if (!net.nE) return;
    const open = this.open(m);
    // coûts : chauffeurs des taxis sortis, kilomètres, dépôt et assurances
    let cost = TAXI_CFG.depotH / 60 + T.fleet.length * TAXI_CFG.insH / 60;
    const kmMul = 1 - 0.03 * Staff.L('conduite');
    for (const t of T.fleet) {
      if (t.st !== 'depot' && t.st !== 'repair') cost += TAXI_CFG.wage / 60; else if (t.st === 'depot' && open) cost += TAXI_CFG.standby / 60;
      if (t.kmAcc) { cost += t.kmAcc / 1000 * TXM[t.model].km * kmMul; t.kmAcc = 0; }
      if (t.st === 'depot' && t.wear > 0) t.wear = Math.max(0, t.wear - 0.0004); // entretien au dépôt
      if (t.st === 'broken' && m >= t.until) this.tow(t, m);
      if (t.st === 'repair' && m >= t.until) { t.st = 'depot'; t.wear = Math.min(t.wear, 0.15); }
    }
    cost *= s.costMul;
    Eco.charge(cost, 'taxiOps'); T.today.ops += cost;
    // demandes
    let nNew = 0;
    if (open) {
      const r = this.rate(m);
      const gen = (rate, origin) => { const n = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0); for (let k = 0; k < n; k++) { const o = origin(); if (o) { this.request(o); nNew++; } } };
      gen(r, () => { const x = this.pickZone((z) => z.pop + 0.7 * z.jobs); return x ? this.pointIn(x[2]) : null; });
      for (const h of this.hotspots()) gen(h.w * this.demandMult(m) / Math.max(0.1, TAXI_PROF[Time.hour(m)]), () => {
        const c = net.nearestList(h.mx + meters((Math.random() - 0.5) * h.r), h.my + meters((Math.random() - 0.5) * h.r), 250, (n) => net.busNode(n), 3);
        return c.length ? { mx: net.x[c[0]], my: net.y[c[0]], n: c[0] } : null;
      });
    }
    T.rq.push(nNew); if (T.rq.length > 60) T.rq.shift();
    // clients au bord du trottoir : un taxi libre passe-t-il ?
    if (T.hq && T.hq.length) T.hq = T.hq.filter((r) => { if (this.hailTaxi(r)) return false; if (m - r.t0 > TAXI_CFG.hailWait) { T.today.missed++; return false; } return true; });
    // appels en attente : répartition
    this.dispatch(m, open);
    // part de taxis en maraude
    if (T.auto && this.L() > 0 && m >= (T.nextAuto || 0)) this.autoTune(m);
    if (Time.mod(m) % 5 === 0 || !open) this.balance(open);
  },
  request(o) {
    const T = this.st(), r = this.newRequest(o); if (!r) return;
    const hail = Math.random() < 0.5;
    if (hail) {
      // client dans la rue : seul un taxi libre qui passe tout près peut le prendre
      T.today.hails++; r.hail = true;
      if (!this.hailTaxi(r)) { T.hq = T.hq || []; T.hq.push(r); }
    } else { T.today.calls++; T.req.push(r); }
  },
  hailTaxi(r) {
    const T = this.st();
    let best = null, bd = TAXI_CFG.hail;
    for (const t of T.fleet) if (t.st === 'roam' && TXM[t.model].cap >= r.size) { const d = dist(t.mx, t.my, r.mx, r.my); if (d < bd) { bd = d; best = t; } }
    if (best) { this.assign(best, r); return true; }
    return false;
  },
  /** vitesse moyenne d'approche estimée (m/s) */
  eta(t, r) {
    let d = dist(t.mx, t.my, r.mx, r.my) * 1.35 / 6.5 / 60;
    if (t.st === 'depot') d += TAXI_CFG.out; // le temps de sortir du dépôt
    return d;
  },
  dispatch(m, open) {
    const T = this.st();
    const keep = [];
    T.req.sort((a, b) => a.t0 - b.t0);
    for (const r of T.req) {
      const age = m - r.t0;
      if (age > r.pat) { T.today.lost++; T.rep = clamp(T.rep - 0.002, 0.6, 1.1); continue; }
      let best = null, be = Infinity;
      for (const t of T.fleet) {
        if (!(t.st === 'roam' || t.st === 'back' || (t.st === 'depot' && open))) continue;
        if (TXM[t.model].cap < r.size) continue;
        const e = this.eta(t, r); if (e < be) { be = e; best = t; }
      }
      if (best && be <= r.pat - age + 2) this.assign(best, r); else keep.push(r);
    }
    T.req = keep;
  },
  assign(t, r) {
    if (r.sess !== this.sess) { r.n = this.nodeNear(r.mx, r.my); r.dn = this.nodeNear(r.dx, r.dy); r.sess = this.sess; }
    if (r.n < 0 || r.dn < 0) return;
    if (t.st === 'depot') { const dn = this.depotNode(); if (dn < 0) return; this.at(t, dn); }
    t.job = r; t.st = 'pickup'; t.bias = null;
    this.goTo(t, r.n);
  },
  /** répartition entre maraude et dépôt, toutes les 5 minutes */
  balance(open) {
    const T = this.st();
    const ok = T.fleet.filter((t) => t.st !== 'broken' && t.st !== 'repair');
    if (!open) { for (const t of ok) if (t.st === 'roam') this.sendBack(t); return; }
    const share = T.auto && this.L() > 0 ? T.autoShare : T.roam;
    const want = Math.round(share * ok.length);
    const out = ok.filter((t) => t.st !== 'depot' && t.st !== 'back');
    if (out.length < want) {
      const dn = this.depotNode(); if (dn < 0) return;
      // d'abord les taxis qui rentraient, puis ceux du dépôt
      let need = want - out.length;
      for (const t of ok) if (need > 0 && t.st === 'back') { t.st = 'roam'; need--; } // finit sa rue puis repart en maraude
      for (const t of ok) if (need > 0 && t.st === 'depot') { this.at(t, dn); t.st = 'roam'; t.path = null; need--; }
    } else if (out.length > want) {
      let extra = out.length - want;
      for (const t of out) if (extra > 0 && t.st === 'roam') { this.sendBack(t); extra--; }
    }
  },
  sendBack(t) {
    const dn = this.depotNode(); if (dn < 0) return;
    t.st = 'back'; t.bias = null; this.goTo(t, dn);
  },
  /** mode automatique (centrale taxis) : plus le niveau est élevé, plus il voit juste et tôt */
  autoTune(m) {
    const T = this.st(), L = this.L();
    let perH;
    if (L === 1) perH = T.rq.reduce((a, b) => a + b, 0) * 60 / Math.max(10, T.rq.length); // ce qu'on a vu passer la dernière heure
    else {
      perH = this.rate(m) * 60 + this.hotspots().reduce((a, h) => a + h.w * 60, 0);
      if (L >= 3) {
        // anticipation : la demande dans 45 minutes, et les événements annoncés
        perH = Math.max(perH, this.rate(m + 45) * 60);
        for (const e of Events.upcoming()) if (e.start - m <= 60 && e.demand) perH *= e.demand.mx !== undefined ? 1.15 : e.demand.mult;
        if (Events.upcoming().some((e) => e.kind === 'strike' && !e.resolved && e.start - m <= 60)) perH *= 1.8;
      }
    }
    const ok = T.fleet.filter((t) => t.st !== 'broken' && t.st !== 'repair').length || 1;
    const noise = [0, 0.3, 0.15, 0.05][L];
    const need = perH * 0.55 / 2.4 * 1.15; // la maraude sert surtout les clients de la rue (≈ 45 %) et les appels pressés
    T.autoShare = clamp(need / ok * (1 + (Math.random() * 2 - 1) * noise), 0, 1);
    T.autoShare = Math.round(T.autoShare * 20) / 20;
    T.nextAuto = m + [0, 30, 15, 10][L];
  },
  tow(t, m) {
    const dn = this.depotNode();
    if (dn >= 0) this.at(t, dn);
    t.st = 'repair'; t.path = null;
    t.until = m + Math.round(TAXI_CFG.repairMin * (1 - 0.3 * Staff.L('maintenance')));
    const c = TAXI_CFG.repair * G.s.costMul * (1 - 0.2 * Staff.L('maintenance'));
    Eco.charge(c, 'taxiOps'); this.st().today.ops += c;
  },

  /* ---------- déplacements ---------- */
  /** pose le taxi sur un nœud du réseau */
  at(t, n) { const net = this.net(); t.node = n; t.mx = net.x[n]; t.my = net.y[n]; t.path = null; t.sess = this.sess; },
  /** itinéraire vers un nœud (A* sous budget de calcul ; au-delà, trajet direct approximatif) */
  goTo(t, n) {
    const net = this.net();
    if (n == null || n < 0 || !net.adj[n]) return;
    if (t.sess !== this.sess || t.node == null || t.node < 0) { const k = this.nodeNear(t.mx, t.my); if (k < 0) return; this.at(t, k); }
    // en pleine rue : on la termine d'abord, puis on calcule l'itinéraire depuis le carrefour suivant
    const P0 = t.path;
    if (P0 && t.k < P0.eds.length && t.u > 0) {
      const b = P0.nodes[t.k + 1], e0 = P0.eds[t.k], rest = Math.max(0.5, P0.len[t.k] - t.u);
      const cur = [t.mx, t.my];
      t.path = null; t.node = b;
      this.goTo(t, n);
      const P = t.path;
      if (P && !(P.eds.length === 1 && P.eds[0] === -1 && b === n)) {
        P.pts.unshift(cur); P.eds.unshift(e0); P.len.unshift(rest); P.nodes.unshift(b);
        P.pts[1] = [net.x[b], net.y[b]];
      } else t.path = { pts: [cur, [net.x[b], net.y[b]]], eds: [e0], len: [rest], nodes: [b, b] };
      t.k = 0; t.u = 0;
      return;
    }
    if (t.node === n) { t.path = { pts: [[net.x[n], net.y[n]], [net.x[n], net.y[n]]], eds: [-1], len: [1], nodes: [n, n] }; t.k = 0; t.u = 0; return; }
    // budget de calcul remis à zéro à chaque appel de Sim.advance (une fois par image) ;
    // au-delà, trajet direct approximatif (seulement aux très grandes vitesses)
    const now = performance.now();
    let r = null;
    if ((this.fMs || 0) < 6) { r = route(net, t.node, n, { maxIter: 60000, eps: 1.6 }); this.fMs = (this.fMs || 0) + performance.now() - now; }
    if (r && r.edges.length) {
      const pts = r.nodes.map((i) => [net.x[i], net.y[i]]);
      t.path = { pts, eds: r.edges, len: r.edges.map((e) => Math.max(0.5, net.len[e])), nodes: r.nodes };
    } else {
      const d = Math.max(1, dist(t.mx, t.my, net.x[n], net.y[n]) * 1.3);
      t.path = { pts: [[t.mx, t.my], [net.x[n], net.y[n]]], eds: [-1], len: [d], nodes: [t.node, n] };
    }
    t.k = 0; t.u = 0;
  },
  /** maraude : prochain tronçon au hasard, plutôt les rues animées de vos zones */
  wander(t) {
    const net = this.net();
    if (t.node == null || !net.adj[t.node]) { const k = this.nodeNear(t.mx, t.my); if (k < 0) return; this.at(t, k); }
    const u = t.node, prev = t.lastE;
    const bias = t.bias || (this.L() >= 3 || Math.random() < 0.3 ? this.nearHot(t) : null);
    if (bias !== t.bias) t.bias = bias;
    let tot = 0; const c = [];
    for (const e of net.adj[u]) {
      if (net.ow[e] && net.ea[e] !== u) continue;
      if (e === prev && net.adj[u].length > 1) continue;
      const z = net.zone[e], zz = z && G.w.zones.get(z);
      const v = net.other(e, u), d = net.dens[e] < 0 ? 250 : net.dens[e];
      let w = (zz && zz.owned ? 1 : 0.03) * TAXI_CLSW[net.cls[e]] * (0.4 + Math.min(2, d / 6000));
      if (bias) { const d0 = dist(net.x[u], net.y[u], bias.mx, bias.my), d1 = dist(net.x[v], net.y[v], bias.mx, bias.my); w *= d1 < d0 ? 2.5 : 0.6; }
      c.push([w, e]); tot += w;
    }
    if (!c.length && prev != null && prev >= 0) { c.push([1, prev]); tot = 1; }
    if (!c.length) { this.sendBack(t); return; }
    let r = Math.random() * tot, e = c[0][1];
    for (const x of c) { r -= x[0]; if (r <= 0) { e = x[1]; break; } }
    const v = net.other(e, u);
    t.path = { pts: [[net.x[u], net.y[u]], [net.x[v], net.y[v]]], eds: [e], len: [Math.max(0.5, net.len[e])], nodes: [u, v] };
    t.k = 0; t.u = 0;
  },
  nearHot(t) {
    const hs = this.hotspots(); if (!hs.length) return null;
    let best = null, bd = 4000;
    for (const h of hs) { const d = dist(t.mx, t.my, h.mx, h.my); if (d < bd && d > 150) { bd = d; best = h; } }
    return best;
  },
  speed(t, e) {
    const net = this.net();
    let v = 8;
    if (e >= 0) {
      v = net.spd[e];
      if (net.lim[e] > 0) v = Math.min(v, net.lim[e] / 3.6 * 0.95);
      v *= Traffic.busFactor(e, this.lane) * 1.05; // les taxis empruntent les couloirs de bus
    } else v *= 0.8;
    v *= this._sm ?? Events.speedMult('bus');
    if (t.st === 'roam') v *= TAXI_CFG.roamSpd;
    return Math.max(1.5, v);
  },
  lane: { busLane: false },
  move(dt) {
    const T = this.st(); if (!T) return;
    const net = this.net(); if (!net.nE) return;
    for (const t of T.fleet) {
      if (t.st === 'depot' || t.st === 'repair' || t.st === 'broken') continue;
      if (t.sess !== this.sess) { // après un chargement : on repart du nœud le plus proche (une fois les routes rechargées)
        const k = this.nodeNear(t.mx, t.my); if (k < 0) continue;
        if (t.job) {
          const n = this.nodeNear(t.job.mx, t.job.my), dn = this.nodeNear(t.job.dx, t.job.dy);
          if (n < 0 || dn < 0) continue;
          t.job.n = n; t.job.dn = dn; t.job.sess = this.sess;
        }
        this.at(t, k);
        if (t.st === 'pickup' && t.job) this.goTo(t, t.job.n);
        else if (t.st === 'ride' && t.job) this.goTo(t, t.job.dn);
        else if (t.st === 'back') this.sendBack(t);
      }
      let rem = dt, g = 0;
      while (rem > 1e-6 && g++ < 200) {
        if (!t.path) {
          if ((t.st === 'pickup' || t.st === 'ride') && !t.job) t.st = 'roam';
          if (t.st === 'roam') this.wander(t); else if (t.st === 'back') this.sendBack(t);
          else if (t.st === 'pickup') this.goTo(t, t.job.n); else if (t.st === 'ride') this.goTo(t, t.job.dn);
          if (!t.path) break;
        }
        const P = t.path, L = P.len[t.k], e = P.eds[t.k];
        const v = this.speed(t, e);
        const left = L - t.u;
        if (v * rem < left) { t.u += v * rem; t.kmAcc = (t.kmAcc || 0) + v * rem; t.km += v * rem; this.wearOn(t, v * rem); rem = 0; }
        else {
          rem -= left / v; t.kmAcc = (t.kmAcc || 0) + left; t.km += left; this.wearOn(t, left);
          t.k++; t.u = 0; t.node = P.nodes[t.k]; t.lastE = e;
          if (t.k >= P.eds.length) { t.path = null; t.mx = P.pts[P.pts.length - 1][0]; t.my = P.pts[P.pts.length - 1][1]; this.arrive(t); }
        }
        if (t.st === 'broken' || t.st === 'depot') break;
      }
      if (t.path) {
        const P = t.path, a = P.pts[t.k], b = P.pts[t.k + 1], f = clamp(t.u / P.len[t.k], 0, 1);
        t.mx = a[0] + (b[0] - a[0]) * f; t.my = a[1] + (b[1] - a[1]) * f;
        if (b[0] !== a[0] || b[1] !== a[1]) t.ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      }
    }
  },
  /** usure et pannes (au kilomètre) */
  wearOn(t, m) {
    const md = TXM[t.model];
    t.wear = Math.min(1.5, (t.wear || 0) + m / 1000 * 0.0006 * md.wear);
    if (t.st === 'broken') return;
    const p = m / 1000 * 0.00018 * (1 + 3 * t.wear) * (1 - 0.22 * Staff.L('conduite'));
    if (Math.random() < p) this.breakDown(t);
  },
  breakDown(t) {
    const T = this.st();
    if (t.job && t.st === 'ride') { T.rep = clamp(T.rep - 0.01, 0.6, 1.1); T.today.lost++; }
    else if (t.job && t.st === 'pickup') { t.job.t0 = Math.max(t.job.t0, G.s.min - 4); T.req.push(t.job); }
    t.job = null; t.st = 'broken'; t.path = null; t.until = G.s.min + 25; T.today.broke++;
    Events.log('Un taxi ' + TXM[t.model].name.toLowerCase() + ' est tombé en panne : dépannage vers le dépôt.', 'warn');
  },
  arrive(t) {
    const T = this.st(), s = G.s, m = s.min;
    if (t.st === 'pickup' && t.job) {
      const w = m - t.job.t0; T.today.wait += w; T.today.waitN++;
      if (w <= 6) T.rep = clamp(T.rep + 0.0015, 0.6, 1.1);
      t.st = 'ride'; t.job.pick = m;
      this.goTo(t, t.job.dn);
      const P = t.path; t.job.km = P ? P.len.reduce((a, b) => a + b, 0) / 1000 : 3;
      return;
    }
    if (t.st === 'ride' && t.job) {
      const fare = this.fare(t.job.km, t.job.size);
      if (!s.unlimited) { s.money += fare; s.today.taxi = (s.today.taxi || 0) + fare; }
      T.today.rev += fare; T.today.n++; T.today.km += t.job.km;
      t.job = null;
      if (this.open(m)) {
        const ok = T.fleet.filter((x) => x.st !== 'broken' && x.st !== 'repair');
        const share = T.auto && this.L() > 0 ? T.autoShare : T.roam;
        const out = ok.filter((x) => x.st !== 'depot' && x.st !== 'back').length;
        if (out <= Math.round(share * ok.length) && share > 0) { t.st = 'roam'; return; }
      }
      this.sendBack(t);
      return;
    }
    if (t.st === 'back') { t.st = 'depot'; t.path = null; const T2 = this.st(); t.mx = T2.depot.mx; t.my = T2.depot.my; return; }
    // maraude : on continue au carrefour suivant (wander au prochain tour)
  },

  /* ---------- journée ---------- */
  newDay() {
    const T = this.st(); if (!T) return;
    const d = T.today;
    T.hist.unshift({ ...d, date: G.s.min - 1440, fleet: T.fleet.length }); if (T.hist.length > 30) T.hist.length = 30;
    const demand = d.calls + d.hails;
    if (demand > 5) T.rep = clamp(T.rep + 0.015 - (d.lost + d.missed * 0.3) / demand * 0.25, 0.6, 1.1);
    T.today = this.blank();
  },
  shiftTime(d) {
    const T = this.st(); if (!T) return;
    for (const t of T.fleet) { if (t.until) t.until += d; if (t.job) { t.job.t0 += d; if (t.job.pick) t.job.pick += d; } }
    for (const r of T.req) r.t0 += d;
    for (const r of T.hq || []) r.t0 += d;
    if (T.nextAuto) T.nextAuto += d;
  },
  /** sauvegarde : pas d'indices de nœuds (le réseau est reconstruit au chargement) */
  toSave() {
    const T = G.s.taxi; if (!T) return null;
    const job = (j) => j && { id: j.id, t0: j.t0, mx: j.mx, my: j.my, dx: j.dx, dy: j.dy, size: j.size, pat: j.pat, km: j.km, pick: j.pick };
    return { ...T, hq: [], fleet: T.fleet.map((t) => ({ id: t.id, model: t.model, st: t.st, mx: t.mx, my: t.my, ang: t.ang, wear: t.wear, km: t.km, until: t.until, job: job(t.job) })), req: T.req.map(job) };
  },

  /* ---------- affichage ---------- */
  label(t) {
    if (t.st === 'roam') return t.bias ? 'Libre · se dirige vers la foule' : 'Libre · en maraude';
    if (t.st === 'pickup') return 'En route vers un client';
    if (t.st === 'ride') return 'En course' + (t.job ? ' · ' + fmtEur(this.fare(t.job.km || 0, t.job.size), true) : '');
    if (t.st === 'back') return 'Retour au dépôt';
    if (t.st === 'broken') return 'En panne · dépanneuse en route';
    if (t.st === 'repair') return 'À l’atelier jusqu’à ' + Time.label(t.until).time;
    return 'Au dépôt';
  },
  draw(ctx, X, Y, zf, z, W, H, nl) {
    Render.tpos = []; Render.dpos = null;
    const T = this.st(); if (!T || z < 11) return;
    const d = T.depot, dx = X(d.mx), dy = Y(d.my);
    if (dx > -40 && dy > -40 && dx < W + 40 && dy < H + 40) {
      const w = 34, h = 18;
      Render.rr(ctx, dx - w / 2, dy - h / 2, w, h, 5);
      ctx.fillStyle = INK; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#FFC21A'; ctx.stroke();
      ctx.fillStyle = '#FFC21A'; ctx.font = '800 10px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TAXI', dx, dy + 0.5);
      const n = T.fleet.filter((t) => t.st === 'depot' || t.st === 'repair').length;
      if (n) {
        ctx.beginPath(); ctx.arc(dx + w / 2, dy - h / 2, 8, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
        ctx.fillStyle = INK; ctx.font = '700 9px ' + FONT; ctx.fillText(String(n), dx + w / 2, dy - h / 2 + 0.5);
      }
      Render.dpos = { x: dx, y: dy };
    }
    // clients qui attendent un taxi (appels)
    if (z >= 14) for (const r of T.req) {
      const x = X(r.mx), y = Y(r.my); if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
      ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#FFC21A'; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - 1.5, 1.6, 0, 7); ctx.moveTo(x - 2.6, y + 3); ctx.arc(x, y + 3, 2.6, Math.PI, 0); ctx.fillStyle = INK; ctx.fill();
    }
    if (z < 12.5) return;
    const L2 = 5.2 * zf, W2 = 2.8 * zf;
    for (const t of T.fleet) {
      if (t.st === 'depot' || t.st === 'repair') continue;
      const x = X(t.mx), y = Y(t.my); if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      if (t.angD === undefined) t.angD = t.ang || 0;
      let da = (t.ang || 0) - t.angD; da = Math.atan2(Math.sin(da), Math.cos(da)); t.angD += da * Math.min(1, Render.fdt / 0.1);
      if (nl > 0 && t.st !== 'broken') Night.vehicle(ctx, { mode: 'bus' }, x, y, t.angD, L2, W2, zf * 0.55, nl);
      ctx.save(); ctx.translate(x, y); ctx.rotate(t.angD);
      Render.rr(ctx, -L2, -W2, 2 * L2, 2 * W2, Math.min(2.2, W2));
      ctx.fillStyle = '#FFC21A'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
      // lumineux : vert = libre, rouge = occupé
      const busy = t.st === 'pickup' || t.st === 'ride';
      ctx.fillStyle = t.st === 'roam' ? '#3FD07A' : busy ? '#F0583A' : '#FFFFFF';
      ctx.fillRect(-1.3 * zf, -W2 * 0.55, 2.6 * zf, W2 * 1.1);
      ctx.restore();
      if (t.st === 'broken') {
        const bx = x + L2 + 5, by = y - L2 - 5;
        ctx.beginPath(); ctx.arc(bx, by, 7, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#EF3E36'; ctx.stroke();
        ctx.fillStyle = INK; ctx.font = '700 9px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', bx, by + 0.5);
      }
      if (G.ui.selTaxi === t) { ctx.beginPath(); ctx.arc(x, y, L2 + 7, 0, 7); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke(); }
      Render.tpos.push({ x, y, t });
    }
  },
};

'use strict';
/* =====================================================================
   TRANSITOPIA — tutoriels
   - Tutoriel principal, proposé à chaque nouvelle partie (on peut le passer) :
     première ligne de bus offerte (3 arrêts, 1 bus), puis tour rapide des menus.
   - Mini-tutoriel proposé la première fois qu'on choisit chaque mode (métro, TER,
     navette, et bus si le tutoriel principal a été passé) : une petite ligne offerte.
   Les lignes offertes sont strictement limitées (arrêts, longueur, 1 véhicule le
   moins cher) et ne sont proposées qu'une fois par mode et par partie.
   ===================================================================== */

const TUTO_LIM = {
  bus: { stops: 3, len: 2500 },
  metro: { stops: 2, len: 1500 },
  ter: { stops: 2, len: 25000 },
  boat: { stops: 2, len: 2000 },
};
const TUTO_MODE_TXT = {
  bus: { place: 'Touchez une rue de votre territoire pour poser chaque arrêt. Le bus suit les vraies rues et le sens de circulation.',
    done: 'Vos bus roulent dans la circulation : les couloirs de bus et les feux prioritaires (fiche de la ligne) les accélèrent.' },
  metro: { place: 'Touchez la carte pour poser 2 stations : le métro est souterrain, son tracé est libre.',
    done: 'Un métro demande un jour de chantier avant d’ouvrir. Rapide et capacitaire, il coûte cher au kilomètre : réservez-le aux quartiers denses.' },
  ter: { place: 'Touchez près de 2 gares reliées par une voie ferrée. Le TER ne s’arrête qu’en gare.',
    done: 'Le TER est le plus rapide sur les longues distances. Construire : « Nouvelle gare » et « Nouvelle voie ferrée » pour étendre le réseau ferré.' },
  boat: { place: 'Touchez le fleuve ou le canal pour poser 2 pontons.',
    done: 'La navette fluviale est lente mais appréciée des touristes, surtout l’été.' },
};

const Tuto = {
  cur: null, timer: null,
  st() { if (!G.s.tuto) G.s.tuto = { main: 'done', seen: {} }; return G.s.tuto; },
  /** parties d'avant les tutoriels : les modes déjà utilisés ne sont plus proposés */
  normalize(isNew) {
    if (!G.s.tuto) G.s.tuto = { main: isNew ? 'pending' : 'done', seen: {} };
    for (const l of G.s.lines) G.s.tuto.seen[l.mode] = true;
  },
  active() { return !!this.cur; },
  lim() { return this.cur && this.cur.free ? TUTO_LIM[this.cur.mode] : null; },

  /* ---------- tutoriel principal ---------- */
  startMain() {
    const t = this.st(); if (t.main !== 'pending') return;
    const city = G.s.city.nom;
    UI.modal(`<div class="tuto-ill">${pict('bus')}${pict('metro')}${pict('ter')}${pict('boat')}</div>
      <div class="plate big">Bienvenue à ${esc(city)} !</div>
      <p>Vous dirigez le tout nouveau réseau de transport de la ville. Votre mission : relier les habitants à leurs emplois, leurs écoles et leurs loisirs, sans faire faillite.</p>

  /* ---------- limites des lignes offertes ---------- */

'use strict';
/* =====================================================================
   TRANSITOPIA — fond de carte « dessiné à la main »
   Rendu bande dessinée en aplats (palette lumineuse : primaires franches,
   ciels bleus, vert tendre, sables) à partir des seules données IGN :
   - papier crème et grain ; quartiers teintés selon leur densité ;
   - parcs, bois et terrains (BD TOPO) en aplats verts, arbres en « bulles » ;
   - eau en bleu avec vaguelettes ;
   - routes encrées d'un trait tremblé, remplies de crème ou de jaune ;
   - bâtiments en aplats colorés, légèrement décalés de leur contour (effet d'impression).
   Le tremblement du trait dépend de la position dans le monde : il se raccorde
   d'une dalle à l'autre. Chaque dalle est composée une fois puis gardée.
   ===================================================================== */

const DS = {
  paper: '#FFF6E3', ink: '#1D2240',
  // quartiers : de la campagne (vert tendre) au centre dense (sable), zones d'activité (corail pâle)
  zone: ['#E3F1C4', '#EEF3CC', '#F8EDCB', '#F7E1B0', '#F4D59C'], act: '#FBDCC8',
  veg: '#A9DB7E', forest: '#86C76A', sport: '#C9E79A', cem: '#CFE3B8', water: '#7CC8F2', waterInk: '#2C78C8',
  road: ['#FFC21A', '#FFD75E', '#FFE9A6', '#FFFDF5', '#FFFDF5'], // autoroute → desserte
  bus: '#EF3E36', rail: '#1D2240',
  bat: ['#F7C873', '#FF9F7A', '#F7A0A8', '#9FD3F2', '#FFE08A', '#C9B6F2', '#B9E3A0', '#FFC9A0', '#F3E6CF'],
  defW: [15, 11, 8.5, 7, 5.5], minPx: [4.2, 3.6, 3, 2.4, 1.8],
};

/* ---------- bruit déterministe (valeur lissée) ---------- */
function dsHash(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function dsNoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = dsHash(xi, yi, s), b = dsHash(xi + 1, yi, s), c = dsHash(xi, yi + 1, s), d = dsHash(xi + 1, yi + 1, s);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}

const Dessin = {
  env: new Map(), envP: new Map(), bat: new Map(), batP: new Map(), run: 0,
  layer: null,

  make() {
    const self = this;
    const Lay = L.GridLayer.extend({
      createTile(c, done) {
        const t = document.createElement('canvas');
        const r = Math.min(2, window.devicePixelRatio || 1);
        t.width = t.height = 256 * r;
        t._c = { x: c.x, y: c.y, z: c.z };
        self.draw(t, c, r).then(() => done(null, t), (e) => { console.warn(e); done(null, t); });
        return t;
      },
    });
    this.layer = new Lay({ maxZoom: 20, maxNativeZoom: 20, keepBuffer: 6, updateWhenZooming: false, attribution: '© IGN Géoplateforme · © contributeurs OpenStreetMap' });
    return this.layer;
  },
  refresh() {
    clearTimeout(this.rt);
    this.rt = setTimeout(() => {
      if (!this.layer || !G.map || !G.map.hasLayer(this.layer)) return;
      const r = Math.min(2, window.devicePixelRatio || 1);
      for (const k in this.layer._tiles) { const tl = this.layer._tiles[k]; if (tl.el && tl.el._c) this.draw(tl.el, tl.el._c, r); }
    }, 1200);
  },
  /** grain du papier (motif répété, calculé une fois) */
  grain() {
    if (this._gr) return this._gr;
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), d = g.createImageData(128, 128);
    for (let i = 0; i < 128 * 128; i++) {
      const v = dsHash(i % 128, i >> 7, 7);
      const fib = dsNoise((i % 128) / 3, (i >> 7) / 19, 3); // fibres allongées
      d.data[i * 4] = 120; d.data[i * 4 + 1] = 90; d.data[i * 4 + 2] = 40;
      d.data[i * 4 + 3] = Math.max(0, (v - 0.55) * 60 + fib * 14);
    }
    g.putImageData(d, 0, 0);
    this._gr = c;
    return c;
  },

  /** motifs à la plume, calés sur le monde (raccord entre dalles) : hachures diagonales, traits d'eau */
  pat(g, kind, r, W) {
    const key = kind + ':' + r;
    this._pc = this._pc || {};
    let c = this._pc[key];
    if (!c) {
      c = document.createElement('canvas'); const x = c.getContext('2d');
      x.strokeStyle = DS.ink; x.lineCap = 'butt';
      if (kind === 'hatch' || kind === 'hatch2') { // hatch2 : ombres, hachures serrées
        const P = Math.max(3, Math.round((kind === 'hatch2' ? 3.1 : 4.5) * r)); c.width = c.height = P; x.lineWidth = (kind === 'hatch2' ? 0.6 : 0.7) * r; x.beginPath();
        for (const o of [-P, 0, P]) { x.moveTo(o - 1, P + 1); x.lineTo(o + P + 1, -1); }
        x.stroke();
      } else { // eau : petits traits horizontaux en quinconce
        const w = Math.round(26 * r), h = Math.round(11 * r); c.width = w; c.height = h;
        x.strokeStyle = '#2C78C8'; x.lineWidth = 0.9 * r; x.lineCap = 'round'; x.beginPath();
        x.moveTo(3 * r, 3 * r); x.lineTo(12 * r, 3 * r); x.moveTo(16 * r, 8.5 * r); x.lineTo(24 * r, 8.5 * r); x.stroke();
      }
      this._pc[key] = c;
    }
    const pt = g.createPattern(c, 'repeat');
    if (pt.setTransform) pt.setTransform(new DOMMatrix([1, 0, 0, 1, -(W.ox % c.width), -(W.oy % c.height)]));
    return pt;
  },

  /** ombre à la plume sur un calque à part : hachures serrées + contour d'encre autour de la silhouette réunie */
  shade(g, S, r, W, add, bb) {
    const c = this._sh || (this._sh = document.createElement('canvas'));
    if (c.width !== S) { c.width = c.height = S; }
    const x = c.getContext('2d');
    const x0 = Math.max(0, Math.floor(bb[0] - 3 * r)), y0 = Math.max(0, Math.floor(bb[1] - 3 * r)), x1 = Math.min(S, Math.ceil(bb[2] + 3 * r)), y1 = Math.min(S, Math.ceil(bb[3] + 3 * r));
    if (x1 <= x0 || y1 <= y0) return;
    x.clearRect(x0, y0, x1 - x0, y1 - y0);
    x.save(); x.beginPath(); x.rect(x0, y0, x1 - x0, y1 - y0); x.clip();
    x.beginPath(); add(x);
    x.lineJoin = 'round'; x.strokeStyle = DS.ink; x.lineWidth = 1.7 * r; x.stroke(); // seule la moitié extérieure restera
    x.globalCompositeOperation = 'destination-out'; x.fill();
    x.globalCompositeOperation = 'source-over'; x.fillStyle = this.pat(x, 'hatch2', r, W); x.fill();
    x.restore();
    g.drawImage(c, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
  },
  /** ajoute un polygone toujours dans le même sens (les silhouettes se réunissent sans trou) */
  addP(x, pts) {
    let a = 0; const n = pts.length;
    for (let i = 0; i < n; i += 2) { const j = (i + 2) % n; a += pts[i] * pts[j + 1] - pts[j] * pts[i + 1]; }
    if (a >= 0) { x.moveTo(pts[0], pts[1]); for (let i = 2; i < n; i += 2) x.lineTo(pts[i], pts[i + 1]); }
    else { x.moveTo(pts[n - 2], pts[n - 1]); for (let i = n - 4; i >= 0; i -= 2) x.lineTo(pts[i], pts[i + 1]); }
    x.closePath();
  },

  /* ---------- trait tremblé ---------- */
  /** chemin tremblé : chaque point est décalé selon le bruit du monde (amplitude en pixels, constante) */
  wob(g, pts, closed, W) {
    const { amp, f, ox, oy } = W, n = pts.length / 2;
    if (n < 2) return;
    const P = [];
    const push = (x, y) => {
      const wx = (x + ox) * f, wy = (y + oy) * f;
      P.push(x + dsNoise(wx, wy, 1) * amp, y + dsNoise(wx, wy, 2) * amp);
    };
    const step = W.step;
    for (let i = 0; i < n - (closed ? 0 : 1); i++) {
      const x1 = pts[i * 2], y1 = pts[i * 2 + 1], j = (i + 1) % n, x2 = pts[j * 2], y2 = pts[j * 2 + 1];
      const l = Math.hypot(x2 - x1, y2 - y1), k = Math.max(1, Math.min(40, Math.ceil(l / step)));
      for (let s = 0; s < k; s++) push(x1 + (x2 - x1) * s / k, y1 + (y2 - y1) * s / k);
    }
    if (!closed) push(pts[(n - 1) * 2], pts[(n - 1) * 2 + 1]);
    // courbe lissée par les milieux (trait souple)
    const m = P.length / 2;
    g.moveTo(P[0], P[1]);
    if (m === 2) { g.lineTo(P[2], P[3]); }
    else {
      for (let i = 1; i < m - 1; i++) g.quadraticCurveTo(P[i * 2], P[i * 2 + 1], (P[i * 2] + P[i * 2 + 2]) / 2, (P[i * 2 + 1] + P[i * 2 + 3]) / 2);
      if (closed) g.quadraticCurveTo(P[(m - 1) * 2], P[(m - 1) * 2 + 1], P[0], P[1]);
      else g.lineTo(P[(m - 1) * 2], P[(m - 1) * 2 + 1]);
    }
    if (closed) g.closePath();
  },

  /* ---------- dessin d'une dalle ---------- */
  async draw(t, co, r) {
    const z = co.z, n = 2 ** z, S = 256 * r;
    const g = t.getContext('2d');
    const tok = (t._tok = (t._tok || 0) + 1);
    const X = (mx) => (mx * n - co.x) * S, Y = (my) => (my * n - co.y) * S;
    const mpp = (G.mpu || 1) / (n * S);
    // ligne claire : trait fin et assuré, à peine vivant (coordonnées du monde : raccord entre dalles)
    const W = { amp: 0.45 * r, f: 1 / (70 * r), ox: co.x * S, oy: co.y * S, step: 9 * r };
    const bx0 = co.x / n, by0 = co.y / n, bx1 = (co.x + 1) / n, by1 = (co.y + 1) / n;
    // données d'environnement (parcs, eau…) par carrés de zoom 14 ; bâtiments par carrés de zoom 16
    let env = null, bats = null;
    if (z >= 13) { const k = 2 ** Math.max(0, z - 14); env = z >= 14 ? await this.envFor(Math.floor(co.x / k), Math.floor(co.y / k)) : null; }
    if (z >= 16) { const k = 2 ** (z - 16); bats = await this.batFor(Math.floor(co.x / k), Math.floor(co.y / k)); }
    if (t._tok !== tok) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = DS.paper; g.fillRect(0, 0, S, S);
    if (!G.w) return;

/* ---------- réseau ferré du joueur ---------- */
const Rail = {
  KM: 1.5e6, STATION: 400000,
  st() {
    if (!G.s.rail) G.s.rail = { stations: [], tracks: [] };
    if (!G.s.rail.joins) G.s.rail.joins = [];
    return G.s.rail;
  },
  /** aiguillage : nœud posé sur une voie existante, relié aux deux extrémités du tronçon */
  applyJoin(j) {
    const net = G.w.rail;
    const i = net.node(j.nid, j.mx, j.my);
    for (const end of [j.a, j.b]) {
      if (!net.idx.has(end)) continue; // tronçon pas encore chargé : on réessaiera
      net.edge(i, net.idx.get(end), 0, j.kmh || 120, '', 'j:' + j.nid + ':' + end, 0, 0);
    }
  },
  /** point d'accroche sur le réseau ferré : un nœud proche, sinon un aiguillage sur le tronçon le plus proche */
  attach(mx, my, maxM) {
    const net = G.w.rail;
    const n = net.nearest(mx, my, Math.min(25, maxM));
    if (n >= 0) return { nid: net.ids[n], mx: net.x[n], my: net.y[n], ang: this.railAngle(n), join: null };
    let best = null, bd = maxM;
    for (let e = 0; e < net.nE; e++) {
      const a = net.ea[e], b = net.eb[e];
      const ax = net.x[a], ay = net.y[a], dx = net.x[b] - ax, dy = net.y[b] - ay;
      const L2 = dx * dx + dy * dy; if (L2 <= 0) continue;
      const t = clamp(((mx - ax) * dx + (my - ay) * dy) / L2, 0, 1);
      const px = ax + t * dx, py = ay + t * dy, d = dist(px, py, mx, my);
      if (d < bd) { bd = d; best = { e, px, py, ang: Math.atan2(dy, dx) }; }
    }
    if (!best) return null;
    const nid = 'j' + Math.round(best.px * 1e9) + '_' + Math.round(best.py * 1e9);
    return { nid, mx: best.px, my: best.py, ang: best.ang, join: { nid, mx: best.px, my: best.py, a: net.ids[net.ea[best.e]], b: net.ids[net.eb[best.e]], kmh: Math.round(net.spd[best.e] * 3.6) } };

    if (!j) return;

  inject() {
    const R = this.st(), net = G.w.rail, w = G.w;
    for (const j of R.joins) this.applyJoin(j);
    for (const s of R.stations) {
      net.node(s.nid, s.mx, s.my);
      const key = 'gs' + s.id;
      if (!w.poiSeen.has(key)) {
        w.poiSeen.add(key);
        w.pois.push({ mx: s.mx, my: s.my, kind: 'station', name: s.name, w: POI_W.station, train: true, own: true, sid: s.id });

  railAngle(i) {

  /** courbe lisse (Hermite cubique) passant par les points, tangente aux ancrages */
  curve(P, dirA, dirB) {

      else if (i === n - 1) { tx = P[n - 1][0] - P[n - 2][0]; ty = P[n - 1][1] - P[n - 2][1]; }
